<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Anavale Traveller's Compendium</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/wiki.css">
  <link rel="stylesheet" href="css/spells.css">
</head>
<body>
<div class="layout">

<!-- ══ SIDEBAR ══ -->
<nav class="sidebar">
  <div class="sidebar-title">The Traveller's <span class="text-gradient">Compendium</span></div>

  <div class="search-container">
    <div class="search-wrap">
      <input type="search" id="wiki-search" class="wiki-search-input"
             placeholder="Search the compendium…"
             oninput="doSearch(this.value)" />
      <span class="search-icon">⌕</span>
    </div>
    <div id="search-results" class="search-results" style="display:none;"></div>
  </div>

  <div id="sidebar-nav"></div>
</nav>

<!-- ══ MAIN ══ -->
<main class="main">
  <div id="wiki-content"></div>
</main>

</div>

  <script src="data/spells.js"></script>
  <script src="data/regions.js"></script>
  <script src="data/nations.js"></script>
  <script src="data/cities.js"></script>
  <script src="data/creatures.js"></script>
  <script src="data/organizations.js"></script>
  <script src="data/characters.js"></script>
  <script src="data/pois.js"></script>
  <script src="data/items.js"></script>
  <script src="data/index.js"></script>
  <script src="js/router.js"></script>
  <script src="js/wiki.js"></script>

<div class="spell-modal-overlay" id="spell-modal-overlay" onclick="if(event.target===this)closeSpellModal()">
  <div class="spell-modal">
    <button class="spell-modal-close" onclick="closeSpellModal()" title="Close">&times;</button>
    <div class="spell-modal-header">
      <div class="spell-modal-type-row" id="sm-type-row"></div>
      <h2 class="spell-modal-name" id="sm-name"></h2>
      <div class="spell-modal-school" id="sm-school"></div>
    </div>
    <div class="spell-modal-stats" id="sm-stats"></div>
    <div class="spell-modal-body" id="sm-body"></div>
  </div>
</div>
</body>
</html>
