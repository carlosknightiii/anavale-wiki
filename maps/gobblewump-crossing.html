    <!-- DOCKS / RIVERBANK STAIRS -->
    <rect x="418" y="420" width="64" height="8"  rx="1" class="bld-stone" stroke="#2a1f0e" stroke-width="1" opacity="0.75"/>
    <rect x="426" y="428" width="48" height="7"  rx="1" class="bld-stone" stroke="#2a1f0e" stroke-width="0.9" opacity="0.65"/>
    <rect x="434" y="435" width="32" height="6"  rx="1" class="bld-stone" stroke="#2a1f0e" stroke-width="0.8" opacity="0.55"/>
    <!-- WELL -->
    <circle cx="440" cy="492" r="10" class="bld-stone" stroke="#2a1f0e" stroke-width="1.5"/>
    <circle cx="440" cy="492" r="6"  fill="#1a3060" stroke="#2a1f0e" stroke-width="1"/>
    <line x1="432" y1="480" x2="448" y2="480" stroke="#2a1f0e" stroke-width="2"   stroke-linecap="round"/>
    <line x1="440" y1="477" x2="440" y2="482" stroke="#2a1f0e" stroke-width="1.5"/>
    <!-- ══ BUILDING LABELS ══ -->
    <text x="328" y="200" font-family="'Cinzel Decorative',serif" font-size="7.5" fill="#2a1f0e" text-anchor="middle" font-weight="700" opacity="0.88">The Formery</text>
    <text x="537" y="177" font-family="'Cinzel Decorative',serif" font-size="7"   fill="#2a1f0e" text-anchor="middle" font-weight="700" opacity="0.88">Wanderkeep Station</text>
    <text x="360" y="392" font-family="'Cinzel Decorative',serif" font-size="7.5" fill="#2a1f0e" text-anchor="middle" font-weight="700" opacity="0.85">Forres Inn</text>
    <text x="461" y="447" font-family="'Cinzel Decorative',serif" font-size="7"   fill="#2a1f0e" text-anchor="middle" font-weight="700" opacity="0.75">Stable</text>
    <text x="637" y="300" font-family="'Cinzel Decorative',serif" font-size="7.5" fill="#2a1f0e" text-anchor="middle" font-weight="700" opacity="0.78">The Old Inn</text>
    <text x="452" y="340" font-family="'Cinzel Decorative',serif" font-size="8"   fill="#2a1f0e" text-anchor="middle" font-weight="700" opacity="0.92">The Bridge</text>
    <text x="440" y="512" font-family="'Courier New',monospace"   font-size="6"   fill="#7a6548" text-anchor="middle" opacity="0.72">Well</text>
    <text x="450" y="456" font-family="'Courier New',monospace"   font-size="5.5" fill="#7a6548" text-anchor="middle" opacity="0.65">Docks</text>
    <!-- ══ COMPASS ROSE ══ -->
    <g transform="translate(832,58)">
      <circle cx="0" cy="0" r="33" fill="#f5ead4" stroke="#2a1f0e" stroke-width="1.5" opacity="0.92"/>
      <circle cx="0" cy="0" r="29" fill="none"    stroke="#f0b429" stroke-width="0.8" opacity="0.65"/>
      <polygon points="0,-23 4,-9 0,-14 -4,-9" fill="#2a1f0e"/>
      <polygon points="0,23 4,9 0,14 -4,9"    fill="#7a6548" opacity="0.6"/>
      <polygon points="23,0 9,4 14,0 9,-4"    fill="#7a6548" opacity="0.5"/>
      <polygon points="-23,0 -9,4 -14,0 -9,-4" fill="#7a6548" opacity="0.5"/>
      <text x="0"   y="-25" font-family="'Cinzel Decorative',serif" font-size="9" fill="#2a1f0e" text-anchor="middle" font-weight="700">N</text>
      <text x="0"   y="33"  font-family="'Cinzel Decorative',serif" font-size="8" fill="#7a6548" text-anchor="middle" opacity="0.75">S</text>
      <text x="27"  y="4"   font-family="'Cinzel Decorative',serif" font-size="8" fill="#7a6548" text-anchor="middle" opacity="0.75">E</text>
      <text x="-27" y="4"   font-family="'Cinzel Decorative',serif" font-size="8" fill="#7a6548" text-anchor="middle" opacity="0.75">W</text>
      <circle cx="0" cy="0" r="3.5" fill="#f0b429" stroke="#2a1f0e" stroke-width="1"/>
    </g>
    <!-- ══ ENTITY PINS — image thumbnails with name labels ══ -->
    <!--
      Each pin structure:
        <g> wrapper with data-entity-id + tabindex/role (wired by JS)
          <circle> outer ring (shadow/glow)
          <circle> white clip background
          <image> portrait photo clipped to circle
          <circle> fallback (shown if image fails — initial letter drawn via JS)
          <circle> border ring
          <text> entity name label below pin
        </g>
    -->
    <!-- PIN: The Bridge — poi, player facing -->
    <g data-entity-id="gobblewump-bridge" class="map-pin-group" filter="url(#f-pin)">
      <circle cx="450" cy="373" r="24" fill="#f5ead4" opacity="0.25"/>
      <circle cx="450" cy="373" r="20" fill="#f5ead4"/>
      <image href="https://ebppsgaftzyvftemfeom.supabase.co/storage/v1/object/public/world-images/pois/gobblewump-bridge.webp"
             x="430" y="353" width="40" height="40" clip-path="url(#clip-bridge)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="450" cy="373" r="20" fill="none" stroke="#2a1f0e" stroke-width="1.8" class="map-pin-ring"/>
      <text class="map-pin-label-text" x="450" y="400">The Bridge</text>
    </g>
    <!-- PIN: The Formery — org, player facing -->
    <g data-entity-id="the-formery" class="map-pin-group" filter="url(#f-pin)">
      <circle cx="328" cy="260" r="24" fill="#c8a86a" opacity="0.25"/>
      <circle cx="328" cy="260" r="20" fill="#c8a86a"/>
      <!-- No image — initial fallback -->
      <text x="328" y="265" font-family="'Cinzel Decorative',serif" font-size="14" fill="#f5ead4" text-anchor="middle" font-weight="700" pointer-events="none">F</text>
      <circle cx="328" cy="260" r="20" fill="none" stroke="#2a1f0e" stroke-width="1.8" class="map-pin-ring"/>
      <text class="map-pin-label-text" x="328" y="287">The Formery</text>
    </g>
    <!-- PIN: Wanderkeep Station — poi, player facing -->
    <g data-entity-id="wanderkeep-rest-station-gobblewump" class="map-pin-group" filter="url(#f-pin)">
      <circle cx="538" cy="235" r="24" fill="#8aaa6a" opacity="0.25"/>
      <circle cx="538" cy="235" r="20" fill="#f5ead4"/>
      <image href="https://ebppsgaftzyvftemfeom.supabase.co/storage/v1/object/public/world-images/pois/wanderkeep-rest-station-gobblewump.webp"
             x="518" y="215" width="40" height="40" clip-path="url(#clip-wanderkeep)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="538" cy="235" r="20" fill="none" stroke="#2a1f0e" stroke-width="1.8" class="map-pin-ring"/>
      <text class="map-pin-label-text" x="538" y="262">Wanderkeep</text>
    </g>
    <!-- PIN: Pressa Vorn — character, player_facing false, NOT dmOnly -->
    <g data-entity-id="pressa-vorn" class="map-pin-group map-pin-dm-only" filter="url(#f-pin)">
      <circle cx="560" cy="252" r="22" fill="#f5ead4" opacity="0.22"/>
      <circle cx="560" cy="252" r="18" fill="#f5ead4"/>
      <image href="https://ebppsgaftzyvftemfeom.supabase.co/storage/v1/object/public/world-images/characters/pressa-vorn.webp"
             x="542" y="234" width="36" height="36" clip-path="url(#clip-pressa)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="560" cy="252" r="18" fill="none" stroke="#f0b429" stroke-width="1.8" class="map-pin-ring"/>
      <text class="map-pin-label-text" x="560" y="277">Pressa Vorn</text>
    </g>
    <!-- PIN: Edvin & Aldvin Forres — character, player_facing false, NOT dmOnly -->
    <g data-entity-id="forres-brothers" class="map-pin-group map-pin-dm-only" filter="url(#f-pin)">
      <circle cx="358" cy="450" r="24" fill="#f5ead4" opacity="0.22"/>
      <circle cx="358" cy="450" r="20" fill="#f5ead4"/>
      <image href="https://ebppsgaftzyvftemfeom.supabase.co/storage/v1/object/public/world-images/characters/forres-brothers.webp"
             x="338" y="430" width="40" height="40" clip-path="url(#clip-forres)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="358" cy="450" r="20" fill="none" stroke="#f0b429" stroke-width="1.8" class="map-pin-ring"/>
      <text class="map-pin-label-text" x="358" y="477">Forres Brothers</text>
    </g>
    <!-- PIN: Gobblewump Gerald — character, player facing, SPECIAL gold pulse -->
    <g data-entity-id="gobblewump-gerald" class="map-pin-group" filter="url(#f-pin)">
      <!-- Session 1: dimmed grey glow -->
      <circle class="gerald-glow-dimmed" cx="455" cy="395" r="32" fill="none" stroke="#888888" stroke-width="1.5" opacity="0.35">
        <animate attributeName="r" values="28;35;28" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Default: gold glow -->
      <circle class="gerald-glow-active" cx="455" cy="395" r="32" fill="none" stroke="#f0b429" stroke-width="1.8" opacity="0.5">
        <animate attributeName="r" values="28;38;28" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.85;0.45" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="455" cy="395" r="22" fill="#f5ead4"/>
      <image href="https://ebppsgaftzyvftemfeom.supabase.co/storage/v1/object/public/world-images/characters/gobblewump-gerald.webp"
             x="433" y="373" width="44" height="44" clip-path="url(#clip-gerald)" preserveAspectRatio="xMidYMid slice"/>
      <!-- Gold ring on active, grey on session 1 -->
      <circle class="gerald-glow-active  map-pin-ring" cx="455" cy="395" r="22" fill="none" stroke="#f0b429" stroke-width="2.2"/>
      <circle class="gerald-glow-dimmed map-pin-ring"  cx="455" cy="395" r="22" fill="none" stroke="#888888" stroke-width="2"/>
      <text class="map-pin-label-text" x="455" y="424">Gerald</text>
    </g>
    <!-- PIN: Color Extractor — DM only (hidden from players by JS) -->
    <g data-entity-id="grusk-field-agent-gobblewump" class="map-pin-group" filter="url(#f-pin)">
      <circle cx="610" cy="460" r="22" fill="#2a1f0e" opacity="0.4"/>
      <circle cx="610" cy="460" r="18" fill="#1a0a0a"/>
      <image href="https://ebppsgaftzyvftemfeom.supabase.co/storage/v1/object/public/world-images/characters/grusk-field-agent-gobblewump.webp"
             x="592" y="442" width="36" height="36" clip-path="url(#clip-extractor)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="610" cy="460" r="18" fill="none" stroke="#aa3a1a" stroke-width="2" class="map-pin-ring"/>
      <text class="map-pin-label-text" x="610" y="485">&#9888; Color Extractor</text>
    </g>
  </svg>
  </div><!-- /map-canvas -->
  <!-- Border frame with corner ornaments -->
  <div class="map-border-frame" aria-hidden="true">
    <span class="map-border-corner tl">&#10022;</span>
    <span class="map-border-corner tr">&#10022;</span>
    <span class="map-border-corner bl">&#10022;</span>
    <span class="map-border-corner br">&#10022;</span>
  </div>
  <!-- Zoom controls -->
  <div class="map-zoom-controls">
    <button class="map-zoom-btn" onclick="mapZoomIn()"  aria-label="Zoom in">+</button>
    <button class="map-zoom-btn" onclick="mapZoomOut()" aria-label="Zoom out">&#8722;</button>
    <button class="map-zoom-btn map-zoom-reset" onclick="mapReset()" aria-label="Reset view">FIT</button>
  </div>
  <!-- Legend -->
  <div class="map-legend">
    <div class="map-legend-title">Legend</div>
    <div class="map-legend-item">
      <svg width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5" fill="#4a8acf" stroke="#1a4a8a" stroke-width="1.2"/></svg>
      Tumblerun River
    </div>
    <div class="map-legend-item">
      <svg width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5" fill="#d47a3a" stroke="#a04a18" stroke-width="1.2"/></svg>
      Mirrenflow River
    </div>
    <div class="map-legend-item">
      <div class="map-legend-road"></div>
      Trade Road
    </div>
    <div class="map-legend-item">
      <svg width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5" fill="#8a7a5a" stroke="#2a1f0e" stroke-width="1.2"/></svg>
      Landmark / POI
    </div>
    <div class="map-legend-item">
      <svg width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5" fill="#f0b429" stroke="#2a1f0e" stroke-width="1.2"/></svg>
      Named NPC
    </div>
    <div class="map-legend-item">
      <svg width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5" fill="#6a8a48" stroke="#2a1f0e" stroke-width="1.2"/></svg>
      Woodland
    </div>
    <!-- Scale bar: 4 squares × 20px = 80px = 20 ft -->
    <div class="map-legend-scale">
      <div class="map-legend-scale-bar-wrap">
        <div class="map-legend-scale-bar">
          <div class="map-legend-scale-line" style="width:80px;"></div>
        </div>
        <div class="map-legend-scale-labels">
          <span>0</span><span>20 ft</span>
        </div>
        <div class="map-legend-scale-note">1 square = 5 ft</div>
      </div>
    </div>
    <div class="map-legend-hint">Click any pin for details</div>
  </div>
</div><!-- /map-viewport -->
<!-- Popup -->
<div class="map-popup-overlay" id="map-popup-overlay">
  <div class="map-popup-backdrop" id="map-popup-backdrop"></div>
  <div class="map-popup" id="map-popup">
    <img class="map-popup-hero map-popup-hero-img" src="" alt="" style="display:none;">
    <div class="map-popup-hero-fallback" style="display:flex;">?</div>
    <div class="map-popup-header">
      <div class="map-popup-header-left">
        <div class="map-popup-title">&#8230;</div>
        <div class="map-popup-type">&#8230;</div>
      </div>
      <button class="map-popup-close" onclick="mapClosePopup()" aria-label="Close">&#10005;</button>
    </div>
    <div class="map-popup-badges"></div>
    <div class="map-popup-body">
      <div class="map-popup-loading">Loading&#8230;</div>
    </div>
  </div>
</div>
<script src="map-template.js"></script>
</body>
