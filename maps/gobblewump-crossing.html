  <!-- Border frame with corner ornaments -->
  <div class="map-border-frame" aria-hidden="true">
    <span class="map-border-corner tl">&#10022;</span>
    <span class="map-border-corner tr">&#10022;</span>
    <span class="map-border-corner bl">&#10022;</span>
    <span class="map-border-corner br">&#10022;</span>
  </div>
  <!-- Zoom controls + scale -->
  <div class="map-zoom-controls">
    <div class="map-zoom-btns">
      <button class="map-zoom-btn" onclick="mapZoomIn()"  aria-label="Zoom in">+</button>
      <button class="map-zoom-btn" onclick="mapZoomOut()" aria-label="Zoom out">&#8722;</button>
      <button class="map-zoom-btn map-zoom-reset" onclick="mapReset()" aria-label="Reset view">FIT</button>
    </div>
    <div class="map-scale-block">
      <div class="map-scale-bar-row">
        <div class="map-scale-tick"></div>
        <div class="map-scale-line"></div>
        <div class="map-scale-tick"></div>
      </div>
      <div class="map-scale-labels">
        <span>0ft</span><span>100ft</span>
      </div>
      <div class="map-scale-note">1 Square = 5ft</div>
    </div>
  </div>
  <!-- Legend -->
  <div class="map-legend">
    <div class="map-legend-title">Legend</div>
    <div class="map-legend-items">
      <div class="map-legend-item">
        <div class="map-legend-swatch map-legend-swatch-bar" style="background:#4a8acf;"></div>
        <span>Rivers</span>
      </div>
      <div class="map-legend-item">
        <div class="map-legend-swatch map-legend-swatch-bar" style="background:#a07820;"></div>
        <span>Roads</span>
      </div>
      <div class="map-legend-item">
        <div class="map-legend-swatch map-legend-swatch-ring" style="border-color:#0b0e16;"></div>
        <span>Landmark / Structure</span>
      </div>
      <div class="map-legend-item">
        <div class="map-legend-swatch map-legend-swatch-ring" style="border-color:#f0b429;"></div>
        <span>NPCs</span>
      </div>
      <div class="map-legend-item">
        <div class="map-legend-swatch map-legend-swatch-woods"></div>
        <span>Woods</span>
      </div>
    </div>
    <div class="map-legend-hint">Click any pin for details</div>
  </div>
</div><!-- /map-viewport -->
<!-- Popup -->
<div class="map-popup-overlay" id="map-popup-overlay">
  <div class="map-popup-backdrop" id="map-popup-backdrop"></div>
  <div class="map-popup" id="map-popup">
    <img class="map-popup-hero map-popup-hero-img" src="" alt="" style="display:none;">
    <div class="map-popup-hero-fallback" style="display:flex;">?</div>
    <div class="map-popup-header">
      <div class="map-popup-header-left">
        <div class="map-popup-title">&#8230;</div>
        <div class="map-popup-type">&#8230;</div>
      </div>
      <button class="map-popup-close" onclick="mapClosePopup()" aria-label="Close">&#10005;</button>
    </div>
    <div class="map-popup-badges"></div>
    <div class="map-popup-body">
      <div class="map-popup-loading">Loading&#8230;</div>
    </div>
  </div>
</div>
<script src="map-template.js"></script>
</body>
