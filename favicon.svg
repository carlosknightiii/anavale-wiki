<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Deep indigo background -->
  <rect width="32" height="32" rx="6" fill="#1a1040"/>
  
  <!-- Soft glow behind prism -->
  <ellipse cx="16" cy="16" rx="10" ry="10" fill="white" opacity="0.08"/>
  
  <!-- The Prior prism — point up, glowing white -->
  <!-- Main prism body -->
  <polygon points="16,4 26,22 6,22" fill="white" opacity="0.95"/>
  
  <!-- Subtle inner facet for depth -->
  <polygon points="16,4 26,22 16,22" fill="#d0c8ff" opacity="0.3"/>
  
  <!-- Prism base edge highlight -->
  <line x1="6" y1="22" x2="26" y2="22" stroke="white" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Small glow dot at apex -->
  <circle cx="16" cy="4" r="1.5" fill="white" opacity="0.9"/>
  
  <!-- Subtle color spectrum at base (Gigglegloom types) -->
  <rect x="7" y="23" width="4" height="2" rx="1" fill="#f9a825" opacity="0.85"/>   <!-- Bubbleseed gold -->
  <rect x="12" y="23" width="4" height="2" rx="1" fill="#29b6f6" opacity="0.85"/>  <!-- Featherflow blue -->
  <rect x="17" y="23" width="4" height="2" rx="1" fill="#7c4dff" opacity="0.85"/>  <!-- Steelfist violet -->
  <rect x="22" y="23" width="3" height="2" rx="1" fill="#ef5350" opacity="0.85"/>  <!-- Flamerage red -->
</svg>
