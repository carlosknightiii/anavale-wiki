            + '</div>' : '')
        + '</div></div>'
      + '</div>';
    }
    renderLimitedUseFeatures();
    if (hasSlotsThisLevel) renderSpellSlotsGroup();
    if (hasCasting) { renderPreparedSpells(); renderSpellcastingStats(); }
  }

  function renderClassTabDynamic() {
    var detailsEl = document.getElementById('cs-class-details');
    var featuresEl = document.getElementById('cs-class-features');
    if (detailsEl) detailsEl.innerHTML = renderClassDetailsHtml(CLASS_ROW);
    if (featuresEl) featuresEl.innerHTML = buildClassFeaturesHtml(CLASS_ROW ? CLASS_ROW.features : null);
    renderClassFeaturesAccordion();
    renderSpellsLearnedTable();
    wireAllTooltips();
  }

  // Parses generateSummary()'s plain-text output ("LABEL\n\nparagraph" blocks
  // joined by "\n\n\n") into {label, text} sections. Shared by the Who You
  // Are summary card and (new) the header's appearance paragraph, so both
  // read the same real parsing instead of two copies drifting apart.
  function parseSummaryBlocks(summaryText) {
    if (!summaryText) return [];
    return summaryText.split('\n\n\n').map(function(block) {
      var idx = block.indexOf('\n\n');
      if (idx === -1) return null;
      return { label: block.slice(0, idx).trim(), text: block.slice(idx + 2).trim() };
    }).filter(function(sec) { return sec && sec.label && sec.text; });
  }
  // Header's appearance paragraph (new) — pulls the "YOUR APPEARANCE" block
  // straight out of the same generateSummary() text already shown in Who
  // You Are, instead of the raw appearance_prompt AI-portrait prompt string
  // that used to leak into the UI verbatim. One authored description
  // instead of a second, unrelated-looking copy.
  function extractSummarySection(summaryText, wantedLabel) {
    var sections = parseSummaryBlocks(summaryText);
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].label.toUpperCase() === wantedLabel.toUpperCase()) return sections[i].text;
    }
    return null;
  }
  // Read-only — no editing affordance, matches the rest of the Overview card
  // visually. Shows only the "WHO ARE YOU" section of generateSummary()'s
  // text, not all six — Your Magic/Your Background/Your Past/Your Appearance/
  // Your Compass are already fully covered by their own dedicated cards
  // (Gigglegloom Affinity, Background, Organization, the header's appearance
  // paragraph, Alignment), so repeating them here was pure duplication.
  function buildSummaryCardHtml(summaryText) {
    var text = extractSummarySection(summaryText, 'WHO ARE YOU');
    if (!text) return '';
    return '<div class="cs-story-card-title">Summary</div><p class="cs-ov-summary-text">' + escHtml(text) + '</p>';
  }

  // ── MainInfo — shared header (Figma 51:1385), renders once above the
  // tab bar and is reused across all four tabs (not duplicated per tab). ──
  function buildMainInfoHtml(ch, app, appearanceDesc, speciesDisplay, regionLabel, portraitSrc) {
    var classKey   = (ch.class_id || '').toLowerCase();
    var speciesKey = (ch.species || '').toLowerCase();
    var alignKey   = (ch.alignment || '').toLowerCase();
    var typeKey    = (ch.class_gigglegloom || '').toLowerCase();
    var typeMeta   = TYPE_META[typeKey] || { name: cap(typeKey) };
    var initBadge  = computeInitiative(ch);

    // Blurb — species + class's Gigglegloom-flavor name + type + region,
    // plus the alignment trait sentence. Sourced from the same lookups
    // character.js's (pre-rewrite) generateSummary() draws from, not invented.
    // Both the species and class-flavor name are Anavale reskins of real PHB
    // terms — each gets its real term in parens right after it, so the
    // mechanical identity (which species/class rules apply) is never lost
    // behind the in-world flavor name.
    var blurbParts = [];
    var flavorName = CLASS_FLAVOR_NAME[classKey];
    if (speciesDisplay && flavorName && typeMeta.name) {
      var speciesWithPhb = speciesDisplay + (SPECIES_PHB[speciesKey] ? ' (' + SPECIES_PHB[speciesKey] + ')' : '');
      var classPhbName = classKey ? cap(classKey.replace(/-/g, ' ')) : '';
      var flavorWithPhb = flavorName + (classPhbName ? ' (' + classPhbName + ')' : '');
      blurbParts.push('A ' + speciesWithPhb + ' ' + flavorWithPhb + ' who carries the ' + typeMeta.name
        + (regionLabel && regionLabel !== '—' ? ' — from ' + regionLabel + '.' : '.'));
    }
    if (ALIGNMENT_TRAIT_SENTENCE[alignKey]) blurbParts.push(ALIGNMENT_TRAIT_SENTENCE[alignKey]);
    var blurbHtml = blurbParts.length ? '<p class="cs-ov-blurb">' + blurbParts.join(' ') + '</p>' : '';

    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ov-maininfo">'
        + '<div class="cs-ov-portrait">'
          + '<img class="cs-ov-portrait-img" id="cs-hero-portrait-img" src="' + (portraitSrc || '') + '" alt="' + (ch.name || '') + ' portrait" onerror="this.style.display=\'none\'">'
          + '<button class="cs-ov-portrait-upload-btn" onclick="document.getElementById(\'cs-photo-input\').click()">Replace</button>'
        + '</div>'
        + '<div class="cs-ov-info">'
          + '<div class="cs-mi-top-row">'
            + '<div class="cs-mi-conditions" id="cs-mi-conditions"></div>'
          + '</div>'
          + '<div class="cs-ov-main">'
            + '<h1 class="cs-ov-name">' + (ch.name || 'Unknown') + '</h1>'
            + '<div class="cs-mi-vitals">'
              + '<div class="cs-mi-ac-badge" id="cs-mi-ac-badge" data-tip=""><span class="cs-mi-ac-label">AC</span><span class="cs-mi-ac-num">—</span></div>'
              + '<div class="cs-mi-init-badge" data-tip="' + initBadge.tip.replace(/"/g,'&quot;') + '"><span class="cs-mi-init-label">Init</span><span class="cs-mi-init-num">' + (initBadge.total >= 0 ? '+' : '') + initBadge.total + '</span></div>'
              + '<div class="cs-mi-hp-slot" id="cs-mi-hp-slot"></div>'
              + '<div class="cs-mi-temp-hp" id="cs-mi-temp-hp"></div>'
              + '<div id="cs-mi-hit-dice-slot"></div>'
            + '</div>'
            + blurbHtml
          + '</div>'
          + '<div class="cs-mi-triple-row">'
            + (speciesDisplay ? '<div class="cs-mi-triple-col"><div class="cs-mi-triple-label">Species</div><div class="cs-mi-species-desc" id="cs-mi-species-desc"></div></div>' : '')
            + (appearanceDesc ? '<div class="cs-mi-triple-col"><div class="cs-mi-triple-label">Appearance</div><div class="cs-mi-appearance">' + appearanceDesc + '</div></div>' : '')
            + '<div class="cs-mi-triple-col" id="cs-mi-speaks-col"><div class="cs-mi-triple-label">Speaks</div><div class="cs-mi-speaks" id="cs-mi-speaks" style="display:none;"></div></div>'
          + '</div>'
        + '</div>'
        + '<div class="cs-mi-inspiration" id="cs-mi-inspiration"></div>'
      + '</div>'
    + '</div></div>';
  }

  // ── Overview cards (alignment / background / gigglegloom / class /
  // summary) — still "Your Story" tab content for this pass; will move to
  // their real tabs (Class, Your Story > Your Background) in later slices. ──
  // ── Your Story tab (Figma 51:1103/51:1218) — Who You Are / Your
  // Background / Your Past. Replaces the old pre-redesign "Overview"
  // accordion (alignment/background/gigglegloom cards + narrative summary)
  // entirely — those cards move into Your Background below; the feat chip
  // that landed on the old Background card in the Ability Scores slice was
  // always meant to be transitional pending this exact rebuild. ──

  // Tab page title (Figma 51:1103 "YOUR STORY") — one per tab, same heading
  // weight/placement across all four (see .cs-page-title CSS).
  function pageTitleHtml(text) {
    return '<div class="cs-ov-breakout"><div class="cs-ov-inner"><h2 class="cs-page-title">' + text + '</h2></div></div>';
  }
  function accordionShell(id, title, bodyHtml) {
    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ov-acc" id="' + id + '">'
        + '<button class="cs-ov-acc-header" type="button" onclick="toggleSheetAccordion(\'' + id + '\')">'
          + '<span class="cs-ov-acc-title">' + title + '</span>'
          + '<span class="cs-ov-acc-toggle"><span class="cs-ov-acc-toggle-label">Collapse</span><span class="cs-ov-acc-chevron">&#9662;</span></span>'
        + '</button>'
        + '<div class="cs-ov-acc-body-outer"><div class="cs-ov-acc-body">' + bodyHtml + '</div></div>'
      + '</div>'
    + '</div></div>';
  }
  function storyCard(label, title, text, benefitsHtml, imgSrc) {
    var labelTitleHtml = '<div class="cs-story-card-label">' + label + '</div>'
      + (title ? '<div class="cs-story-card-title">' + title + '</div>' : '');
    return '<div class="cs-story-card">'
      + (imgSrc
          ? '<div class="cs-story-card-head"><img class="cs-story-card-img" src="' + imgSrc + '" alt="" loading="lazy"><div class="cs-story-card-headtext">' + labelTitleHtml + '</div></div>'
          : labelTitleHtml)
      + (text ? '<div class="cs-story-card-text">' + escHtml(text) + '</div>' : '')
      + (benefitsHtml || '')
    + '</div>';
  }
  // ── Benefits box (Figma 51:1218) — typed lines inside a blue/600 box,
  // not the old rounded pill-tags. Ability deltas combine onto one
  // comma-joined line; everything else (skill/feat/DM-add/situational)
  // gets its own line with a type-specific suffix. Only skill and feat
  // lines get the gold tooltip icon — plain ability lines and DM-add/
  // situational lines don't (confirmed against the real Figma benefit
  // boxes on both Your Background's Background card and Your Past's
  // cards, not assumed). ──
  function abilityDeltaLineHtml(deltas) {
    if (!deltas || !deltas.length) return '';
    var parts = deltas.map(function(d) {
      return '<span class="cs-benefit-amount ' + (d.amount >= 0 ? 'positive' : 'negative') + '">' + (d.amount >= 0 ? '+' : '') + d.amount + '</span> <span class="cs-benefit-name">' + d.key.toUpperCase() + '</span>';
    });
    return '<div class="cs-benefit-line">' + parts.join(', ') + '</div>';
  }
  // amount is optional — Your Past's skill_bonuses carry a real +N amount,
  // Your Background's flat skill grants don't (confirmed against Figma:
  // Background's skill lines have no "+1" prefix, Your Past's do).
  function skillBenefitLineHtml(name, amount) {
    var tip = SKILL_TIPS[name];
    return '<div class="cs-benefit-line">'
      + (amount != null ? '<span class="cs-benefit-amount positive">+' + amount + '</span> ' : '')
      + '<span class="cs-benefit-name">' + escHtml(name) + '</span> <span class="cs-benefit-suffix">(Skill Proficiency)</span>'
      + (tip ? '<span class="cs-ab-tip" data-tip="' + tip.replace(/"/g,'&quot;') + '">?</span>' : '')
    + '</div>';
  }
  function featBenefitLineHtml(name) {
    var tip = FEAT_TIPS[name];
    return '<div class="cs-benefit-line">'
      + '<span class="cs-benefit-name">' + escHtml(name) + '</span> <span class="cs-benefit-suffix">(Ability)</span>'
      + (tip ? '<span class="cs-ab-tip" data-tip="' + tip.replace(/"/g,'&quot;') + '">?</span>' : '')
    + '</div>';
  }
  function dmAddBenefitLineHtml(label) {
    return '<div class="cs-benefit-line"><span class="cs-benefit-name">' + escHtml(label) + '</span> <span class="cs-benefit-suffix">(DM adds)</span></div>';
  }
  function situationalBenefitLineHtml(text) {
    return '<div class="cs-benefit-line"><span class="cs-benefit-desc">' + escHtml(text) + '</span> <span class="cs-benefit-suffix">(Situational)</span></div>';
  }
  function benefitsBoxHtml(lines) {
    var real = lines.filter(Boolean);
    if (!real.length) return '';
    return '<div class="cs-story-benefits"><div class="cs-story-benefit-label">Benefits:</div>' + real.join('') + '</div>';
  }

  // ── Your Past card (Figma 51:1218) — distinct from storyCard(): fixed
  // 358px width, 18px titles (vs Your Background's 26px), and two layout
  // variants. 'header' (5 of 7 cards) puts the icon beside just the eyebrow
  // + title; 'full' (Left Behind, Why You Left) puts the icon beside the
  // ENTIRE content column including body text — a real structural
  // difference confirmed against the Figma frame, not a styling nuance. ──
  function pastCard(eyebrow, title, text, benefitsHtml, imgSrc, layout) {
    var headTextHtml = '<div class="cs-story-card-label">' + eyebrow + '</div>'
      + '<div class="cs-past-card-title">' + title + '</div>';
    var bodyInner = (text ? '<div class="cs-story-card-text">' + escHtml(text) + '</div>' : '') + (benefitsHtml || '');
    if (layout === 'full') {
      return '<div class="cs-past-card cs-past-card--full">'
        + (imgSrc ? '<img class="cs-story-card-img" src="' + imgSrc + '" alt="" loading="lazy">' : '')
        + '<div class="cs-past-card-body">' + headTextHtml + bodyInner + '</div>'
      + '</div>';
    }
    return '<div class="cs-past-card">'
      + '<div class="cs-story-card-head">'
        + (imgSrc ? '<img class="cs-story-card-img" src="' + imgSrc + '" alt="" loading="lazy">' : '')
        + '<div class="cs-story-card-headtext">' + headTextHtml + '</div>'
      + '</div>'
      + bodyInner
    + '</div>';
  }

  // ── Who You Are ──────────────────────────────────────────────────
  // Figma 51:1103: this is ONE card (cs-whoyouare-card), not five/six
  // separate rounded boxes like Your Background/Your Past — the summary
  // and the personality items all sit inside the same blue-700 container.
  // Each item is a flush left-border strip (cs-whoyouare-item), not its
  // own bg/radius. Eyebrow + title text confirmed verbatim against the
  // real Figma frame (5 of 6 shown there; "Laugh" / personality_laugh
  // wasn't in that frame — eyebrow/title supplied by the DM directly).
  var WHOYOUARE_FIELDS = [
    { key:'personality_immediate', eyebrow:'First Impression', title:'People Instantly Notice About You' },
    { key:'personality_wrong',     eyebrow:'Misunderstood',     title:'People Get Wrong About You' },
    { key:'personality_laugh',     eyebrow:'Laugh',             title:'What Always Makes You Laugh' },
    { key:'cares_about',           eyebrow:'Primary Care',      title:'Care About' },
    { key:'deepest_fear',          eyebrow:'Fear',              title:'Deepest Fear' },
    { key:'seeking',               eyebrow:'Quest',             title:'What You Seek' }
  ];
  function whoYouAreItem(eyebrow, title, text) {
    return '<div class="cs-whoyouare-item">'
      + '<div class="cs-story-card-label">' + eyebrow + '</div>'
      + '<div class="cs-whoyouare-item-title">' + title + '</div>'
      + '<div class="cs-story-card-text">' + escHtml(text) + '</div>'
    + '</div>';
  }
  function buildWhoYouAreHtml(ch) {
    // Narrative summary — generateSummary() (character.js) writes
    // player_characters.summary as plain text, "LABEL\n\nparagraph" blocks
    // joined by "\n\n\n". Read-only display; free-text player answers are
    // baked into this string, so it's HTML-escaped like any other field.
    var summaryCardHtml = buildSummaryCardHtml(ch.summary);
    var items = WHOYOUARE_FIELDS
      .filter(function(f) { return ch[f.key]; })
      .map(function(f) { return whoYouAreItem(f.eyebrow, f.title, ch[f.key]); }).join('');
    var bodyHtml = summaryCardHtml + (items ? '<div class="cs-whoyouare-items">' + items + '</div>' : '');
    return accordionShell('cs-ov-acc-whoyouare', 'Who You Are',
      '<div class="cs-whoyouare-card">' + bodyHtml + '</div>');
  }

  // ── Your Background ──────────────────────────────────────────────
  // Gigglegloom/Alignment render immediately from ch; Region/Background lore
  // + benefits populate once fetchRegionData()/fetchBackgroundData() resolve
  // (renderBackgroundCardsDynamic(), called from both).
  function renderBackgroundCardsHtml(ch, typeKey, typeMeta) {
    var alignKey = (ch.alignment || '').toLowerCase();
    var alignName = ALIGNMENT_TRAIT_NAME[alignKey] || label(ALIGNMENT_LABELS, ch.alignment);
    var alignPhb  = ALIGNMENT_PHB[alignKey];
    // Card thumbnails — same verbatim-asset approach as Your Past, derived
    // from the exact real filename patterns character.js/character.html use
    // for these same option cards (confirmed by reading both, not guessed):
    // renderGigglogloomAffinity() → assets/icons/icon-{typeId}.svg,
    // the home-region cards' inline background-image → assets/images/regions/
    // img-{region}-landscape.webp, renderBackgroundCards() → assets/images/
    // backgrounds/bg-{bg.id}.png. Moral Alignment has no per-value icon (its
    // .char-alignment-card is text-only) — per the DM, it uses the one
    // shared img-alignment.webp illustration of all 5 alignments together,
    // the same image regardless of which alignment the character has.
    var regionKey = (ch.home_region || '').toLowerCase();
    var ggCard = storyCard('Gigglegloom Affinity', typeMeta.name, typeMeta.desc, null,
      typeKey ? '../assets/icons/icon-' + typeKey + '.svg' : null);
    var regionCard = storyCard('Home Region', REGION_ROW ? REGION_ROW.name : cap(ch.home_region || ''),
      REGION_ROW ? REGION_ROW.summary : null, null,
      regionKey ? '../assets/images/regions/img-' + regionKey + '-landscape.webp' : null);
    // Speed & Size — species.speed_ft/size, new columns this session (2024
    // PHB values, seeded per species.phb_equivalent). Low-frequency
    // reference data, placed here rather than the header per DM decision —
    // this accordion is already the species/region/alignment/background
    // facts cluster, unlike Who You Are (personality/narrative content).
    // No image asset exists for this (not a player-chosen option card like
    // the others), no benefits box, no title-vs-label split beyond the
    // value itself — self-explanatory once labeled, per the handoff.
    var speedSizeCard = '';
    if (SPECIES_ROW && (SPECIES_ROW.speed_ft || SPECIES_ROW.size)) {
      var speedSizeParts = [];
      if (SPECIES_ROW.speed_ft) speedSizeParts.push(SPECIES_ROW.speed_ft + ' ft');
      if (SPECIES_ROW.size) speedSizeParts.push(SPECIES_ROW.size);
      speedSizeCard = storyCard('Speed & Size', speedSizeParts.join(' · '), null, null, null);
    }
    var alignTitle = alignName + (alignPhb ? ' <span class="cs-story-card-sub">(' + alignPhb + ')</span>' : '');
    var alignCard = storyCard('Moral Alignment', alignTitle, ALIGNMENT_CARD_DESC[alignKey] || null, null,
      '../assets/images/img-alignment.webp');

    var bgKey = (ch.background_id || '').toLowerCase();
    var bgPhb = BG_PHB[bgKey];
    var bgName = BACKGROUND_ROW ? BACKGROUND_ROW.name : cap((ch.background_id || '').replace(/-/g,' '));
    var bgTitle = bgName + (bgPhb ? ' <span class="cs-story-card-sub">(' + bgPhb + ')</span>' : '');
    var abilityBonuses = parseBackgroundAbilityBonuses(BACKGROUND_ROW);
    var abilityDeltas = Object.keys(abilityBonuses).map(function(k) { return { key: k, amount: abilityBonuses[k] }; });
    var bgLines = [abilityDeltaLineHtml(abilityDeltas)];
    var bgFeat = getBackgroundFeat(BACKGROUND_ROW);
    if (bgFeat) bgLines.push(featBenefitLineHtml(bgFeat));
    (BACKGROUND_ROW && Array.isArray(BACKGROUND_ROW.skills) ? BACKGROUND_ROW.skills : []).forEach(function(sk) {
      bgLines.push(skillBenefitLineHtml(sk, null));
    });
    var bgCard = storyCard('Background', bgTitle, BACKGROUND_ROW ? BACKGROUND_ROW.lore : null, benefitsBoxHtml(bgLines),
      bgKey ? '../assets/images/backgrounds/bg-' + bgKey + '.png' : null);

    return ggCard + regionCard + speedSizeCard + alignCard + bgCard;
  }
  function buildYourBackgroundHtml(ch, typeKey, typeMeta) {
    return accordionShell('cs-ov-acc-background', 'Your Background',
      '<div class="cs-story-cards" id="cs-background-cards">' + renderBackgroundCardsHtml(ch, typeKey, typeMeta) + '</div>');
  }
  function renderBackgroundCardsDynamic() {
    if (!CH) return;
    var el = document.getElementById('cs-background-cards');
    if (!el) return;
    var typeKey = (CH.class_gigglegloom || '').toLowerCase();
    var typeMeta = TYPE_META[typeKey] || { name: cap(typeKey), color:'#c8940a' };
    el.innerHTML = renderBackgroundCardsHtml(CH, typeKey, typeMeta);
    wireAllTooltips();
  }

  // ── Your Past ─────────────────────────────────────────────────────
  // Benefits boxes read player_characters.skill_bonuses, filtering on the
  // "past_raised:"/"past_friend:"/"past_org:" source prefixes tagged at
  // submission (buildCharacterEntry() in character.js) — confirmed against
  // real data (Kael: source "past_raised:single-parent" etc.) before writing
  // this filter, not assumed from the build spec.
  function buildYourPastHtml(ch) {
    var skillBonusesArr = Array.isArray(ch.skill_bonuses) ? ch.skill_bonuses : [];
    function bonusesForPrefix(prefix) {
      return skillBonusesArr.filter(function(b) { return typeof b.source === 'string' && b.source.indexOf(prefix) === 0; });
    }

    var cards = [];
    if (ch.who_raised_you) {
      var raisedDeltas = RAISED_ABILITY_BONUS[ch.who_raised_you] || [];
      var raisedSkillLines = bonusesForPrefix('past_raised:').map(function(b) { return skillBenefitLineHtml(b.skill, b.amount); });
      var raisedBenefits = benefitsBoxHtml([abilityDeltaLineHtml(raisedDeltas)].concat(raisedSkillLines));
      cards.push(pastCard('Upbringing', 'Who Raised You', label(RAISED_LABELS, ch.who_raised_you), raisedBenefits, pastCardImg('who_raised_you', ch.who_raised_you), 'header'));
    }
    if (ch.dearest_friend) {
      var friendSkillLines = bonusesForPrefix('past_friend:').map(function(b) { return skillBenefitLineHtml(b.skill, b.amount); });
      cards.push(pastCard('Friend', 'Dearest Friend', label(FRIEND_LABELS, ch.dearest_friend), benefitsBoxHtml(friendSkillLines), pastCardImg('dearest_friend', ch.dearest_friend), 'header'));
    }
    if (ch.had_pet) {
      var petEffect = PET_EFFECT[ch.had_pet];
      var petBenefits = benefitsBoxHtml([petEffect ? situationalBenefitLineHtml(petEffect) : null]);
      cards.push(pastCard('Pet', 'Had a Pet', label(PET_LABELS, ch.had_pet), petBenefits, pastCardImg('had_pet', ch.had_pet), 'header'));
    }
    if (ch.fallen_in_love) cards.push(pastCard('Love', 'Fallen in Love', label(LOVE_LABELS, ch.fallen_in_love), null, pastCardImg('fallen_in_love', ch.fallen_in_love), 'header'));
    if (ch.organization_joined) {
      var orgDmLines = (Array.isArray(ch.dm_pending_items) ? ch.dm_pending_items : []).map(function(item) { return dmAddBenefitLineHtml(item.label || 'Item'); });
      var orgSkillLines = bonusesForPrefix('past_org:').map(function(b) { return skillBenefitLineHtml(b.skill, b.amount); });
      cards.push(pastCard('Organization', 'Organization', label(ORG_LABELS, ch.organization_joined), benefitsBoxHtml(orgDmLines.concat(orgSkillLines)), pastCardImg('organization_joined', ch.organization_joined), 'header'));
    }
    if (ch.left_behind) cards.push(pastCard('Left Behind', 'Left Behind', label(LEFT_BEHIND_LABELS, ch.left_behind), null, pastCardImg('left_behind', ch.left_behind), 'full'));
    if (ch.why_you_left) {
      var quest = WHY_LEFT_QUEST[ch.why_you_left];
      var questHtml = quest ? '<div class="cs-past-quest"><span class="cs-story-quest-label">Personal quest:</span> ' + escHtml(quest) + '</div>' : null;
      cards.push(pastCard('Why You Left', 'Why You Left', label(WHY_LEFT_LABELS, ch.why_you_left), questHtml, pastCardImg('why_you_left', ch.why_you_left), 'full'));
    }
    var cardsHtml = cards.join('');

    return accordionShell('cs-ov-acc-past', 'Your Past',
      (cardsHtml ? '<div class="cs-story-cards">' + cardsHtml + '</div>' : ''));
  }

  function toggleSheetAccordion(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var collapsed = el.classList.toggle('collapsed');
    var labelEl = el.querySelector('.cs-ov-acc-toggle-label');
    if (labelEl) labelEl.textContent = collapsed ? 'Expand' : 'Collapse';
  }

  // ── Overview weight bar — capacity = STR × 15, current = full inventory
  // (equipped + carried), same sum the Carrying bar (renderCarryingBar) uses. ──
  function computeCarriedWeight() {
    return INVENTORY.reduce(function(sum, item) {
      var w = item.item_id ? (catalogWeightFor(item.item_id) || 0) : (parseFloat(item.weight_lb) || 0);
      return sum + (w * (parseInt(item.quantity) || 0));
    }, 0);
  }
  // ── Render live-play data (HP, gold, inventory, notes, photo) ─────
  function renderLivePlay() {
    renderHeaderHP();
    renderHitDice();
    renderEquipped();
    renderGold();
    renderInventory();
    renderNotes();
    renderPhoto();
    renderConditions();
    renderInspiration();
    renderSpellSlotsGroup();
    renderPreparedSpells();
    // renderClassTabDynamic() (fired when fetchClassData() resolves) already
    // calls renderSpellsLearnedTable() once, but that runs in parallel with
    // fetchSpellsData() in the same init Promise.all and can win the race —
    // SPELLS_BY_ID may still be empty at that point, so learned_spells' ids
    // wouldn't resolve to real spell rows yet. renderLivePlay() only runs
    // once the whole Promise.all resolves (SPELLS_BY_ID guaranteed loaded by
    // then), so it re-renders here for real, same two-phase pattern as
    // everything else on this tab.
    renderSpellsLearnedTable();
    renderSpellcastingStats();
    renderLimitedUseFeatures();
    renderAbilitySkills();
    wireAllTooltips();
  }

  // ── HP (MainInfo header) ────────────────────────────────────────────
  // Rebuilt to match Figma 51:1385 exactly: label + directly-editable
  // number input(s), no Edit toggle, no separate −/+/Apply/Set-Max-Mod
  // panel — typing a value and blurring the field is the entire
  // interaction. Current AND max are both live inputs now (per DM
  // decision): editing "max" derives hp_max_modifier from the typed value
  // minus the real hp_max base, replacing the old separate Max-Mod control
  // rather than adding a third field. Temp HP gets the same input treatment
  // (no bar, no denominator — still no real "max temp HP" to show one
  // against) and is now always visible rather than hiding at 0, since a
  // typeable field needs to exist to type into. At 0 Current HP the row is
  // still replaced in-place by the death-save tracker (untouched — Figma's
  // mockup doesn't depict that state, so its Heal input/button stay as-is).
  function renderHeaderHP() {
    var slot = document.getElementById('cs-mi-hp-slot');
    var tempEl = document.getElementById('cs-mi-temp-hp');
    if (!slot) return;
    var hpCur = SHEET ? (parseInt(SHEET.hp_current) || 0) : 0;
    var hpMaxBase = SHEET ? (parseInt(SHEET.hp_max) || 0) : 0;
    var hpModifier = SHEET ? (parseInt(SHEET.hp_max_modifier) || 0) : 0;
    var hpMaxEffective = hpMaxBase + hpModifier;
    var hpTemp = SHEET ? (parseInt(SHEET.hp_temp) || 0) : 0;
    var atZero = SHEET && hpCur <= 0;

    if (atZero) {
      // Still need a way to heal back up from 0 — the bar/inputs are gone
      // in this branch, so keep a minimal heal input here. Any positive
      // Apply crosses back above 0 and swaps the bar back in.
      slot.innerHTML = renderDeathSavesHtml()
        + '<div class="cs-mi-hp-controls">'
          + '<input class="cs-hp-input" id="cs-hp-delta" type="number" placeholder="+HP">'
          + '<button class="cs-hp-apply" onclick="applyHPDelta()">Heal</button>'
        + '</div>';
    } else {
      var pct = hpMaxEffective > 0 ? Math.max(0, Math.min(100, (hpCur / hpMaxEffective) * 100)) : 0;
      slot.innerHTML =
        '<div class="cs-mi-hp-compact">'
          + '<span class="cs-mi-hp-compact-label">HP</span>'
          + '<input class="cs-mi-hp-num-input" type="number" value="' + hpCur + '" onblur="setHPCurrentDirect(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'
          + '<span class="cs-mi-hp-compact-max">/</span>'
          + '<input class="cs-mi-hp-num-input" type="number" value="' + hpMaxEffective + '" onblur="setHPMaxDirect(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'
          + '<div class="cs-mi-hp-compact-bar"><div class="cs-mi-hp-compact-bar-fill" style="width:' + pct + '%;"></div></div>'
        + '</div>';
    }

    if (tempEl) {
      tempEl.innerHTML =
        '<div class="cs-mi-hp-compact cs-mi-hp-compact--temp">'
          + '<span class="cs-mi-hp-compact-label">Temp HP</span>'
          + '<input class="cs-mi-hp-num-input" type="number" min="0" value="' + hpTemp + '" onblur="setTempHPDirect(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'
        + '</div>';
    }
  }

  // ── Death saves (MainInfo header, new) — swaps in for the HP bar in the
  // same slot when Current HP is 0. Clicking a filled pip un-fills it and
  // everything after it (standard 5e tracker behavior). ──
  function renderDeathSavesHtml() {
    var succ = SHEET ? (parseInt(SHEET.death_save_successes) || 0) : 0;
    var fail = SHEET ? (parseInt(SHEET.death_save_failures) || 0) : 0;
    var succPips = [1,2,3].map(function(i) {
      return '<button class="cs-mi-ds-pip cs-mi-ds-pip--success' + (i <= succ ? ' filled' : '') + '" onclick="toggleDeathSaveSuccess(' + i + ')" aria-label="Death save success ' + i + '"></button>';
    }).join('');
    var failPips = [1,2,3].map(function(i) {
      return '<button class="cs-mi-ds-pip cs-mi-ds-pip--failure' + (i <= fail ? ' filled' : '') + '" onclick="toggleDeathSaveFailure(' + i + ')" aria-label="Death save failure ' + i + '"></button>';
    }).join('');
    return '<div class="cs-mi-death-saves">'
      + '<div class="cs-mi-ds-label">Death Saves — 0 HP</div>'
      + '<div class="cs-mi-ds-row"><span class="cs-mi-ds-row-label">Success</span><span class="cs-mi-ds-pips">' + succPips + '</span></div>'
      + '<div class="cs-mi-ds-row"><span class="cs-mi-ds-row-label">Failure</span><span class="cs-mi-ds-pips">' + failPips + '</span></div>'
    + '</div>';
  }
  function toggleDeathSaveSuccess(i) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.death_save_successes) || 0;
    var next = (cur === i) ? i - 1 : i;
    SHEET.death_save_successes = next;
    saveSheet({ death_save_successes: next });
    renderHeaderHP();
  }
  function toggleDeathSaveFailure(i) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.death_save_failures) || 0;
    var next = (cur === i) ? i - 1 : i;
    SHEET.death_save_failures = next;
    saveSheet({ death_save_failures: next });
    renderHeaderHP();
  }

  // ── Hit Dice (MainInfo header) — near HP, same "spendable healing
  // resource belongs in this visual neighborhood" reasoning as Death Saves.
  // Max is never stored — always ch.level, computed live (same
  // derive-don't-cache principle js/hp-calc.js already uses for HP), so
  // this keeps working correctly as the party levels past 1 with no
  // migration needed then. Round 2 QA redesign — segment fill/click
  // convention now matches .cs-limuse-*/Spell Slots exactly (available
  // fills left, spent fills right; clicking a segment sets spent to
  // max-segIdx, clicking the current boundary segment un-spends it) instead
  // of the original spent-left/available-right pip convention this
  // predates — see the .cs-mi-hit-dice CSS comment for why. No rest-flow to
  // auto-restore spent dice exists anywhere on this sheet yet (same gap
  // Death Saves and Spell Slots already have) — restoring is a manual
  // click, deliberately out of scope here.
  // Uses character_sheet.hit_dice_used — a pre-existing column, populated
  // (1/0/0 for all 3 characters) but never referenced anywhere in the
  // codebase before this. The handoff assumed no tracking column existed;
  // caught via SQL before shipping, so this reuses hit_dice_used rather
  // than the hit_dice_spent this build first (wrongly) added. Its sibling
  // hit_dice_total is still dead/unused — max is deliberately computed live
  // from ch.level instead, per the handoff's own don't-cache-max instruction.
  function renderHitDiceHtml() {
    var max = (CH && CH.level) || 1;
    var dieType = CLASS_ROW ? CLASS_ROW.hit_die : 'd?';
    var spent = SHEET ? Math.min(parseInt(SHEET.hit_dice_used) || 0, max) : 0;
    var segments = Array.from({ length: max }, function(_, i) {
      var isSpent = i >= (max - spent);
      return '<button class="cs-mi-hd-seg' + (isSpent ? ' spent' : ' active') + '" onclick="toggleHitDie(' + i + ')" aria-label="Hit die ' + (i + 1) + (isSpent ? ' (spent)' : ' (available)') + '">' + (i + 1) + '</button>';
    }).join('');
    return '<div class="cs-mi-hit-dice">'
      + '<div class="cs-mi-hd-headrow">'
        + '<span class="cs-mi-hd-label">Hit Dice (' + dieType + ')<span class="cs-ab-tip" data-tip="Spend during a short rest to heal — roll this die and add your Constitution modifier. You regain some spent dice after a long rest.">?</span></span>'
        + '<span class="cs-mi-hd-count">Used: ' + spent + '/' + max + '</span>'
      + '</div>'
      + '<div class="cs-mi-hd-row">' + segments + '</div>'
    + '</div>';
  }
  function toggleHitDie(segIdx) {
    if (!SHEET) return;
    var max = (CH && CH.level) || 1;
    var cur = parseInt(SHEET.hit_dice_used) || 0;
    var next = (cur === (max - segIdx)) ? (max - segIdx) - 1 : (max - segIdx);
    if (next < 0) next = 0;
    if (next > max) next = max;
    SHEET.hit_dice_used = next;
    saveSheet({ hit_dice_used: next });
    renderHitDice();
  }
  function renderHitDice() {
    var el = document.getElementById('cs-mi-hit-dice-slot');
    if (!el) return;
    el.innerHTML = renderHitDiceHtml();
    // Round 2 Revisions 2e — same self-wiring pattern renderInspiration()
    // already uses: this widget introduces its own [data-tip] element, so
    // it wires itself rather than relying on whichever caller happens to
    // run wireAllTooltips() afterward.
    wireAllTooltips();
  }

  function adjustHP(delta) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.hp_current) || 0;
    var maxEffective = (parseInt(SHEET.hp_max) || 0) + (parseInt(SHEET.hp_max_modifier) || 0);
    var next = Math.max(0, Math.min(maxEffective, cur + delta));
    SHEET.hp_current = next;
    var patch = { hp_current: next };
    // Healing from 0 clears death saves — 5e rule, and required for the
    // header's bar/death-save swap to make sense next time HP hits 0.
    if (cur <= 0 && next > 0) {
      SHEET.death_save_successes = 0;
      SHEET.death_save_failures = 0;
      patch.death_save_successes = 0;
      patch.death_save_failures = 0;
    }
    saveSheet(patch);
    renderHeaderHP();
  }
  // Direct-edit handlers (Figma 51:1385) — replace the old Edit-toggle +
  // −/+/Apply/Set-Max-Mod panel entirely. Each input saves on blur/Enter;
  // an invalid (non-numeric) value just reverts the field via a re-render
  // rather than saving garbage.
  function setHPCurrentDirect(input) {
    if (!SHEET) return;
    var val = parseInt(input.value);
    if (isNaN(val)) { renderHeaderHP(); return; }
    var maxEffective = (parseInt(SHEET.hp_max) || 0) + (parseInt(SHEET.hp_max_modifier) || 0);
    var prevCur = parseInt(SHEET.hp_current) || 0;
    var next = Math.max(0, Math.min(maxEffective, val));
    SHEET.hp_current = next;
    var patch = { hp_current: next };
    // Healing from 0 clears death saves — 5e rule, and required for the
    // header's bar/death-save swap to make sense next time HP hits 0.
    if (prevCur <= 0 && next > 0) {
      SHEET.death_save_successes = 0;
      SHEET.death_save_failures = 0;
      patch.death_save_successes = 0;
      patch.death_save_failures = 0;
    }
    saveSheet(patch);
    renderHeaderHP();
  }
  // Max HP has no direct column — hp_max is the real base (class/CON-derived)
  // and hp_max_modifier is a temporary offset from status effects. Typing a
  // new effective max here derives the modifier from it (typed − base)
  // instead of asking for the modifier itself, replacing the old separate
  // "Set Max Mod" control.
  function setHPMaxDirect(input) {
    if (!SHEET) return;
    var val = parseInt(input.value);
    if (isNaN(val)) { renderHeaderHP(); return; }
    var base = parseInt(SHEET.hp_max) || 0;
    var modifier = val - base;
    SHEET.hp_max_modifier = modifier;
    saveSheet({ hp_max_modifier: modifier });
    renderHeaderHP();
  }
  function setTempHPDirect(input) {
    if (!SHEET) return;
    var val = parseInt(input.value);
    if (isNaN(val)) { renderHeaderHP(); return; }
    val = Math.max(0, val);
    SHEET.hp_temp = val;
    saveSheet({ hp_temp: val });
    renderHeaderHP();
  }

  function applyHPDelta() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-delta');
    var delta = parseInt(input.value) || 0;
    if (!delta) return;
    adjustHP(delta);
    input.value = '';
  }

  // ── Conditions (MainInfo header) — picker over the `conditions` Supabase
  // table (fetchConditionsData(), fetched once at boot same as dm.html's
  // SCC Live Session panel fetches it in sccInit()), not free text. Each
  // pill's color/tooltip comes from its real row; the picker only offers
  // conditions not already applied. ──
  function conditionRow(name) {
    for (var i = 0; i < CONDITIONS_DATA.length; i++) {
      if (CONDITIONS_DATA[i].name === name) return CONDITIONS_DATA[i];
    }
    return null;
  }
  function renderConditions() {
    var el = document.getElementById('cs-mi-conditions');
    if (!el) return;
    var applied = (SHEET && Array.isArray(SHEET.conditions)) ? SHEET.conditions : [];
    var pills = applied.map(function(c, i) {
      var row = conditionRow(c);
      var bg = row ? row.color_bg : 'rgba(192,132,252,0.1)';
      var border = row ? row.color_border : 'rgba(192,132,252,0.25)';
      var text = row ? row.color_text : '#c084fc';
      var tip = row ? row.tip : c;
      return '<span class="cs-mi-condition-pill" style="--cond-bg:' + bg + ';--cond-border:' + border + ';--cond-text:' + text + ';" data-tip="' + tip.replace(/"/g,'&quot;') + '">'
        + escHtml(c)
        + '<button class="cs-mi-condition-remove" onclick="removeCondition(' + i + ')" aria-label="Remove ' + escHtml(c) + '">&times;</button></span>';
    }).join('');
    var available = CONDITIONS_DATA.filter(function(r) { return applied.indexOf(r.name) < 0; });
    var options = available.map(function(r) { return '<option value="' + escHtml(r.name) + '">' + escHtml(r.name) + '</option>'; }).join('');
    el.innerHTML = (available.length ? '<button class="cs-mi-condition-add" onclick="showAddConditionInput()">+ Add Condition</button>' : '')
      + pills
      + '<span class="cs-mi-condition-input-row" id="cs-mi-condition-input-row" style="display:none;">'
        + '<select class="cs-mi-condition-select" id="cs-mi-condition-select">' + options + '</select>'
        + '<button class="cs-hp-apply" onclick="addCondition()">Add</button>'
      + '</span>';
    wireAllTooltips();
  }
  function showAddConditionInput() {
    var row = document.getElementById('cs-mi-condition-input-row');
    if (!row) return;
    row.style.display = 'inline-flex';
    var select = document.getElementById('cs-mi-condition-select');
    if (select) select.focus();
  }
  function addCondition() {
    var select = document.getElementById('cs-mi-condition-select');
    var val = select ? select.value : '';
    if (!val || !SHEET) return;
    var conditions = Array.isArray(SHEET.conditions) ? SHEET.conditions.slice() : [];
    if (conditions.indexOf(val) < 0) conditions.push(val);
    SHEET.conditions = conditions;
    saveSheet({ conditions: conditions });
    renderConditions();
  }
  function removeCondition(idx) {
    if (!SHEET || !Array.isArray(SHEET.conditions)) return;
    var conditions = SHEET.conditions.slice();
    conditions.splice(idx, 1);
    SHEET.conditions = conditions;
    saveSheet({ conditions: conditions });
    renderConditions();
  }

  // ── Inspiration (MainInfo header, new) — small circular badge, top-right
  // of the header, matching Figma 51:1385 (not the pill button this used
  // to be next to the AC badge). ──
  function renderInspiration() {
    var el = document.getElementById('cs-mi-inspiration');
    if (!el) return;
    var on = !!(SHEET && SHEET.has_inspiration);
    el.innerHTML = '<button class="cs-mi-insp-badge' + (on ? ' active' : '') + '" onclick="toggleInspiration()" data-tip="Spend before any d20 roll — roll twice, take the higher result. You can only hold one at a time.">'
      + '<span class="cs-mi-insp-badge-label">Inspiration</span>'
      + '<span class="cs-mi-insp-badge-state">' + (on ? 'Yes' : 'None') + '</span>'
      + '</button>';
    wireAllTooltips();
  }
  function toggleInspiration() {
    if (!SHEET) return;
    SHEET.has_inspiration = !SHEET.has_inspiration;
    saveSheet({ has_inspiration: SHEET.has_inspiration });
    renderInspiration();
  }

  // ── Species / Speaks (MainInfo header, new) ─────────────────────────
  function fetchSpeciesData(ch) {
    if (!ch.species) { renderSpeciesDesc(); return Promise.resolve(); }
    return sb.from('species').select('*').eq('id', ch.species).maybeSingle()
      .then(function(res) {
        if (!res.error && res.data) SPECIES_ROW = res.data;
        renderSpeciesDesc();
        // Speed & Size lives in the Your Background accordion (renderBackgroundCardsHtml()),
        // not here — piggybacks on the same refresh renderBackgroundCardsDynamic()
        // already provides for Region/Background, same "reuse the existing
        // refresh call" instruction as the header species description above.
        renderBackgroundCardsDynamic();
      })
      .catch(function() { renderSpeciesDesc(); renderBackgroundCardsDynamic(); });
  }
  function renderSpeciesDesc() {
    var el = document.getElementById('cs-mi-species-desc');
    if (!el) return;
    var desc = SPECIES_ROW && SPECIES_ROW.description;
    el.textContent = desc || '';
    el.style.display = desc ? '' : 'none';
  }
  function fetchLanguageData(ch) {
    if (!ch.language_extra) { renderSpeaksBlock(); return Promise.resolve(); }
    return sb.from('languages').select('*').eq('id', ch.language_extra).maybeSingle()
      .then(function(res) {
        if (!res.error && res.data) LANGUAGE_ROW = res.data;
        renderSpeaksBlock();
      })
      .catch(function() { renderSpeaksBlock(); });
  }
  function renderSpeaksBlock() {
    var el = document.getElementById('cs-mi-speaks');
    if (!el) return;
    if (!LANGUAGE_ROW) { el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = '';
    var langColor = LANGUAGE_ROW.color || 'inherit';
    el.innerHTML = '<div class="cs-mi-speaks-row"><span class="cs-mi-speaks-glyph" style="color:' + langColor + ';">' + (LANGUAGE_ROW.glyph || '') + '</span>'
      + '<span class="cs-mi-speaks-name" style="color:' + langColor + ';">' + escHtml(LANGUAGE_ROW.name || '') + '</span></div>'
      + (LANGUAGE_ROW.spoken_where ? '<span class="cs-mi-speaks-sub">' + escHtml(LANGUAGE_ROW.spoken_where) + '</span>' : '');
  }

  // ── Background / Region (Your Story tab, new) ───────────────────────
  function fetchBackgroundData(ch) {
    if (!ch.background_id) return Promise.resolve();
    return sb.from('backgrounds').select('*').eq('id', ch.background_id).maybeSingle()
      .then(function(res) { if (!res.error && res.data) BACKGROUND_ROW = res.data; renderBackgroundCardsDynamic(); })
      .catch(function() { renderBackgroundCardsDynamic(); });
  }
  function fetchRegionData(ch) {
    var regionKey = (ch.home_region || '').toLowerCase();
    if (!regionKey) return Promise.resolve();
    return sb.from('regions').select('id,name,summary').eq('id', regionKey).maybeSingle()
      .then(function(res) { if (!res.error && res.data) REGION_ROW = res.data; renderBackgroundCardsDynamic(); })
      .catch(function() { renderBackgroundCardsDynamic(); });
  }

  // Fetched once at boot (init Promise.all, same pattern as fetchSpeciesData
  // etc.) — resolves before renderLivePlay()/renderConditions() first run,
  // so no dynamic re-render is needed here the way Background/Region needed.
  function fetchConditionsData() {
    return sb.from('conditions').select('*').order('sort_order')
      .then(function(res) { if (!res.error && Array.isArray(res.data)) CONDITIONS_DATA = res.data; })
      .catch(function() {});
  }

  // ── Currency — 3 pill inputs (Figma 51:2260) ────────────────────────
  // Round 3 Follow-up: DM decision — currency is now DM-only, mirroring the
  // Spells Learned model change (Round 2 Revisions). Reasoning given: too
  // easy for a player to accidentally change a value and lose track of what
  // it was. Pills are now read-only display over gold_cp, not an edit
  // surface — same cs-currency-pill/-input markup and CSS (the earlier
  // currency-styling fix stays untouched), just `readonly` added and the
  // onblur/onkeydown save handlers removed, since there's nothing left to
  // save from this UI. DM-side editing moves to DM Tools' Players page (see
  // that file's own Decision Log entry) — same gold_cp field, so a DM edit
  // there is exactly what this display re-renders on the player's next load.
  function renderGold() {
    var block = document.getElementById('cs-gold-block');
    if (!block) return;
    var cp = SHEET ? (SHEET.gold_cp || 0) : 0;
    var gp    = Math.floor(cp / 100);

  // ── Equipped — 10-slot doll (Figma 51:2260) ─────────────────────────

  // mutually exclusive, see selectEquipItem()/autoUnequipOffHandForTwoHanded().
  // accessorySlotKey narrows catalog candidates to the matching items.equip_slot

    { area:'handR',      label:'Right Hand', keys:['hand_right'],          categories:['weapon'] },

    { area:'ring_right', label:'Right Ring', keys:['ring_right'],          categories:['accessory'], accessorySlotKey:'ring' },

  function saveAppearance(key, value) {

  // Minimal tooltip: reads data-tip off an element and shows a floating
  // bubble on hover — same data-tip convention character.html's
  // .char-field-tooltip uses. wireAllTooltips() sweeps every [data-tip]
  // element instead of call sites wiring each one by hand; wireTooltip()
  // itself stays idempotent (el._tipWired) so both styles of call are safe.
  function wireAllTooltips() {
    // A shown tooltip bubble lives in document.body, tied to a mouseleave
    // on its source element. Clicking a control INSIDE that element (e.g.
    // a condition pill's own × button) fires the click without the mouse
    // ever leaving the pill, and the click's re-render then replaces the
    // pill via innerHTML — destroying it without a mouseleave ever firing,
    // so the bubble is orphaned and stays on screen. Every re-render calls
    // wireAllTooltips() right after rebuilding its DOM, so sweeping stray
    // bubbles here (before rewiring) catches every such case in one place.
    document.querySelectorAll('.cs-tooltip').forEach(function(t) { t.remove(); });
    document.querySelectorAll('[data-tip]').forEach(wireTooltip);

  function wireTooltip(el) {
    if (!el || !el.dataset || !el.dataset.tip || el._tipWired) return;
    el._tipWired = true;
    var tipEl = null;
    el.addEventListener('mouseenter', function() {
      tipEl = document.createElement('div');
      tipEl.className = 'cs-tooltip';
      tipEl.textContent = el.dataset.tip;
      document.body.appendChild(tipEl);
      var rect = el.getBoundingClientRect();
      // Clamp so the bubble (centered via CSS translate(-50%, ...)) never
      // overflows past the viewport edge — the Inspiration badge sits in
      // the header's top-right corner, close enough to the edge that an
      // unclamped center-on-element position pushed the bubble off-screen.
      var left = rect.left + rect.width / 2;
      var half = tipEl.offsetWidth / 2;
      left = Math.max(half + 8, Math.min(window.innerWidth - half - 8, left));
      tipEl.style.left = left + 'px';
      tipEl.style.top  = rect.top + 'px';

      if (tipEl) { tipEl.remove(); tipEl = null; }
    });

  // Which hand (if either) holds a two-handed weapon right now, symmetric
  // in both directions — a two-handed weapon can land in either doll
  // position (selectEquipItem() routes a Left Hand pick to hand_left same
  // as a Right Hand pick routes to hand_right, no hand is privileged), so
  // this checks both instead of assuming hand_right is always "main hand".
  // lockedKeys carries what needs auto-clearing on the *other* side —
  // Left Hand has two backing keys (hand_left, shield) since a shield can

  function detectTwoHandedLock() {
    var rightItem = EQUIPPED.hand_right ? EQUIPPED_ITEMS[EQUIPPED.hand_right] : null;

    var rightIsTwoHanded = !!(rightItem && Array.isArray(rightItem.properties) && rightItem.properties.indexOf('two-handed') !== -1);
    var leftIsTwoHanded  = !!(leftItem  && Array.isArray(leftItem.properties)  && leftItem.properties.indexOf('two-handed') !== -1);
    if (rightIsTwoHanded) return { activeArea: 'handR', lockedArea: 'handL', item: rightItem, lockedKeys: ['hand_left', 'shield'] };

  function renderEquipped() {

    // beside a stacked column on each side, silhouette centered between
    // them. Each stacked area renders inside its own .cs-equip-slot-row

        + '<div class="cs-equip-doll-side">'

        + '<img class="cs-equip-doll-silhouette" src="../assets/images/character-sheet/equipped-gear/equipped-gear-silhouete.png" alt="" aria-hidden="true">'

    renderRingsRow();
    renderSpecialEffects();
    renderAttunement();
    wireAllTooltips();

  // Special Effects panel — read-only summary of every currently-equipped
  // item (any of the 13 EQUIPPED keys, doll slots + both rings) that has a
  // real effect set: grants_advantage/grants_proficiency/magic_bonus (the

  // equipped_effect_mechanical/equipped_effect_flavor free-text fields.
  // Items with none of these stay out of the panel entirely; if nothing
  // across the whole loadout has anything to show, the column itself
  // hides (see the display toggle at the end) rather than rendering an
  // empty box. Iterated in EQUIPPED's own key order — no separate slot
  // list to keep in sync.
  function buildSpecialEffectRows(item) {
    var rows = [];
    if (item.magic_bonus) {
      rows.push({ kind: 'mech', text: (item.magic_bonus > 0 ? '+' : '') + item.magic_bonus + ' magic bonus' });
    }
    (item.grants_advantage || []).forEach(function(g) {
      rows.push({ kind: 'mech', text: 'Advantage on ' + g });
    });
    (item.grants_proficiency || []).forEach(function(g) {
      rows.push({ kind: 'mech', text: 'Proficiency: ' + g });
    });
    if (item.equipped_effect_mechanical) rows.push({ kind: 'mech', text: item.equipped_effect_mechanical });
    if (item.equipped_effect_flavor) rows.push({ kind: 'flavor', text: item.equipped_effect_flavor });

  function renderSpecialEffects() {
    var col = document.getElementById('cs-special-effects-col');

    // own bottom-divided "row" inside (Figma's own node name for this) —
    // not a per-item card like Your Story. A "row" can hold multiple
    // sparkle lines (magic_bonus/grants_advantage/grants_proficiency/
    // equipped_effect_mechanical each render their own) since the data
    // model allows several mechanical facts per item even though Figma's
    // own example only shows one — the divider still applies once, to the
    // whole item, matching Figma's real DOM (border-b-2 on the row that
    // wraps name+mechanical+flavor together, not on each fact line).
    var itemsHtml = Object.keys(EQUIPPED).map(function(key) {

      var rows = buildSpecialEffectRows(item);
      if (!rows.length) return '';
      return '<div class="cs-effect-item">'
        + '<div class="cs-effect-name">' + escHtml(item.name || 'Unknown item') + '</div>'
        + rows.map(function(r) {
            if (r.kind === 'mech') {
              return '<div class="cs-effect-mech">'
                + '<span class="cs-effect-mech-icon">&#10024;</span>'
                + '<span class="cs-effect-mech-text">' + escHtml(r.text) + '</span>'
              + '</div>';

            return '<div class="cs-effect-flavor">'
              + '<span class="cs-effect-flavor-icon">&#128214;</span>'
              + '<span class="cs-effect-flavor-text">' + escHtml(r.text) + '</span>'

  // Rings — cosmetic-only (appearance_data.ring_right/ring_left), no doll
  // position exists for them (unchanged from before) — real slot tiles
  // now, same renderEquippedSlot() every doll position uses, just not
  // placed on the doll itself.
  function renderRingsRow() {
    var row = document.getElementById('cs-ring-row');
    if (!row) return;
    row.innerHTML = RING_SLOTS.map(function(r) { return renderEquippedSlot(equipSlotByArea(r.key), null); }).join('');
  }
  // ── Magic Item Attunement (Inventory tab, new) — 5e's real cap is 3
  // attuned items at once. Only currently-equipped items flagged
  // items.requires_attunement are eligible; a custom (non-catalog)
  // inventory row has no such field to check and is never eligible, same
  // as it already sits outside other catalog-only mechanics elsewhere in
  // this file (combat stats, Special Effects, etc.).
  //
  // Reads EQUIPPED_ITEMS, not CATALOG_CACHE — CATALOG_CACHE is a mixed
  // cache (the +Add Item search modal populates it with a partial select,
  // name/category/cost_gp/weight_lb/summary/base_ac/damage_dice/
  // damage_type/image only — no requires_attunement); EQUIPPED_ITEMS is
  // always a full items.* row for exactly the items in EQUIPPED (both its
  // write paths, fetchEquipped() and selectEquipItem(), select('*')), so
  // it's the correct, purpose-built source for this, not a guess.
  function getAttunableEquippedItems() {
    var out = [];
    Object.keys(EQUIPPED).forEach(function(key) {
      var itemKey = EQUIPPED[key];
      if (!itemKey) return;
      var item = EQUIPPED_ITEMS[itemKey];
      if (item && item.requires_attunement) out.push({ key: itemKey, name: item.name });
    });
    return out;
  }
  function renderAttunement() {
    var col = document.getElementById('cs-attunement-col');
    var el = document.getElementById('cs-attunement-block');
    if (!col || !el) return;
    var eligible = getAttunableEquippedItems();
    if (!eligible.length) { col.style.display = 'none'; return; }
    col.style.display = '';
    var attuned = (SHEET && Array.isArray(SHEET.attuned_items)) ? SHEET.attuned_items : [];
    el.innerHTML = '<div class="cs-attune-block">'
      + '<div class="cs-attune-header">Attunement (' + attuned.length + '/3)'
        + '<span class="cs-ab-tip" data-tip="Some magic items need you to bond with them before their full power works. You can be attuned to up to 3 items at once, and attuning happens during a short rest.">?</span>'
      + '</div>'
      + eligible.map(function(it) {

          var atCap = attuned.length >= 3 && !isAttuned;

            + '<span class="cs-attune-name">' + escHtml(it.name || 'Unknown item') + '</span>'
            + '<button class="cs-attune-btn' + (isAttuned ? ' active' : '') + '"'

  // this stays a separate, independently-correct check rather than risk
  // altering already-tested lines.
  function clearAttunementIfUnequipped(itemKey) {
    if (!SHEET || !itemKey || !Array.isArray(SHEET.attuned_items)) return;

    var stillEquipped = Object.keys(EQUIPPED).some(function(k) { return EQUIPPED[k] === itemKey; });
    if (stillEquipped) return;
    var next = SHEET.attuned_items.filter(function(k) { return k !== itemKey; });
    SHEET.attuned_items = next;
    saveSheet({ attuned_items: next });

  function autoUnequipOffHandForTwoHanded(keys) {
    if (!SHEET) return;

  function computeAC() {

    var dexMod = Math.floor((dexRaw - 10) / 2);
    var armor  = EQUIPPED.armor  ? EQUIPPED_ITEMS[EQUIPPED.armor]  : null;
    var shield = EQUIPPED.shield ? EQUIPPED_ITEMS[EQUIPPED.shield] : null;

      breakdown.push('10 base');

      + box
      + '<div class="cs-equip-slot-label">' + slot.label.toUpperCase() + '</div>'
      + (nameLine ? '<div class="cs-equip-slot-name">' + nameLine + '</div>' : '')
      + (dmgText ? '<div class="cs-equip-slot-damage">' + dmgText + '</div>' : '')
    + '</div>';
  }

  // ── Slot popover — one picker per slot, listing only items the character
  // actually owns that are valid here (getEquipCandidates()/
  // renderEquipResults() below). No cosmetic layer, no second section. ──
  var EQUIP_TARGET_SLOT = null; // a doll "area" key, not a raw EQUIPPED key
  function equipSlotByArea(area) {
    for (var i = 0; i < EQUIP_DOLL_SLOTS.length; i++) { if (EQUIP_DOLL_SLOTS[i].area === area) return EQUIP_DOLL_SLOTS[i]; }
    return null;
  }
  // Which of a doll slot's backing keys (only ever >1 for the merged Left
  // Hand position) currently holds an item, and that item — shared by the
  // doll render, the popover's mechanical row, and the other-hand-conflict
  // flag below, so the lookup can't drift between them.
  function getSlotActiveItem(slot) {
    if (!slot) return { key: null, item: null };
    for (var i = 0; i < slot.keys.length; i++) {
      if (EQUIPPED[slot.keys[i]]) return { key: slot.keys[i], item: EQUIPPED_ITEMS[EQUIPPED[slot.keys[i]]] || null };
    }
    return { key: null, item: null };
  }
  // Plain-text (not HTML) stats line for hover tooltips — data-tip is
  // rendered via textContent, so this can't reuse buildEquipResultStats()'s
  // &middot;/&#8230; HTML entities, which would show up literally.
  function buildEquippedTooltipText(item, category) {
    var parts = [item.name];
    if (category === 'armor' && item.base_ac != null) {
      parts.push('AC ' + item.base_ac + (item.armor_weight_class ? ' (' + cap(item.armor_weight_class) + ')' : ''));
    } else if (category === 'shield') {
      parts.push('+' + (item.ac_bonus != null ? item.ac_bonus : 2) + ' AC');
    } else if (category === 'weapon' && item.damage_dice) {
      parts.push(item.damage_dice + (item.damage_type ? ' ' + item.damage_type : ''));
    }
    if (item.weight_lb != null) parts.push(item.weight_lb + ' lb');
    return parts.join(' — ');
  }
  function openSlotPopover(area) {
    EQUIP_TARGET_SLOT = area;
    var slot = equipSlotByArea(area);
    if (!slot) return;
    document.getElementById('cs-equip-modal-title').textContent = slot.label;
    renderPopoverCurrent();
    document.getElementById('cs-equip-search-input').value = '';
    renderEquipResults('');
    document.getElementById('cs-equip-modal-overlay').style.display = 'flex';
  }
  function closeEquipModal() {
    document.getElementById('cs-equip-modal-overlay').style.display = 'none';
    EQUIP_TARGET_SLOT = null;
  }
  // Currently-equipped line, with an inline Unequip control.
  function renderPopoverCurrent() {
    var el = document.getElementById('cs-equip-current');
    if (!el) return;
    var active = getSlotActiveItem(equipSlotByArea(EQUIP_TARGET_SLOT));
    el.innerHTML = active.item
      ? ('<strong>' + active.item.name + '</strong> <button class="cs-equip-current-clear" onclick="popoverUnequip()">Unequip</button>')
      : '<em>Nothing equipped</em>';
  }
  function popoverUnequip() {
    var active = getSlotActiveItem(equipSlotByArea(EQUIP_TARGET_SLOT));
    if (active.key) unequipSlot(active.key);
    renderPopoverCurrent();
    renderEquipResults((document.getElementById('cs-equip-search-input').value || ''));
  }
  // ── +Add Item modal (Figma 51:2260) — wraps the existing catalog search,
  // opened from the new header button instead of an always-visible inline bar.
  function openAddItemModal() {
    document.getElementById('cs-inv-search-input').value = '';
    document.getElementById('cs-inv-search-results').innerHTML = '';
    document.getElementById('cs-inv-search-results').classList.remove('visible');
    document.getElementById('cs-additem-modal-overlay').style.display = 'flex';
  }
  function closeAddItemModal() {
    document.getElementById('cs-additem-modal-overlay').style.display = 'none';
  }
  function onEquipSearchInput() {
    var q = (document.getElementById('cs-equip-search-input').value || '').trim();
    renderEquipResults(q);
  }
  // Inventory rows relevant to a doll position — custom rows match by
  // item_type against the slot's broad categories (no per-accessory-slot
  // data exists on custom rows, same permissive fallback armor/shield/weapon
  // always used). Catalog rows match by category, narrowed further by the
  // real items.equip_slot value for the 7 accessory positions so e.g. a ring
  // doesn't show up as a Head candidate. Excludes whichever specific row is
  // already equipped in THIS slot (redundant with the "Currently equipped"
  // line above the list) — keyed off that row's own equipped_slot AND its
  // own catalog/row id matching EQUIPPED[activeKey] (same equipKey formula
  // selectEquipItem() uses), not equipped_slot alone. A stale equipped_slot
  // left over from before unequipSlot() cleared it properly (or any other
  // drift between a row's own column and the live equipped map) must not
  // hide an otherwise-real, currently-unequipped candidate — confirmed
  // live via Kael's Shortsword, whose equipped_slot was stale 'hand_right'
  // from a much older session while character_sheet.equipped.hand_right
  // was actually the Longbow.
  function getEquipCandidates(area) {
    var slot = equipSlotByArea(area);
    if (!slot) return [];
    var activeKey = getSlotActiveItem(slot).key;
    var activeEquipKey = activeKey ? EQUIPPED[activeKey] : null;
    return INVENTORY.filter(function(item) {
      var rowEquipKey = item.item_id || item.id;
      if (activeKey && item.equipped_slot === activeKey && rowEquipKey === activeEquipKey) return false;
      var catalogItem = item.item_id ? CATALOG_CACHE[item.item_id] : null;
      if (catalogItem) {
        if (slot.categories.indexOf(catalogItem.category) === -1) return false;
        if (catalogItem.category === 'accessory') return catalogItem.equip_slot === slot.accessorySlotKey;
        return true;
      }
      return slot.categories.indexOf(item.item_type) !== -1;
    });
  }
  // Stats line for an equip search result — reads catalog fields when the
  // row is catalog-linked, falls back to whatever the inventory row itself
  // carries (custom items don't have combat stats, so this is often empty).
  function buildEquipResultStats(category, src) {
    src = src || {};
    if (category === 'armor') {
      if (src.base_ac == null) return '';
      return 'AC ' + src.base_ac
        + (src.armor_weight_class ? ' &middot; ' + src.armor_weight_class : '')
        + (src.stealth_disadvantage ? ' &middot; Stealth disadv.' : '')
        + (src.str_requirement ? ' &middot; Str ' + src.str_requirement + ' req.' : '')
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '');
    }
    if (category === 'shield') {
      if (src.ac_bonus == null) return '';
      return '+' + src.ac_bonus + ' AC'
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '');
    }
    if (category === 'weapon') {
      if (!src.damage_dice) return '';
      return src.damage_dice + (src.damage_type ? ' ' + src.damage_type : '')
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '')
        + (src.properties && src.properties.length ? ' &middot; ' + src.properties.join(', ') : '')
        + (src.range_normal ? ' &middot; Range ' + src.range_normal + '/' + src.range_long : '');
    }
    return '';
  }
  // Thumbnail markup — catalog image with an onerror fallback to a
  // category-appropriate CSS icon; no image at all skips straight to the icon.
  function buildEquipResultThumb(category, catalogItem) {
    var iconClass = 'cs-equip-icon-' + category;
    if (catalogItem && catalogItem.image) {
      return '<img class="cs-equip-thumb" src="' + catalogItem.image + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<div class="cs-equip-thumb cs-equip-thumb-icon ' + iconClass + '" style="display:none;"></div>';
    }
    return '<div class="cs-equip-thumb cs-equip-thumb-icon ' + iconClass + '"></div>';
  }
  function renderEquipResults(q) {
    var resultsEl = document.getElementById('cs-equip-search-results');
    var searchInput = document.getElementById('cs-equip-search-input');
    var slot = equipSlotByArea(EQUIP_TARGET_SLOT);
    if (!resultsEl || !slot) return;
    var candidates = getEquipCandidates(EQUIP_TARGET_SLOT);
    // Nothing to search — an empty search box next to an empty-state
    // message reads as broken (live QC: "what is this field for?"), so
    // hide it entirely rather than leave it with nothing to do.
    if (searchInput) searchInput.style.display = candidates.length ? '' : 'none';
    if (!candidates.length) {
      resultsEl.innerHTML = '<div class="cs-inv-empty">No items in inventory for this slot</div>';
      return;
    }
    var query = (q || '').toLowerCase().trim();
    var rows = candidates.map(function(item) {
      var catalogItem = item.item_id ? CATALOG_CACHE[item.item_id] : null;
      var name = catalogItem ? catalogItem.name : (item.custom_name || 'Unknown item');
      var rowCategory = catalogItem ? catalogItem.category : (item.item_type || slot.categories[0]);
      return { item: item, catalogItem: catalogItem, name: name, category: rowCategory };
    });
    if (query) {
      rows = rows.filter(function(r) { return r.name.toLowerCase().indexOf(query) !== -1; });
    }
    if (!rows.length) {
      resultsEl.innerHTML = '<div class="cs-inv-empty">No matches.</div>';
      return;
    }
    // Flag a candidate already equipped in the *other* hand — only a
    // meaningful concept for the handL/handR pair (every other doll
    // position is unique, there's no "other" to conflict with).
    var OTHER_HAND = { handL: 'handR', handR: 'handL' };
    var otherArea = OTHER_HAND[EQUIP_TARGET_SLOT];
    var otherActive = otherArea ? getSlotActiveItem(equipSlotByArea(otherArea)) : null;
    var otherKeyId = (otherActive && otherActive.key) ? EQUIPPED[otherActive.key] : null;
    var otherLabel = otherArea ? equipSlotByArea(otherArea).label : null;
    resultsEl.innerHTML = rows.map(function(r) {
      var weightSrc = r.catalogItem ? r.catalogItem.weight_lb : r.item.weight_lb;
      var weight = parseFloat(weightSrc) || 0;
      var stats  = buildEquipResultStats(r.category, r.catalogItem || r.item);
      var thumb  = buildEquipResultThumb(r.category, r.catalogItem);
      var rowEquipKey = r.item.item_id || r.item.id;
      var otherHandFlag = (otherKeyId && otherKeyId === rowEquipKey)
        ? '<span class="cs-equip-result-flag">Also equipped: ' + otherLabel + '</span>' : '';
      return '<div class="cs-equip-result" onclick="selectEquipItem(\'' + r.item.id + '\')">'
        + thumb
        + '<div class="cs-equip-result-info">'
          + '<span class="cs-equip-result-name">' + r.name + '</span>'
          + (stats ? '<span class="cs-equip-result-stats">' + stats + '</span>' : '')
          + otherHandFlag
        + '</div>'
        + '<span class="cs-equip-result-weight">' + weight + ' lb</span>'
      + '</div>';
    }).join('');
  }
  // Clears any inventory row(s) whose own equipped_slot column still
  // points at slotKey, back to null — called anywhere character_sheet.
  // equipped stops pointing a given key at an item, so a row's own
  // column and the live equipped map can't drift apart. Previously only
  // ever set, never reset (unequipSlot() left it stale forever), which
  // is what created every stale-equipped_slot bug found tonight: the
  // ring double-equip, and Right Hand's candidate list wrongly excluding
  // a real owned Shortsword. Loops all matches, not just one, in case
  // more than one row is already stale from before this fix existed.
  function clearInventoryEquippedSlot(slotKey) {
    INVENTORY.filter(function(i) { return i.equipped_slot === slotKey; }).forEach(function(invRow) {
      invRow.equipped_slot = null;
      sb.from('inventory').update({ equipped_slot: null }).eq('id', invRow.id).then(function(res) {
        if (res.error) console.warn('Could not clear inventory equipped_slot:', res.error);
      });
    });
  }
  function selectEquipItem(invItemId) {
    var slot = equipSlotByArea(EQUIP_TARGET_SLOT);
    if (!slot || !SHEET) return;
    var invItem = INVENTORY.find(function(i) { return i.id === invItemId; });
    if (!invItem) return;
    var catalogItem = invItem.item_id ? CATALOG_CACHE[invItem.item_id] : null;
    var itemCategory = catalogItem ? catalogItem.category : invItem.item_type;
    // Which real EQUIPPED key this goes to — only ambiguous for the merged
    // Left Hand position (handL), where the chosen item's own category picks
    // hand_left (weapon) vs shield (shield).
    var targetKey = (slot.keys.length > 1) ? (itemCategory === 'shield' ? 'shield' : 'hand_left') : slot.keys[0];
    var catalogId = invItem.item_id || null;
    var equipKey  = catalogId || invItem.id;
    var equipped = (typeof SHEET.equipped === 'object' && SHEET.equipped) ? SHEET.equipped : {};
    // Mutual exclusion: clear any sibling key sharing this doll position.
    slot.keys.forEach(function(k) {
      if (k === targetKey || !equipped[k]) return;
      var removedId = equipped[k];
      delete equipped[k];
      EQUIPPED[k] = null;
      clearInventoryEquippedSlot(k);
      var stillUsed = Object.keys(EQUIPPED).some(function(kk) { return EQUIPPED[kk] === removedId; });
      if (!stillUsed) delete EQUIPPED_ITEMS[removedId];
      clearAttunementIfUnequipped(removedId);
    });
    // Same physical inventory row moving from a different slot entirely —
    // not a sibling key above (e.g. handL/handR both take 'weapon', or
    // ring_right/ring_left both take 'ring'; two separate slots that
    // happen to share a candidate category, not two keys backing one doll
    // position). Detected off this ROW's own equipped_slot, not the
    // catalog id, so two distinct owned rows of the same catalog item
    // (e.g. two real rings) never falsely clear each other — only
    // re-selecting the literal same row triggers this. No separate
    // clearInventoryEquippedSlot() call needed here — this exact row's
    // own equipped_slot column gets overwritten to targetKey a few lines
    // below in the same update, which already replaces the stale value.
    // The equipped[priorSlotKey]===equipKey guard stays as defensive
    // insurance against any remaining drift (e.g. manual DB edits), even
    // though unequipSlot() no longer creates this drift itself.
    var priorSlotKey = invItem.equipped_slot;
    if (priorSlotKey && priorSlotKey !== targetKey && equipped[priorSlotKey] === equipKey) {
      delete equipped[priorSlotKey];
      EQUIPPED[priorSlotKey] = null;
      var stillUsedPrior = Object.keys(EQUIPPED).some(function(kk) { return EQUIPPED[kk] === equipKey; });
      if (!stillUsedPrior) delete EQUIPPED_ITEMS[equipKey];
      // No clearAttunementIfUnequipped() call here, deliberately — this is
      // the same physical item moving to a *different* slot (targetKey,
      // set a few lines below), not actually coming off. Clearing
      // attunement here would be a real bug: the item never left EQUIPPED,
      // it's mid-move within this same function call.
    }
    // Direct replacement — targetKey already holds a *different* item
    // (e.g. swapping Longbow for Shortsword, both in hand_right). Not a
    // sibling key, not this row moving from elsewhere — the outgoing
    // item's own inventory row still needs its equipped_slot cleared, or
    // it goes stale exactly like the unequipSlot()/sibling gaps did.
    if (equipped[targetKey] && equipped[targetKey] !== equipKey) {
      clearInventoryEquippedSlot(targetKey);
    }
    equipped[targetKey] = equipKey;
    SHEET.equipped = equipped;
    EQUIPPED[targetKey] = equipKey;
    saveSheet({ equipped: equipped });
    invItem.equipped_slot = targetKey;
    sb.from('inventory').update({ equipped_slot: targetKey }).eq('id', invItem.id).then(function(res) {
      if (res.error) showToast('Equip saved, but inventory record not updated — ' + res.error.message, true);
    });
    closeEquipModal();
    showToast('Equipped');
    // CATALOG_CACHE only carries the partial fields used by the inventory list
    // (name, category, cost_gp, weight_lb, summary, image) — not enough for AC
    // calculation or the doll thumbnail (item.category), so fetch the full row.
    if (catalogId) {
      sb.from('items').select('*').eq('id', catalogId).single().then(function(res) {
        if (res.error) {
          console.warn('equip item fetch failed:', res.error);
          showToast('Could not load item data', true);
          renderEquipped();
          return;
        }
        if (!res.data) {
          console.warn('equip item fetch returned no data for id:', catalogId);
          renderEquipped();
          return;
        }

        renderEquipped();
      });
    } else {
      EQUIPPED_ITEMS[equipKey] = { name: invItem.custom_name || 'Unknown item', weight_lb: invItem.weight_lb || 0, category: itemCategory };
