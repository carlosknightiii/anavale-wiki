<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Anavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Roboto:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    /* ── CSS Variables (mirrors character.css :root exactly) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-headers:  'Charm', serif;
      --font-serif:    'Cinzel Decorative', Georgia, serif;
      --font-sans:     'Roboto', system-ui, sans-serif;
      --font-mono:     'Courier New', Courier, monospace;

      --parchment:        #f5ead4;
      --parchment-light:  #f8f1e2;
      --parchment-dark:   #e8d4a8;
      --ink:              #2a1f0e;
      --ink-light:        #4a3520;
      --ink-faint:        #7a6548;
      --gold:             #c8940a;
      --gold-light:       #e8b830;
      --amber:            #7a5200;
      --white:            #ffffff;
      --teal:             #1a6a5a;
      --violet:           #4a2878;
      --green:            #2a5818;
      --bubbleseed:       #2a7a3a;
      --featherflow:      #2266b8;
      --steelfist:        #6a3aaa;
      --flamerage:        #aa3a1a;
      --gradient-colorful: linear-gradient(135deg, #e8c84a 0%, #f8e888 30%, #e87a8a 55%, #9a70e8 80%, #4ac8b8 100%);

      --char-bg:               #0a0e18;
      --char-panel:            rgba(10, 14, 24, 0.85);
      --char-border:           var(--ink-faint);
      --char-border-gold:      var(--gold);
      --char-radius:           12px;
      --char-card-bg:          rgba(18, 24, 42, 0.95);
      --char-card-bg-hover:    rgba(22, 30, 54, 0.98);
      --char-card-bg-selected: rgba(40, 30, 10, 0.95);
      --char-accent-tint:      rgba(255, 255, 255, 0.08);
      --char-accent-border:    rgba(255, 255, 255, 0.3);
      --char-accent-border-mid:rgba(255, 255, 255, 0.4);
      --char-section-bg:       rgba(10, 14, 24, 0.75);
      --char-text-muted:       rgba(255, 255, 255, 0.8);
      --char-text-faint:       rgba(245, 234, 212, 0.65);
      --char-highlight-tint:   rgba(200, 148, 10, 0.1);
      --char-highlight-border: rgba(200, 148, 10, 0.3);
      --char-card-bg-subtle:   rgba(255, 255, 255, 0.03);
    }

    /* ── Page Shell ── */
    body {
      background:
        linear-gradient(rgba(3,4,12,0.88), rgba(3,4,12,0.88)),
        url('../assets/images/regions/img-caparia-landscape.webp') center/cover fixed;
      color: var(--parchment);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav Bar ── */
    .cs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 15, 0.92);
      border-bottom: 1px solid rgba(200,148,10,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .cs-nav-title {
      font-family: var(--font-headers);
      font-size: 1.25rem;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .cs-nav-back {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    .cs-nav-back:hover { opacity: 1; color: var(--gold); }

    /* ── Main content wrapper ── */
    .cs-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Hero Section ── */
    .cs-hero {
      position: relative;
      border-radius: var(--char-radius);
      overflow: hidden;
      margin-bottom: 2rem;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .cs-hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 30%;
      filter: brightness(0.4) saturate(1.2);
    }
    .cs-hero-orb-a {
      position: absolute;
      width: 420px; height: 420px;
      border-radius: 50%;
      filter: blur(60px);
      top: -140px; left: -100px;
      pointer-events: none;
      opacity: 0.55;
      animation: cs-orb1 20s ease-in-out infinite;
    }
    .cs-hero-orb-b {
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      filter: blur(60px);
      bottom: -60px; right: -80px;
      pointer-events: none;
      opacity: 0.35;
      animation: cs-orb2 26s ease-in-out infinite;
    }
    .cs-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(3,4,12,0.97) 0%, rgba(3,4,12,0.80) 50%, rgba(3,4,12,0.15) 100%);
    }
    .cs-hero-bottom-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: linear-gradient(to bottom, transparent, rgba(3,4,12,0.97));
      pointer-events: none;
    }
    .cs-hero-portrait-wrap {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 180px;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }
    .cs-portrait-upload-btn {
      position: absolute;
      bottom: 0.75rem;
      right: 0.5rem;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(10,14,24,0.88);
      color: white;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      opacity: 1;
      z-index: 10;
    }
    .cs-portrait-upload-btn:hover { background: rgba(200,148,10,0.35); border-color: rgba(200,148,10,0.6); }
    .cs-hero-portrait {
      position: absolute;
      right: 1.5rem; bottom: 1rem;
      width: 110px; height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(200,148,10,0.4);
      box-shadow: 0 0 24px rgba(0,0,0,0.7);
      opacity: 0.85;
    }
    .cs-hero-content {
      position: relative;
      z-index: 2;
      padding: 1.75rem 1.5rem 1.5rem;
    }
    .cs-hero-eyebrow {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
      font-weight: 700;
    }
    .cs-hero-name {
      font-family: var(--font-headers);
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      color: var(--white);
      line-height: 1.05;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 16px rgba(0,0,0,0.9);
    }
    .cs-hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .cs-hero-tag {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.05);
    }
    .cs-hero-tag--type {
      color: #fff;
      border-color: transparent;
    }

    /* ── Stat row (ability scores) ── */
    .cs-stat-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .cs-stat-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.75rem 0.4rem;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .cs-stat-block:hover {
      border-color: var(--char-highlight-border);
      background: var(--char-card-bg-hover);
    }
    .cs-stat-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--white);
      line-height: 1;
      margin-bottom: 0.2rem;
    }
    .cs-stat-mod {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--gold-light);
      margin-bottom: 0.3rem;
    }
    .cs-stat-label {
      font-family: var(--font-sans);
      font-size: 0.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }

    /* ── Section headers ── */
    .cs-section {
      margin-bottom: 1.75rem;
    }
    .cs-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--char-highlight-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-section-label::before {
      content: '✦';
      font-size: 0.55rem;
      opacity: 0.6;
    }

    /* ── Identity grid ── */
    .cs-identity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .cs-identity-row {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .cs-identity-key {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-identity-val {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--parchment);
      font-weight: 400;
    }

    /* ── Appearance block ── */
    .cs-appearance-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      padding: 1.25rem 1.5rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--char-text-muted);
      line-height: 1.8;
      font-style: italic;
    }
    .cs-appearance-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1rem;
    }
    .cs-chip {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--char-text-faint);
      background: var(--char-accent-tint);
    }
    .cs-chip-label {
      color: rgba(200,148,10,0.7);
      font-weight: 700;
      margin-right: 0.3rem;
    }

    /* ── Story panel ── */
    .cs-story-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      overflow: hidden;
    }
    .cs-story-row {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .cs-story-row:last-child { border-bottom: none; }
    .cs-story-key {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      padding-top: 0.05rem;
      line-height: 1.4;
    }
    .cs-story-val {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--char-text-muted);
      line-height: 1.7;
    }
    .cs-story-val em {
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ── Gear list ── */
    .cs-gear-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .cs-gear-item {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-gear-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* ── Gold display ── */
    .cs-gold-block {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--char-highlight-tint);
      border: 1px solid var(--char-highlight-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
    }
    .cs-gold-icon {
      font-size: 1.4rem;
      color: var(--gold-light);
      flex-shrink: 0;
    }
    .cs-gold-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--gold-light);
      line-height: 1;
    }
    .cs-gold-label {
      font-family: var(--font-sans);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.6);
      font-weight: 700;
      margin-top: 0.15rem;
    }

    /* ── Gigglegloom type banner ── */
    .cs-type-banner {
      border-radius: var(--char-radius);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .cs-type-banner-bg {
      position: absolute;
      inset: 0;
      opacity: 0.12;
    }
    .cs-type-icon {
      width: 40px; height: 40px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 10px currentColor);
    }
    .cs-type-name {
      font-family: var(--font-headers);
      font-size: 1.5rem;
      color: var(--white);
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    .cs-type-element {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.15rem;
      position: relative;
      z-index: 1;
    }
    .cs-type-desc {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      line-height: 1.65;
      margin-top: 0.65rem;
      position: relative;
      z-index: 1;
    }

    /* ── Not-found state ── */
    .cs-not-found {
      text-align: center;
      padding: 6rem 2rem;
    }
    .cs-not-found-glyph {
      font-family: var(--font-headers);
      font-size: 5rem;
      color: rgba(200,148,10,0.15);
      margin-bottom: 1.5rem;
      line-height: 1;
    }
    .cs-not-found-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--char-text-faint);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .cs-not-found-body {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: rgba(245,234,212,0.4);
      line-height: 1.8;
      max-width: 380px;
      margin: 0 auto 2rem;
    }
    .cs-not-found-link {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--char-highlight-border);
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .cs-not-found-link:hover {
      background: var(--char-highlight-tint);
      border-color: var(--gold);
    }

    /* ── Divider ornament ── */
    .cs-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0 1.5rem;
      opacity: 0.25;
    }
    .cs-divider::before, .cs-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold);
    }
    .cs-divider-glyph {
      font-family: var(--font-headers);
      font-size: 0.85rem;
      color: var(--gold);
    }

    /* ── Footer ── */
    .cs-footer {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.15);
    }

    /* ── Animations ── */
    @keyframes cs-orb1 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(30px, 20px); }
    }
    @keyframes cs-orb2 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(-20px, -30px); }
    }
    @keyframes cs-fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cs-wrap { animation: cs-fadein 0.5s ease forwards; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cs-stat-row { grid-template-columns: repeat(3, 1fr); }
      .cs-identity-grid { grid-template-columns: 1fr; }
      .cs-story-row { grid-template-columns: 1fr; gap: 0.2rem; }
      .cs-gear-grid { grid-template-columns: 1fr; }
      .cs-hero-portrait { display: none; }
      .cs-nav { padding: 0.6rem 1rem; }
    }
    @media (max-width: 380px) {
      .cs-stat-row { grid-template-columns: repeat(3, 1fr); gap: 0.35rem; }
      .cs-stat-val { font-size: 1.25rem; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .cs-wrap { animation: none; }
      .cs-hero-orb-a, .cs-hero-orb-b { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="cs-nav">
    <a class="cs-nav-title" href="../index.html">✦ Anavale</a>
    <a class="cs-nav-back" href="../index.html">← Return to Wiki</a>
  </nav>

  <!-- Main content — rendered by JS below -->
  <main class="cs-wrap" id="cs-main">
    <!-- populated by renderSheet() -->
  </main>

  <footer class="cs-footer" id="cs-footer"></footer>

  <div id="cs-toast" class="cs-toast"></div>

  <style>
    /* ── Loading state ── */
    .cs-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1.5rem;
    }
    .cs-loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(200,148,10,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: cs-spin 0.9s linear infinite;
    }
    .cs-loading-text {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.4);
    }
    @keyframes cs-spin { to { transform: rotate(360deg); } }

    /* ── HP tracker ── */
    .cs-hp-block {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }
    .cs-hp-cell {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--char-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-hp-cell--current { border-color: rgba(180,60,60,0.35); background: rgba(180,60,60,0.07); }
    .cs-hp-label {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-hp-val {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--white);
      line-height: 1;
    }
    .cs-hp-cell--current .cs-hp-val { color: #f87171; }
    .cs-hp-controls {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }
    .cs-hp-btn {
      flex: 1;
      padding: 0.35rem 0;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    t.classList.add('visible');
    setTimeout(function() { t.classList.remove('visible'); }, 3000);
  }

  // ── Appearance helpers ────────────────────────────────────────────
  function buildAppearanceDesc(app) {
    if (!app) return null;
    var parts = [];
    if (app.height && app.build) parts.push(cap(app.height) + ', ' + app.build + ' build.');
    else if (app.height) parts.push(cap(app.height) + '.');
    if (app.age) parts.push(cap(app.age) + '.');
    var face = [];
    if (app.face_shape) face.push(app.face_shape + ' face');
    if (app.skin_tone)  face.push(app.skin_tone + ' skin');
    if (face.length) parts.push(cap(face.join(', ')) + '.');
    var eyes = [];
    if (app.eye_color) eyes.push(app.eye_color);
    if (app.eye_shape) eyes.push(app.eye_shape);
    if (eyes.length) parts.push(cap(eyes.join(', ')) + ' eyes.');
    var hair = [];
    if (app.hair_color) hair.push(app.hair_color);
    if (app.hair_style) hair.push(app.hair_style + ' hair');
    if (hair.length) parts.push(cap(hair.join(', ')) + '.');
    if (app.facial_hair && app.facial_hair !== 'none') parts.push(cap(app.facial_hair) + '.');
    if (Array.isArray(app.facial_markings) && app.facial_markings.length) {
      parts.push('Markings: ' + app.facial_markings.join(', ') + '.');
    }
    return parts.join(' ') || null;
  }

  function buildGearList(app) {
    if (!app) return [];
    var slotLabels = {
      cloak:'Cloak', top:'Top', lower:'Lower', shoes:'Shoes', hat:'Hat',
      hand_right:'Right Hand', hand_left:'Left Hand',
      ring_right:'Ring (R)', ring_left:'Ring (L)',
      necklace:'Necklace', earrings:'Earrings'
    };
    return Object.keys(slotLabels).filter(function(k) {
      return app[k] && app[k] !== 'none' && app[k] !== '';
    }).map(function(k) {
      return { slot: slotLabels[k], val: cap((app[k]||'').replace(/-/g,' ')) };
    });
  }

  // ── Not-found template ────────────────────────────────────────────
  function renderNotFound(title, body) {
    return '<div class="cs-not-found">'
      + '<div class="cs-not-found-glyph">✦</div>'
      + '<div class="cs-not-found-title">' + title + '</div>'
      + '<div class="cs-not-found-body">' + body + '</div>'
      + '<a class="cs-not-found-link" href="../index.html">← Return to Anavale Wiki</a>'
      + '</div>';
  }

          + '<div class="cs-hero-eyebrow">Anavale · Character Sheet</div>'
          + '<div class="cs-hero-name">' + (ch.name||'Unknown') + '</div>'
          + '<div class="cs-hero-tags">'
            + '<span class="cs-hero-tag cs-hero-tag--type" style="background:' + typeMeta.color + '22;border-color:' + typeMeta.color + '55;color:#fff;">' + typeMeta.name + '</span>'
            + '<span class="cs-hero-tag">' + classDisplay + '</span>'

              + '<option value="armor">Armor</option>'
              + '<option value="consumable">Consumable</option>'
              + '<option value="shield">Shield</option>'
              + '<option value="tool">Tool</option>'
              + '<option value="weapon">Weapon</option>'
            + '</select>'
          + '</div>'

        + '</div>'

        + '<div class="cs-inv-list" id="cs-inv-list"><div class="cs-inv-empty">Loading inventory…</div></div>'
      + '</div>'

  // ── Render live-play data (HP, gold, inventory, notes, photo) ─────
  function renderLivePlay() {
    renderHP();
    renderGold();
    renderInventory();
    renderNotes();
    renderPhoto();
  }

  // ── HP ────────────────────────────────────────────────────────────
  function renderHP() {
    var block  = document.getElementById('cs-hp-block');
    if (!block) return;
    var hpCur     = SHEET ? SHEET.hp_current : '—';
    var hpMaxBase = SHEET ? SHEET.hp_max : 0;
    var hpModifier = SHEET ? (SHEET.hp_max_modifier || 0) : 0;
    var hpMaxEffective = hpMaxBase + hpModifier;
    var hpTemp    = SHEET ? (SHEET.hp_temp || 0) : 0;
    block.innerHTML =
      '<div class="cs-hp-cell cs-hp-cell--current">'
        + '<div class="cs-hp-label">Current HP</div>'
        + '<div class="cs-hp-val" id="cs-hp-current">' + hpCur + '</div>'
        + '<div class="cs-hp-controls">'
          + '<button class="cs-hp-btn" onclick="adjustHP(-1)" title="−1">−</button>'
          + '<button class="cs-hp-btn" onclick="adjustHP(1)"  title="+1">+</button>'
        + '</div>'
        + '<div class="cs-hp-input-row">'
          + '<input class="cs-hp-input" id="cs-hp-delta" type="number" placeholder="±">'
          + '<button class="cs-hp-apply" onclick="applyHPDelta()">Apply</button>'
        + '</div>'
      + '</div>'
      + '<div class="cs-hp-cell">'
        + '<div class="cs-hp-label">Max HP</div>'
        + '<div class="cs-hp-val">' + hpMaxEffective + (hpModifier !== 0 ? ' <span style="font-size:0.7rem;color:' + (hpModifier > 0 ? '#6ecf6e' : '#f87171') + ';">(' + (hpModifier > 0 ? '+' : '') + hpModifier + ')</span>' : '') + '</div>'
        + '<div class="cs-hp-input-row">'
          + '<input class="cs-hp-input" id="cs-hp-max-modifier" type="number" placeholder="±" title="Temporary max HP change from a status effect">'
          + '<button class="cs-hp-apply" onclick="setMaxHPModifier()">Set</button>'
        + '</div>'
      + '</div>'
      + '<div class="cs-hp-cell">'
        + '<div class="cs-hp-label">Temp HP</div>'
        + '<div class="cs-hp-val" id="cs-hp-temp">' + hpTemp + '</div>'
        + '<div class="cs-hp-input-row">'
          + '<input class="cs-hp-input" id="cs-hp-temp-input" type="number" min="0" placeholder="0">'
          + '<button class="cs-hp-apply" onclick="setTempHP()">Set</button>'
        + '</div>'
      + '</div>';
  }

  function adjustHP(delta) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.hp_current) || 0;
    var maxEffective = (parseInt(SHEET.hp_max) || 0) + (parseInt(SHEET.hp_max_modifier) || 0);
    SHEET.hp_current = Math.max(0, Math.min(maxEffective, cur + delta));
    document.getElementById('cs-hp-current').textContent = SHEET.hp_current;
    saveSheet({ hp_current: SHEET.hp_current });
  }
  function setTempHP() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-temp-input');
    var val = parseInt(input.value);
    if (isNaN(val) || val < 0) return;
    SHEET.hp_temp = val;
    saveSheet({ hp_temp: val });
    input.value = '';
    renderHP();
  }
  function setMaxHPModifier() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-max-modifier');
    var val = parseInt(input.value);
    if (isNaN(val)) return;
    SHEET.hp_max_modifier = val;
    saveSheet({ hp_max_modifier: val });
    input.value = '';
    renderHP();
  }

  function applyHPDelta() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-delta');
    var delta = parseInt(input.value) || 0;
    if (!delta) return;
    adjustHP(delta);
    input.value = '';
  }

  // ── Gold ──────────────────────────────────────────────────────────
  function renderGold() {
    var block = document.getElementById('cs-gold-block');
    if (!block) return;
    var cp     = SHEET ? (SHEET.gold_cp || 0) : 0;
    var gpWhole = Math.floor(cp / 100);
    var spRem   = Math.floor((cp % 100) / 10);
    var cpRem   = cp % 10;
    var display = gpWhole + ' gp';
    if (spRem) display += ' ' + spRem + ' sp';
    if (cpRem) display += ' ' + cpRem + ' cp';
    block.innerHTML =
      '<div class="cs-gold-block">'
        + '<div class="cs-gold-icon">◈</div>'
        + '<div>'
          + '<div class="cs-gold-val" id="cs-gold-val">' + display + '</div>'
          + '<div class="cs-gold-label">Current gold</div>'
        + '</div>'
      + '</div>'
      + '<div class="cs-gold-edit-row">'
        + '<input class="cs-gold-input" id="cs-gold-input" type="number" placeholder="gp" title="Enter gold pieces">'
        + '<button class="cs-gold-save" onclick="setGold()">Set Gold</button>'
      + '</div>';
  }

  function setGold() {
    if (!SHEET) return;
    var input = document.getElementById('cs-gold-input');
    var gp = parseFloat(input.value);
    if (isNaN(gp)) return;
    SHEET.gold_cp = Math.round(gp * 100);
    saveSheet({ gold_cp: SHEET.gold_cp });
    input.value = '';
    renderGold();
    showToast('Gold updated');
  }

  // ── Inventory ─────────────────────────────────────────────────────
  function renderInventory() {
    var list = document.getElementById('cs-inv-list');
    if (!list) return;
    var totalWeight = INVENTORY.reduce(function(sum, item) {
      var w = item.item_id ? (catalogWeightFor(item.item_id) || 0) : (parseFloat(item.weight_lb) || 0);
      return sum + (w * (parseInt(item.quantity) || 0));
    }, 0);
    var weightEl = document.getElementById('cs-inv-weight-total');
    if (weightEl) weightEl.textContent = 'Carrying: ' + (Math.round(totalWeight * 10) / 10) + ' lb';
    if (!INVENTORY.length) {
      list.innerHTML = '<div class="cs-inv-empty">No items yet — search above or add a custom item.</div>';
      return;
    }
    var favorites = INVENTORY.filter(function(i) { return i.is_favorite; }).sort(function(a,b) { return (a.sort_order||0) - (b.sort_order||0); });
    var regular   = INVENTORY.filter(function(i) { return !i.is_favorite; }).sort(function(a,b) { return (a.sort_order||0) - (b.sort_order||0); });
    var html = '';
    if (favorites.length) {
      html += '<div class="cs-inv-section-label">★ Favorites</div>';
      html += '<div class="cs-inv-sortable" data-group="favorite">' + favorites.map(renderInvRow).join('') + '</div>';
    }
    if (regular.length) {
      if (favorites.length) html += '<div class="cs-inv-section-label">Items</div>';
      html += '<div class="cs-inv-sortable" data-group="regular">' + regular.map(renderInvRow).join('') + '</div>';
    }
    list.innerHTML = html;
  }
  var TYPE_ICONS = {
    weapon:'⚔️', armor:'🛡️', shield:'🛡️', consumable:'🧪', tool:'🔧',
    accessory:'💍', spell:'📜', food:'🍖', resource:'🪵', treasure:'💰', other:'📦'
  };
  function renderInvRow(item) {
    var catalogItem = item.item_id ? CATALOG_CACHE[item.item_id] : null;
    var name = catalogItem ? catalogItem.name : (item.custom_name || 'Unknown item');
    var type = catalogItem ? catalogItem.category : (item.item_type || 'other');
    var costGp = catalogItem ? (catalogItem.cost_gp || 0) : (item.cost_gp || 0);
    var costSp = item.item_id ? 0 : (item.cost_sp || 0);
    var costCp = item.item_id ? 0 : (item.cost_cp || 0);
    var costStr = [costGp ? costGp + 'gp' : '', costSp ? costSp + 'sp' : '', costCp ? costCp + 'cp' : ''].filter(Boolean).join(' ') || '—';
    var weight = catalogItem ? (catalogItem.weight_lb || 0) : (item.weight_lb || 0);
    var desc = catalogItem ? catalogItem.summary : item.custom_desc;
    var thumb = (catalogItem && catalogItem.image)
      ? '<img class="cs-inv-thumb" src="' + catalogItem.image + '" alt="">'
      : '<div class="cs-inv-thumb cs-inv-thumb-icon">' + (TYPE_ICONS[type] || '📦') + '</div>';
    var editBtn = !item.item_id
      ? '<button class="cs-inv-edit" onclick="openCustomItemModal(\'' + item.id + '\')" title="Edit">✎</button>'
      : '';
    return '<div class="cs-inv-row-wrap">'
      + '<div class="cs-inv-row" draggable="true" data-id="' + item.id + '" id="inv-' + item.id + '">'
        + '<span class="cs-inv-drag-handle">⠿</span>'
        + thumb
        + '<button class="cs-inv-fav-btn' + (item.is_favorite ? ' active' : '') + '" onclick="toggleFavorite(\'' + item.id + '\')" title="Favorite">★</button>'
        + '<div class="cs-inv-name-wrap">'
          + '<div class="cs-inv-name"' + (desc ? ' onclick="toggleInvDesc(\'' + item.id + '\')" style="cursor:pointer;"' : '') + '>' + name + (desc ? ' <span class="cs-inv-expand-arrow" id="arrow-' + item.id + '">▾</span>' : '') + '</div>'
        + '</div>'
        + '<span class="cs-inv-type-tag">' + type + '</span>'
        + '<input class="cs-inv-qty-input" type="number" min="0" value="' + (item.quantity||0) + '" onchange="updateInvQuantity(\'' + item.id + '\', this.value)">'
        + '<span class="cs-inv-cost">' + costStr + '</span>'
        + '<span class="cs-inv-weight">' + (weight||0) + 'lb</span>'
        + editBtn
        + '<button class="cs-inv-del" onclick="confirmDeleteItem(\'' + item.id + '\', \'' + name.replace(/'/g,"\\'") + '\')" title="Remove">×</button>'
      + '</div>'
      + (desc ? '<div class="cs-inv-desc-panel" id="desc-' + item.id + '" style="display:none;">' + desc + '</div>' : '')
    + '</div>';
  }
  function toggleInvDesc(id) {
    var panel = document.getElementById('desc-' + id);
    var arrow = document.getElementById('arrow-' + id);
    if (!panel) return;
    var open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    if (arrow) arrow.textContent = open ? '▾' : '▴';
  }
  var CATALOG_CACHE = {};
  var SEARCH_DEBOUNCE = null;
  var EDITING_ITEM_ID = null;
  function catalogWeightFor(itemId) {
    return CATALOG_CACHE[itemId] ? CATALOG_CACHE[itemId].weight_lb : 0;
  }
  function onInventorySearchInput() {
    clearTimeout(SEARCH_DEBOUNCE);
    var q = (document.getElementById('cs-inv-search-input').value || '').trim();
    var resultsEl = document.getElementById('cs-inv-search-results');
    if (q.length < 2) { resultsEl.innerHTML = ''; resultsEl.classList.remove('visible'); return; }
    SEARCH_DEBOUNCE = setTimeout(function() { runInventorySearch(q); }, 250);
  }
  function runInventorySearch(q) {
    var cat = document.getElementById('cs-inv-cat-select').value;
    var query = sb.from('items').select('id,name,category,cost_gp,weight_lb,summary,base_ac,damage_dice,damage_type,image')
      .eq('player_facing', true)
      .ilike('name', '%' + q + '%')
      .order('name')
      .limit(8);
    if (cat) query = query.eq('category', cat);
    query.then(function(res) {
      var resultsEl = document.getElementById('cs-inv-search-results');
      resultsEl.classList.add('visible');
      if (res.error || !res.data || !res.data.length) {
        resultsEl.innerHTML = '<div class="cs-inv-empty">No matches.</div>';
        return;
      }
      res.data.forEach(function(it) { CATALOG_CACHE[it.id] = it; });
      resultsEl.innerHTML = res.data.map(function(it) {
        var thumb = it.image ? '<img class="cs-inv-thumb" src="' + it.image + '" alt="">' : '<div class="cs-inv-thumb cs-inv-thumb-icon">' + (TYPE_ICONS[it.category] || '📦') + '</div>';
        return '<div class="cs-inv-result-row">'
          + thumb
          + '<div class="cs-inv-result-info" onclick="event.stopPropagation()">'
            + '<span class="cs-inv-result-name">' + it.name + '</span>'
            + '<span class="cs-inv-result-meta">' + (it.category||'') + ' · ' + (it.cost_gp||0) + 'gp · ' + (it.weight_lb||0) + 'lb</span>'
          + '</div>'
          + '<div class="cs-inv-result-add">'
            + '<input class="cs-inv-qty-input" type="number" min="1" value="1" id="qty-' + it.id + '" onclick="event.stopPropagation()">'
            + '<button class="cs-inv-result-add-btn" onclick="selectCatalogItem(\'' + it.id + '\')">Add</button>'
          + '</div>'
        + '</div>';
      }).join('');
    });
  }
  function selectCatalogItem(itemId) {
    var it = CATALOG_CACHE[itemId];
    if (!it) return;
    var qtyInput = document.getElementById('qty-' + itemId);
    var qty = parseInt(qtyInput ? qtyInput.value : 1) || 1;
    var maxSort = Math.max(0, ...INVENTORY.filter(function(i){return !i.is_favorite;}).map(function(i){return i.sort_order||0;}));
    var row = { character_id: CHAR_ID, token: TOKEN, item_id: itemId, quantity: qty, sort_order: maxSort + 1 };
    sb.from('inventory').insert(row).select().then(function(res) {
      if (res.error) { showToast('Could not add item — ' + res.error.message, true); return; }
      INVENTORY.push(res.data[0]);
      document.getElementById('cs-inv-search-input').value = '';
      document.getElementById('cs-inv-search-results').innerHTML = '';
      document.getElementById('cs-inv-search-results').classList.remove('visible');
      renderInventory();
      showToast(it.name + ' added');
    });
  }
  var ITEM_TYPE_LIST = ['accessory','armor','consumable','food','other','resource','shield','spell','tool','treasure','weapon'];
  function openCustomItemModal(editId) {
    EDITING_ITEM_ID = editId || null;
    var existing = editId ? INVENTORY.find(function(i){ return i.id === editId; }) : null;
    var prefillName = existing ? existing.custom_name : (document.getElementById('cs-inv-search-input').value || '').trim();
    document.getElementById('cs-item-modal-title').textContent = existing ? 'Edit Item' : 'Create New Item';
    var body = document.getElementById('cs-item-modal-body');
    body.innerHTML =
      '<div class="cs-field-group"><label class="cs-field-label">Item Name</label>'
        + '<input class="cs-inv-input" id="ci-name" value="' + (prefillName||'').replace(/"/g,'&quot;') + '"></div>'
      + '<div class="cs-field-group"><label class="cs-field-label">Item Type</label>'
        + '<select class="cs-inv-cat-select" id="ci-type" style="width:100%;">'
          + '<option value="">Select</option>'
          + ITEM_TYPE_LIST.map(function(t){
              var sel = existing && existing.item_type === t ? ' selected' : '';
              return '<option value="' + t + '"' + sel + '>' + t.charAt(0).toUpperCase()+t.slice(1) + '</option>';
            }).join('')
        + '</select></div>'
      + '<div class="cs-field-group"><label class="cs-field-label">Description</label>'
        + '<textarea class="cs-inv-input" id="ci-desc" style="width:100%;min-height:70px;">' + (existing && existing.custom_desc ? existing.custom_desc : '') + '</textarea></div>'
      + '<div class="cs-field-row-4">'
        + '<div class="cs-field-group"><label class="cs-field-label">Qty</label><input class="cs-inv-input" id="ci-qty" type="number" min="0" value="' + (existing ? existing.quantity : 1) + '"></div>'
        + '<div class="cs-field-group"><label class="cs-field-label">GP</label><input class="cs-inv-input" id="ci-gp" type="number" min="0" value="' + (existing ? (existing.cost_gp||0) : 0) + '"></div>'
        + '<div class="cs-field-group"><label class="cs-field-label">SP</label><input class="cs-inv-input" id="ci-sp" type="number" min="0" value="' + (existing ? (existing.cost_sp||0) : 0) + '"></div>'
        + '<div class="cs-field-group"><label class="cs-field-label">CP</label><input class="cs-inv-input" id="ci-cp" type="number" min="0" value="' + (existing ? (existing.cost_cp||0) : 0) + '"></div>'
      + '</div>'
      + '<div class="cs-field-group"><label class="cs-field-label">Weight (lb)</label>'
        + '<input class="cs-inv-input" id="ci-weight" type="number" min="0" step="0.1" value="' + (existing ? (existing.weight_lb||0) : 0) + '"></div>'
      + '<div style="margin-top:0.5rem;">'
        + '<label class="cs-checkbox-label"><input type="checkbox" id="ci-magical"' + (existing && existing.is_magical ? ' checked' : '') + '> Magical</label>'
        + '<label class="cs-checkbox-label" style="margin-left:1.2rem;"><input type="checkbox" id="ci-consumable"' + (existing && existing.is_consumable ? ' checked' : '') + '> Consumable</label>'
      + '</div>'
      + '<div id="ci-warning" style="display:none;margin-top:0.75rem;padding:0.6rem;background:rgba(200,148,10,0.12);border:1px solid rgba(200,148,10,0.4);border-radius:6px;font-size:0.82rem;"></div>'
      + '<div style="display:flex;gap:0.6rem;justify-content:flex-end;margin-top:1rem;">'
        + '<button class="cs-modal-btn-secondary" onclick="closeCustomItemModal()">Cancel</button>'
        + '<button class="cs-modal-btn-primary" onclick="submitCustomItem()">' + (existing ? 'Save Changes' : 'Save and Add') + '</button>'
      + '</div>';
    document.getElementById('cs-item-modal-overlay').style.display = 'flex';
  }
  function closeCustomItemModal() {
    document.getElementById('cs-item-modal-overlay').style.display = 'none';
    EDITING_ITEM_ID = null;
  }
  function levenshteinSimilarity(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    var m = a.length, n = b.length;
    if (!m) return n ? 0 : 1;
    if (!n) return 0;
    var d = [];
    for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i-1] === b[j-1] ? 0 : 1;
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      }
    }
    var dist = d[m][n];
    var maxLen = Math.max(m, n);
    return 1 - (dist / maxLen);
  }
  function checkCatalogForMatch(name) {
    return sb.from('items').select('id,name').eq('player_facing', true).limit(200).then(function(res) {
      if (res.error || !res.data) return null;
      var best = null, bestScore = 0;
      res.data.forEach(function(it) {
        var score = levenshteinSimilarity(name, it.name);
        if (score > bestScore) { bestScore = score; best = it; }
      });
      return bestScore >= 0.7 ? best : null;
    });
  }
  function submitCustomItem() {
    var name = (document.getElementById('ci-name').value || '').trim();
    if (!name) { showToast('Item name required', true); return; }
    var warningEl = document.getElementById('ci-warning');
    checkCatalogForMatch(name).then(function(match) {
      if (match && !EDITING_ITEM_ID) {
        warningEl.style.display = 'block';
        warningEl.innerHTML = 'This looks like <strong>' + match.name + '</strong> — did you mean to search for that instead? '
          + '<button class="cs-modal-btn-secondary" style="margin-top:0.5rem;" onclick="useMatchInstead(\'' + match.id + '\')">Use ' + match.name + '</button>';
        return;
      }
      warningEl.style.display = 'none';
      var fields = {
        custom_name: name,
        item_type: document.getElementById('ci-type').value || 'other',
        custom_desc: (document.getElementById('ci-desc').value || '').trim() || null,
        quantity: parseInt(document.getElementById('ci-qty').value) || 0,
        cost_gp: parseFloat(document.getElementById('ci-gp').value) || 0,
        cost_sp: parseFloat(document.getElementById('ci-sp').value) || 0,
        cost_cp: parseFloat(document.getElementById('ci-cp').value) || 0,
        weight_lb: parseFloat(document.getElementById('ci-weight').value) || 0,
        is_magical: document.getElementById('ci-magical').checked,
        is_consumable: document.getElementById('ci-consumable').checked
      };
      if (EDITING_ITEM_ID) {
        sb.from('inventory').update(fields).eq('id', EDITING_ITEM_ID).select().then(function(res) {
          if (res.error) { showToast('Could not save changes — ' + res.error.message, true); return; }
          var idx = INVENTORY.findIndex(function(i){ return i.id === EDITING_ITEM_ID; });
          if (idx >= 0) INVENTORY[idx] = res.data[0];
          closeCustomItemModal();
          renderInventory();
          showToast('Item updated');
        });
      } else {
        var maxSort = Math.max(0, ...INVENTORY.filter(function(i){return !i.is_favorite;}).map(function(i){return i.sort_order||0;}));
        fields.character_id = CHAR_ID;
        fields.token = TOKEN;
        fields.sort_order = maxSort + 1;
        sb.from('inventory').insert(fields).select().then(function(res) {
          if (res.error) { showToast('Could not add item — ' + res.error.message, true); return; }
          INVENTORY.push(res.data[0]);
          closeCustomItemModal();
          renderInventory();
          showToast(name + ' added');
        });
      }
    });
  }
  function useMatchInstead(itemId) {
    closeCustomItemModal();
    sb.from('items').select('id,name,category,cost_gp,weight_lb,summary,image').eq('id', itemId).single().then(function(res) {
      if (res.error || !res.data) { showToast('Could not find that item', true); return; }
      CATALOG_CACHE[itemId] = res.data;
      var qty = parseInt(document.getElementById('ci-qty') ? document.getElementById('ci-qty').value : 1) || 1;
      var maxSort = Math.max(0, ...INVENTORY.filter(function(i){return !i.is_favorite;}).map(function(i){return i.sort_order||0;}));
      var row = { character_id: CHAR_ID, token: TOKEN, item_id: itemId, quantity: qty, sort_order: maxSort + 1 };
      sb.from('inventory').insert(row).select().then(function(insertRes) {
        if (insertRes.error) { showToast('Could not add item — ' + insertRes.error.message, true); return; }
        INVENTORY.push(insertRes.data[0]);
        renderInventory();
        showToast(res.data.name + ' added');
      });
    });
  }
  function toggleFavorite(id) {
    var item = INVENTORY.find(function(i) { return i.id === id; });
    if (!item) return;
    item.is_favorite = !item.is_favorite;
    var maxSort = Math.max(0, ...INVENTORY.filter(function(i){ return i.is_favorite === item.is_favorite && i.id !== id; }).map(function(i){return i.sort_order||0;}));
    item.sort_order = maxSort + 1;
    sb.from('inventory').update({ is_favorite: item.is_favorite, sort_order: item.sort_order }).eq('id', id).then(function(res) {
      if (res.error) { showToast('Could not update favorite', true); return; }
      renderInventory();
    });
  }
  function updateInvQuantity(id, val) {
    var qty = parseInt(val);
    if (isNaN(qty) || qty < 0) return;
    var item = INVENTORY.find(function(i) { return i.id === id; });
    if (item) item.quantity = qty;
    sb.from('inventory').update({ quantity: qty }).eq('id', id).then(function(res) {
      if (res.error) { showToast('Could not update quantity', true); return; }
      renderInventory();
    });
  }
  function confirmDeleteItem(id, name) {
    document.getElementById('cs-delete-confirm-text').textContent = 'Remove "' + name + '" from your inventory? This cannot be undone.';
    var btn = document.getElementById('cs-delete-confirm-btn');
    btn.onclick = function() { deleteInventoryItem(id); closeDeleteConfirm(); };
    document.getElementById('cs-delete-confirm-overlay').style.display = 'flex';
  }
  function closeDeleteConfirm() {
    document.getElementById('cs-delete-confirm-overlay').style.display = 'none';
  }
  function deleteInventoryItem(id) {
    sb.from('inventory').delete().eq('id', id).then(function(res) {
      if (res.error) { showToast('Could not remove item', true); return; }
      INVENTORY = INVENTORY.filter(function(i) { return i.id !== id; });
      renderInventory();
      showToast('Item removed');
    });
  }

  // ── Notes ─────────────────────────────────────────────────────────
  var notesDirty = false;

  function renderNotes() {
    var area = document.getElementById('cs-notes-area');
    if (!area) return;
    area.value = NOTES[ACTIVE_NOTE_TAB] || '';
    notesDirty = false;
  }

  function switchNoteTab(tab) {
    if (notesDirty) saveNotes(true);
    ACTIVE_NOTE_TAB = tab;
    document.querySelectorAll('.cs-notes-tab').forEach(function(b) {
      b.classList.toggle('active', b.textContent.toLowerCase() === tab);
    });
    renderNotes();
  }

  function saveNotes(silent) {
    if (!CHAR_ID) return;
    var content = (document.getElementById('cs-notes-area') || {}).value || '';
    NOTES[ACTIVE_NOTE_TAB] = content;
    notesDirty = false;
    // Upsert: match on character_id + tab
    sb.from('character_notes')
      .upsert({ character_id: CHAR_ID, token: TOKEN, tab: ACTIVE_NOTE_TAB, content: content },
              { onConflict: 'character_id,tab' })
      .then(function(res) {
        if (res.error) { showToast('Notes not saved — ' + res.error.message, true); return; }
        if (!silent) showToast('Notes saved');
      });
  }

  // ── Photo ─────────────────────────────────────────────────────────
  function renderPhoto() {
    if (!PHOTO_URL) return;
    var portrait = document.getElementById('cs-hero-portrait-img');
    if (portrait) {
      portrait.src = PHOTO_URL;
      portrait.style.display = '';
    }
  }

  function uploadPhoto(input) {
    var file = input.files && input.files[0];
    if (!file || !CHAR_ID) return;
    showToast('Uploading…');
    var path = 'characters/' + CHAR_ID;
    sb.storage.from('character-photos').remove([path]).then(function() {
      sb.storage.from('character-photos').upload(path, file, { cacheControl: '3600', contentType: file.type })
      .then(function(res) {
        if (res.error) { showToast('Upload failed — ' + res.error.message, true); return; }
        var url = SB_URL + '/storage/v1/object/public/character-photos/' + path;
        PHOTO_URL = url;
        sb.from('character_photo')
          .upsert({ character_id: CHAR_ID, token: TOKEN, storage_path: path, mime_type: file.type, file_size_bytes: file.size },
                  { onConflict: 'character_id' })
          .then(function(saveRes) {
            if (saveRes.error) { showToast('Photo saved but record not updated', true); return; }
            var portrait = document.getElementById('cs-hero-portrait-img');
            if (portrait) { portrait.src = PHOTO_URL; portrait.style.display = ''; }
            showToast('Photo uploaded ✦');
          });
      });
    });
  }

  // ── Save sheet fields ─────────────────────────────────────────────
  function saveSheet(fields) {
    if (!CHAR_ID) return;
    sb.from('character_sheet')
      .update(fields)
      .eq('character_id', CHAR_ID)
      .then(function(res) {
        if (res.error) showToast('Save failed — ' + res.error.message, true);
      });
  }

  // ── Fetch or create character_sheet row ───────────────────────────
  function fetchOrCreateSheet(ch) {
    return sb.from('character_sheet').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error) { console.warn('Sheet fetch error:', res.error); return; }
        if (res.data) {
          SHEET = res.data;
        } else {
          // First load: create row with HP from player_characters
          var scores = (typeof ch.ability_scores === 'object' && ch.ability_scores) ? ch.ability_scores : {};
          var conMod = Math.floor(((parseInt(scores.con) || 10) - 10) / 2);
          // Derive hit die from class_id — basic mapping
          var hitDie = { barbarian:12, fighter:10, paladin:10, ranger:10, monk:8, druid:8,
                         cleric:8, rogue:8, bard:8, warlock:8, wizard:6, sorcerer:6 };
          var hpMax  = (hitDie[ch.class_id] || 8) + conMod;
          var newRow = {
            character_id: CHAR_ID, token: TOKEN,
            hp_max: hpMax, hp_current: hpMax, hp_temp: 0,
            gold_cp: (BG_GOLD[ch.background_id] || 50) * 100,
            proficiency_bonus: 2
          };
          return sb.from('character_sheet').insert(newRow).select().single()
            .then(function(ins) {
              if (ins.error) { console.warn('Sheet create error:', ins.error); return; }
              SHEET = ins.data;
            });
        }
      });
  }

  // ── Fetch inventory ───────────────────────────────────────────────
  function fetchInventory() {
    return sb.from('inventory').select('*').eq('character_id', CHAR_ID).order('created_at')
      .then(function(res) {
        if (res.error) { console.warn('Inventory fetch error:', res.error); return; }
        INVENTORY = res.data || [];
      });
  }

  // ── Fetch notes ───────────────────────────────────────────────────
  function fetchNotes() {
    return sb.from('character_notes').select('*').eq('character_id', CHAR_ID)
      .then(function(res) {
        if (res.error) { console.warn('Notes fetch error:', res.error); return; }
        (res.data || []).forEach(function(row) { NOTES[row.tab] = row.content; });
      });
  }

  // ── Fetch photo ───────────────────────────────────────────────────
  function fetchPhoto() {
    return sb.from('character_photo').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error || !res.data || !res.data.storage_path) return;
        PHOTO_URL = SB_URL + '/storage/v1/object/public/character-photos/' + res.data.storage_path;
      });
  }

  // ── Main boot ─────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    TOKEN = getToken();
    var main = document.getElementById('cs-main');

    if (!TOKEN) {
      main.innerHTML = renderNotFound('No character link provided.', 'Use the URL from your character creation confirmation page.');
      return;
    }

    // Show loading state immediately — never render stale static data
    main.innerHTML = '<div class="cs-loading">'
      + '<div class="cs-loading-spinner"></div>'
      + '<div class="cs-loading-text">Loading your character…</div>'
      + '</div>';

    // 1. Fetch character from Supabase
    sb.from('player_characters').select('*').eq('token', TOKEN).maybeSingle()
      .then(function(res) {
        if (res.error) {
          main.innerHTML = renderNotFound('Could not load character.', 'There was a problem reaching the server. Please try again in a moment.');
          return;
        }
        if (!res.data) {
          main.innerHTML = renderNotFound('No character found for this link.', 'Make sure you\'re using the exact URL from your confirmation page.');
          return;
        }

        var ch  = res.data;
        CHAR_ID = ch.id;

        // 2. Render static character data immediately
        renderCharacter(ch);

        // 3. Fetch live-play data in parallel, then render all at once
        Promise.all([
          fetchOrCreateSheet(ch),
          fetchInventory(),
          fetchNotes(),
          fetchPhoto()
        ]).then(function() {
          renderLivePlay();
        }).catch(function(err) {
          console.warn('Live-play fetch error:', err);
          renderLivePlay(); // render what we have
        });
      });
  });
  </script>
