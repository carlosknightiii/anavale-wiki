<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Anavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Roboto:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    /* ── CSS Variables (mirrors character.css :root exactly) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-headers:  'Charm', serif;
      --font-serif:    'Cinzel Decorative', Georgia, serif;
      --font-sans:     'Roboto', system-ui, sans-serif;
      --font-mono:     'Courier New', Courier, monospace;

      --parchment:        #f5ead4;
      --parchment-light:  #f8f1e2;
      --parchment-dark:   #e8d4a8;
      --ink:              #2a1f0e;
      --ink-light:        #4a3520;
      --ink-faint:        #7a6548;
      --gold:             #c8940a;
      --gold-light:       #e8b830;
      --amber:            #7a5200;
      --white:            #ffffff;
      --teal:             #1a6a5a;
      --violet:           #4a2878;
      --green:            #2a5818;
      --bubbleseed:       #2a7a3a;
      --featherflow:      #2266b8;
      --steelfist:        #6a3aaa;
      --flamerage:        #aa3a1a;
      --gradient-colorful: linear-gradient(135deg, #e8c84a 0%, #f8e888 30%, #e87a8a 55%, #9a70e8 80%, #4ac8b8 100%);

      --char-bg:               #0a0e18;
      --char-panel:            rgba(10, 14, 24, 0.85);
      --char-border:           var(--ink-faint);
      --char-border-gold:      var(--gold);
      --char-radius:           12px;
      --char-card-bg:          rgba(18, 24, 42, 0.95);
      --char-card-bg-hover:    rgba(22, 30, 54, 0.98);
      --char-card-bg-selected: rgba(40, 30, 10, 0.95);
      --char-accent-tint:      rgba(255, 255, 255, 0.08);
      --char-accent-border:    rgba(255, 255, 255, 0.3);
      --char-accent-border-mid:rgba(255, 255, 255, 0.4);
      --char-section-bg:       rgba(10, 14, 24, 0.75);
      --char-text-muted:       rgba(255, 255, 255, 0.8);
      --char-text-faint:       rgba(245, 234, 212, 0.65);
      --char-highlight-tint:   rgba(200, 148, 10, 0.1);
      --char-highlight-border: rgba(200, 148, 10, 0.3);
      --char-card-bg-subtle:   rgba(255, 255, 255, 0.03);
    }

    /* ── Page Shell ── */
    body {
      background:
        linear-gradient(rgba(3,4,12,0.88), rgba(3,4,12,0.88)),
        url('../assets/images/regions/img-caparia-landscape.webp') center/cover fixed;
      color: var(--parchment);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav Bar ── */
    .cs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 15, 0.92);
      border-bottom: 1px solid rgba(200,148,10,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .cs-nav-title {
      font-family: var(--font-headers);
      font-size: 1.25rem;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .cs-nav-back {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    .cs-nav-back:hover { opacity: 1; color: var(--gold); }

    /* ── Main content wrapper ── */
    .cs-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Hero Section ── */
    .cs-hero {
      position: relative;
      border-radius: var(--char-radius);
      overflow: hidden;
      margin-bottom: 2rem;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .cs-hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 30%;
      filter: brightness(0.4) saturate(1.2);
    }
    .cs-hero-orb-a {
      position: absolute;
      width: 420px; height: 420px;
      border-radius: 50%;
      filter: blur(60px);
      top: -140px; left: -100px;
      pointer-events: none;
      opacity: 0.55;
      animation: cs-orb1 20s ease-in-out infinite;
    }
    .cs-hero-orb-b {
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      filter: blur(60px);
      bottom: -60px; right: -80px;
      pointer-events: none;
      opacity: 0.35;
      animation: cs-orb2 26s ease-in-out infinite;
    }
    .cs-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(3,4,12,0.97) 0%, rgba(3,4,12,0.80) 50%, rgba(3,4,12,0.15) 100%);
    }
    .cs-hero-bottom-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: linear-gradient(to bottom, transparent, rgba(3,4,12,0.97));
      pointer-events: none;
    }
    .cs-hero-portrait-wrap {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 180px;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }
    .cs-portrait-upload-btn {
      position: absolute;
      bottom: 0.75rem;
      right: 0.5rem;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(10,14,24,0.88);
      color: white;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      opacity: 1;
      z-index: 10;
    }
    .cs-portrait-upload-btn:hover { background: rgba(200,148,10,0.35); border-color: rgba(200,148,10,0.6); }
    .cs-hero-portrait {
      position: absolute;
      right: 1.5rem; bottom: 1rem;
      width: 110px; height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(200,148,10,0.4);
      box-shadow: 0 0 24px rgba(0,0,0,0.7);
      opacity: 0.85;
    }
    .cs-hero-content {
      position: relative;
      z-index: 2;
      padding: 1.75rem 1.5rem 1.5rem;
    }
    .cs-hero-eyebrow {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
      font-weight: 700;
    }
    .cs-hero-name {
      font-family: var(--font-headers);
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      color: var(--white);
      line-height: 1.05;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 16px rgba(0,0,0,0.9);
    }
    .cs-hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .cs-hero-tag {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.05);
    }
    .cs-hero-tag--type {
      color: #fff;
      border-color: transparent;
    }

    /* ── Stat row (ability scores) ── */
    .cs-stat-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .cs-stat-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.75rem 0.4rem;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .cs-stat-block:hover {
      border-color: var(--char-highlight-border);
      background: var(--char-card-bg-hover);
    }
    .cs-stat-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--white);
      line-height: 1;
      margin-bottom: 0.2rem;
    }
    .cs-stat-mod {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--gold-light);
      margin-bottom: 0.3rem;
    }
    .cs-stat-label {
      font-family: var(--font-sans);
      font-size: 0.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }

    /* ── Section headers ── */
    .cs-section {
      margin-bottom: 1.75rem;
    }
    .cs-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--char-highlight-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-section-label::before {
      content: '✦';
      font-size: 0.55rem;
      opacity: 0.6;
    }

    /* ── Identity grid ── */
    .cs-identity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .cs-identity-row {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .cs-identity-key {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-identity-val {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--parchment);
      font-weight: 400;
    }

    /* ── Appearance block ── */
    .cs-appearance-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      padding: 1.25rem 1.5rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--char-text-muted);
      line-height: 1.8;
      font-style: italic;
    }
    .cs-appearance-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1rem;
    }
    .cs-chip {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--char-text-faint);
      background: var(--char-accent-tint);
    }
    .cs-chip-label {
      color: rgba(200,148,10,0.7);
      font-weight: 700;
      margin-right: 0.3rem;
    }

    /* ── Story panel ── */
    .cs-story-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      overflow: hidden;
    }
    .cs-story-row {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .cs-story-row:last-child { border-bottom: none; }
    .cs-story-key {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      padding-top: 0.05rem;
      line-height: 1.4;
    }
    .cs-story-val {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--char-text-muted);
      line-height: 1.7;
    }
    .cs-story-val em {
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ── Gear list ── */
    .cs-gear-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .cs-gear-item {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-gear-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* ── Gold display ── */
    .cs-gold-block {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--char-highlight-tint);
      border: 1px solid var(--char-highlight-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
    }
    .cs-gold-icon {
      font-size: 1.4rem;
      color: var(--gold-light);
      flex-shrink: 0;
    }
    .cs-gold-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--gold-light);
      line-height: 1;
    }
    .cs-gold-label {
      font-family: var(--font-sans);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.6);
      font-weight: 700;
      margin-top: 0.15rem;
    }

    /* ── Gigglegloom type banner ── */
    .cs-type-banner {
      border-radius: var(--char-radius);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .cs-type-banner-bg {
      position: absolute;
      inset: 0;
      opacity: 0.12;
    }
    .cs-type-icon {
      width: 40px; height: 40px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 10px currentColor);
    }
    .cs-type-name {
      font-family: var(--font-headers);
      font-size: 1.5rem;
      color: var(--white);
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    .cs-type-element {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.15rem;
      position: relative;
      z-index: 1;
    }
    .cs-type-desc {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      line-height: 1.65;
      margin-top: 0.65rem;
      position: relative;
      z-index: 1;
    }

    /* ── Not-found state ── */
    .cs-not-found {
      text-align: center;
      padding: 6rem 2rem;
    }
    .cs-not-found-glyph {
      font-family: var(--font-headers);
      font-size: 5rem;
      color: rgba(200,148,10,0.15);
      margin-bottom: 1.5rem;
      line-height: 1;
    }
    .cs-not-found-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--char-text-faint);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .cs-not-found-body {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: rgba(245,234,212,0.4);
      line-height: 1.8;
      max-width: 380px;
      margin: 0 auto 2rem;
    }
    .cs-not-found-link {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--char-highlight-border);
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .cs-not-found-link:hover {
      background: var(--char-highlight-tint);
      border-color: var(--gold);
    }

    /* ── Divider ornament ── */
    .cs-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0 1.5rem;
      opacity: 0.25;
    }
    .cs-divider::before, .cs-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold);
    }
    .cs-divider-glyph {
      font-family: var(--font-headers);
      font-size: 0.85rem;
      color: var(--gold);
    }

    /* ── Footer ── */
    .cs-footer {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.15);
    }

    /* ── Animations ── */
    @keyframes cs-orb1 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(30px, 20px); }
    }
    @keyframes cs-orb2 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(-20px, -30px); }
    }
    @keyframes cs-fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cs-wrap { animation: cs-fadein 0.5s ease forwards; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cs-stat-row { grid-template-columns: repeat(3, 1fr); }
      .cs-identity-grid { grid-template-columns: 1fr; }
      .cs-story-row { grid-template-columns: 1fr; gap: 0.2rem; }
      .cs-gear-grid { grid-template-columns: 1fr; }
      .cs-hero-portrait { display: none; }
      .cs-nav { padding: 0.6rem 1rem; }
    }
    @media (max-width: 380px) {
      .cs-stat-row { grid-template-columns: repeat(3, 1fr); gap: 0.35rem; }
      .cs-stat-val { font-size: 1.25rem; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .cs-wrap { animation: none; }
      .cs-hero-orb-a, .cs-hero-orb-b { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="cs-nav">
    <a class="cs-nav-title" href="../index.html">✦ Anavale</a>
    <a class="cs-nav-back" href="../index.html">← Return to Wiki</a>
  </nav>

  <!-- Main content — rendered by JS below -->
  <main class="cs-wrap" id="cs-main">
    <!-- populated by renderSheet() -->
  </main>
  <div id="cs-modal-root"></div>

  <footer class="cs-footer" id="cs-footer"></footer>

  <div id="cs-toast" class="cs-toast"></div>

  <style>
    /* ── Loading state ── */
    .cs-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1.5rem;
    }
    .cs-loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(200,148,10,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: cs-spin 0.9s linear infinite;
    }
    .cs-loading-text {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.4);
    }
    @keyframes cs-spin { to { transform: rotate(360deg); } }

    /* ── HP tracker ── */
    .cs-hp-block {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }
    .cs-hp-cell {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--char-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-hp-cell--current { border-color: rgba(180,60,60,0.35); background: rgba(180,60,60,0.07); }
    .cs-hp-label {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-hp-val {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--white);
      line-height: 1;
    }
    .cs-hp-cell--current .cs-hp-val { color: #f87171; }
    .cs-hp-controls {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }
    .cs-hp-btn {
      flex: 1;
      padding: 0.35rem 0;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-hp-btn:hover { background: rgba(255,255,255,0.12); }

  function buildAppearanceDesc(app) {
    if (!app) return null;
    var parts = [];
    if (app.height && app.build) parts.push(cap(app.height) + ', ' + app.build + ' build.');
    else if (app.height) parts.push(cap(app.height) + '.');
    if (app.age) parts.push(cap(app.age) + '.');
    var face = [];
    if (app.face_shape) face.push(app.face_shape + ' face');
    if (app.skin_tone)  face.push(app.skin_tone + ' skin');
    if (face.length) parts.push(cap(face.join(', ')) + '.');
    var eyes = [];
    if (app.eye_color) eyes.push(app.eye_color);
    if (app.eye_shape) eyes.push(app.eye_shape);
    if (eyes.length) parts.push(cap(eyes.join(', ')) + ' eyes.');
    var hair = [];
    if (app.hair_color) hair.push(app.hair_color);
    if (app.hair_style) hair.push(app.hair_style + ' hair');
    if (hair.length) parts.push(cap(hair.join(', ')) + '.');
    if (app.facial_hair && app.facial_hair !== 'none') parts.push(cap(app.facial_hair) + '.');
    if (Array.isArray(app.facial_markings) && app.facial_markings.length) {
      parts.push('Markings: ' + app.facial_markings.join(', ') + '.');
    }
    return parts.join(' ') || null;

  var DRAG_ITEM_ID = null;
  function wireInventoryDragDrop() {
    document.querySelectorAll('.cs-inv-row').forEach(function(row) {
      row.addEventListener('dragstart', function(e) {
        DRAG_ITEM_ID = row.dataset.id;
        row.closest('.cs-inv-row-wrap').classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', function() {
        document.querySelectorAll('.cs-inv-row-wrap.dragging').forEach(function(el) { el.classList.remove('dragging'); });
        DRAG_ITEM_ID = null;
      });
    });
    document.querySelectorAll('.cs-inv-sortable').forEach(function(container) {
      container.addEventListener('dragover', function(e) {
        e.preventDefault();
        var dragging = container.querySelector('.cs-inv-row-wrap.dragging');
        if (!dragging) return;
        var afterEl = getDragAfterElement(container, e.clientY);
        if (afterEl == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterEl);
        }
      });
      container.addEventListener('drop', function(e) {
        e.preventDefault();
        persistDragOrder(container);
      });
    });
  }
  function getDragAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll('.cs-inv-row-wrap:not(.dragging)'));
    return els.reduce(function(closest, el) {
      var box = el.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: el };
      } else {
        return closest;
      }
    }, { offset: -Infinity, element: null }).element;
  }
  function persistDragOrder(container) {
    var isFavorite = container.dataset.group === 'favorite';
    var rows = Array.prototype.slice.call(container.querySelectorAll('.cs-inv-row'));
    var updates = rows.map(function(row, idx) {
      var item = INVENTORY.find(function(i){ return i.id === row.dataset.id; });
      if (item) item.sort_order = idx;
      return { id: row.dataset.id, sort_order: idx };
    });
    updates.forEach(function(u) {
      sb.from('inventory').update({ sort_order: u.sort_order }).eq('id', u.id).then(function(res) {
        if (res.error) console.warn('Sort order save failed for', u.id, res.error);
      });
    });
  }

  function levenshteinSimilarity(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    var m = a.length, n = b.length;
    if (!m) return n ? 0 : 1;
    if (!n) return 0;
    var d = [];
    for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i-1] === b[j-1] ? 0 : 1;
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      }
    }
    var dist = d[m][n];
    var maxLen = Math.max(m, n);
    return 1 - (dist / maxLen);
  }
  function checkCatalogForMatch(name) {
    return sb.from('items').select('id,name').eq('player_facing', true).limit(200).then(function(res) {
      if (res.error || !res.data) return null;
      var best = null, bestScore = 0;
      res.data.forEach(function(it) {
        var score = levenshteinSimilarity(name, it.name);
        if (score > bestScore) { bestScore = score; best = it; }
      });
      return bestScore >= 0.7 ? best : null;
    });
  }

  // ── Wiki autocomplete ─────────────────────────────────────────────
  var WIKI_TABLES = ['cities','world_characters','creatures','organizations','pois','nations','regions','religions','items'];
  function loadWikiAcCache() {
    if (WIKI_AC_CACHE !== null) return Promise.resolve();
    return Promise.all(WIKI_TABLES.map(function(table) {
      return sb.from(table).select('id,name,player_facing').then(function(res) {
        if (res.error || !res.data) return [];
        return res.data
          .filter(function(r) { return r.player_facing === true || r.player_facing === 'teaser'; })
          .map(function(r) { return { id: r.id, name: r.name, table: table }; });
      });
    })).then(function(results) {
      WIKI_AC_CACHE = [];
      results.forEach(function(rows) { WIKI_AC_CACHE = WIKI_AC_CACHE.concat(rows); });
    });
  }
  function handleNoteBodyInput(bodyEl, noteId) {
    // Capture query synchronously before any async gap
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range  = sel.getRangeAt(0);
    var text   = range.startContainer.textContent || '';
    var pos    = range.startOffset;
    var before = text.slice(0, pos);
    var match  = before.match(/([A-Za-z'][A-Za-z']*(?:\s[A-Za-z']+)*)$/);
    if (!match || match[1].trim().length < 2) { closeWikiAc(noteId); return; }
    var query       = match[1].trim().toLowerCase();
    var matchedText = match[1];
    loadWikiAcCache().then(function() {
      // Re-capture selection after async gap — caret may have moved
      var sel2 = window.getSelection();
      if (!sel2 || !sel2.rangeCount) return;
      var range2 = sel2.getRangeAt(0);
      var hits = (WIKI_AC_CACHE || []).filter(function(e) {
        return e.name.toLowerCase().indexOf(query) !== -1;
      }).sort(function(a, b) {
        var aStarts = a.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
        var bStarts = b.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
        return aStarts - bStarts || a.name.localeCompare(b.name);
      }).slice(0, 8);
      if (hits.length) {
        showWikiAc(noteId, hits, bodyEl, range2, matchedText);
      } else {
        closeWikiAc(noteId);
      }
    });
  }

    var groupNotes = notes.filter(function(n) { return n.is_favorite === note.is_favorite && n.id !== noteId; });
    var maxSort = groupNotes.length ? Math.max.apply(null, groupNotes.map(function(n){ return n.sort_order||0; })) : -1;
    note.sort_order = maxSort + 1;

  function wireNoteDragDrop() {
    document.querySelectorAll('.cs-note-card').forEach(function(card) {
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', function(e) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.dataset.noteId);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', function() {
        document.querySelectorAll('.cs-note-card.dragging').forEach(function(el){ el.classList.remove('dragging'); });
      });
    });
    document.querySelectorAll('.cs-note-sortable').forEach(function(container) {
      container.addEventListener('dragover', function(e) {
        e.preventDefault();
        var dragging = document.querySelector('.cs-note-card.dragging');
        if (!dragging) return;
        var afterEl = getNoteAfterElement(container, e.clientY);
        if (afterEl == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterEl);
        }
      });
      container.addEventListener('drop', function(e) {
        e.preventDefault();
        persistNoteDragOrder(container);
      });
    });
  }
  function getNoteAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll('.cs-note-card:not(.dragging)'));
    return els.reduce(function(closest, el) {
      var box    = el.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: el };
      }
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }
  function persistNoteDragOrder(container) {
    var tab   = ACTIVE_NOTE_TAB;
    var cards = Array.prototype.slice.call(container.querySelectorAll('.cs-note-card'));
    cards.forEach(function(card, idx) {
      var noteId = card.dataset.noteId;
      var note   = (NOTES[tab] || []).find(function(n){ return n.id === noteId; });
      if (note) note.sort_order = idx;
      sb.from('character_notes').update({ sort_order: idx }).eq('id', noteId).then(function(res) {
        if (res.error) console.warn('Note sort save failed', noteId, res.error);
      });
    });

  function showWikiAc(noteId, hits, bodyEl, range, matchedText) {
    var dropdown = document.getElementById('cs-wiki-ac-' + noteId);
    if (!dropdown) return;
    if (!hits.length) { dropdown.classList.remove('visible'); return; }
    var TABLE_LABELS = {
      cities:'City', world_characters:'Character', creatures:'Creature',
      organizations:'Organization', pois:'Place of Interest',
      nations:'Nation', regions:'Region', religions:'Religion', items:'Item'
    };
    dropdown.innerHTML = hits.map(function(h, idx) {
      return '<div class="cs-wiki-ac-item" data-idx="' + idx + '">'
        + '<span class="cs-wiki-ac-item-type">' + (TABLE_LABELS[h.table]||h.table) + '</span>'
        + h.name.replace(/</g,'&lt;')
      + '</div>';
    }).join('');
    dropdown.classList.add('visible');
    // Position dropdown: use caret rect when valid, else fall back to bottom of body
    var bodyRect  = bodyEl.getBoundingClientRect();
    var caretRect = range.getBoundingClientRect();
    var topOffset, leftOffset;
    if (caretRect && caretRect.bottom > 0 && caretRect.bottom > bodyRect.top) {
      topOffset  = caretRect.bottom - bodyRect.top + 4;
      leftOffset = Math.max(0, caretRect.left - bodyRect.left);
    } else {
      // Fallback: position below the body element's current scroll height
      topOffset  = bodyEl.scrollHeight + 4;
      leftOffset = 0;
    }
    dropdown.style.top  = topOffset  + 'px';
    dropdown.style.left = leftOffset + 'px';
    // Wire click — capture range for link insertion
    dropdown.querySelectorAll('.cs-wiki-ac-item').forEach(function(itemEl, idx) {
      itemEl.addEventListener('mousedown', function(e) {
        e.preventDefault();
        insertWikiLink(bodyEl, noteId, hits[idx], matchedText, range);

  function closeWikiAc(noteId) {

  function insertWikiLink(bodyEl, noteId, entry, matchedText, range) {
    closeWikiAc(noteId);
    var routeFn  = WIKI_ROUTES[entry.table];
    var href     = routeFn ? routeFn(entry.id) : '#';
    var wikiBase = window.location.origin + '/anavale-wiki/';
    var link     = document.createElement('a');
    link.href      = wikiBase + href;
    link.className = 'cs-wiki-link';
    link.target    = '_blank';
    link.rel       = 'noopener';
    link.textContent = entry.name;
    // Replace the typed text with the link
    var textNode   = range.startContainer;
    var pos        = range.startOffset;
    var text       = textNode.textContent || '';
    var matchStart = pos - matchedText.length;
    if (matchStart < 0) matchStart = 0;
    // Split text node and insert link
    var before = document.createTextNode(text.slice(0, matchStart));
    var after  = document.createTextNode(text.slice(pos) + ' ');
    var parent = textNode.parentNode;
    parent.insertBefore(before, textNode);
    parent.insertBefore(link, textNode);
    parent.insertBefore(after, textNode);
    parent.removeChild(textNode);
    // Move caret after link
    var newRange = document.createRange();
    newRange.setStart(after, 1);
    newRange.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(newRange);
    // Save immediately
    saveNoteBody(bodyEl, noteId);
  }

  // ── Photo ─────────────────────────────────────────────────────────
  function renderPhoto() {
    if (!PHOTO_URL) return;
    var portrait = document.getElementById('cs-hero-portrait-img');
    if (portrait) {
      portrait.src = PHOTO_URL;
      portrait.style.display = '';
    }
  }

  function uploadPhoto(input) {
    var file = input.files && input.files[0];
    if (!file || !CHAR_ID) return;
    showToast('Uploading…');
    var path = 'characters/' + CHAR_ID;
    sb.storage.from('character-photos').remove([path]).then(function() {
      sb.storage.from('character-photos').upload(path, file, { cacheControl: '3600', contentType: file.type })
      .then(function(res) {
        if (res.error) { showToast('Upload failed — ' + res.error.message, true); return; }
        var url = SB_URL + '/storage/v1/object/public/character-photos/' + path;
        PHOTO_URL = url;
        sb.from('character_photo')
          .upsert({ character_id: CHAR_ID, token: TOKEN, storage_path: path, mime_type: file.type, file_size_bytes: file.size },
                  { onConflict: 'character_id' })
          .then(function(saveRes) {
            if (saveRes.error) { showToast('Photo saved but record not updated', true); return; }
            var portrait = document.getElementById('cs-hero-portrait-img');
            if (portrait) { portrait.src = PHOTO_URL; portrait.style.display = ''; }
            showToast('Photo uploaded ✦');
          });
      });
    });
  }

  // ── Save sheet fields ─────────────────────────────────────────────
  function saveSheet(fields) {
    if (!CHAR_ID) return;
    sb.from('character_sheet')
      .update(fields)
      .eq('character_id', CHAR_ID)
      .then(function(res) {
        if (res.error) showToast('Save failed — ' + res.error.message, true);
      });
  }

  // ── Fetch or create character_sheet row ───────────────────────────
  function fetchOrCreateSheet(ch) {
    return sb.from('character_sheet').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error) { console.warn('Sheet fetch error:', res.error); return; }
        if (res.data) {
          SHEET = res.data;
        } else {
          // First load: create row with HP from player_characters
          var scores = (typeof ch.ability_scores === 'object' && ch.ability_scores) ? ch.ability_scores : {};
          var conMod = Math.floor(((parseInt(scores.con) || 10) - 10) / 2);
          // Derive hit die from class_id — basic mapping
          var hitDie = { barbarian:12, fighter:10, paladin:10, ranger:10, monk:8, druid:8,
                         cleric:8, rogue:8, bard:8, warlock:8, wizard:6, sorcerer:6 };
          var hpMax  = (hitDie[ch.class_id] || 8) + conMod;
          var newRow = {
            character_id: CHAR_ID, token: TOKEN,
            hp_max: hpMax, hp_current: hpMax, hp_temp: 0,
            gold_cp: (BG_GOLD[ch.background_id] || 50) * 100,
            proficiency_bonus: 2
          };
          return sb.from('character_sheet').insert(newRow).select().single()
            .then(function(ins) {
              if (ins.error) { console.warn('Sheet create error:', ins.error); return; }
              SHEET = ins.data;
            });
        }
      });
  }

  // ── Fetch inventory ───────────────────────────────────────────────
  function fetchInventory() {
    return sb.from('inventory').select('*').eq('character_id', CHAR_ID).order('created_at')
      .then(function(res) {
        if (res.error) { console.warn('Inventory fetch error:', res.error); return; }
        INVENTORY = res.data || [];
        var ids = INVENTORY.filter(function(i){ return i.item_id; }).map(function(i){ return i.item_id; });
        var uniqueIds = ids.filter(function(id, idx){ return ids.indexOf(id) === idx; });
        if (!uniqueIds.length) return;
        return sb.from('items').select('id,name,category,cost_gp,weight_lb,summary,image')
          .in('id', uniqueIds)
          .then(function(catRes) {
            if (catRes.error || !catRes.data) { console.warn('Catalog hydrate error:', catRes.error); return; }
            catRes.data.forEach(function(it) { CATALOG_CACHE[it.id] = it; });
          });
      });
  }

  // ── Fetch notes ───────────────────────────────────────────────────
  function fetchNotes() {
    return sb.from('character_notes')
      .select('id,tab,title,content,sort_order,is_favorite')
      .eq('character_id', CHAR_ID)
      .order('sort_order', { ascending: true })
      .then(function(res) {
        if (res.error) { console.warn('Notes fetch error:', res.error); return; }
        NOTES = { general:[], places:[], names:[], things:[], misc:[] };
        (res.data || []).forEach(function(row) {
          if (NOTES[row.tab]) NOTES[row.tab].push({ id: row.id, title: row.title || '', content: row.content || '', sort_order: row.sort_order || 0, is_favorite: !!row.is_favorite });
        });
      });
  }

  // ── Fetch photo ───────────────────────────────────────────────────
  function fetchPhoto() {
    return sb.from('character_photo').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error || !res.data || !res.data.storage_path) return;
        PHOTO_URL = SB_URL + '/storage/v1/object/public/character-photos/' + res.data.storage_path;
      });
  }

  // ── Main boot ─────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    var modalRoot = document.getElementById('cs-modal-root');
    if (modalRoot) {
      modalRoot.innerHTML =
        '<div class="cs-modal-overlay" id="cs-item-modal-overlay" style="display:none" onclick="if(event.target===this)closeCustomItemModal()">'
          + '<div class="cs-modal">'
            + '<div class="cs-modal-title" id="cs-item-modal-title">Create New Item</div>'
            + '<div class="cs-modal-body" id="cs-item-modal-body"></div>'
          + '</div>'
        + '</div>'
        + '<div class="cs-modal-overlay" id="cs-delete-confirm-overlay" style="display:none" onclick="if(event.target===this)closeDeleteConfirm()">'
          + '<div class="cs-modal cs-modal-sm">'
            + '<div class="cs-modal-title">Remove Item</div>'
            + '<div class="cs-modal-body">'
              + '<p id="cs-delete-confirm-text" style="font-family:var(--font-sans);font-size:0.86rem;color:var(--char-text-muted);margin-bottom:1rem;"></p>'
              + '<div style="display:flex;gap:0.6rem;justify-content:flex-end;">'
                + '<button class="cs-modal-btn-secondary" onclick="closeDeleteConfirm()">Cancel</button>'
                + '<button class="cs-modal-btn-danger" id="cs-delete-confirm-btn">Remove</button>'
              + '</div>'
            + '</div>'
          + '</div>'
        + '</div>';
    }
    TOKEN = getToken();
    var main = document.getElementById('cs-main');

    if (!TOKEN) {
      main.innerHTML = renderNotFound('No character link provided.', 'Use the URL from your character creation confirmation page.');
      return;
    }

    // Show loading state immediately — never render stale static data
    main.innerHTML = '<div class="cs-loading">'
      + '<div class="cs-loading-spinner"></div>'
      + '<div class="cs-loading-text">Loading your character…</div>'
      + '</div>';

    // 1. Fetch character from Supabase
    sb.from('player_characters').select('*').eq('token', TOKEN).maybeSingle()
      .then(function(res) {
        if (res.error) {
          main.innerHTML = renderNotFound('Could not load character.', 'There was a problem reaching the server. Please try again in a moment.');
          return;
        }
        if (!res.data) {
          main.innerHTML = renderNotFound('No character found for this link.', 'Make sure you\'re using the exact URL from your confirmation page.');
          return;
        }

        var ch  = res.data;
        CHAR_ID = ch.id;

        // 2. Render static character data immediately
        renderCharacter(ch);

        // 3. Fetch live-play data in parallel, then render all at once
        Promise.all([
          fetchOrCreateSheet(ch),
          fetchInventory(),
          fetchNotes(),
          fetchPhoto()
        ]).then(function() {
          renderLivePlay();
        }).catch(function(err) {
          console.warn('Live-play fetch error:', err);
          renderLivePlay(); // render what we have
        });
      });
  });
  </script>
</body>
</html>
