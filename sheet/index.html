  // ── Who You Are ──────────────────────────────────────────────────
  // Figma 51:1103: this is ONE card (cs-whoyouare-card), not five/six
  // separate rounded boxes like Your Background/Your Past — the summary
  // and the personality items all sit inside the same blue-700 container.
  // Each item is a flush left-border strip (cs-whoyouare-item), not its
  // own bg/radius. Eyebrow + title text confirmed verbatim against the
  // real Figma frame (5 of 6 shown there; "Laugh" / personality_laugh
  // wasn't in that frame — eyebrow/title supplied by the DM directly).
  var WHOYOUARE_FIELDS = [
    { key:'personality_immediate', eyebrow:'First Impression', title:'People Instantly Notice About You' },
    { key:'personality_wrong',     eyebrow:'Misunderstood',     title:'People Get Wrong About You' },
    { key:'personality_laugh',     eyebrow:'Laugh',             title:'What Always Makes You Laugh' },
    { key:'cares_about',           eyebrow:'Primary Care',      title:'Care About' },
    { key:'deepest_fear',          eyebrow:'Fear',              title:'Deepest Fear' },
    { key:'seeking',               eyebrow:'Quest',             title:'What You Seek' }
  ];
  function whoYouAreItem(eyebrow, title, text) {
    return '<div class="cs-whoyouare-item">'
      + '<div class="cs-story-card-label">' + eyebrow + '</div>'
      + '<div class="cs-whoyouare-item-title">' + title + '</div>'
      + '<div class="cs-story-card-text">' + escHtml(text) + '</div>'
    + '</div>';
  }
  function buildWhoYouAreHtml(ch) {
    // Narrative summary — generateSummary() (character.js) writes
    // player_characters.summary as plain text, "LABEL\n\nparagraph" blocks
    // joined by "\n\n\n". Read-only display; free-text player answers are
    // baked into this string, so it's HTML-escaped like any other field.
    var summaryCardHtml = buildSummaryCardHtml(ch.summary);
    var items = WHOYOUARE_FIELDS
      .filter(function(f) { return ch[f.key]; })
      .map(function(f) { return whoYouAreItem(f.eyebrow, f.title, ch[f.key]); }).join('');
    var bodyHtml = summaryCardHtml + (items ? '<div class="cs-whoyouare-items">' + items + '</div>' : '');
    return accordionShell('cs-ov-acc-whoyouare', 'Who You Are',
      '<div class="cs-whoyouare-card">' + bodyHtml + '</div>');
  }

  // ── Your Background ──────────────────────────────────────────────
  // Gigglegloom/Alignment render immediately from ch; Region/Background lore
  // + benefits populate once fetchRegionData()/fetchBackgroundData() resolve
  // (renderBackgroundCardsDynamic(), called from both).
  function renderBackgroundCardsHtml(ch, typeKey, typeMeta) {
    var alignKey = (ch.alignment || '').toLowerCase();
    var alignName = ALIGNMENT_TRAIT_NAME[alignKey] || label(ALIGNMENT_LABELS, ch.alignment);
    var alignPhb  = ALIGNMENT_PHB[alignKey];
    // Card thumbnails — same verbatim-asset approach as Your Past, derived
    // from the exact real filename patterns character.js/character.html use
    // for these same option cards (confirmed by reading both, not guessed):
    // renderGigglogloomAffinity() → assets/icons/icon-{typeId}.svg,
    // the home-region cards' inline background-image → assets/images/regions/
    // img-{region}-landscape.webp, renderBackgroundCards() → assets/images/
    // backgrounds/bg-{bg.id}.png. Moral Alignment has no image anywhere in
    // the codebase — character.html's .char-alignment-card is text-only, no
    // data-img/background-image/icon of any kind — so it gets no thumbnail
    // here rather than a fabricated one.
    var regionKey = (ch.home_region || '').toLowerCase();
    var ggCard = storyCard('Gigglegloom Affinity', typeMeta.name, typeMeta.desc, null,
      typeKey ? '../assets/icons/icon-' + typeKey + '.svg' : null);
    var regionCard = storyCard('Home Region', REGION_ROW ? REGION_ROW.name : cap(ch.home_region || ''),
      REGION_ROW ? REGION_ROW.summary : null, null,
      regionKey ? '../assets/images/regions/img-' + regionKey + '-landscape.webp' : null);
    var alignTitle = alignName + (alignPhb ? ' <span class="cs-story-card-sub">(' + alignPhb + ')</span>' : '');
    var alignCard = storyCard('Moral Alignment', alignTitle, ALIGNMENT_CARD_DESC[alignKey] || null, null);

    var bgKey = (ch.background_id || '').toLowerCase();
    var bgPhb = BG_PHB[bgKey];
    var bgName = BACKGROUND_ROW ? BACKGROUND_ROW.name : cap((ch.background_id || '').replace(/-/g,' '));
    var bgTitle = bgName + (bgPhb ? ' <span class="cs-story-card-sub">(' + bgPhb + ')</span>' : '');
    var abilityBonuses = parseBackgroundAbilityBonuses(BACKGROUND_ROW);
    var abilityDeltas = Object.keys(abilityBonuses).map(function(k) { return { key: k, amount: abilityBonuses[k] }; });
    var bgLines = [abilityDeltaLineHtml(abilityDeltas)];
    var bgFeat = getBackgroundFeat(BACKGROUND_ROW);
    if (bgFeat) bgLines.push(featBenefitLineHtml(bgFeat));
    (BACKGROUND_ROW && Array.isArray(BACKGROUND_ROW.skills) ? BACKGROUND_ROW.skills : []).forEach(function(sk) {
      bgLines.push(skillBenefitLineHtml(sk, null));
    });
    var bgCard = storyCard('Background', bgTitle, BACKGROUND_ROW ? BACKGROUND_ROW.lore : null, benefitsBoxHtml(bgLines),
      bgKey ? '../assets/images/backgrounds/bg-' + bgKey + '.png' : null);

    return ggCard + regionCard + alignCard + bgCard;
  }

  // ── Your Past ─────────────────────────────────────────────────────
  // Benefits boxes read player_characters.skill_bonuses, filtering on the
  // "past_raised:"/"past_friend:"/"past_org:" source prefixes tagged at
  // submission (buildCharacterEntry() in character.js) — confirmed against
  // real data (Kael: source "past_raised:single-parent" etc.) before writing
  // this filter, not assumed from the build spec.
  function buildYourPastHtml(ch) {
    var skillBonusesArr = Array.isArray(ch.skill_bonuses) ? ch.skill_bonuses : [];
    function bonusesForPrefix(prefix) {
      return skillBonusesArr.filter(function(b) { return typeof b.source === 'string' && b.source.indexOf(prefix) === 0; });
    }

    var cards = [];
    if (ch.who_raised_you) {
      var raisedDeltas = RAISED_ABILITY_BONUS[ch.who_raised_you] || [];
      var raisedSkillLines = bonusesForPrefix('past_raised:').map(function(b) { return skillBenefitLineHtml(b.skill, b.amount); });
      var raisedBenefits = benefitsBoxHtml([abilityDeltaLineHtml(raisedDeltas)].concat(raisedSkillLines));
      cards.push(pastCard('Upbringing', 'Who Raised You', label(RAISED_LABELS, ch.who_raised_you), raisedBenefits, pastCardImg('who_raised_you', ch.who_raised_you), 'header'));
    }
    if (ch.dearest_friend) {
      var friendSkillLines = bonusesForPrefix('past_friend:').map(function(b) { return skillBenefitLineHtml(b.skill, b.amount); });
      cards.push(pastCard('Friend', 'Dearest Friend', label(FRIEND_LABELS, ch.dearest_friend), benefitsBoxHtml(friendSkillLines), pastCardImg('dearest_friend', ch.dearest_friend), 'header'));
    }
    if (ch.had_pet) {
      var petEffect = PET_EFFECT[ch.had_pet];
      var petBenefits = benefitsBoxHtml([petEffect ? situationalBenefitLineHtml(petEffect) : null]);
      cards.push(pastCard('Pet', 'Had a Pet', label(PET_LABELS, ch.had_pet), petBenefits, pastCardImg('had_pet', ch.had_pet), 'header'));
    }
    if (ch.fallen_in_love) cards.push(pastCard('Love', 'Fallen in Love', label(LOVE_LABELS, ch.fallen_in_love), null, pastCardImg('fallen_in_love', ch.fallen_in_love), 'header'));
    if (ch.organization_joined) {
      var orgDmLines = (Array.isArray(ch.dm_pending_items) ? ch.dm_pending_items : []).map(function(item) { return dmAddBenefitLineHtml(item.label || 'Item'); });
      var orgSkillLines = bonusesForPrefix('past_org:').map(function(b) { return skillBenefitLineHtml(b.skill, b.amount); });
      cards.push(pastCard('Organization', 'Organization', label(ORG_LABELS, ch.organization_joined), benefitsBoxHtml(orgDmLines.concat(orgSkillLines)), pastCardImg('organization_joined', ch.organization_joined), 'header'));
    }
    if (ch.left_behind) cards.push(pastCard('Left Behind', 'Left Behind', label(LEFT_BEHIND_LABELS, ch.left_behind), null, pastCardImg('left_behind', ch.left_behind), 'full'));
    if (ch.why_you_left) {
      var quest = WHY_LEFT_QUEST[ch.why_you_left];
      var questHtml = quest ? '<div class="cs-past-quest"><span class="cs-story-quest-label">Personal quest:</span> ' + escHtml(quest) + '</div>' : null;
      cards.push(pastCard('Why You Left', 'Why You Left', label(WHY_LEFT_LABELS, ch.why_you_left), questHtml, pastCardImg('why_you_left', ch.why_you_left), 'full'));
    }
    var cardsHtml = cards.join('');

    return accordionShell('cs-ov-acc-past', 'Your Past',
      (cardsHtml ? '<div class="cs-story-cards">' + cardsHtml + '</div>' : ''));
  }

  function toggleSheetAccordion(id) {

  // ── Overview weight bar — capacity = STR × 15, current = full inventory
  // (equipped + carried), same sum cs-inv-weight-total already uses. ──
  function computeCarriedWeight() {
    return INVENTORY.reduce(function(sum, item) {
      var w = item.item_id ? (catalogWeightFor(item.item_id) || 0) : (parseFloat(item.weight_lb) || 0);
      return sum + (w * (parseInt(item.quantity) || 0));
    }, 0);
  }
  // ── Render live-play data (HP, gold, inventory, notes, photo) ─────
  function renderLivePlay() {
    renderHeaderHP();
    renderEquipped();
    renderGold();
    renderInventory();
    renderNotes();
    renderPhoto();
    renderConditions();
    renderInspiration();
    renderSpellSlots();

  // ── HP (MainInfo header) ────────────────────────────────────────────
  // Rebuilt to match Figma 51:1385 exactly: label + directly-editable
  // number input(s), no Edit toggle, no separate −/+/Apply/Set-Max-Mod
  // panel — typing a value and blurring the field is the entire
  // interaction. Current AND max are both live inputs now (per DM
  // decision): editing "max" derives hp_max_modifier from the typed value
  // minus the real hp_max base, replacing the old separate Max-Mod control
  // rather than adding a third field. Temp HP gets the same input treatment
  // (no bar, no denominator — still no real "max temp HP" to show one
  // against) and is now always visible rather than hiding at 0, since a
  // typeable field needs to exist to type into. At 0 Current HP the row is
  // still replaced in-place by the death-save tracker (untouched — Figma's
  // mockup doesn't depict that state, so its Heal input/button stay as-is).
  function renderHeaderHP() {
    var slot = document.getElementById('cs-mi-hp-slot');
    var tempEl = document.getElementById('cs-mi-temp-hp');
    if (!slot) return;
    var hpCur = SHEET ? (parseInt(SHEET.hp_current) || 0) : 0;
    var hpMaxBase = SHEET ? (parseInt(SHEET.hp_max) || 0) : 0;
    var hpModifier = SHEET ? (parseInt(SHEET.hp_max_modifier) || 0) : 0;
    var hpMaxEffective = hpMaxBase + hpModifier;
    var hpTemp = SHEET ? (parseInt(SHEET.hp_temp) || 0) : 0;
    var atZero = SHEET && hpCur <= 0;

    if (atZero) {
      // Still need a way to heal back up from 0 — the bar/inputs are gone
      // in this branch, so keep a minimal heal input here. Any positive
      // Apply crosses back above 0 and swaps the bar back in.
      slot.innerHTML = renderDeathSavesHtml()
        + '<div class="cs-mi-hp-controls">'
          + '<input class="cs-hp-input" id="cs-hp-delta" type="number" placeholder="+HP">'
          + '<button class="cs-hp-apply" onclick="applyHPDelta()">Heal</button>'
        + '</div>';
    } else {
      var pct = hpMaxEffective > 0 ? Math.max(0, Math.min(100, (hpCur / hpMaxEffective) * 100)) : 0;
      slot.innerHTML =
        '<div class="cs-mi-hp-compact">'
          + '<span class="cs-mi-hp-compact-label">HP</span>'
          + '<input class="cs-mi-hp-num-input" type="number" value="' + hpCur + '" onblur="setHPCurrentDirect(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'
          + '<span class="cs-mi-hp-compact-max">/</span>'
          + '<input class="cs-mi-hp-num-input" type="number" value="' + hpMaxEffective + '" onblur="setHPMaxDirect(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'
          + '<div class="cs-mi-hp-compact-bar"><div class="cs-mi-hp-compact-bar-fill" style="width:' + pct + '%;"></div></div>'
        + '</div>';
    }

    if (tempEl) {
      tempEl.innerHTML =
        '<div class="cs-mi-hp-compact cs-mi-hp-compact--temp">'
          + '<span class="cs-mi-hp-compact-label">Temp HP</span>'
          + '<input class="cs-mi-hp-num-input" type="number" min="0" value="' + hpTemp + '" onblur="setTempHPDirect(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'
        + '</div>';
    }
  }

  // ── Death saves (MainInfo header, new) — swaps in for the HP bar in the
  // same slot when Current HP is 0. Clicking a filled pip un-fills it and
  // everything after it (standard 5e tracker behavior). ──
  function renderDeathSavesHtml() {
    var succ = SHEET ? (parseInt(SHEET.death_save_successes) || 0) : 0;
    var fail = SHEET ? (parseInt(SHEET.death_save_failures) || 0) : 0;
    var succPips = [1,2,3].map(function(i) {
      return '<button class="cs-mi-ds-pip cs-mi-ds-pip--success' + (i <= succ ? ' filled' : '') + '" onclick="toggleDeathSaveSuccess(' + i + ')" aria-label="Death save success ' + i + '"></button>';
    }).join('');
    var failPips = [1,2,3].map(function(i) {
      return '<button class="cs-mi-ds-pip cs-mi-ds-pip--failure' + (i <= fail ? ' filled' : '') + '" onclick="toggleDeathSaveFailure(' + i + ')" aria-label="Death save failure ' + i + '"></button>';
    }).join('');
    return '<div class="cs-mi-death-saves">'
      + '<div class="cs-mi-ds-label">Death Saves — 0 HP</div>'
      + '<div class="cs-mi-ds-row"><span class="cs-mi-ds-row-label">Success</span><span class="cs-mi-ds-pips">' + succPips + '</span></div>'
      + '<div class="cs-mi-ds-row"><span class="cs-mi-ds-row-label">Failure</span><span class="cs-mi-ds-pips">' + failPips + '</span></div>'
    + '</div>';
  }
  function toggleDeathSaveSuccess(i) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.death_save_successes) || 0;
    var next = (cur === i) ? i - 1 : i;
    SHEET.death_save_successes = next;
    saveSheet({ death_save_successes: next });
    renderHeaderHP();
  }
  function toggleDeathSaveFailure(i) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.death_save_failures) || 0;
    var next = (cur === i) ? i - 1 : i;
    SHEET.death_save_failures = next;
    saveSheet({ death_save_failures: next });
    renderHeaderHP();
  }

  function adjustHP(delta) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.hp_current) || 0;
    var maxEffective = (parseInt(SHEET.hp_max) || 0) + (parseInt(SHEET.hp_max_modifier) || 0);
    var next = Math.max(0, Math.min(maxEffective, cur + delta));
    SHEET.hp_current = next;
    var patch = { hp_current: next };
    // Healing from 0 clears death saves — 5e rule, and required for the
    // header's bar/death-save swap to make sense next time HP hits 0.
    if (cur <= 0 && next > 0) {
      SHEET.death_save_successes = 0;
      SHEET.death_save_failures = 0;
      patch.death_save_successes = 0;
      patch.death_save_failures = 0;
    }
    saveSheet(patch);
    renderHeaderHP();
  }
  // Direct-edit handlers (Figma 51:1385) — replace the old Edit-toggle +
  // −/+/Apply/Set-Max-Mod panel entirely. Each input saves on blur/Enter;
  // an invalid (non-numeric) value just reverts the field via a re-render
  // rather than saving garbage.
  function setHPCurrentDirect(input) {
    if (!SHEET) return;
    var val = parseInt(input.value);
    if (isNaN(val)) { renderHeaderHP(); return; }
    var maxEffective = (parseInt(SHEET.hp_max) || 0) + (parseInt(SHEET.hp_max_modifier) || 0);
    var prevCur = parseInt(SHEET.hp_current) || 0;
    var next = Math.max(0, Math.min(maxEffective, val));
    SHEET.hp_current = next;
    var patch = { hp_current: next };
    // Healing from 0 clears death saves — 5e rule, and required for the
    // header's bar/death-save swap to make sense next time HP hits 0.
    if (prevCur <= 0 && next > 0) {
      SHEET.death_save_successes = 0;
      SHEET.death_save_failures = 0;
      patch.death_save_successes = 0;
      patch.death_save_failures = 0;
    }
    saveSheet(patch);
    renderHeaderHP();
  }
  // Max HP has no direct column — hp_max is the real base (class/CON-derived)
  // and hp_max_modifier is a temporary offset from status effects. Typing a
  // new effective max here derives the modifier from it (typed − base)
  // instead of asking for the modifier itself, replacing the old separate
  // "Set Max Mod" control.
  function setHPMaxDirect(input) {
    if (!SHEET) return;
    var val = parseInt(input.value);
    if (isNaN(val)) { renderHeaderHP(); return; }
    var base = parseInt(SHEET.hp_max) || 0;
    var modifier = val - base;
    SHEET.hp_max_modifier = modifier;
    saveSheet({ hp_max_modifier: modifier });
    renderHeaderHP();
  }
  function setTempHPDirect(input) {
    if (!SHEET) return;
    var val = parseInt(input.value);
    if (isNaN(val)) { renderHeaderHP(); return; }
    val = Math.max(0, val);
    SHEET.hp_temp = val;
    saveSheet({ hp_temp: val });
    renderHeaderHP();
  }

  function applyHPDelta() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-delta');
    var delta = parseInt(input.value) || 0;
    if (!delta) return;
    adjustHP(delta);
    input.value = '';
  }

  // ── Conditions (MainInfo header) — picker over the `conditions` Supabase
  // table (fetchConditionsData(), fetched once at boot same as dm.html's
  // SCC Live Session panel fetches it in sccInit()), not free text. Each
  // pill's color/tooltip comes from its real row; the picker only offers
  // conditions not already applied. ──
  function conditionRow(name) {
    for (var i = 0; i < CONDITIONS_DATA.length; i++) {
      if (CONDITIONS_DATA[i].name === name) return CONDITIONS_DATA[i];
    }
    return null;
  }
  function renderConditions() {
    var el = document.getElementById('cs-mi-conditions');
    if (!el) return;
    var applied = (SHEET && Array.isArray(SHEET.conditions)) ? SHEET.conditions : [];
    var pills = applied.map(function(c, i) {
      var row = conditionRow(c);
      var bg = row ? row.color_bg : 'rgba(192,132,252,0.1)';
      var border = row ? row.color_border : 'rgba(192,132,252,0.25)';
      var text = row ? row.color_text : '#c084fc';
      var tip = row ? row.tip : c;
      return '<span class="cs-mi-condition-pill" style="--cond-bg:' + bg + ';--cond-border:' + border + ';--cond-text:' + text + ';" data-tip="' + tip.replace(/"/g,'&quot;') + '">'
        + escHtml(c)
        + '<button class="cs-mi-condition-remove" onclick="removeCondition(' + i + ')" aria-label="Remove ' + escHtml(c) + '">&times;</button></span>';
    }).join('');
    var available = CONDITIONS_DATA.filter(function(r) { return applied.indexOf(r.name) < 0; });
    var options = available.map(function(r) { return '<option value="' + escHtml(r.name) + '">' + escHtml(r.name) + '</option>'; }).join('');
    el.innerHTML = (available.length ? '<button class="cs-mi-condition-add" onclick="showAddConditionInput()">+ Add Condition</button>' : '')
      + pills
      + '<span class="cs-mi-condition-input-row" id="cs-mi-condition-input-row" style="display:none;">'
        + '<select class="cs-mi-condition-select" id="cs-mi-condition-select">' + options + '</select>'
        + '<button class="cs-hp-apply" onclick="addCondition()">Add</button>'
      + '</span>';
    wireAllTooltips();
  }
  function showAddConditionInput() {
    var row = document.getElementById('cs-mi-condition-input-row');
    if (!row) return;
    row.style.display = 'inline-flex';
    var select = document.getElementById('cs-mi-condition-select');
    if (select) select.focus();
  }
  function addCondition() {
    var select = document.getElementById('cs-mi-condition-select');
    var val = select ? select.value : '';
    if (!val || !SHEET) return;
    var conditions = Array.isArray(SHEET.conditions) ? SHEET.conditions.slice() : [];
    if (conditions.indexOf(val) < 0) conditions.push(val);
    SHEET.conditions = conditions;
    saveSheet({ conditions: conditions });
    renderConditions();
  }
  function removeCondition(idx) {
    if (!SHEET || !Array.isArray(SHEET.conditions)) return;
    var conditions = SHEET.conditions.slice();
    conditions.splice(idx, 1);
    SHEET.conditions = conditions;
    saveSheet({ conditions: conditions });
    renderConditions();
  }

  // ── Inspiration (MainInfo header, new) — small circular badge, top-right
  // of the header, matching Figma 51:1385 (not the pill button this used

  // ── Gold ──────────────────────────────────────────────────────────
  function renderGold() {
    var block = document.getElementById('cs-gold-block');
    if (!block) return;
    var cp     = SHEET ? (SHEET.gold_cp || 0) : 0;
    var gpWhole = Math.floor(cp / 100);
    var spRem   = Math.floor((cp % 100) / 10);
    var cpRem   = cp % 10;
    var display = gpWhole + ' gp';
    if (spRem) display += ' ' + spRem + ' sp';
    if (cpRem) display += ' ' + cpRem + ' cp';
    block.innerHTML =
      '<div class="cs-gold-block">'
        + '<div class="cs-gold-icon">◈</div>'
        + '<div>'
          + '<div class="cs-gold-val" id="cs-gold-val">' + display + '</div>'
          + '<div class="cs-gold-label">Current gold</div>'
        + '</div>'
      + '</div>'
      + '<div class="cs-gold-edit-row">'
        + '<input class="cs-gold-input" id="cs-gold-input" type="number" placeholder="gp" title="Enter gold pieces">'
        + '<button class="cs-gold-save" onclick="setGold()">Set Gold</button>'
      + '</div>';
  }

  function setGold() {
    if (!SHEET) return;
    var input = document.getElementById('cs-gold-input');
    var gp = parseFloat(input.value);
    if (isNaN(gp)) return;
    SHEET.gold_cp = Math.round(gp * 100);
    saveSheet({ gold_cp: SHEET.gold_cp });
    input.value = '';
    renderGold();
    showToast('Gold updated');
  }

  // ── Equipped ──────────────────────────────────────────────────────
  var EQUIP_SLOTS = [
    { key:'armor',      label:'Armor',     type:'armor',  category:'armor'  },
    { key:'shield',     label:'Shield',    type:'shield', category:'shield' },
    { key:'hand_right', label:'Main Hand', type:'weapon', category:'weapon' },
    { key:'hand_left',  label:'Off Hand',  type:'weapon', category:'weapon' }
  ];
  // Minimal tooltip: reads data-tip off an element and shows a floating
  // bubble on hover — same data-tip convention character.html's
  // .char-field-tooltip uses. wireAllTooltips() sweeps every [data-tip]
  // element instead of call sites wiring each one by hand; wireTooltip()
  // itself stays idempotent (el._tipWired) so both styles of call are safe.
  function wireAllTooltips() {
    document.querySelectorAll('[data-tip]').forEach(wireTooltip);
  }
  function wireTooltip(el) {
    if (!el || !el.dataset || !el.dataset.tip || el._tipWired) return;
    el._tipWired = true;
    var tipEl = null;
    el.addEventListener('mouseenter', function() {
      tipEl = document.createElement('div');
      tipEl.className = 'cs-tooltip';
      tipEl.textContent = el.dataset.tip;
      document.body.appendChild(tipEl);
      var rect = el.getBoundingClientRect();
      // Clamp so the bubble (centered via CSS translate(-50%, ...)) never
      // overflows past the viewport edge — the Inspiration badge sits in
      // the header's top-right corner, close enough to the edge that an
      // unclamped center-on-element position pushed the bubble off-screen.
      var left = rect.left + rect.width / 2;
      var half = tipEl.offsetWidth / 2;
      left = Math.max(half + 8, Math.min(window.innerWidth - half - 8, left));
      tipEl.style.left = left + 'px';
      tipEl.style.top  = rect.top + 'px';
    });
    el.addEventListener('mouseleave', function() {
      if (tipEl) { tipEl.remove(); tipEl = null; }
    });
  }
  function renderEquipped() {
    var block = document.getElementById('cs-equipped-block');
    if (!block) return;
    var mainHandItem = EQUIPPED.hand_right ? EQUIPPED_ITEMS[EQUIPPED.hand_right] : null;
    var isTwoHanded = !!(mainHandItem && Array.isArray(mainHandItem.properties) && mainHandItem.properties.indexOf('two-handed') !== -1);
    if (isTwoHanded && EQUIPPED.hand_left) {
      autoUnequipOffHandForTwoHanded();
    }
    block.innerHTML = computeWeaponDamageHtml()
      + '<div class="cs-equipped-grid">' + EQUIP_SLOTS.map(function(slot) { return renderEquippedSlot(slot, isTwoHanded); }).join('') + '</div>';
    renderACBadge();
  }
  // Clears Off Hand when Main Hand holds/gains a two-handed weapon — covers
  // both directions (equipping two-handed while Off Hand is occupied, and
  // Off Hand simply staying locked afterward via renderEquippedSlot).
  function autoUnequipOffHandForTwoHanded() {
    if (!SHEET) return;
    var equipped = (typeof SHEET.equipped === 'object' && SHEET.equipped) ? SHEET.equipped : {};
    var removedId = equipped.hand_left;
    delete equipped.hand_left;
    SHEET.equipped = equipped;
    EQUIPPED.hand_left = null;
    var stillUsed = Object.keys(EQUIPPED).some(function(k) { return EQUIPPED[k] === removedId; });
    if (removedId && !stillUsed) delete EQUIPPED_ITEMS[removedId];
    saveSheet({ equipped: equipped });
  }
  function buildWeaponDamageHtml(item) {
    return '<span class="cs-equipped-damage-dice">' + item.damage_dice + '</span>'
      + (item.damage_type ? ' <span class="cs-equipped-damage-type">' + item.damage_type + '</span>' : '');
  }
  // AC math is unchanged from the old renderEquippedAC() — factored into a
  // pure computeAC() so the badge can render in the MainInfo header
  // (cs-mi-ac-badge) instead of the Equipped section, with no logic change.
  function computeAC() {
    var dexRaw = parseInt(ABILITY_SCORES.dex) || 10;
    var dexMod = Math.floor((dexRaw - 10) / 2);
    var armor  = EQUIPPED.armor  ? EQUIPPED_ITEMS[EQUIPPED.armor]  : null;
    var shield = EQUIPPED.shield ? EQUIPPED_ITEMS[EQUIPPED.shield] : null;
    var ac = 10;
    var breakdown = [];
    if (armor) {
      ac = parseInt(armor.base_ac) || 10;
      breakdown.push(ac + ' (' + armor.name + ')');
      var weightClass = (armor.armor_weight_class || '').toLowerCase();
      if (weightClass === 'heavy') {
        breakdown.push('Dex (not added)');
      } else if (weightClass === 'medium') {
        var maxDex = (armor.max_dex_bonus != null && armor.max_dex_bonus !== '') ? parseInt(armor.max_dex_bonus) : 2;
        var dexApplied = Math.min(dexMod, maxDex);
        ac += dexApplied;
        breakdown.push(dexApplied + ' Dex (capped)');
      } else {
        ac += dexMod;
        breakdown.push(dexMod + ' Dex (' + dexRaw + ')');
      }
      if (parseInt(armor.magic_bonus) > 0) {
        ac += parseInt(armor.magic_bonus);
        breakdown.push(armor.magic_bonus + ' armor enchantment');
      }
    } else {
      ac += dexMod;
      breakdown.push('10 base');
      breakdown.push(dexMod + ' Dex (' + dexRaw + ')');
    }
    if (shield) {
      var shieldBonus = (shield.ac_bonus != null && shield.ac_bonus !== '') ? parseInt(shield.ac_bonus) : 2;
      ac += shieldBonus;
      breakdown.push(shieldBonus + ' Shield');
      if (parseInt(shield.magic_bonus) > 0) {
        ac += parseInt(shield.magic_bonus);
        breakdown.push(shield.magic_bonus + ' shield enchantment');
      }
    }
    return { ac: ac, tip: breakdown.join(' + ') + ' = ' + ac };
  }
  function computeWeaponDamageHtml() {
    var mainHand = EQUIPPED.hand_right ? EQUIPPED_ITEMS[EQUIPPED.hand_right] : null;
    var offHand  = EQUIPPED.hand_left  ? EQUIPPED_ITEMS[EQUIPPED.hand_left]  : null;
    var dmgParts = [];
    if (mainHand && mainHand.damage_dice) dmgParts.push(buildWeaponDamageHtml(mainHand));
    if (offHand && offHand.damage_dice) dmgParts.push(buildWeaponDamageHtml(offHand));
    return dmgParts.length
      ? '<span class="cs-equipped-damage-sep">&#9876;</span><span class="cs-equipped-damage">'
        + dmgParts.join('<span class="cs-equipped-damage-slash"> / </span>') + '</span>'
      : '';
  }
  function renderACBadge() {
    var el = document.getElementById('cs-mi-ac-badge');
    if (!el) return;
    var r = computeAC();
    el.setAttribute('data-tip', r.tip.replace(/"/g,'&quot;'));
    el.innerHTML = '<span class="cs-mi-ac-label">AC</span><span class="cs-mi-ac-num">' + r.ac + '</span>';
    wireTooltip(el);
  }
  function renderEquippedStat(labelText, value, fullRow) {
    return '<div class="cs-equipped-stat"' + (fullRow ? ' style="grid-column:1/-1;"' : '') + '>'
      + '<span>' + labelText + '</span><span>' + value + '</span></div>';
  }
  function renderEquippedSlot(slot, mainHandTwoHanded) {
    if (slot.key === 'hand_left' && mainHandTwoHanded) {
      return '<div class="cs-equipped-slot"><div class="cs-equipped-slot-label">' + slot.label.toUpperCase() + '</div>'
        + '<div class="cs-equipped-locked">Two-handed weapon equipped</div></div>';
    }
    var itemId = EQUIPPED[slot.key];
    var item   = itemId ? EQUIPPED_ITEMS[itemId] : null;
    var body;
    if (!item) {
      body = '<button class="cs-equipped-empty-btn" onclick="openEquipModal(\'' + slot.key + '\')">Search to equip&#8230;</button>';
    } else {
      var stats = [];
      if (slot.type === 'armor') {
        stats.push(renderEquippedStat('Base AC', item.base_ac != null ? item.base_ac : '&mdash;'));
        if (item.armor_weight_class) stats.push(renderEquippedStat('Weight Class', cap(item.armor_weight_class)));
        if (item.stealth_disadvantage) stats.push(renderEquippedStat('Stealth', 'Disadvantage'));
        if (item.str_requirement) stats.push(renderEquippedStat('Str Req', item.str_requirement));
        if (item.magic_bonus) stats.push(renderEquippedStat('Magic Bonus', '+' + item.magic_bonus));
        if (item.weight_lb != null) stats.push(renderEquippedStat('Weight', item.weight_lb + ' lb'));
      } else if (slot.type === 'shield') {
        stats.push(renderEquippedStat('AC Bonus', '+' + (item.ac_bonus != null ? item.ac_bonus : 2)));
        if (item.magic_bonus) stats.push(renderEquippedStat('Magic Bonus', '+' + item.magic_bonus));
        if (item.weight_lb != null) stats.push(renderEquippedStat('Weight', item.weight_lb + ' lb'));
      } else if (slot.type === 'weapon') {
        var isRanged = !!item.range_normal;
        stats.push(renderEquippedStat('Attack', isRanged ? 'Ranged' : 'Melee'));
        if (item.damage_dice) stats.push(renderEquippedStat('Damage', item.damage_dice + (item.damage_type ? ' ' + item.damage_type : '')));
        if (item.versatile_dice) stats.push(renderEquippedStat('Versatile', item.versatile_dice));
        if (Array.isArray(item.properties) && item.properties.length) stats.push(renderEquippedStat('Properties', item.properties.join(', ')));
        if (isRanged) stats.push(renderEquippedStat('Range', item.range_normal + (item.range_long ? ' / ' + item.range_long : '')));
        if (item.magic_bonus) stats.push(renderEquippedStat('Magic Bonus', '+' + item.magic_bonus));
        if (item.weight_lb != null) stats.push(renderEquippedStat('Weight', item.weight_lb + ' lb'));
      }
      if (Array.isArray(item.grants_advantage) && item.grants_advantage.length) {
        stats.push(renderEquippedStat('Advantage', item.grants_advantage.join(', '), true));
      }
      if (item.story_note) {
        stats.push('<div class="cs-equipped-stat" style="grid-column:1/-1;font-style:italic;">' + item.story_note + '</div>');
      }
      body = '<div class="cs-equipped-item">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;">'
          + '<strong>' + item.name + '</strong>'
          + '<button class="cs-equipped-unequip" onclick="unequipSlot(\'' + slot.key + '\')" title="Unequip">&#10005;</button>'
        + '</div>'
        + stats.join('')
      + '</div>';
    }
    return '<div class="cs-equipped-slot"><div class="cs-equipped-slot-label">' + slot.label.toUpperCase() + '</div>' + body + '</div>';
  }

  // ── Equip search modal ────────────────────────────────────────────
  var EQUIP_TARGET_SLOT = null;
  var EQUIP_SLOT_TITLES = { armor:'Equip Armor', shield:'Equip Shield', hand_right:'Equip Main Hand', hand_left:'Equip Off Hand' };
  function equipSlotByKey(key) {
    for (var i = 0; i < EQUIP_SLOTS.length; i++) { if (EQUIP_SLOTS[i].key === key) return EQUIP_SLOTS[i]; }
    return null;
  }
  function openEquipModal(slotKey) {
    EQUIP_TARGET_SLOT = slotKey;
    document.getElementById('cs-equip-modal-title').textContent = EQUIP_SLOT_TITLES[slotKey] || 'Equip Item';
    document.getElementById('cs-equip-search-input').value = '';
    renderEquipResults('');
    document.getElementById('cs-equip-modal-overlay').style.display = 'flex';
  }
  function closeEquipModal() {
    document.getElementById('cs-equip-modal-overlay').style.display = 'none';
    EQUIP_TARGET_SLOT = null;
  }
  function onEquipSearchInput() {
    var q = (document.getElementById('cs-equip-search-input').value || '').trim();
    renderEquipResults(q);
  }
  // Inventory rows relevant to a slot — custom rows match by item_type,
  // catalog-linked rows match by the linked catalog item's category.
  function getEquipCandidates(slotKey) {
    var slot = equipSlotByKey(slotKey);
    if (!slot) return [];
    return INVENTORY.filter(function(item) {
      var catalogItem  = item.item_id ? CATALOG_CACHE[item.item_id] : null;
      var matchesCustom  = item.item_type === slot.category;
      var matchesCatalog = !!(item.item_id && catalogItem && catalogItem.category === slot.category);
      return matchesCustom || matchesCatalog;
    });
  }
  // Stats line for an equip search result — reads catalog fields when the
  // row is catalog-linked, falls back to whatever the inventory row itself
  // carries (custom items don't have combat stats, so this is often empty).
  function buildEquipResultStats(category, src) {
    src = src || {};
    if (category === 'armor') {
      if (src.base_ac == null) return '';
      return 'AC ' + src.base_ac
        + (src.armor_weight_class ? ' &middot; ' + src.armor_weight_class : '')
        + (src.stealth_disadvantage ? ' &middot; Stealth disadv.' : '')
        + (src.str_requirement ? ' &middot; Str ' + src.str_requirement + ' req.' : '')
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '');
    }
    if (category === 'shield') {
      if (src.ac_bonus == null) return '';
      return '+' + src.ac_bonus + ' AC'
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '');
    }
    if (category === 'weapon') {
      if (!src.damage_dice) return '';
      return src.damage_dice + (src.damage_type ? ' ' + src.damage_type : '')
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '')
        + (src.properties && src.properties.length ? ' &middot; ' + src.properties.join(', ') : '')
        + (src.range_normal ? ' &middot; Range ' + src.range_normal + '/' + src.range_long : '');
    }
    return '';
  }
  // Thumbnail markup — catalog image with an onerror fallback to a
  // category-appropriate CSS icon; no image at all skips straight to the icon.
  function buildEquipResultThumb(category, catalogItem) {
    var iconClass = 'cs-equip-icon-' + category;
    if (catalogItem && catalogItem.image) {
      return '<img class="cs-equip-thumb" src="' + catalogItem.image + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
        + '<div class="cs-equip-thumb cs-equip-thumb-icon ' + iconClass + '" style="display:none;"></div>';
    }
    return '<div class="cs-equip-thumb cs-equip-thumb-icon ' + iconClass + '"></div>';
  }
  function renderEquipResults(q) {
    var resultsEl = document.getElementById('cs-equip-search-results');
    var slot = equipSlotByKey(EQUIP_TARGET_SLOT);
    if (!resultsEl || !slot) return;
    var candidates = getEquipCandidates(EQUIP_TARGET_SLOT);
    if (!candidates.length) {
      resultsEl.innerHTML = '<div class="cs-inv-empty">No items in inventory for this slot</div>';
      return;
    }
    var query = (q || '').toLowerCase().trim();
    var rows = candidates.map(function(item) {
      var catalogItem = item.item_id ? CATALOG_CACHE[item.item_id] : null;
      var name = catalogItem ? catalogItem.name : (item.custom_name || 'Unknown item');
      return { item: item, catalogItem: catalogItem, name: name };
    });
    if (query) {
      rows = rows.filter(function(r) { return r.name.toLowerCase().indexOf(query) !== -1; });
    }
    if (!rows.length) {
      resultsEl.innerHTML = '<div class="cs-inv-empty">No matches.</div>';
      return;
    }
    resultsEl.innerHTML = rows.map(function(r) {
      var weightSrc = r.catalogItem ? r.catalogItem.weight_lb : r.item.weight_lb;
      var weight = parseFloat(weightSrc) || 0;
      var stats  = buildEquipResultStats(slot.category, r.catalogItem || r.item);
      var thumb  = buildEquipResultThumb(slot.category, r.catalogItem);

        + thumb
        + '<div class="cs-equip-result-info">'

          + (stats ? '<span class="cs-equip-result-stats">' + stats + '</span>' : '')

      + '</div>';
    }).join('');
  }
  function selectEquipItem(invItemId) {
    var slotKey = EQUIP_TARGET_SLOT;
    if (!slotKey || !SHEET) return;
    var invItem = INVENTORY.find(function(i) { return i.id === invItemId; });
    if (!invItem) return;
    var catalogId = invItem.item_id || null;
    var equipKey  = catalogId || invItem.id;
    var equipped = (typeof SHEET.equipped === 'object' && SHEET.equipped) ? SHEET.equipped : {};
    equipped[slotKey] = equipKey;
    SHEET.equipped = equipped;
    EQUIPPED[slotKey] = equipKey;
    saveSheet({ equipped: equipped });
    invItem.equipped_slot = slotKey;
    sb.from('inventory').update({ equipped_slot: slotKey }).eq('id', invItem.id).then(function(res) {
      if (res.error) showToast('Equip saved, but inventory record not updated — ' + res.error.message, true);
    });

    showToast('Equipped');

    delete equipped[slotKey];
    SHEET.equipped = equipped;
    EQUIPPED[slotKey] = null;
    var stillUsed = Object.keys(EQUIPPED).some(function(k) { return EQUIPPED[k] === removedId; });
    if (removedId && !stillUsed) delete EQUIPPED_ITEMS[removedId];
    saveSheet({ equipped: equipped });
    renderEquipped();
  }

  // ── Inventory ─────────────────────────────────────────────────────
  function renderInventory() {
    var list = document.getElementById('cs-inv-list');
    if (!list) return;
    var totalWeight = computeCarriedWeight();
    var weightEl = document.getElementById('cs-inv-weight-total');

      list.innerHTML = '<div class="cs-inv-empty">No items yet — search above or add a custom item.</div>';
      return;
    }
    var favorites = INVENTORY.filter(function(i) { return i.is_favorite; }).sort(function(a,b) { return (a.sort_order||0) - (b.sort_order||0); });
    var regular   = INVENTORY.filter(function(i) { return !i.is_favorite; }).sort(function(a,b) { return (a.sort_order||0) - (b.sort_order||0); });
    var html = '';

      html += '<div class="cs-inv-section-label">★ Favorites</div>';
      html += '<div class="cs-inv-sortable" data-group="favorite">' + favorites.map(renderInvRow).join('') + '</div>';

  }
  var TYPE_ICONS = {
    weapon:'⚔️', armor:'🛡️', shield:'🛡️', consumable:'🧪', tool:'🔧',
    accessory:'💍', spell:'📜', food:'🍖', resource:'🪵', treasure:'💰', other:'📦'
  };
  function renderInvRow(item) {
    var catalogItem = item.item_id ? CATALOG_CACHE[item.item_id] : null;
    var name = catalogItem ? catalogItem.name : (item.custom_name || 'Unknown item');
    var type = catalogItem ? catalogItem.category : (item.item_type || 'other');
    var costGp = catalogItem ? (catalogItem.cost_gp || 0) : (item.cost_gp || 0);
    var costSp = item.item_id ? 0 : (item.cost_sp || 0);
    var costCp = item.item_id ? 0 : (item.cost_cp || 0);
    var costStr = [costGp ? costGp + 'gp' : '', costSp ? costSp + 'sp' : '', costCp ? costCp + 'cp' : ''].filter(Boolean).join(' ') || '—';
    var weight = catalogItem ? (catalogItem.weight_lb || 0) : (item.weight_lb || 0);
    var desc = catalogItem ? catalogItem.summary : item.custom_desc;
    var thumb = (catalogItem && catalogItem.image)
      ? '<img class="cs-inv-thumb" src="' + catalogItem.image + '" alt="">'

        + thumb
        + '<button class="cs-inv-fav-btn' + (item.is_favorite ? ' active' : '') + '" onclick="toggleFavorite(\'' + item.id + '\')" title="Favorite">★</button>'
        + '<div class="cs-inv-name-wrap">'
          + '<div class="cs-inv-name"' + (desc ? ' onclick="toggleInvDesc(\'' + item.id + '\')" style="cursor:pointer;"' : '') + '>' + name + (desc ? ' <span class="cs-inv-expand-arrow" id="arrow-' + item.id + '">▾</span>' : '') + '</div>'
        + '</div>'
        + '<span class="cs-inv-type-tag">' + type + '</span>'
        + '<input class="cs-inv-qty-input" type="number" min="0" value="' + (item.quantity||0) + '" onchange="updateInvQuantity(\'' + item.id + '\', this.value)">'
        + '<span class="cs-inv-cost">' + costStr + '</span>'
        + '<span class="cs-inv-weight">' + (weight||0) + 'lb</span>'
        + editBtn
        + '<button class="cs-inv-del" onclick="confirmDeleteItem(\'' + item.id + '\', \'' + name.replace(/'/g,"\\'") + '\')" title="Remove">×</button>'
      + '</div>'
      + (desc ? '<div class="cs-inv-desc-panel" id="desc-' + item.id + '" style="display:none;">' + desc + '</div>' : '')
    + '</div>';

  var DRAG_ITEM_ID = null;
  function wireInventoryDragDrop() {
    document.querySelectorAll('.cs-inv-row').forEach(function(row) {
      row.addEventListener('dragstart', function(e) {
        DRAG_ITEM_ID = row.dataset.id;
        row.closest('.cs-inv-row-wrap').classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', function() {
        document.querySelectorAll('.cs-inv-row-wrap.dragging').forEach(function(el) { el.classList.remove('dragging'); });
        DRAG_ITEM_ID = null;
      });
    });
    document.querySelectorAll('.cs-inv-sortable').forEach(function(container) {
      container.addEventListener('dragover', function(e) {
        e.preventDefault();
        var dragging = container.querySelector('.cs-inv-row-wrap.dragging');
        if (!dragging) return;
        var afterEl = getDragAfterElement(container, e.clientY);
        if (afterEl == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterEl);
        }

  function levenshteinSimilarity(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    var m = a.length, n = b.length;
    if (!m) return n ? 0 : 1;
    if (!n) return 0;
    var d = [];
    for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i-1] === b[j-1] ? 0 : 1;
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      }
    }
    var dist = d[m][n];
    var maxLen = Math.max(m, n);
    return 1 - (dist / maxLen);
  }

      res.data.forEach(function(it) {
        var score = levenshteinSimilarity(name, it.name);

      return bestScore >= 0.7 ? best : null;
    });

    var existing = NOTES[tab] || [];
    var nextOrder = existing.length ? Math.max.apply(null, existing.map(function(n) { return n.sort_order || 0; })) + 1 : 0;
    sb.from('character_notes')
      .insert({ character_id: CHAR_ID, token: TOKEN, tab: tab, title: '', content: '', sort_order: nextOrder })
      .select('id,tab,title,content,sort_order')
      .single()
      .then(function(res) {
        if (res.error) { showToast('Could not create note — ' + res.error.message, true); return; }
        var newId = res.data.id;
        NOTES[tab].push({ id: newId, title: '', content: '', sort_order: nextOrder, is_favorite: false });
        renderNoteCards();
        // Auto-open the new card by its actual ID
        var listEl = document.getElementById('cs-notes-list');
        if (listEl) {
          var safeNewId = String(newId).replace(/[^a-zA-Z0-9-]/g, '');
          var newCard = listEl.querySelector('.cs-note-card[data-note-id="' + safeNewId + '"]');
          if (newCard) {
            newCard.classList.add('cs-note-open');
            var bodyEl = newCard.querySelector('.cs-note-body');
            if (bodyEl) bodyEl.focus();
          }
        }
      });
  }
  function deleteNote(noteId) {
    // Reuse the existing styled delete confirm modal
    var textEl = document.getElementById('cs-delete-confirm-text');
    if (textEl) textEl.textContent = 'Delete this note? This cannot be undone.';
    var btn = document.getElementById('cs-delete-confirm-btn');
    btn.onclick = function() { doDeleteNote(noteId); closeDeleteConfirm(); };
    document.getElementById('cs-delete-confirm-overlay').style.display = 'flex';
  }
  function doDeleteNote(noteId) {
    sb.from('character_notes').delete().eq('id', noteId).then(function(res) {
      if (res.error) { showToast('Could not delete note — ' + res.error.message, true); return; }
      var tab = ACTIVE_NOTE_TAB;
      NOTES[tab] = (NOTES[tab] || []).filter(function(n) { return n.id !== noteId; });
      renderNoteCards();
      showToast('Note deleted');
    });
  }
  // ── Global notes search ───────────────────────────────────────────
  function onNotesSearchInput(input) {
    var q = (input.value || '').toLowerCase().trim();
    var resultsEl = document.getElementById('cs-notes-search-results');
    if (!resultsEl) return;
    if (!q) { hideNotesSearch(); return; }
    var hits = [];
    NOTE_TABS.forEach(function(t) {
      (NOTES[t.id] || []).forEach(function(n) {
        var inTitle   = (n.title   || '').toLowerCase().indexOf(q) !== -1;
        var inContent = (n.content || '').toLowerCase().indexOf(q) !== -1;
        if (inTitle || inContent) {
          hits.push({ tab: t, note: n, inContent: inContent });
        }
      });
    });
    if (!hits.length) {
      resultsEl.innerHTML = '<div class="cs-notes-empty">No matches found.</div>';
    } else {
      resultsEl.innerHTML = hits.map(function(h) {
        var excerpt = '';
        if (h.inContent) {
          var idx = (h.note.content||'').toLowerCase().indexOf(q);
          var start = Math.max(0, idx - 30);
          excerpt = (start > 0 ? '…' : '') + (h.note.content||'').slice(start, idx + q.length + 40) + '…';
        }
        return '<div class="cs-notes-search-hit" onclick="jumpToNote(\'' + h.tab.id + '\',\'' + h.note.id + '\')">'
          + '<div class="cs-notes-search-hit-tab">' + h.tab.icon + ' ' + h.tab.label + '</div>'
          + '<div class="cs-notes-search-hit-title">' + ((h.note.title||'').replace(/</g,'&lt;') || '<em>Untitled</em>') + '</div>'
          + (excerpt ? '<div class="cs-notes-search-hit-excerpt">' + excerpt.replace(/</g,'&lt;') + '</div>' : '')
        + '</div>';
      }).join('');
    }
    resultsEl.classList.add('visible');
  }
  function hideNotesSearch() {
    var el = document.getElementById('cs-notes-search-results');
    if (el) el.classList.remove('visible');
  }
  function jumpToNote(tabId, noteId) {
    hideNotesSearch();
    var searchEl = document.getElementById('cs-notes-search');
    if (searchEl) searchEl.value = '';
    ACTIVE_NOTE_TAB = tabId;
    renderNotes();
    // After render, open and scroll to the target card
    setTimeout(function() {
      var listEl = document.getElementById('cs-notes-list');
      if (!listEl) return;
      var card = listEl.querySelector('[data-note-id="' + noteId + '"]');
      if (card) {
        card.classList.add('cs-note-open');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 50);
  }
  // ── Wiki autocomplete ─────────────────────────────────────────────
  var WIKI_TABLES = ['cities','world_characters','creatures','organizations','pois','nations','regions','religions','items'];
  function loadWikiAcCache() {
    if (WIKI_AC_CACHE !== null) return Promise.resolve();
    return Promise.all(WIKI_TABLES.map(function(table) {
      return sb.from(table).select('id,name,player_facing').then(function(res) {
        if (res.error || !res.data) return [];
        return res.data
          .filter(function(r) { return r.player_facing === true || r.player_facing === 'teaser'; })
          .map(function(r) { return { id: r.id, name: r.name, table: table }; });
      });
    })).then(function(results) {
      WIKI_AC_CACHE = [];
      results.forEach(function(rows) { WIKI_AC_CACHE = WIKI_AC_CACHE.concat(rows); });
    });
  }
  function handleNoteBodyInput(bodyEl, noteId) {
    // Capture query synchronously before any async gap
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range  = sel.getRangeAt(0);
    var text   = range.startContainer.textContent || '';
    var pos    = range.startOffset;
    var before = text.slice(0, pos);
    var match  = before.match(/([A-Za-z'][A-Za-z']*)$/);
    if (!match || match[1].trim().length < 2) { closeWikiAc(noteId); return; }
    var query       = match[1].trim().toLowerCase();
    var matchedText = match[1];
    loadWikiAcCache().then(function() {
      // Re-capture selection after async gap — caret may have moved
      var sel2 = window.getSelection();
      if (!sel2 || !sel2.rangeCount) return;
      var range2 = sel2.getRangeAt(0);
      var hits = (WIKI_AC_CACHE || []).filter(function(e) {
        return e.name.toLowerCase().indexOf(query) !== -1;
      }).sort(function(a, b) {
        var aStarts = a.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
        var bStarts = b.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
        return aStarts - bStarts || a.name.localeCompare(b.name);
      }).slice(0, 8);
      if (hits.length) {
        showWikiAc(noteId, hits, bodyEl, range2, matchedText);
      } else {
        closeWikiAc(noteId);
      }
    });
  }
  function toggleNotePin(noteId) {
    var tab   = ACTIVE_NOTE_TAB;
    var notes = NOTES[tab] || [];
    var note  = notes.find(function(n) { return n.id === noteId; });
    if (!note) return;
    note.is_favorite = !note.is_favorite;
    var groupNotes = notes.filter(function(n) { return n.is_favorite === note.is_favorite && n.id !== noteId; });
    var maxSort = groupNotes.length ? Math.max.apply(null, groupNotes.map(function(n){ return n.sort_order||0; })) : -1;
    note.sort_order = maxSort + 1;
    sb.from('character_notes').update({ is_favorite: note.is_favorite, sort_order: note.sort_order }).eq('id', noteId).then(function(res) {
      if (res.error) { showToast('Could not pin note', true); return; }
      renderNoteCards();
    });
  }
  function wireNoteDragDrop() {
    document.querySelectorAll('.cs-note-card').forEach(function(card) {
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', function(e) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.dataset.noteId);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', function() {
        document.querySelectorAll('.cs-note-card.dragging').forEach(function(el){ el.classList.remove('dragging'); });
      });
    });
    document.querySelectorAll('.cs-note-sortable').forEach(function(container) {
      container.addEventListener('dragover', function(e) {
        e.preventDefault();
        var dragging = document.querySelector('.cs-note-card.dragging');
        if (!dragging) return;
        var afterEl = getNoteAfterElement(container, e.clientY);
        if (afterEl == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterEl);
        }
      });
      container.addEventListener('drop', function(e) {
        e.preventDefault();
        persistNoteDragOrder(container);
      });
    });
  }
  function getNoteAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll('.cs-note-card:not(.dragging)'));
    return els.reduce(function(closest, el) {
      var box    = el.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: el };
      }
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }
  function persistNoteDragOrder(container) {
    var tab   = ACTIVE_NOTE_TAB;
    var cards = Array.prototype.slice.call(container.querySelectorAll('.cs-note-card'));
    cards.forEach(function(card, idx) {
      var noteId = card.dataset.noteId;
      var note   = (NOTES[tab] || []).find(function(n){ return n.id === noteId; });
      if (note) note.sort_order = idx;
      sb.from('character_notes').update({ sort_order: idx }).eq('id', noteId).then(function(res) {
        if (res.error) console.warn('Note sort save failed', noteId, res.error);
      });
    });
  }
  function showWikiAc(noteId, hits, bodyEl, range, matchedText) {
    var dropdown = document.getElementById('cs-wiki-ac-' + noteId);
    if (!dropdown) return;
    if (!hits.length) { dropdown.classList.remove('visible'); return; }
    var TABLE_LABELS = {
      cities:'City', world_characters:'Character', creatures:'Creature',
      organizations:'Organization', pois:'Place of Interest',
      nations:'Nation', regions:'Region', religions:'Religion', items:'Item'
    };
    dropdown.innerHTML = hits.map(function(h, idx) {
      return '<div class="cs-wiki-ac-item" data-idx="' + idx + '">'
        + '<span class="cs-wiki-ac-item-type">' + (TABLE_LABELS[h.table]||h.table) + '</span>'
        + h.name.replace(/</g,'&lt;')
      + '</div>';
    }).join('');
    dropdown.classList.add('visible');
    // Position dropdown: use caret rect when valid, else fall back to bottom of body
    var bodyRect  = bodyEl.getBoundingClientRect();
    var caretRect = range.getBoundingClientRect();
    var topOffset, leftOffset;
    if (caretRect && caretRect.bottom > 0 && caretRect.bottom > bodyRect.top) {
      topOffset  = caretRect.bottom - bodyRect.top + 4;
      leftOffset = Math.max(0, caretRect.left - bodyRect.left);
    } else {
      // Fallback: position below the body element's current scroll height
      topOffset  = bodyEl.scrollHeight + 4;
      leftOffset = 0;
    }
    dropdown.style.top  = topOffset  + 'px';
    dropdown.style.left = leftOffset + 'px';
    // Wire click — capture range for link insertion
    dropdown.querySelectorAll('.cs-wiki-ac-item').forEach(function(itemEl, idx) {
      itemEl.addEventListener('mousedown', function(e) {
        e.preventDefault();
        insertWikiLink(bodyEl, noteId, hits[idx], matchedText, range);
      });
    });
  }
  function closeWikiAc(noteId) {
    var el = document.getElementById('cs-wiki-ac-' + noteId);
    if (el) el.classList.remove('visible');
  }
  function insertWikiLink(bodyEl, noteId, entry, matchedText, range) {
    closeWikiAc(noteId);
    var routeFn  = WIKI_ROUTES[entry.table];
    var href     = routeFn ? routeFn(entry.id) : '#';
    var wikiBase = window.location.origin + '/anavale-wiki/';
    var link     = document.createElement('a');
    link.href      = wikiBase + href;
    link.className = 'cs-wiki-link';
    link.target    = '_blank';
    link.rel       = 'noopener';
    link.textContent = entry.name;
    // Replace the typed text with the link
    var textNode   = range.startContainer;
    var pos        = range.startOffset;
    var text       = textNode.textContent || '';
    var matchStart = pos - matchedText.length;
    if (matchStart < 0) matchStart = 0;
    // Split text node and insert link
    var before = document.createTextNode(text.slice(0, matchStart));
    var after  = document.createTextNode(text.slice(pos) + ' ');
    var parent = textNode.parentNode;
    parent.insertBefore(before, textNode);
    parent.insertBefore(link, textNode);
    parent.insertBefore(after, textNode);
    parent.removeChild(textNode);
    // Move caret after link
    var newRange = document.createRange();
    newRange.setStart(after, 1);
    newRange.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(newRange);
    // Save immediately
    saveNoteBody(bodyEl, noteId);
  }

  // ── Photo ─────────────────────────────────────────────────────────
  function renderPhoto() {
    if (!PHOTO_URL) return;
    var portrait = document.getElementById('cs-hero-portrait-img');
    if (portrait) {
      portrait.src = PHOTO_URL;
      portrait.style.display = '';
    }
  }

  function uploadPhoto(input) {
    var file = input.files && input.files[0];
    if (!file || !CHAR_ID) return;
    showToast('Uploading…');
    var path = 'characters/' + CHAR_ID;
    sb.storage.from('character-photos').remove([path]).then(function() {
      sb.storage.from('character-photos').upload(path, file, { cacheControl: '3600', contentType: file.type })
      .then(function(res) {
        if (res.error) { showToast('Upload failed — ' + res.error.message, true); return; }
        var url = SB_URL + '/storage/v1/object/public/character-photos/' + path;
        PHOTO_URL = url;
        sb.from('character_photo')
          .upsert({ character_id: CHAR_ID, token: TOKEN, storage_path: path, mime_type: file.type, file_size_bytes: file.size },
                  { onConflict: 'character_id' })
          .then(function(saveRes) {
            if (saveRes.error) { showToast('Photo saved but record not updated', true); return; }
            var portrait = document.getElementById('cs-hero-portrait-img');
            if (portrait) { portrait.src = PHOTO_URL; portrait.style.display = ''; }
            showToast('Photo uploaded ✦');
          });
      });
    });
  }

  // ── Save sheet fields ─────────────────────────────────────────────
  function saveSheet(fields) {
    if (!CHAR_ID) return;
    sb.from('character_sheet')
      .update(fields)
      .eq('character_id', CHAR_ID)
      .then(function(res) {
        if (res.error) showToast('Save failed — ' + res.error.message, true);
      });
  }

  // ── Fetch class mechanical data (Overview Class card) ──────────────
  // Table may not exist yet (see docs/character-sheet-redesign-handoff.md
  // §6/§7) — errors are swallowed so the card just keeps its "—" placeholders.
  function fetchClassData(ch) {
    if (!ch.class_id) return Promise.resolve();
    return sb.from('classes').select('*').eq('id', ch.class_id).maybeSingle()
      .then(function(res) {
        if (!res.error && res.data) CLASS_ROW = res.data;
        renderClassTabDynamic();
      })
      .catch(function() { renderClassTabDynamic(); });
  }

  // ── Fetch or create character_sheet row ───────────────────────────
  function fetchOrCreateSheet(ch) {
    return sb.from('character_sheet').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error) { console.warn('Sheet fetch error:', res.error); return; }
        if (res.data) {
          SHEET = res.data;
          // HP always tracks the character's current CON/feats/level (AC already
          // does this live, on every render — see renderEquippedAC()). A CON
          // change moves hp_current by the same delta as hp_max, per the 5e rule.
          var patch = reconcileHp(SHEET, ch, CLASS_ROW);
          if (patch) {
            SHEET.hp_max = patch.hp_max;
            SHEET.hp_current = patch.hp_current;
            SHEET.hp_con_mod_cached = patch.hp_con_mod_cached;
            return sb.from('character_sheet').update(patch).eq('character_id', CHAR_ID)
              .then(function(upd) { if (upd.error) console.warn('HP reconcile save error:', upd.error); });
          }
        } else {
          // First load: create row with HP from player_characters
          var computed = computeHpBase(ch, CLASS_ROW);
          // Starting gold = real background gold, minus what was spent shopping
          // during creation (Stage 4), plus any imagined-past gold bonus.
          // Fallback of 10 matches the most common real background value.
          var startingGoldCp = (BG_STARTING_GOLD[ch.background_id] || 10) * 100
            - (parseInt(ch.starting_gold_spent_cp) || 0)
            + (parseInt(ch.starting_gold_bonus_cp) || 0);
          var newRow = {
            character_id: CHAR_ID, token: TOKEN,
            hp_max: computed.hpBase, hp_current: computed.hpBase, hp_temp: 0,
            hp_con_mod_cached: computed.conMod,
            gold_cp: Math.max(0, startingGoldCp),
            proficiency_bonus: 2
          };
          return sb.from('character_sheet').insert(newRow).select().single()
            .then(function(ins) {
              if (ins.error) { console.warn('Sheet create error:', ins.error); return; }
              SHEET = ins.data;
            });
        }
      });
  }

  // ── Fetch equipped ────────────────────────────────────────────────
  function fetchEquipped(ch) {
    var equipped = (SHEET && typeof SHEET.equipped === 'object' && SHEET.equipped) ? SHEET.equipped : {};
    EQUIPPED = {
      armor:      equipped.armor      || null,
      shield:     equipped.shield     || null,
      hand_right: equipped.hand_right || null,
      hand_left:  equipped.hand_left  || null
    };
    var ids = Object.keys(EQUIPPED).map(function(k) { return EQUIPPED[k]; }).filter(Boolean);
    var uniqueIds = ids.filter(function(id, idx) { return ids.indexOf(id) === idx; });
    if (!uniqueIds.length) return Promise.resolve();
    return sb.from('items').select('*').in('id', uniqueIds).then(function(res) {
      if (res.error || !res.data) { console.warn('Equipped items fetch error:', res.error); return; }
      res.data.forEach(function(it) { EQUIPPED_ITEMS[it.id] = it; });
    });
  }

  // ── Fetch inventory ───────────────────────────────────────────────
  function fetchInventory() {
    return sb.from('inventory').select('*').eq('character_id', CHAR_ID).order('created_at')
      .then(function(res) {
        if (res.error) { console.warn('Inventory fetch error:', res.error); return; }
        INVENTORY = res.data || [];
        var ids = INVENTORY.filter(function(i){ return i.item_id; }).map(function(i){ return i.item_id; });
        var uniqueIds = ids.filter(function(id, idx){ return ids.indexOf(id) === idx; });
        if (!uniqueIds.length) return;
        return sb.from('items').select('*')
          .in('id', uniqueIds)
          .then(function(catRes) {
            if (catRes.error || !catRes.data) { console.warn('Catalog hydrate error:', catRes.error); return; }
            catRes.data.forEach(function(it) { CATALOG_CACHE[it.id] = it; });
          });
      });
  }

  // ── Fetch notes ───────────────────────────────────────────────────
  function fetchNotes() {
    return sb.from('character_notes')
      .select('id,tab,title,content,sort_order,is_favorite')
      .eq('character_id', CHAR_ID)
      .order('sort_order', { ascending: true })
      .then(function(res) {
        if (res.error) { console.warn('Notes fetch error:', res.error); return; }
        NOTES = { general:[], places:[], names:[], things:[], misc:[] };
        (res.data || []).forEach(function(row) {
          if (NOTES[row.tab]) NOTES[row.tab].push({ id: row.id, title: row.title || '', content: row.content || '', sort_order: row.sort_order || 0, is_favorite: !!row.is_favorite });
        });
      });
  }

  // ── Fetch photo ───────────────────────────────────────────────────
  function fetchPhoto() {
    return sb.from('character_photo').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error || !res.data || !res.data.storage_path) return;
        PHOTO_URL = SB_URL + '/storage/v1/object/public/character-photos/' + res.data.storage_path;
      });
  }

  // ── Main boot ─────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    var modalRoot = document.getElementById('cs-modal-root');
    if (modalRoot) {
      modalRoot.innerHTML =
        '<div class="cs-modal-overlay" id="cs-item-modal-overlay" style="display:none" onclick="if(event.target===this)closeCustomItemModal()">'
          + '<div class="cs-modal">'
            + '<div class="cs-modal-title" id="cs-item-modal-title">Create New Item</div>'
            + '<div class="cs-modal-body" id="cs-item-modal-body"></div>'
          + '</div>'
        + '</div>'
        + '<div class="cs-modal-overlay" id="cs-delete-confirm-overlay" style="display:none" onclick="if(event.target===this)closeDeleteConfirm()">'
          + '<div class="cs-modal cs-modal-sm">'
            + '<div class="cs-modal-title">Remove Item</div>'
            + '<div class="cs-modal-body">'
              + '<p id="cs-delete-confirm-text" style="font-family:var(--font-sans);font-size:0.86rem;color:var(--char-text-muted);margin-bottom:1rem;"></p>'
              + '<div style="display:flex;gap:0.6rem;justify-content:flex-end;">'
                + '<button class="cs-modal-btn-secondary" onclick="closeDeleteConfirm()">Cancel</button>'
                + '<button class="cs-modal-btn-danger" id="cs-delete-confirm-btn">Remove</button>'
              + '</div>'
            + '</div>'
          + '</div>'
        + '</div>'
        + '<div class="cs-modal-overlay" id="cs-equip-modal-overlay" style="display:none" onclick="if(event.target===this)closeEquipModal()">'
          + '<div class="cs-modal">'
            + '<div class="cs-modal-title" id="cs-equip-modal-title">Equip Item</div>'
            + '<div class="cs-modal-body">'
              + '<input class="cs-inv-input" id="cs-equip-search-input" placeholder="Search items&#8230;" autocomplete="off" oninput="onEquipSearchInput()">'
              + '<div class="cs-equip-results" id="cs-equip-search-results"></div>'
            + '</div>'
          + '</div>'
        + '</div>';
    }
    TOKEN = getToken();
    var main = document.getElementById('cs-main');

    if (!TOKEN) {
      main.innerHTML = renderNotFound('No character link provided.', 'Use the URL from your character creation confirmation page.');
      return;
    }

    // Show loading state immediately — never render stale static data
    main.innerHTML = '<div class="cs-loading">'
      + '<div class="cs-loading-spinner"></div>'
      + '<div class="cs-loading-text">Loading your character…</div>'
      + '</div>';

    // 1. Fetch character from Supabase
    sb.from('player_characters').select('*').eq('token', TOKEN).maybeSingle()
      .then(function(res) {
        if (res.error) {
          main.innerHTML = renderNotFound('Could not load character.', 'There was a problem reaching the server. Please try again in a moment.');
          return;
        }
        if (!res.data) {
          main.innerHTML = renderNotFound('No character found for this link.', 'Make sure you\'re using the exact URL from your confirmation page.');
          return;
        }

        var ch  = res.data;
        CHAR_ID = ch.id;

        // 2. Render static character data immediately
        renderCharacter(ch);

        // 3. Fetch live-play data in parallel, then render all at once
        Promise.all([
          fetchClassData(ch).then(function() { return fetchOrCreateSheet(ch); }).then(function() { return fetchEquipped(ch); }),
          fetchSpeciesData(ch),
          fetchLanguageData(ch),
          fetchBackgroundData(ch),
          fetchRegionData(ch),
          fetchConditionsData(),
          fetchInventory(),
          fetchNotes(),
          fetchPhoto()
        ]).then(function() {
          renderLivePlay();
        }).catch(function(err) {
          console.warn('Live-play fetch error:', err);
          renderLivePlay(); // render what we have
        });
      });
  });
  </script>
