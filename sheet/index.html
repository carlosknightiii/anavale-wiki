<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Anavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Roboto:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    /* ── CSS Variables (mirrors character.css :root exactly) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-headers:  'Charm', serif;
      --font-serif:    'Cinzel Decorative', Georgia, serif;
      --font-sans:     'Roboto', system-ui, sans-serif;
      --font-mono:     'Courier New', Courier, monospace;

      --parchment:        #f5ead4;
      --parchment-light:  #f8f1e2;
      --parchment-dark:   #e8d4a8;
      --ink:              #2a1f0e;
      --ink-light:        #4a3520;
      --ink-faint:        #7a6548;
      --gold:             #c8940a;
      --gold-light:       #e8b830;
      --amber:            #7a5200;
      --white:            #ffffff;
      --teal:             #1a6a5a;
      --violet:           #4a2878;
      --green:            #2a5818;
      --bubbleseed:       #2a7a3a;
      --featherflow:      #2266b8;
      --steelfist:        #6a3aaa;
      --flamerage:        #aa3a1a;
      --gradient-colorful: linear-gradient(135deg, #e8c84a 0%, #f8e888 30%, #e87a8a 55%, #9a70e8 80%, #4ac8b8 100%);

      --char-bg:               #0a0e18;
      --char-panel:            rgba(10, 14, 24, 0.85);
      --char-border:           var(--ink-faint);
      --char-border-gold:      var(--gold);
      --char-radius:           12px;
      --char-card-bg:          rgba(18, 24, 42, 0.95);
      --char-card-bg-hover:    rgba(22, 30, 54, 0.98);
      --char-card-bg-selected: rgba(40, 30, 10, 0.95);
      --char-accent-tint:      rgba(255, 255, 255, 0.08);
      --char-accent-border:    rgba(255, 255, 255, 0.3);
      --char-accent-border-mid:rgba(255, 255, 255, 0.4);
      --char-section-bg:       rgba(10, 14, 24, 0.75);
      --char-text-muted:       rgba(255, 255, 255, 0.8);
      --char-text-faint:       rgba(245, 234, 212, 0.65);
      --char-highlight-tint:   rgba(200, 148, 10, 0.1);
      --char-highlight-border: rgba(200, 148, 10, 0.3);
      --char-card-bg-subtle:   rgba(255, 255, 255, 0.03);
    }

    /* ── Page Shell ── */
    body {
      background:
        linear-gradient(rgba(3,4,12,0.88), rgba(3,4,12,0.88)),
        url('../assets/images/regions/img-caparia-landscape.webp') center/cover fixed;
      color: var(--parchment);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav Bar ── */
    .cs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 15, 0.92);
      border-bottom: 1px solid rgba(200,148,10,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .cs-nav-title {
      font-family: var(--font-headers);
      font-size: 1.25rem;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .cs-nav-back {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    .cs-nav-back:hover { opacity: 1; color: var(--gold); }

    /* ── Main content wrapper ── */
    .cs-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Hero Section ── */
    .cs-hero {
      position: relative;
      border-radius: var(--char-radius);
      overflow: hidden;
      margin-bottom: 2rem;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .cs-hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 30%;
      filter: brightness(0.4) saturate(1.2);
    }
    .cs-hero-orb-a {
      position: absolute;
      width: 420px; height: 420px;
      border-radius: 50%;
      filter: blur(60px);
      top: -140px; left: -100px;
      pointer-events: none;
      opacity: 0.55;
      animation: cs-orb1 20s ease-in-out infinite;
    }
    .cs-hero-orb-b {
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      filter: blur(60px);
      bottom: -60px; right: -80px;
      pointer-events: none;
      opacity: 0.35;
      animation: cs-orb2 26s ease-in-out infinite;
    }
    .cs-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(3,4,12,0.97) 0%, rgba(3,4,12,0.80) 50%, rgba(3,4,12,0.15) 100%);
    }
    .cs-hero-bottom-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: linear-gradient(to bottom, transparent, rgba(3,4,12,0.97));
      pointer-events: none;
    }
    .cs-hero-portrait {
      position: absolute;
      right: 1.5rem; bottom: 1rem;
      width: 110px; height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(200,148,10,0.4);
      box-shadow: 0 0 24px rgba(0,0,0,0.7);
      opacity: 0.85;
    }
    .cs-hero-content {
      position: relative;
      z-index: 2;
      padding: 1.75rem 1.5rem 1.5rem;
    }
    .cs-hero-eyebrow {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
      font-weight: 700;
    }
    .cs-hero-name {
      font-family: var(--font-headers);
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      color: var(--white);
      line-height: 1.05;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 16px rgba(0,0,0,0.9);
    }
    .cs-hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .cs-hero-tag {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.05);
    }
    .cs-hero-tag--type {
      color: #fff;
      border-color: transparent;
    }

    /* ── Stat row (ability scores) ── */
    .cs-stat-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .cs-stat-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.75rem 0.4rem;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .cs-stat-block:hover {
      border-color: var(--char-highlight-border);
      background: var(--char-card-bg-hover);
    }
    .cs-stat-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--white);
      line-height: 1;
      margin-bottom: 0.2rem;
    }
    .cs-stat-mod {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--gold-light);
      margin-bottom: 0.3rem;
    }
    .cs-stat-label {
      font-family: var(--font-sans);
      font-size: 0.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }

    /* ── Section headers ── */
    .cs-section {
      margin-bottom: 1.75rem;
    }
    .cs-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--char-highlight-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-section-label::before {
      content: '✦';
      font-size: 0.55rem;
      opacity: 0.6;
    }

    /* ── Identity grid ── */
    .cs-identity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .cs-identity-row {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .cs-identity-key {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-identity-val {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--parchment);
      font-weight: 400;
    }

    /* ── Appearance block ── */
    .cs-appearance-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      padding: 1.25rem 1.5rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--char-text-muted);
      line-height: 1.8;
      font-style: italic;
    }
    .cs-appearance-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1rem;
    }
    .cs-chip {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--char-text-faint);
      background: var(--char-accent-tint);
    }
    .cs-chip-label {
      color: rgba(200,148,10,0.7);
      font-weight: 700;
      margin-right: 0.3rem;
    }

    /* ── Story panel ── */
    .cs-story-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      overflow: hidden;
    }
    .cs-story-row {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .cs-story-row:last-child { border-bottom: none; }
    .cs-story-key {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      padding-top: 0.05rem;
      line-height: 1.4;
    }
    .cs-story-val {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--char-text-muted);
      line-height: 1.7;
    }
    .cs-story-val em {
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ── Gear list ── */
    .cs-gear-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .cs-gear-item {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-gear-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* ── Gold display ── */
    .cs-gold-block {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--char-highlight-tint);
      border: 1px solid var(--char-highlight-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
    }
    .cs-gold-icon {
      font-size: 1.4rem;
      color: var(--gold-light);
      flex-shrink: 0;
    }
    .cs-gold-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--gold-light);
      line-height: 1;
    }
    .cs-gold-label {
      font-family: var(--font-sans);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.6);
      font-weight: 700;
      margin-top: 0.15rem;
    }

    /* ── Gigglegloom type banner ── */
    .cs-type-banner {
      border-radius: var(--char-radius);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .cs-type-banner-bg {
      position: absolute;
      inset: 0;
      opacity: 0.12;
    }
    .cs-type-icon {
      width: 40px; height: 40px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 10px currentColor);
    }
    .cs-type-name {
      font-family: var(--font-headers);
      font-size: 1.5rem;
      color: var(--white);
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    .cs-type-element {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.15rem;
      position: relative;
      z-index: 1;
    }
    .cs-type-desc {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      line-height: 1.65;
      margin-top: 0.65rem;
      position: relative;
      z-index: 1;
    }

    /* ── Not-found state ── */
    .cs-not-found {
      text-align: center;
      padding: 6rem 2rem;
    }
    .cs-not-found-glyph {
      font-family: var(--font-headers);
      font-size: 5rem;
      color: rgba(200,148,10,0.15);
      margin-bottom: 1.5rem;
      line-height: 1;
    }
    .cs-not-found-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--char-text-faint);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .cs-not-found-body {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: rgba(245,234,212,0.4);
      line-height: 1.8;
      max-width: 380px;
      margin: 0 auto 2rem;
    }
    .cs-not-found-link {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--char-highlight-border);
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .cs-not-found-link:hover {
      background: var(--char-highlight-tint);
      border-color: var(--gold);
    }

    /* ── Divider ornament ── */
    .cs-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0 1.5rem;
      opacity: 0.25;
    }
    .cs-divider::before, .cs-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold);
    }
    .cs-divider-glyph {
      font-family: var(--font-headers);
      font-size: 0.85rem;
      color: var(--gold);
    }

    /* ── Footer ── */
    .cs-footer {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.15);
    }

    /* ── Animations ── */
    @keyframes cs-orb1 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(30px, 20px); }
    }
    @keyframes cs-orb2 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(-20px, -30px); }
    }
    @keyframes cs-fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cs-wrap { animation: cs-fadein 0.5s ease forwards; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cs-stat-row { grid-template-columns: repeat(3, 1fr); }
      .cs-identity-grid { grid-template-columns: 1fr; }
      .cs-story-row { grid-template-columns: 1fr; gap: 0.2rem; }
      .cs-gear-grid { grid-template-columns: 1fr; }
      .cs-hero-portrait { display: none; }
      .cs-nav { padding: 0.6rem 1rem; }
    }
    @media (max-width: 380px) {
      .cs-stat-row { grid-template-columns: repeat(3, 1fr); gap: 0.35rem; }
      .cs-stat-val { font-size: 1.25rem; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .cs-wrap { animation: none; }
      .cs-hero-orb-a, .cs-hero-orb-b { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="cs-nav">
    <a class="cs-nav-title" href="../index.html">✦ Anavale</a>
    <a class="cs-nav-back" href="../index.html">← Return to Wiki</a>
  </nav>

  <!-- Main content — rendered by JS below -->
  <main class="cs-wrap" id="cs-main">
    <!-- populated by renderSheet() -->
  </main>

  <footer class="cs-footer" id="cs-footer"></footer>

  <div id="cs-toast" class="cs-toast"></div>

  <style>
    /* ── Loading state ── */
    .cs-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1.5rem;
    }
    .cs-loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(200,148,10,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: cs-spin 0.9s linear infinite;
    }
    .cs-loading-text {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.4);
    }
    @keyframes cs-spin { to { transform: rotate(360deg); } }

    /* ── HP tracker ── */
    .cs-hp-block {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }
    .cs-hp-cell {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--char-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-hp-cell--current { border-color: rgba(180,60,60,0.35); background: rgba(180,60,60,0.07); }
    .cs-hp-label {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-hp-val {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--white);
      line-height: 1;
    }
    .cs-hp-cell--current .cs-hp-val { color: #f87171; }
    .cs-hp-controls {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }
    .cs-hp-btn {
      flex: 1;
      padding: 0.35rem 0;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-hp-btn:hover { background: rgba(255,255,255,0.12); }
    .cs-hp-input-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }
    .cs-hp-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      text-align: center;
      width: 60px;
    }
    .cs-hp-apply {
      padding: 0.3rem 0.75rem;
      background: rgba(200,148,10,0.2);
      border: 1px solid rgba(200,148,10,0.4);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;

          + '<div class="cs-story-block">' + storyHtml + '</div></div>'
        ) : '')

      + '<div class="cs-divider"><span class="cs-divider-glyph">✦ · ✦</span></div>'

      // ── Live-play sections (populated by renderLivePlay) ──────────

      // HP
      + '<div class="cs-section" id="cs-hp-section">'
        + '<div class="cs-section-label">Hit Points</div>'
        + '<div class="cs-hp-block" id="cs-hp-block"></div>'
      + '</div>'

      // Gold
      + '<div class="cs-section" id="cs-gold-section">'
        + '<div class="cs-section-label">Gold</div>'
        + '<div id="cs-gold-block"></div>'
      + '</div>'

      // Inventory
      + '<div class="cs-section">'
        + '<div class="cs-section-label">Inventory</div>'
        + '<div class="cs-inv-add-row">'
          + '<input class="cs-inv-input" id="cs-inv-name-input" placeholder="Item name…">'
          + '<input class="cs-inv-input" id="cs-inv-qty-input" placeholder="Qty" style="width:60px;flex:none;">'
          + '<button class="cs-inv-add-btn" onclick="addInventoryItem()">+ Add</button>'
        + '</div>'
        + '<div class="cs-inv-list" id="cs-inv-list"><div class="cs-inv-empty">Loading inventory…</div></div>'
      + '</div>'

      // Notes
      + '<div class="cs-section">'
        + '<div class="cs-section-label">Notes</div>'
        + '<div class="cs-notes-tabs" id="cs-notes-tabs">'
          + ['general','places','names','things','misc'].map(function(t) {
              return '<button class="cs-notes-tab' + (t==='general'?' active':'') + '" onclick="switchNoteTab(\'' + t + '\')">' + cap(t) + '</button>';
            }).join('')
        + '</div>'
        + '<textarea class="cs-notes-textarea" id="cs-notes-area" placeholder="Notes go here…" oninput="notesDirty=true"></textarea>'
        + '<button class="cs-notes-save" onclick="saveNotes()">Save Notes</button>'
      + '</div>'

      // Photo
      + '<div class="cs-section">'
        + '<div class="cs-section-label">Character Photo</div>'
        + '<div class="cs-photo-block" id="cs-photo-block">'
          + '<div class="cs-photo-placeholder" id="cs-photo-placeholder">No photo yet</div>'
          + '<button class="cs-photo-upload-btn" onclick="document.getElementById(\'cs-photo-input\').click()">⬆ Upload Photo</button>'
          + '<input class="cs-photo-input" type="file" id="cs-photo-input" accept="image/*" onchange="uploadPhoto(this)">'
        + '</div>'
      + '</div>'

      + '<div class="cs-divider"><span class="cs-divider-glyph">✦ · ✦</span></div>';

    // Footer + title
    document.getElementById('cs-footer').textContent = '✦ · Anavale · ' + (ch.name||'') + ' · Level ' + (ch.level||1) + ' · ✦';
    document.title = (ch.name||'Character') + ' — Anavale';
  }

  // ── Render live-play data (HP, gold, inventory, notes, photo) ─────
  function renderLivePlay() {
    renderHP();
    renderGold();
    renderInventory();
    renderNotes();
    renderPhoto();
  }

  // ── HP ────────────────────────────────────────────────────────────
  function renderHP() {
    var block  = document.getElementById('cs-hp-block');
    if (!block) return;
    var hpCur  = SHEET ? SHEET.hp_current : '—';
    var hpMax  = SHEET ? SHEET.hp_max     : '—';
    var hpTemp = SHEET ? (SHEET.hp_temp || 0) : '—';
    block.innerHTML =
      '<div class="cs-hp-cell cs-hp-cell--current">'
        + '<div class="cs-hp-label">Current HP</div>'
        + '<div class="cs-hp-val" id="cs-hp-current">' + hpCur + '</div>'
        + '<div class="cs-hp-controls">'
          + '<button class="cs-hp-btn" onclick="adjustHP(-1)" title="−1">−</button>'
          + '<button class="cs-hp-btn" onclick="adjustHP(1)"  title="+1">+</button>'
        + '</div>'
        + '<div class="cs-hp-input-row">'
          + '<input class="cs-hp-input" id="cs-hp-delta" type="number" placeholder="±">'
          + '<button class="cs-hp-apply" onclick="applyHPDelta()">Apply</button>'
        + '</div>'
      + '</div>'
      + '<div class="cs-hp-cell">'
        + '<div class="cs-hp-label">Max HP</div>'
        + '<div class="cs-hp-val">' + hpMax + '</div>'
      + '</div>'
      + '<div class="cs-hp-cell">'
        + '<div class="cs-hp-label">Temp HP</div>'
        + '<div class="cs-hp-val" id="cs-hp-temp">' + hpTemp + '</div>'
      + '</div>';
  }

  function adjustHP(delta) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.hp_current) || 0;
    var max = parseInt(SHEET.hp_max)     || 0;
    SHEET.hp_current = Math.max(0, Math.min(max, cur + delta));
    document.getElementById('cs-hp-current').textContent = SHEET.hp_current;
    saveSheet({ hp_current: SHEET.hp_current });
  }

  function applyHPDelta() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-delta');
    var delta = parseInt(input.value) || 0;
    if (!delta) return;
    adjustHP(delta);
    input.value = '';
  }

  // ── Gold ──────────────────────────────────────────────────────────
  function renderGold() {
    var block = document.getElementById('cs-gold-block');
    if (!block) return;
    var cp     = SHEET ? (SHEET.gold_cp || 0) : 0;
    var gpWhole = Math.floor(cp / 100);
    var spRem   = Math.floor((cp % 100) / 10);
    var cpRem   = cp % 10;
    var display = gpWhole + ' gp';
    if (spRem) display += ' ' + spRem + ' sp';
    if (cpRem) display += ' ' + cpRem + ' cp';
    block.innerHTML =
      '<div class="cs-gold-block">'
        + '<div class="cs-gold-icon">◈</div>'
        + '<div>'
          + '<div class="cs-gold-val" id="cs-gold-val">' + display + '</div>'
          + '<div class="cs-gold-label">Current gold</div>'
        + '</div>'
      + '</div>'
      + '<div class="cs-gold-edit-row">'
        + '<input class="cs-gold-input" id="cs-gold-input" type="number" placeholder="gp" title="Enter gold pieces">'
        + '<button class="cs-gold-save" onclick="setGold()">Set Gold</button>'
      + '</div>';
  }

  function setGold() {
    if (!SHEET) return;
    var input = document.getElementById('cs-gold-input');
    var gp = parseFloat(input.value);
    if (isNaN(gp)) return;
    SHEET.gold_cp = Math.round(gp * 100);
    saveSheet({ gold_cp: SHEET.gold_cp });
    input.value = '';
    renderGold();
    showToast('Gold updated');
  }

  // ── Inventory ─────────────────────────────────────────────────────
  function renderInventory() {
    var list = document.getElementById('cs-inv-list');
    if (!list) return;
    if (!INVENTORY.length) {
      list.innerHTML = '<div class="cs-inv-empty">No items yet — add something above.</div>';
      return;
    }
    list.innerHTML = INVENTORY.map(function(item) {
      return '<div class="cs-inv-row" id="inv-' + item.id + '">'
        + '<div class="cs-inv-dot"></div>'
        + '<div class="cs-inv-name">' + (item.custom_name || item.item_id || '—') + (item.notes ? ' <em style="color:var(--char-text-faint);font-size:0.76rem;">— ' + item.notes + '</em>' : '') + '</div>'
        + '<div class="cs-inv-qty">×' + (item.quantity || 1) + '</div>'
        + '<button class="cs-inv-del" onclick="deleteInventoryItem(\'' + item.id + '\')" title="Remove">×</button>'
        + '</div>';
    }).join('');
  }

  function addInventoryItem() {
    var nameInput = document.getElementById('cs-inv-name-input');
    var qtyInput  = document.getElementById('cs-inv-qty-input');
    var name = (nameInput.value || '').trim();
    if (!name) { nameInput.focus(); return; }
    var qty  = parseInt(qtyInput.value) || 1;
    var row  = { character_id: CHAR_ID, token: TOKEN, custom_name: name, quantity: qty };
    sb.from('inventory').insert(row).select().then(function(res) {
      if (res.error) { showToast('Could not add item — ' + res.error.message, true); return; }
      INVENTORY.push(res.data[0]);
      nameInput.value = '';
      qtyInput.value  = '';
      renderInventory();
      showToast('Item added');
    });
  }

  function deleteInventoryItem(id) {
    sb.from('inventory').delete().eq('id', id).then(function(res) {
      if (res.error) { showToast('Could not remove item', true); return; }
      INVENTORY = INVENTORY.filter(function(i) { return i.id !== id; });
      renderInventory();
      showToast('Item removed');
    });
  }

  // ── Notes ─────────────────────────────────────────────────────────
  var notesDirty = false;

  function renderNotes() {
    var area = document.getElementById('cs-notes-area');
    if (!area) return;
    area.value = NOTES[ACTIVE_NOTE_TAB] || '';
    notesDirty = false;
  }

  function switchNoteTab(tab) {
    if (notesDirty) saveNotes(true);
    ACTIVE_NOTE_TAB = tab;
    document.querySelectorAll('.cs-notes-tab').forEach(function(b) {
      b.classList.toggle('active', b.textContent.toLowerCase() === tab);
    });
    renderNotes();
  }

  function saveNotes(silent) {
    if (!CHAR_ID) return;
    var content = (document.getElementById('cs-notes-area') || {}).value || '';
    NOTES[ACTIVE_NOTE_TAB] = content;
    notesDirty = false;
    // Upsert: match on character_id + tab
    sb.from('character_notes')
      .upsert({ character_id: CHAR_ID, token: TOKEN, tab: ACTIVE_NOTE_TAB, content: content },
              { onConflict: 'character_id,tab' })
      .then(function(res) {
        if (res.error) { showToast('Notes not saved — ' + res.error.message, true); return; }
        if (!silent) showToast('Notes saved');
      });
  }

  // ── Photo ─────────────────────────────────────────────────────────
  function renderPhoto() {
    var block = document.getElementById('cs-photo-block');
    if (!block) return;
    var placeholder = document.getElementById('cs-photo-placeholder');
    if (PHOTO_URL) {
      if (placeholder) placeholder.style.display = 'none';
      var existing = document.getElementById('cs-photo-img');
      if (!existing) {
        var img = document.createElement('img');
        img.className = 'cs-photo-img';
        img.id = 'cs-photo-img';
        img.src = PHOTO_URL;
        img.alt = 'Character photo';
        block.insertBefore(img, block.firstChild);
      } else {
        existing.src = PHOTO_URL;
      }
    }
  }

  function uploadPhoto(input) {
    var file = input.files && input.files[0];
    if (!file || !CHAR_ID) return;
    showToast('Uploading…');
    var ext  = file.name.split('.').pop() || 'jpg';
    var path = 'characters/' + CHAR_ID + '.' + ext;
    var fd   = new FormData();
    fd.append('', file, path);
    sb.storage.from('character-photos').upload(path, file, { upsert: true, contentType: file.type })
      .then(function(res) {
        if (res.error) { showToast('Upload failed — ' + res.error.message, true); return; }
        // Get public URL — note: bucket is private, so we use a signed URL via RLS-allowed select
            var url = SB_URL + '/storage/v1/object/public/character-photos/' + path;
            PHOTO_URL = url;
            // Save storage_path to character_photo table
            sb.from('character_photo')
              .upsert({ character_id: CHAR_ID, token: TOKEN, storage_path: path, mime_type: file.type, file_size_bytes: file.size },
                      { onConflict: 'character_id' })
              .then(function(saveRes) {
                if (saveRes.error) { showToast('Photo saved but record not updated', true); return; }
                renderPhoto();
                showToast('Photo uploaded ✦');
              });
  }

  // ── Save sheet fields ─────────────────────────────────────────────
  function saveSheet(fields) {
    if (!CHAR_ID) return;
    sb.from('character_sheet')
      .update(fields)
      .eq('character_id', CHAR_ID)
      .then(function(res) {
        if (res.error) showToast('Save failed — ' + res.error.message, true);
      });
  }

  // ── Fetch or create character_sheet row ───────────────────────────
  function fetchOrCreateSheet(ch) {
    return sb.from('character_sheet').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error) { console.warn('Sheet fetch error:', res.error); return; }
        if (res.data) {
          SHEET = res.data;
        } else {
          // First load: create row with HP from player_characters
          var scores = (typeof ch.ability_scores === 'object' && ch.ability_scores) ? ch.ability_scores : {};
          var conMod = Math.floor(((parseInt(scores.con) || 10) - 10) / 2);
          // Derive hit die from class_id — basic mapping
          var hitDie = { barbarian:12, fighter:10, paladin:10, ranger:10, monk:8, druid:8,
                         cleric:8, rogue:8, bard:8, warlock:8, wizard:6, sorcerer:6 };
          var hpMax  = (hitDie[ch.class_id] || 8) + conMod;
          var newRow = {
            character_id: CHAR_ID, token: TOKEN,
            hp_max: hpMax, hp_current: hpMax, hp_temp: 0,
            gold_cp: (BG_GOLD[ch.background_id] || 50) * 100,
            proficiency_bonus: 2
          };
          return sb.from('character_sheet').insert(newRow).select().single()
            .then(function(ins) {
              if (ins.error) { console.warn('Sheet create error:', ins.error); return; }
              SHEET = ins.data;
            });
        }
      });
  }

  // ── Fetch inventory ───────────────────────────────────────────────
  function fetchInventory() {
    return sb.from('inventory').select('*').eq('character_id', CHAR_ID).order('created_at')
      .then(function(res) {
        if (res.error) { console.warn('Inventory fetch error:', res.error); return; }
        INVENTORY = res.data || [];
      });
  }

  // ── Fetch notes ───────────────────────────────────────────────────
  function fetchNotes() {
    return sb.from('character_notes').select('*').eq('character_id', CHAR_ID)
      .then(function(res) {
        if (res.error) { console.warn('Notes fetch error:', res.error); return; }
        (res.data || []).forEach(function(row) { NOTES[row.tab] = row.content; });
      });
  }

  // ── Fetch photo ───────────────────────────────────────────────────
  function fetchPhoto() {
    return sb.from('character_photo').select('*').eq('character_id', CHAR_ID).maybeSingle()
      .then(function(res) {
        if (res.error || !res.data || !res.data.storage_path) return;
        PHOTO_URL = SB_URL + '/storage/v1/object/public/character-photos/' + res.data.storage_path;
      });
  }

  // ── Main boot ─────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    TOKEN = getToken();
    var main = document.getElementById('cs-main');

    if (!TOKEN) {
      main.innerHTML = renderNotFound('No character link provided.', 'Use the URL from your character creation confirmation page.');
      return;
    }

    // Show loading state immediately — never render stale static data
    main.innerHTML = '<div class="cs-loading">'
      + '<div class="cs-loading-spinner"></div>'
      + '<div class="cs-loading-text">Loading your character…</div>'
      + '</div>';

    // 1. Fetch character from Supabase
    sb.from('player_characters').select('*').eq('token', TOKEN).maybeSingle()
      .then(function(res) {
        if (res.error) {
          main.innerHTML = renderNotFound('Could not load character.', 'There was a problem reaching the server. Please try again in a moment.');
          return;
        }
        if (!res.data) {
          main.innerHTML = renderNotFound('No character found for this link.', 'Make sure you\'re using the exact URL from your confirmation page.');
          return;
        }

        var ch  = res.data;
        CHAR_ID = ch.id;

        // 2. Render static character data immediately
        renderCharacter(ch);

        // 3. Fetch live-play data in parallel, then render all at once
        Promise.all([
          fetchOrCreateSheet(ch),
          fetchInventory(),
          fetchNotes(),
          fetchPhoto()
        ]).then(function() {
          renderLivePlay();
        }).catch(function(err) {
          console.warn('Live-play fetch error:', err);
          renderLivePlay(); // render what we have
        });
      });
  });
  </script>
</body>
</html>
