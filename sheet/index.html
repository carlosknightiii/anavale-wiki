       Special Effects "too wide" against the doll being "more important" —
       reversed to 3:2 doll:Effects. Effects still keeps its own base
       min-width (358px, unchanged), so a real multi-line card still has
       room — it just no longer outgrows the doll by default. flex-basis 0
       on both so the grow ratio alone decides the split once both are
       past their min-width floor. */
    .cs-inv-top-col--doll { flex: 3 1 0; }
    .cs-inv-top-col--effects { flex: 2 1 0; }
    .cs-inv-top-col--currency { max-width: 480px; display: flex; flex-direction: column; align-items: center; }
    .cs-inv-col-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h4);
      color: var(--text);
      text-align: center;
      margin: 0 0 var(--char-ov-gap-xs);
    }
    .cs-inv-carrying-title { text-align: left; }

    /* ── Special Effects panel — matches Figma 51:2260 (node 91:1440 "list")
       pulled fresh 2026-08-12, not the earlier from-scratch build. ONE
       shared bordered box (not per-item cards like Your Story) — each
       equipped item is a "row" inside it (Figma's own node naming), each
       row individually bottom-divided, including the last one (Figma's own
       2-item example already borders both). min-height, not height: the
       277px is Figma's canvas size for a 2-item example, not a real cap —
       must grow for more/longer content, never clip or scroll. ── */
    .cs-effect-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 277px;
      box-sizing: border-box;
      background: var(--blue-700);
      border: 1px solid var(--blue-300);
      border-radius: var(--radius);
      padding: var(--char-ov-gap-s);
    }
    .cs-effect-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      border-bottom: 2px solid var(--blue-300);
      padding-bottom: var(--char-ov-gap-2xs);
    }
    .cs-effect-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: var(--char-ov-h4);
      color: var(--text);
      width: 100%;
    }
    .cs-effect-mech {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      width: 100%;
    }
    .cs-effect-mech-icon {
      font-size: var(--char-ov-h3);
      font-weight: 700;
      line-height: 1.2;
      flex-shrink: 0;
    }
    .cs-effect-mech-text {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: var(--char-ov-pl);
      color: var(--gold);
    }
    .cs-effect-flavor {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      font-family: var(--font-body);
      font-weight: 400;
      font-style: italic;
      color: var(--text);
    }
    .cs-effect-flavor-icon {
      font-size: var(--char-ov-pl);
      flex-shrink: 0;
    }
    .cs-effect-flavor-text {
      flex: 1 1 0;
      min-width: 0;
      font-size: var(--char-ov-h5);
    }

    /* ── Attunement (Inventory tab, new) — under the doll, own bordered
       box reusing .cs-effect-panel's token choices (blue-700/blue-300)
       rather than inventing new colors, but its own layout since rows
       need a button, unlike Special Effects' plain text rows. ── */
    .cs-attune-block {
      margin-top: var(--char-ov-gap-s);
      width: 100%;
      box-sizing: border-box;
      background: var(--blue-700);
      border: 1px solid var(--blue-300);
      border-radius: var(--radius);
      padding: var(--char-ov-gap-xs) var(--char-ov-gap-s);
    }
    .cs-attune-header {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h5);
      color: var(--text);
      margin-bottom: var(--char-ov-gap-2xs);
    }
    .cs-attune-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-top: 1px solid var(--blue-300);
    }
    .cs-attune-row:first-of-type { border-top: none; }
    .cs-attune-name {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-attune-btn {
      flex-shrink: 0;
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gold);
      background: none;
      color: var(--gold);
      cursor: pointer;
    }
    .cs-attune-btn.active { background: var(--gold); color: var(--blue-800); }
    .cs-attune-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Carrying bar — capacity = STR x 15, standard progress-bar reading:
       track (--blue-700) always full width, fill (--blue-300) grows from
       the left as current weight rises toward capacity. Live-tested report
       of "no visible fill" investigated via getComputedStyle() — both
       colors and the fill-width % were resolving correctly (confirmed
       against a real character: 14/195lb -> width:7.18%, backgroundColor
       rgb(71,84,127) on the fill vs rgb(18,24,41) on the track), so this
       wasn't a broken calc or an unresolved CSS variable. What's real:
       at low carry percentages the fill is a thin strip and the two blues
       are close enough in value that it reads as blank at a glance —
       widened the border accent and floored the width so the fill always
       has an unambiguous, visible presence. ── */
    .cs-inv-weight-bar {
      position: relative;
      width: 100%;
      height: 44px;
      border-radius: 9999px;
      background: var(--blue-700);
      overflow: hidden;
      margin-bottom: var(--char-ov-gap-m);
    }
    .cs-inv-weight-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      min-width: 8px;
      background: var(--blue-300);
      border-right: 2px solid var(--blue-200);
      transition: width 0.2s ease;
    }
    .cs-inv-weight-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
    }

    /* ── Own-inventory search/category filter (Figma 51:2260) ── */
    .cs-inv-filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: var(--char-ov-gap-xs);
      margin-bottom: var(--char-ov-gap-xs);
    }
    .cs-inv-filter-field {
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-2xs);
      flex: 1 1 240px;
      min-width: 200px;
    }
    /* Category is a short "Select"/category-name value, not free text —
       sizing it to match the Search field's width left a lot of empty
       dropdown space. Sized to content instead. */
    .cs-inv-filter-field--cat { flex: 0 1 auto; min-width: 0; }
    .cs-inv-filter-label { font-family: var(--font-body); font-size: 1rem; color: var(--text); }
    .cs-inv-filter-input, .cs-inv-filter-select {
      background: var(--blue-600);
      border: 1px solid var(--blue-200);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      height: var(--char-field-height);
      padding: 0 1rem;
      box-sizing: border-box;
      width: 100%;
    }
    .cs-inv-filter-input { border-radius: 9999px; }
    .cs-inv-filter-input::placeholder { color: rgba(232,232,240,0.75); }
    .cs-inv-filter-select { width: auto; }

    /* ── Bulk delete bar — "Select" column has no bulk action in the
       mockup, built as multi-select -> Delete selected (see build spec). ── */
    .cs-inv-bulk-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: var(--char-ov-gap-xs);
      background: var(--dm-bulk-bg);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 1rem;
      margin-bottom: var(--char-ov-gap-2xs);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-inv-bulk-delete-btn {
      background: rgba(214,43,43,0.2);
      border: 1px solid var(--red-border-strong);
      border-radius: var(--radius-sm);
      color: var(--red);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-inv-bulk-delete-btn:hover { background: rgba(214,43,43,0.35); }

    /* ── Item table (Figma 51:2260) — alternating row shading matches the
       Class tab's Key Features table pattern. ── */
    .cs-inv-table-wrap { width: 100%; overflow-x: auto; }
    /* auto (content-based) layout, not fixed — every column but Select/
       Thumb/Actions should size to its own content instead of an equal
       fixed share; Select/Thumb/Actions keep explicit widths below, which
       auto layout still honors as a floor. */
    .cs-inv-table { width: 100%; border-collapse: collapse; table-layout: auto; }
    .cs-inv-th {
      background: var(--blue-700);
      color: var(--white);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      padding: var(--char-ov-gap-2xs) var(--char-ov-gap-xs);
    }
    .cs-inv-th-select, .cs-inv-th-thumb { width: 60px; }
    .cs-inv-th-actions { width: 132px; }
    .cs-inv-tr:nth-child(odd)  .cs-inv-td { background: var(--blue-600); }
    .cs-inv-tr:nth-child(even) .cs-inv-td { background: var(--blue-500); }
    .cs-inv-tr.selected .cs-inv-td { background: var(--dm-row-selected); }
    .cs-inv-td {
      color: var(--white);
      font-family: var(--font-body);
      font-size: 0.85rem;
      padding: var(--char-ov-gap-2xs) var(--char-ov-gap-xs);
      vertical-align: middle;
      border-bottom: 1px solid rgba(0,0,0,0.15);
    }
    .cs-inv-td-select, .cs-inv-td-thumb, .cs-inv-td-cat, .cs-inv-td-price, .cs-inv-td-weight, .cs-inv-td-specs, .cs-inv-td-actions { text-align: center; }
    .cs-inv-td-select input { width: 18px; height: 18px; cursor: pointer; }
    .cs-inv-td-thumb .cs-inv-thumb, .cs-inv-td-thumb .cs-inv-thumb-icon { margin: 0 auto; }
    .cs-inv-row-actions { display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .cs-inv-empty-row {
      text-align: center;
      padding: 1.5rem;
      font-family: var(--font-sans);
      font-style: italic;
      color: var(--char-text-faint);
    }
    @media (max-width: 900px) {
      .cs-inv-table { min-width: 860px; }
    }

    .cs-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .cs-modal {
      background: rgba(16,20,34,0.98);
      border: 1px solid rgba(200,148,10,0.3);
      border-radius: 14px;
      padding: 1.5rem;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      box-sizing: border-box;
    }
    .cs-modal-sm { max-width: 380px; }
    .cs-modal-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--gold-light);
      margin-bottom: 1rem;
    }
    /* Round 3 Follow-up: Add Item modal only ever had click-outside to
       dismiss (no Escape handler exists anywhere in this file, confirmed
       via grep — a real gap, not something this modal alone was missing).
       Scoped this fix to Add Item specifically, per the ask, rather than
       retrofitting every modal in the file with a close icon. Title row
       becomes flex (title left, × button right) only where this class is
       added — every other modal's plain-block .cs-modal-title is untouched. */
    .cs-modal-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .cs-modal-title-row .cs-modal-title { margin-bottom: 0; }
    .cs-modal-close-btn {
      background: none;
      border: none;
      color: var(--char-text-faint);
      opacity: 0.7;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      font-size: 1.3rem;
      line-height: 1;
      font-family: var(--font-body);
    }
    .cs-modal-close-btn:hover { opacity: 1; color: var(--text); }
    .cs-field-group { margin-bottom: 0.7rem; }
    .cs-field-label {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    .cs-field-row-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0.5rem; }
    .cs-field-row-4 .cs-inv-input { flex: none; min-width: 0; width: 100%; box-sizing: border-box; }
    .cs-checkbox-label {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--char-text-muted);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .cs-modal-btn-primary {
      padding: 0.5rem 1.1rem;
      background: rgba(200,148,10,0.25);
      border: 1px solid rgba(200,148,10,0.5);
      border-radius: 7px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cs-modal-btn-primary:hover { background: rgba(200,148,10,0.4); }
    .cs-modal-btn-secondary {
      padding: 0.5rem 1.1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 7px;
      color: var(--char-text-muted);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .cs-modal-btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .cs-modal-btn-danger {
      padding: 0.5rem 1.1rem;
      background: rgba(180,50,50,0.25);
      border: 1px solid rgba(180,50,50,0.5);
      border-radius: 7px;
      color: #f87171;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cs-modal-btn-danger:hover { background: rgba(180,50,50,0.4); }

    /* ── Notes tabs ── */
    .cs-notes-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 0;
      border-bottom: 2px solid rgba(200,148,10,0.25);
    }
    .cs-notes-tab {
      padding: 0.5rem 1rem;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      color: var(--char-text-faint);
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      border-radius: 6px 6px 0 0;
      margin-bottom: -2px;
      white-space: nowrap;
    }
    .cs-notes-tab:hover {
      color: var(--char-text-muted);
      background: rgba(255,255,255,0.04);
    }
    .cs-notes-tab.active {
      background: rgba(10,14,24,0.95);
      border-color: rgba(200,148,10,0.35);
      border-bottom-color: rgba(10,14,24,0.95);
      color: var(--gold-light);
    }
    .cs-notes-tab-icon { font-size: 0.8rem; }
    /* Notes global search */
    .cs-notes-search-wrap {
      position: relative;
      margin-bottom: 0.85rem;
    }
    .cs-notes-search {
      width: 100%;
      box-sizing: border-box;
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--char-text-muted);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      height: var(--char-field-height);
      padding: 0 0.9rem 0 2rem;
      transition: border-color 0.15s;
    }
    .cs-notes-search:focus { outline: none; border-color: rgba(200,148,10,0.35); }
    .cs-notes-search-icon {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      opacity: 0.4;
      pointer-events: none;
    }
    .cs-notes-search-results {
      margin-top: 0.5rem;
      display: none;
    }
    .cs-notes-search-results.visible { display: block; }
    .cs-notes-search-hit {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.4rem;
      cursor: pointer;
    }
    .cs-notes-search-hit:hover { border-color: rgba(200,148,10,0.3); }
    .cs-notes-search-hit-tab {
      font-family: var(--font-sans);
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.2rem;
    }
    .cs-notes-search-hit-title {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      font-weight: 600;
    }
    .cs-notes-search-hit-excerpt {
      font-family: var(--font-sans);
      font-size: 0.76rem;
      color: var(--char-text-faint);
      margin-top: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Note cards */
    .cs-notes-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .cs-notes-empty {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--char-text-faint);
      font-style: italic;
      text-align: center;
      padding: 1rem 0;
    }
    .cs-note-card {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--char-radius);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .cs-note-card:hover { border-color: rgba(255,255,255,0.14); }
    .cs-note-card.cs-note-open { border-color: rgba(200,148,10,0.3); }
    .cs-note-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 0.9rem;
      cursor: pointer;
      user-select: none;
    }
    .cs-note-chevron {
      font-size: 0.6rem;
      color: var(--char-text-faint);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .cs-note-card.cs-note-open .cs-note-chevron { transform: rotate(90deg); }
    .cs-note-title-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--char-text-muted);
      font-family: var(--font-sans);
      font-size: 0.86rem;
      font-weight: 600;
      padding: 0;
      cursor: pointer;
    }
    .cs-note-title-input:focus {
      outline: none;
      cursor: text;
    }
    .cs-note-title-input::placeholder { color: rgba(255,255,255,0.2); font-weight: 400; }
    .cs-note-delete-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.18);
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.1rem 0.3rem;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
      border-radius: 4px;
    }
    .cs-note-delete-btn:hover { color: #f87171; background: rgba(248,113,113,0.08); }
    .cs-note-fav-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .cs-note-fav-btn.active { color: var(--gold); }
    .cs-note-drag-handle {
      color: rgba(255,255,255,0.18);
      cursor: grab;
      font-size: 0.9rem;
      flex-shrink: 0;
      padding: 0 0.1rem;
      user-select: none;
    }
    .cs-note-edit-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.25);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0.1rem 0.3rem;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
      border-radius: 4px;
    }
    .cs-note-edit-btn:hover { color: var(--gold-light); background: rgba(200,148,10,0.1); }
    .cs-note-done-btn {
      margin-top: 0.6rem;
      padding: 0.3rem 0.85rem;
      background: rgba(200,148,10,0.15);
      border: 1px solid rgba(200,148,10,0.35);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: block;
    }
    .cs-note-done-btn:hover { background: rgba(200,148,10,0.28); }
    .cs-note-body-wrap {
      display: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 0.75rem 0.9rem 0.85rem;
      position: relative;
    }
    .cs-note-card.cs-note-open .cs-note-body-wrap { display: block; }
    .cs-notes-tab-content {
      padding-top: 0.85rem;
    }
    .cs-note-sortable { display: flex; flex-direction: column; gap: 0.6rem; }
    .cs-note-row-wrap.dragging { opacity: 0.4; }
    .cs-note-body {
      min-height: 80px;
      font-family: var(--font-sans);
      font-size: 0.86rem;
      line-height: 1.75;
      color: var(--char-text-muted);
      outline: none;
      white-space: pre-wrap;

  // ── Helpers ───────────────────────────────────────────────────────
  function cap(str) { if (!str) return '—'; return str.charAt(0).toUpperCase() + str.slice(1); }
  function label(map, key) { if (!key) return '—'; return map[key] || cap((key+'').replace(/-/g,' ')); }
  // Ported verbatim from js/character.js — bg.bonuses entries are either an
  // ability delta ("+1 Wis") or a feat name ("Tough"); this is the same
  // parsing character.js uses for its own live preview, kept identical so
  // the two can't drift. Only the two functions are ported, not the data.
  var ABILITY_WORD_MAP = { 'Str':'str', 'Dex':'dex', 'Con':'con', 'Int':'int', 'Wis':'wis', 'Cha':'cha' };
  function parseBackgroundAbilityBonuses(bgObj) {
    var result = {};
    if (!bgObj || !bgObj.bonuses) return result;
    bgObj.bonuses.forEach(function(b) {
      var m = b.match(/^([+-]\d+)\s+(\w+)$/);
      if (m && ABILITY_WORD_MAP[m[2]]) {
        var key = ABILITY_WORD_MAP[m[2]];
        result[key] = (result[key] || 0) + parseInt(m[1]);
      }
    });
    return result;
  }
  function getBackgroundFeat(bgObj) {
    if (!bgObj || !bgObj.bonuses) return null;
    var feat = bgObj.bonuses.find(function(b) { return !/^[+-]\d+\s+\w+$/.test(b); });
    return feat || null;
  }
  function abMod(v) { var m = Math.floor((v-10)/2); return (m>=0?'+':'')+m; }
  // Initiative — DEX mod + 5 if the character has the Alert feat (the only
  // feat in FEAT_TIPS affecting initiative). Depends only on data already
  // synchronous by the time buildMainInfoHtml() runs (ABILITY_SCORES/ch.feats
  // are both set from the initial player_characters fetch, no SHEET/
  // CLASS_ROW wait), so this renders once, correctly, on first paint — no
  // separate refresh function needed, unlike AC/saves/spellcasting stats.
  function computeInitiative(ch) {
    var dexRaw = parseInt(ABILITY_SCORES.dex) || 10;
    var dexMod = Math.floor((dexRaw - 10) / 2);
    var hasAlert = Array.isArray(ch && ch.feats) && ch.feats.indexOf('Alert') !== -1;
    var bonus = hasAlert ? 5 : 0;
    var total = dexMod + bonus;
    return { total: total, tip: dexMod + ' Dex' + (hasAlert ? ' + 5 (Alert)' : '') + ' = ' + total };
  }
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getToken() {

  function showToast(msg, isError) {
    var t = document.getElementById('cs-toast');
    if (!t) return;
    t.textContent = msg;

    void t.offsetWidth;
    t.classList.add('visible');
    setTimeout(function() { t.classList.remove('visible'); }, 3000);
  }

  // ── Appearance helpers ────────────────────────────────────────────
  function buildAppearanceDesc(app) {
    if (!app) return null;
    var parts = [];
    if (app.height && app.build) parts.push(cap(app.height) + ', ' + app.build + ' build.');
    else if (app.height) parts.push(cap(app.height) + '.');
    if (app.age) parts.push(cap(app.age) + '.');
    var face = [];
    if (app.face_shape) face.push(app.face_shape + ' face');
    // app-skin-tone is an <input type="color"> (character.html) — always a
    // hex value, never a word. Omit rather than print "#ffba66 skin".
    if (app.skin_tone && app.skin_tone.charAt(0) !== '#') face.push(app.skin_tone + ' skin');
    if (face.length) parts.push(cap(face.join(', ')) + '.');
    var eyes = [];
    if (app.eye_color) eyes.push(app.eye_color);
    if (app.eye_shape) eyes.push(app.eye_shape);
    if (eyes.length) parts.push(cap(eyes.join(', ')) + ' eyes.');
    var hair = [];
    if (app.hair_color) hair.push(app.hair_color);
    if (app.hair_style) hair.push(app.hair_style + ' hair');
    if (hair.length) parts.push(cap(hair.join(', ')) + '.');
    if (app.facial_hair && app.facial_hair !== 'none') parts.push(cap(app.facial_hair) + '.');
    if (Array.isArray(app.facial_markings) && app.facial_markings.length) {
      parts.push('Markings: ' + app.facial_markings.join(', ') + '.');
    }
    return parts.join(' ') || null;

  // Ability Scores tab content (Figma 51:1663/51:1668) — 6 cards from
  // ability_scores jsonb, math unchanged. Feats moved to the Background
  // card (buildYourBackgroundHtml, Your Story tab) per the Tab Redesign v1
  // spec — not rendered here anymore.
  // Skill list under one ability card. Three distinct states, per the ask:
  // proficient (class-chosen, ch.skills) uses the real proficiency_bonus
  // from character_sheet; a PAST_EFFECTS flat +1 (ch.skill_bonuses) only
  // applies when NOT proficient — confirmed against real overlap cases
  // (Kael: Animal Handling/Survival, Hana: Insight) that proficiency
  // supersedes rather than stacks, per 2024 PHB stacking rules (same-target
  // bonuses don't add — the higher one applies, and proficiency bonus is
  // always ≥ the flat +1). Marker: a "Prof." text label for proficient,
  // no marker at all for flat-bonus or neither — a dot next to a flat-bonus
  // skill read as a second, unexplained state once the "(+1)" next to its
  // total already said the same thing (DM feedback on live review).
  // Single source of truth for a skill's proficiency state/total — shared by
  // each skill row below and the Passive Perception badge, so the two can't
  // drift on the same "is proficiency superseding a flat +1" math.
  function computeSkillTotal(name, modNum, profBonus, ch) {
    var skillsArr  = Array.isArray(ch && ch.skills) ? ch.skills : [];
    var bonusesArr = Array.isArray(ch && ch.skill_bonuses) ? ch.skill_bonuses : [];
    var isProficient = skillsArr.indexOf(name) !== -1;
    var flatBonusObj = !isProficient ? bonusesArr.find(function(b) { return b && b.skill === name; }) : null;
    var flatAmount = flatBonusObj ? (parseInt(flatBonusObj.amount) || 1) : 0;
    var hasFlatBonus = !!flatBonusObj;
    return {
      total: modNum + (isProficient ? profBonus : hasFlatBonus ? flatAmount : 0),
      isProficient: isProficient,
      hasFlatBonus: hasFlatBonus,
      flatAmount: flatAmount
    };
  }
  function abilitySkillsInnerHtml(ab, modNum, profBonus, ch) {
    var skillNames = ABILITY_SKILLS[ab] || [];
    if (!skillNames.length) {
      return '<div class="cs-ab-skills-empty">No skills</div>';
    }
    return skillNames.map(function(name) {
      var s = computeSkillTotal(name, modNum, profBonus, ch);
      var totalStr = (s.total >= 0 ? '+' : '') + s.total
        + (s.hasFlatBonus ? ' (+' + s.flatAmount + ')' : '');
      var totalCls = s.total > 0 ? 'positive' : s.total < 0 ? 'negative' : '';
      var stateCls = s.isProficient ? 'cs-ab-skill--proficient' : s.hasFlatBonus ? 'cs-ab-skill--flat' : 'cs-ab-skill--none';
      var tip = SKILL_TIPS[name];
      var markerHtml = s.isProficient
        ? '<span class="cs-ab-skill-marker"><span class="cs-ab-skill-prof-label">Prof.</span></span>'
        : '<span class="cs-ab-skill-marker"></span>';
      return '<div class="cs-ab-skill ' + stateCls + '">'
        + markerHtml
        + '<span class="cs-ab-skill-name">' + escHtml(name)
          + (tip ? '<span class="cs-ab-tip" data-tip="' + tip.replace(/"/g,'&quot;') + '">?</span>' : '')
        + '</span>'
        + '<span class="cs-ab-skill-total ' + totalCls + '">' + totalStr + '</span>'
      + '</div>';
    }).join('');
  }
  // Saving-throw row — same visual family as a skill row (reuses
  // .cs-ab-skill* classes verbatim, just labeled "Save"), one per ability
  // card. Proficiency comes from classes.saving_throws via
  // parseSavingThrows(), not ch.skills — a different proficiency source
  // than the skill rows above. No per-card tooltip anymore — see
  // ABILITY_EXPLAINER_BLOCKS above.
  function abilitySaveRowHtml(ab, modNum, profBonus, isProficient) {
    var total = modNum + (isProficient ? profBonus : 0);
    var totalStr = (total >= 0 ? '+' : '') + total;
    var totalCls = total > 0 ? 'positive' : total < 0 ? 'negative' : '';
    var stateCls = isProficient ? 'cs-ab-skill--proficient' : 'cs-ab-skill--none';
    var markerHtml = isProficient
      ? '<span class="cs-ab-skill-marker"><span class="cs-ab-skill-prof-label">Prof.</span></span>'
      : '<span class="cs-ab-skill-marker"></span>';
    return '<div class="cs-ab-skill ' + stateCls + '">'
      + markerHtml
      + '<span class="cs-ab-skill-name">Save</span>'
      + '<span class="cs-ab-skill-total ' + totalCls + '">' + totalStr + '</span>'
    + '</div>';
  }
  // Passive Perception — 10 + Perception's total (proficiency or flat bonus,
  // same computeSkillTotal() math the Perception skill row uses). WIS-card
  // only; not a rollable stat, so styled as a distinct small pill rather
  // than folded into the skill list.
  function passivePerceptionBadgeHtml(wisModNum, profBonus, ch) {
    var passive = 10 + computeSkillTotal('Perception', wisModNum, profBonus, ch).total;
    return '<div class="cs-ab-passive" data-tip="A background number, not a roll. The DM checks this quietly to see if you notice something without trying — a hidden trap, someone lurking nearby.">'
      + '<span class="cs-ab-passive-label">Passive Perception</span>'
      + '<span class="cs-ab-passive-val">' + passive + '</span>'
    + '</div>';
  }

  // Ability Scores tab content (Figma 51:1663/51:1668) — 6 cards from
  // ability_scores jsonb, math unchanged. Feats moved to the Background
  // card (buildYourBackgroundHtml, Your Story tab) per the Tab Redesign v1
  // spec — not rendered here anymore.
  //
  // Skills section (no Figma reference for this — ad-hoc, matching existing
  // card/token styling, same approach as Special Effects): all 18 skills,
  // grouped under their parent ability card, replacing the old flat
  // "Proficient skills: X, Y, Z" comma-list this tab used to render (that
  // row is gone — the grouped list below covers the same information plus
  // bonus math and flat-bonus skills it never showed). Each card's skills
  // block gets an id so renderAbilitySkills() can refresh it once SHEET
  // (holding the real proficiency_bonus) loads — this initial build runs
  // before that fetch resolves, same ordering constraint renderHeaderHP()
  // already works around.
  function buildAbilityScoresHtml(scores, ch) {
    var AB_KEYS  = ['str','dex','con','int','wis','cha'];
    var AB_SHORT = { str:'STR', dex:'DEX', con:'CON', int:'INT', wis:'WIS', cha:'CHA' };
    var profBonus = SHEET ? (parseInt(SHEET.proficiency_bonus) || 0) : 2;
    // classes.saving_throws hasn't necessarily resolved yet on this first,
    // synchronous render (CLASS_ROW is null until fetchClassData() settles)
    // — same ordering gap profBonus already works around via SHEET. Falls
    // back to all-non-proficient rather than hiding the row; renderAbility-
    // Skills() re-derives this once CLASS_ROW is guaranteed loaded.
    var savesProficient = parseSavingThrows(CLASS_ROW ? CLASS_ROW.saving_throws : null);
    var cards = AB_KEYS.map(function(ab) {
      var raw    = parseInt(scores[ab]) || 0;
      var modNum = raw ? Math.floor((raw - 10) / 2) : 0;
      var modStr = raw ? (modNum >= 0 ? '+' : '') + modNum : '—';
      var modCls = modNum > 0 ? 'positive' : modNum < 0 ? 'negative' : '';
      return '<div class="cs-ab-card cs-ab-card--' + ab + '">'
        + '<img class="cs-ab-img" src="../assets/images/character-sheet/ability-scores/ability-' + ab + '.png" alt="">'
        + '<div class="cs-ab-txt">'
          + '<div class="cs-ab-label">' + AB_SHORT[ab]
            + '<span class="cs-ab-tip" data-tip="' + ABILITY_TIPS[ab].replace(/"/g,'&quot;') + '">?</span>'
          + '</div>'
          + '<div class="cs-ab-val">' + (raw || '—') + '</div>'
          + (raw ? '<div class="cs-ab-mod"><span class="cs-ab-mod-num ' + modCls + '">' + modStr + '</span> Modifier</div>' : '')
          + (ab === 'wis' ? '<div id="cs-ab-passive-perception">' + passivePerceptionBadgeHtml(modNum, profBonus, ch) + '</div>' : '')
        + '</div>'
        + '<div class="cs-ab-save" id="cs-ab-save-' + ab + '">' + abilitySaveRowHtml(ab, modNum, profBonus, !!savesProficient[ab]) + '</div>'
        + '<div class="cs-ab-skills" id="cs-ab-skills-' + ab + '">' + abilitySkillsInnerHtml(ab, modNum, profBonus, ch) + '</div>'
      + '</div>';
    }).join('');

    var explainerHtml = ABILITY_EXPLAINER_BLOCKS.map(function(b) {
      return '<div class="cs-ab-explainer-block">'
        + '<div class="cs-ab-explainer-heading">' + escHtml(b.heading) + '</div>'
        + '<p class="cs-ab-explainer-body">' + escHtml(b.body) + '</p>'
      + '</div>';
    }).join('');

    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ab-explainer">' + explainerHtml + '</div>'
      + '<div class="cs-ab-cards">' + cards + '</div>'
    + '</div></div>';
  }

  // Refreshes the 6 skill blocks, 6 save rows, and the Passive Perception
  // badge in place once SHEET (real proficiency_bonus) and CLASS_ROW (real
  // saving_throws) have both loaded — called from renderLivePlay(), which
  // only runs after the Promise.all covering both fetches resolves, so
  // CLASS_ROW is guaranteed set here even though it isn't on the first,
  // synchronous buildAbilityScoresHtml() render above. ch.skills/
  // ch.skill_bonuses don't change after initial load, so only the
  // proficiency-bonus/saving-throws-dependent math needs a second pass;
  // ability modifiers are re-read from the same global ABILITY_SCORES
  // buildAbilityScoresHtml used initially.
  function renderAbilitySkills() {
    if (!CH) return;
    var profBonus = SHEET ? (parseInt(SHEET.proficiency_bonus) || 0) : 2;
    var savesProficient = parseSavingThrows(CLASS_ROW ? CLASS_ROW.saving_throws : null);
    ['str','dex','con','int','wis','cha'].forEach(function(ab) {
      var raw = parseInt(ABILITY_SCORES[ab]) || 0;
      var modNum = raw ? Math.floor((raw - 10) / 2) : 0;
      var skillsEl = document.getElementById('cs-ab-skills-' + ab);
      if (skillsEl) skillsEl.innerHTML = abilitySkillsInnerHtml(ab, modNum, profBonus, CH);
      var saveEl = document.getElementById('cs-ab-save-' + ab);
      if (saveEl) saveEl.innerHTML = abilitySaveRowHtml(ab, modNum, profBonus, !!savesProficient[ab]);
      if (ab === 'wis') {
        var passiveEl = document.getElementById('cs-ab-passive-perception');
        if (passiveEl) passiveEl.innerHTML = passivePerceptionBadgeHtml(modNum, profBonus, CH);
      }
    });
  }

  // Hit Die/Saves/Weapons get a "?" tooltip from the matching classes.*_tip
  // column; Primary and Armor stay tooltip-free, matching character.html's
  // .char-class-trait pattern exactly (build spec: "don't invent tips").
  function classTraitLabel(text, tip) {
    return tip
      ? text + '<span class="cs-ab-tip" data-tip="' + tip.replace(/"/g,'&quot;') + '">?</span>'
      : text;
  }
  // Hit die was dropped from this card 2026-08-14 to match the real Figma
  // frame (52:2705, node 94:1561) exactly — confirmed via get_design_context,
  // not assumed from the handoff doc's own (also hit-die-free) field list.
  // Hit die still displays elsewhere (the header's Hit Dice tracker reads
  // CLASS_ROW.hit_die directly), so this isn't a data loss, just de-duplication.
  // classes.hit_die_tip is now unused by this function but left in the schema —
  // same "leave a harmless unused column" precedent as hit_dice_total.
  function renderClassDetailsHtml(row) {
    var primary = row ? row.primary_ability   : null;
    var saves   = row ? row.saving_throws     : null;
    var casting = row ? row.casting_summary   : null;
    var armor   = row ? row.armor             : null;
    var tools   = row ? row.tools             : null;
    var weapons = row ? row.weapons           : null;
    var savesTip  = row ? row.saves_tip   : null;
    var weaponsTip = row ? row.weapons_tip : null;
    return '<div class="cs-ov-class-detail">'
        + '<p class="cs-ov-class-detail-key">Primary ability:</p><p class="cs-ov-class-detail-val">' + (primary || '—') + '</p>'
        + '<p class="cs-ov-class-detail-key">' + classTraitLabel('Saving throws:', savesTip) + '</p><p class="cs-ov-class-detail-val">' + (saves || '—') + '</p>'
        + '<p class="cs-ov-class-detail-key">Casting Spells:</p><p class="cs-ov-class-detail-val">' + (casting || '—') + '</p>'
      + '</div>'
      + '<div class="cs-ov-class-detail">'
        + '<p class="cs-ov-class-detail-key">Armor:</p><p class="cs-ov-class-detail-val">' + (armor || '—') + '</p>'
        + '<p class="cs-ov-class-detail-key">Tools:</p><p class="cs-ov-class-detail-val">' + (tools || '—') + '</p>'
        + '<p class="cs-ov-class-detail-key">' + classTraitLabel('Weapons:', weaponsTip) + '</p><p class="cs-ov-class-detail-val">' + (weapons || '—') + '</p>'
      + '</div>';
  }

  // ── Key Features (Class tab, new) — icon + name/description/level split.
  // FEAT_ICONS ported verbatim from character.js's renderClassGrid() (only
  // the icon table already existed there); the name/description/level
  // parser below is new — character.js only assigns an icon and renders
  // the raw string, it never actually split features apart. Verified
  // against all 72 real feature strings (12 classes × 6) in classes.features
  // before writing this, not assumed from the build spec's description. ──
  var FEAT_ICONS = [
    { pattern: /favored enemy/i,            icon: '&#127919;' },
    { pattern: /natural explorer/i,         icon: '&#127807;' },
    { pattern: /hide in plain sight/i,      icon: '&#128065;' },
    { pattern: /rage/i,                     icon: '&#128121;' },
    { pattern: /unarmored defense/i,        icon: '&#128170;' },
    { pattern: /danger sense/i,             icon: '&#8252;' },
    { pattern: /primal path/i,              icon: '&#128005;' },
    { pattern: /bardic inspiration/i,       icon: '&#127917;' },
    { pattern: /jack of all trades/i,       icon: '&#127925;' },
    { pattern: /song of rest/i,             icon: '&#127925;' },
    { pattern: /expertise/i,                icon: '&#127925;' },
    { pattern: /destroy undead/i,           icon: '&#128128;' },
    { pattern: /turn undead/i,              icon: '&#129440;' },
    { pattern: /druidic circle/i,           icon: '&#128171;' },
    { pattern: /druidic/i,                  icon: '&#128172;' },
    { pattern: /timeless body/i,            icon: '&#8987;' },
    { pattern: /beast spells/i,             icon: '&#10024;' },
    { pattern: /wild shape/i,               icon: '&#127807;' },
    { pattern: /second wind/i,              icon: '&#127788;' },
    { pattern: /action surge/i,             icon: '&#9889;' },
    { pattern: /indomitable/i,              icon: '&#128074;' },
    { pattern: /martial arts/i,             icon: '&#129357;' },
    { pattern: /stunning strike/i,          icon: '&#129339;' },
    { pattern: /unarmored movement/i,       icon: '&#128168;' },
    { pattern: /metamagic/i,                icon: '&#128302;' },
    { pattern: /pact magic/i,               icon: '&#128138;' },
    { pattern: /eldritch invocation/i,      icon: '&#128520;' },
    { pattern: /mystic arcanum/i,           icon: '&#128220;' },
    { pattern: /arcane tradition/i,         icon: '&#9905;' },
    { pattern: /arcane recovery/i,          icon: '&#128260;' },
    { pattern: /spell mastery/i,            icon: '&#129497;' },
    { pattern: /spellbook/i,                icon: '&#128214;' },
    { pattern: /reckless attack/i,          icon: '&#9889;' },
    { pattern: /sneak attack/i,             icon: '&#128481;' },
    { pattern: /divine smite|smite/i,       icon: '&#9876;' },
    { pattern: /extra attack/i,             icon: '&#9876;' },
    { pattern: /fighting style/i,           icon: '&#9876;' },
    { pattern: /spellcasting/i,             icon: '&#10024;' },
    { pattern: /channel divinity/i,         icon: '&#9728;' },
    { pattern: /divine intervention/i,      icon: '&#9728;' },
    { pattern: /aura of protection/i,       icon: '&#128737;' },
    { pattern: /sacred oath|monastic tradition|ranger archetype|bard college|sorcerous origin|otherworldly patron/i, icon: '&#127775;' },
    { pattern: /subclass/i,                 icon: '&#127775;' },
    { pattern: /cunning action|uncanny dodge|evasion/i, icon: '&#128481;' },
    { pattern: /superiority|maneuver/i,     icon: '&#128171;' },
    { pattern: /ki point|flurry|patient defense/i, icon: '&#128074;' },
    { pattern: /eldritch blast/i,           icon: '&#128520;' },
    { pattern: /dark one|pact of/i,         icon: '&#128138;' },
    { pattern: /signature spell/i,          icon: '&#129497;' },
    // Generic fallback
    { pattern: /./,                         icon: '&#10022;' }
  ];
  function classFeatureIcon(raw) {
    for (var i = 0; i < FEAT_ICONS.length; i++) {
      if (FEAT_ICONS[i].pattern.test(raw)) return FEAT_ICONS[i].icon;
    }
    return '&#10022;';
  }
  // Splits a raw feature string into {name, description, level}. New logic
  // — not a port, character.js never split these, it only assigns an icon
  // and renders the whole string. " — " separates name from description
  // when present; " subclass at level N" / " at level N" is stripped off
  // the name (whichever side of the dash it landed on) into a level badge.
  function parseClassFeature(raw) {
    var name = raw, description = null, level = null;
    var dashIdx = raw.indexOf(' — ');
    if (dashIdx !== -1) {
      name = raw.slice(0, dashIdx);
      description = raw.slice(dashIdx + 3);
    }
    var subclassMatch = name.match(/^(.*) subclass at level (\d+)$/);
    if (subclassMatch) {
      name = subclassMatch[1];
      level = subclassMatch[2];
    } else {
      var levelMatch = name.match(/^(.*) at level (\d+)$/);
      if (levelMatch) {
        name = levelMatch[1];
        level = levelMatch[2];
      }
    }
    return { name: name, description: description, level: level };
  }
  function buildClassFeaturesHtml(features) {
    if (!Array.isArray(features) || !features.length) return '';
    var rows = features.map(function(raw) {
      var icon = classFeatureIcon(raw);
      var parsed = parseClassFeature(raw);
      return '<div class="cs-class-feature-row">'
        + '<span class="cs-class-feature-icon">' + icon + '</span>'
        + '<div class="cs-class-feature-txt">'
          + '<span class="cs-class-feature-name">' + escHtml(parsed.name) + '</span>'
          + (parsed.level ? '<span class="cs-class-feature-level">Level ' + parsed.level + '</span>' : '')
          + (parsed.description ? '<span class="cs-class-feature-desc">' + escHtml(parsed.description) + '</span>' : '')
        + '</div>'
      + '</div>';
    }).join('');
    // No leading "Key Features" label here (dropped 2026-08-14) — the new
    // Overview-accordion column heading (.cs-class-col-heading) provides it
    // now. .cs-class-features-label itself is untouched and still used
    // as-is by the separate Spellcasting/Spell Slots cards on this tab.
    return '<div class="cs-class-features">' + rows + '</div>';
  }

  // ── Class tab (Figma 52:2705/52:2710) ───────────────────────────────
  // Basic info (image/name/level) renders immediately from player_characters;
  // mechanical fields + Key Features come from the `classes` table via
  // renderClassTabDynamic() once fetchClassData() resolves.
  // ── Class tab Overview restructure (Figma 52:2705, pulled fresh
  // 2026-08-14) — Basic row + a two-column "Overview" accordion (Class
  // details left, Key Features right). Built by hand rather than calling
  // accordionShell() verbatim: that helper wraps its own .cs-ov-breakout,
  // and this whole tab already lives inside ONE shared breakout established
  // once at the top of this function — nesting a second viewport-relative
  // full-bleed wrapper (width:100vw; left:50%; margin-left:-50vw) one level
  // deeper would double-offset, not just double-wrap harmlessly. Same
  // .cs-ov-acc*/toggleSheetAccordion() classes and behavior are reused
  // directly, just without accordionShell()'s outer div.
  //
  // Real Figma structure has the Accordion wrapping Basic + details
  // together (collapsing "Overview" would hide the class name/image too) —
  // deviated from that on purpose, keeping Basic always visible outside the
  // collapsible region, per this handoff's own explicit instruction ("Basic
  // row stays where it is"). Flagged, not silently picked either way.
  function buildClassOverviewAccordionHtml() {
    return '<div class="cs-ov-acc" id="cs-class-overview-acc">'
      + '<button class="cs-ov-acc-header" type="button" onclick="toggleSheetAccordion(\'cs-class-overview-acc\')">'
        + '<span class="cs-ov-acc-title">Overview</span>'
        + '<span class="cs-ov-acc-toggle"><span class="cs-ov-acc-toggle-label">Collapse</span><span class="cs-ov-acc-chevron">&#9662;</span></span>'
      + '</button>'
      + '<div class="cs-ov-acc-body-outer"><div class="cs-ov-acc-body">'
        + '<div class="cs-class-overview-row">'
          + '<div class="cs-class-overview-col">'
            // Round 2 QA: "Overview" appeared twice (accordion header +
            // this column) — the accordion header already establishes
            // context, this column's own heading is renamed to what it
            // actually holds instead of repeating the parent's title.
            + '<div class="cs-class-col-heading">Details</div>'
            + '<div class="cs-ov-class-details" id="cs-class-details">' + renderClassDetailsHtml(CLASS_ROW) + '</div>'
          + '</div>'
          + '<div class="cs-class-overview-col">'
            + '<div class="cs-class-col-heading">Key Features</div>'
            + '<div id="cs-class-features">' + buildClassFeaturesHtml(CLASS_ROW ? CLASS_ROW.features : null) + '</div>'
          + '</div>'
        + '</div>'
      + '</div></div>'
    + '</div>';
  }
  function buildClassTabHtml(ch, classDisplay) {
    var classKey = (ch.class_id || '').toLowerCase();
    var classImgSrc = classKey ? '../assets/images/classes/class-' + classKey + '.webp' : '';
    return '<div class="cs-ov-breakout"><div class="cs-ov-inner"><div class="cs-class-tab-stack">'
      + '<div class="cs-ov-class-card">'
        + '<div class="cs-ov-class-basic">'
          + (classImgSrc ? '<img class="cs-ov-class-img" src="' + classImgSrc + '" alt="" onerror="this.style.display=\'none\'">' : '')
          + '<div class="cs-ov-class-txt">'
            + '<div class="cs-ov-class-label">Class</div>'
            + '<div class="cs-ov-class-name">' + classDisplay + '</div>'
          + '</div>'
          + '<div class="cs-ov-class-level"><div class="cs-ov-class-level-label">Level</div><div class="cs-ov-class-level-val">' + (ch.level || 1) + '</div></div>'
        + '</div>'
        + buildClassOverviewAccordionHtml()
      + '</div>'
      // Features accordion — new this handoff, holds the Class-Specific
      // limited-use tracker (and, later, Handoff B's Spell Slots/Prepared/
      // Learned cards as sibling groups in the same body). Always-present
      // empty anchor div, never the accordion markup itself, on this first
      // synchronous paint — CLASS_ROW is null here (fetchClassData()
      // hasn't resolved yet), so whether any limited-use features exist is
      // still unknown. renderClassFeaturesAccordion() (called from
      // renderClassTabDynamic() once CLASS_ROW loads) fills this in only
      // when there's real content, per the DM's explicit call not to add a
      // hideIfEmpty flag to accordionShell() — skip emitting the accordion
      // at all rather than emit-then-hide.
      // Round 3 QA: Spellcasting Modifier/Save DC/Attack Bonus used to be
      // its own standalone .cs-ov-class-card here, outside the Features
      // accordion entirely — moved inside (see
      // renderClassFeaturesAccordion()'s template), directly below Spells
      // Prepared, so it reads as one Features group instead of a separate
      // card. No standalone wrapper left behind.
      + '<div id="cs-class-features-acc-wrap"></div>'
      // Round 2 Revisions — DM decision: spells are DM-assigned only, no
      // player self-serve. This card now just displays learned_spells (see
      // renderSpellsLearnedTable()) — no eligible-pool browsing, so the
      // search/filter row is gone entirely (DM's own recommendation,
      // confirmed: filtering a short 5-15-item known list added UI weight
      // without real benefit). Column headers unchanged; widths tightened
      // via .cs-sl-table (Round 2 Revisions 2c).
      + '<div class="cs-ov-class-card cs-spells-learned-card" id="cs-spells-learned-card" style="display:none;">'
        + '<div class="cs-limuse-group-label">Spells Learned</div>'
        + '<div class="cs-inv-table-wrap">'
          + '<table class="cs-inv-table cs-sl-table">'
            + '<thead><tr>'
              + '<th class="cs-inv-th cs-inv-th-select">Prepared</th>'
              + '<th class="cs-inv-th cs-inv-th-thumb"></th>'
              + '<th class="cs-inv-th">Name</th>'
              + '<th class="cs-inv-th">Level</th>'
              + '<th class="cs-inv-th">Category</th>'
              + '<th class="cs-inv-th">Casting Time</th>'
              + '<th class="cs-inv-th">Range</th>'
              + '<th class="cs-inv-th">Components</th>'
              + '<th class="cs-inv-th">Duration</th>'
              + '<th class="cs-inv-th">Description</th>'
            + '</tr></thead>'
            + '<tbody id="cs-spells-learned-tbody"><tr><td class="cs-inv-empty-row" colspan="10">Loading spells&#8230;</td></tr></tbody>'
          + '</table>'
        + '</div>'
      + '</div>'
    + '</div></div></div>';
  }

  // ── Spell Slots (Features accordion, Handoff B — replaces the earlier
  // pip stopgap). Max is derived live from classes.spell_slot_progression
  // (a real 9-element-array-per-level table, verified against the 2024 PHB
  // for every casting class including Warlock's distinct Pact Magic table)
  // at the character's current level — same "derive, don't cache" principle
  // hp-calc.js already uses for HP, so leveling up just changes which slots
  // show up, no migration/manual edit needed. character_sheet.spell_slots
  // is repurposed from "current available count" (the old stopgap's
  // meaning) to "spent count" (matching the Class-Specific tracker's
  // segment convention below) — safe, confirmed via SQL that all 3 real
  // characters' columns were still empty/zero, never used in real play.
  var SPELL_LEVEL_ROMAN = {1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX'};
  function computeSpellSlotsArray() {
    if (!CLASS_ROW || !CLASS_ROW.spell_slot_progression) return null;
    var chLevel = (CH && CH.level) || 1;
    return CLASS_ROW.spell_slot_progression[String(chLevel)] || null;
  }
  // Same left-to-right-available / right-to-left-spent fill convention as
  // limitedUseCardHtml() below, just with a --magic-blue segment treatment
  // (confirmed against the real Figma pull) instead of Class-Specific's
  // --green — reuses .cs-limuse-card/-header/-name/-count/-bar verbatim.
  function spellSlotCardHtml(level, max, spent) {
    var segments = [];
    for (var i = 0; i < max; i++) {
      var isSpent = i >= (max - spent);
      segments.push('<button class="cs-limuse-seg cs-spellslot-seg' + (isSpent ? ' spent' : ' active') + '" onclick="toggleSpellSlotSeg(' + level + ', ' + i + ')">'
        + (isSpent ? '<span class="cs-limuse-seg-label">Spent</span>' : '<span class="cs-limuse-seg-num">' + (i + 1) + '</span>')
        + '</button>');
    }
    return '<div class="cs-limuse-card">'
      + '<div class="cs-limuse-header">'
        + '<span class="cs-limuse-name">Level ' + (SPELL_LEVEL_ROMAN[level] || level) + '</span>'
        + '<span class="cs-limuse-count">Used: ' + spent + '/' + max + '</span>'
      + '</div>'
      + '<div class="cs-limuse-bar">' + segments.join('') + '</div>'
    + '</div>';
  }
  function renderSpellSlotsGroup() {
    var el = document.getElementById('cs-spellslot-cards');
    if (!el) return;
    var arr = computeSpellSlotsArray();
    if (!arr) { el.innerHTML = '<div class="cs-spell-slot-none">No spell slots at this level.</div>'; return; }
    var spentObj = (SHEET && typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? SHEET.spell_slots : {};
    var html = '';
    for (var i = 0; i < 9; i++) {
      var max = parseInt(arr[i]) || 0;
      if (max <= 0) continue;
      var level = i + 1;
      var spent = Math.min(parseInt(spentObj[level]) || 0, max);
      html += spellSlotCardHtml(level, max, spent);
    }
    el.innerHTML = html || '<div class="cs-spell-slot-none">No spell slots at this level.</div>';
  }
  function toggleSpellSlotSeg(level, segIdx) {
    if (!SHEET) return;
    var arr = computeSpellSlotsArray();
    var max = arr ? (parseInt(arr[level - 1]) || 0) : 0;
    if (max <= 0) return;
    var spentObj = (typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? Object.assign({}, SHEET.spell_slots) : {};
    var cur = parseInt(spentObj[level]) || 0;
    var next = (cur === (max - segIdx)) ? (max - segIdx) - 1 : (max - segIdx);
    if (next < 0) next = 0;
    if (next > max) next = max;
    spentObj[level] = next;
    SHEET.spell_slots = spentObj;
    saveSheet({ spell_slots: spentObj });
    renderSpellSlotsGroup();
  }

  // ── Spells Prepared (Features accordion, Handoff B) ─────────────────
  // classes.prepared_count_formula: {type:"fixed_table", values:{level:count}}
  // for Bard/Sorcerer/Warlock (2024 PHB calls this "Prepared Spells" too —
  // no separate "known spells" concept anymore), or {type:
  // "ability_mod_plus_level", level_divisor, round:"down"|null, min} for the
  // two ability-mod-based groups. Verified against the 2024 PHB directly —
  // caught and corrected two real errors in the handoff doc along the way:
  // Paladin was wrongly grouped with the full-level casters (Cleric/Druid/
  // Wizard) when it actually uses the half-level formula, same as Ranger;
  // and Ranger's rounding was stated as "round up" when the real rule
  // rounds down (both now share level_divisor:2, round:"down").
  function computePreparedMax() {
    if (!CLASS_ROW || !CLASS_ROW.prepared_count_formula) return 0;
    var f = CLASS_ROW.prepared_count_formula;
    var chLevel = (CH && CH.level) || 1;
    var min = parseInt(f.min) || 1;
    if (f.type === 'fixed_table') {
      var n = f.values ? parseInt(f.values[String(chLevel)]) : 0;
      return Math.max(min, n || 0);
    }
    if (f.type === 'ability_mod_plus_level') {
      var castingAbility = CLASS_ROW.spellcasting_ability;
      var abMod = castingAbility ? Math.floor(((parseInt(ABILITY_SCORES[castingAbility]) || 10) - 10) / 2) : 0;
      var divisor = parseInt(f.level_divisor) || 1;
      var levelPart = Math.floor(chLevel / divisor);
      return Math.max(min, abMod + levelPart);
    }
    return 0;
  }
  // Swap-rule copy verbatim per class group, per the handoff doc: Cleric/
  // Druid/Wizard can change any number after a Long Rest; Paladin/Ranger
  // can swap just one after a Long Rest; Bard/Sorcerer/Warlock only swap
  // one when they gain a class level (matches their fixed-table formula —
  // there's no daily "prepare from a wider pool" for these three).
  var PREPARED_SWAP_RULES = {
    cleric: 'After a Long Rest, you can change any number of your prepared spells.',
    druid: 'After a Long Rest, you can change any number of your prepared spells.',
    wizard: 'After a Long Rest, you can change any number of your prepared spells.',
    paladin: 'After a Long Rest, you can swap out one of your prepared spells for another.',
    ranger: 'After a Long Rest, you can swap out one of your prepared spells for another.',
    bard: 'When you gain a level in this class, you can swap out one spell you know for another.',
    sorcerer: 'When you gain a level in this class, you can swap out one spell you know for another.',
    warlock: 'When you gain a level in this class, you can swap out one spell you know for another.'
  };
  function renderPreparedSpells() {
    var countEl = document.getElementById('cs-prepared-count');
    var explainerEl = document.getElementById('cs-prepared-explainer');
    var pillsEl = document.getElementById('cs-prepared-pills');
    if (!countEl || !pillsEl) return;
    var classKey = (CH && CH.class_id || '').toLowerCase();
    var max = computePreparedMax();
    var prepared = (SHEET && Array.isArray(SHEET.prepared_spells)) ? SHEET.prepared_spells : [];
    countEl.textContent = prepared.length + '/' + max;
    if (explainerEl) explainerEl.textContent = PREPARED_SWAP_RULES[classKey] || '';
    var html = prepared.map(function(id) {
      var sp = SPELLS_BY_ID[id];
      var name = sp ? sp.name : id;
      return '<span class="cs-prepared-pill">' + escHtml(name)
        + '<button class="cs-prepared-pill-x" onclick="unprepareSpell(\'' + id + '\')" aria-label="Unprepare ' + escHtml(name) + '">&#10005;</button>'
      + '</span>';
    }).join('');
    // Round 3 QA: was a single "+ Prepare" pill regardless of how many
    // slots were actually empty — one per unfilled slot, per the original
    // Figma intent (Handoff B), up to the character's real max (e.g. Hana
    // at 0/4 shows 4 pills, not 1). Every pill opens the same shared
    // picker — prepareSpell() itself already stops adding once max is
    // reached, so there's no per-pill "slot index" to track.
    var emptySlots = Math.max(0, max - prepared.length);
    for (var i = 0; i < emptySlots; i++) {
      html += '<button class="cs-prepared-pill cs-prepared-pill--add" onclick="openSpellPicker()">+ Prepare</button>';
    }
    pillsEl.innerHTML = html;
  }
  function unprepareSpell(id) {
    if (!SHEET) return;
    var prepared = (Array.isArray(SHEET.prepared_spells) ? SHEET.prepared_spells : []).filter(function(x){ return x !== id; });
    SHEET.prepared_spells = prepared;
    saveSheet({ prepared_spells: prepared });
    renderPreparedSpells();
    renderSpellsLearnedTable();
  }
  function prepareSpell(id) {
    if (!SHEET) return;
    var prepared = (Array.isArray(SHEET.prepared_spells) ? SHEET.prepared_spells : []).slice();
    var max = computePreparedMax();
    if (prepared.indexOf(id) === -1 && prepared.length < max) prepared.push(id);
    SHEET.prepared_spells = prepared;
    saveSheet({ prepared_spells: prepared });
    renderPreparedSpells();
    renderSpellsLearnedTable();
  }
  // Shared picker modal for "+ Prepare" — lists spells already on this
  // character's Learned list (see Spells Learned below) that aren't
  // prepared yet. A spell must be learned before it can be prepared, same
  // relationship as a real spellbook/known-spells list feeding a daily
  // prepared subset.
  function openSpellPicker() {
    var learned = (SHEET && Array.isArray(SHEET.learned_spells)) ? SHEET.learned_spells : [];
    var prepared = (SHEET && Array.isArray(SHEET.prepared_spells)) ? SHEET.prepared_spells : [];
    var pool = learned.filter(function(id){ return prepared.indexOf(id) === -1; })
      .map(function(id){ return SPELLS_BY_ID[id]; }).filter(Boolean)
      .sort(function(a,b){ return (a.level - b.level) || a.name.localeCompare(b.name); });
    var resultsEl = document.getElementById('cs-spell-picker-results');
    if (!resultsEl) return;
    resultsEl.innerHTML = pool.length
      ? pool.map(function(s) {
          return '<div class="cs-equip-result" onclick="prepareSpell(\'' + s.id + '\'); closeSpellPickerModal();">'
            + '<span class="cs-equip-result-name">' + escHtml(s.name) + ' <span style="opacity:0.6;">(' + (s.level === 0 ? 'Cantrip' : 'Level ' + s.level) + ')</span></span>'
          + '</div>';
        }).join('')
      : '<div class="cs-inv-empty">No learned spells available to prepare — learn one from the Spells Learned table first.</div>';
    document.getElementById('cs-spell-picker-modal-overlay').style.display = 'flex';
  }
  function closeSpellPickerModal() {
    var overlay = document.getElementById('cs-spell-picker-modal-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  // ── Spells Learned browser (Class tab, Handoff B) ────────────────────
  // character_sheet.learned_spells — spells the player has added to their
  // personal list via this browser. Real spells.school/casting_time/range/
  // components/duration/classes were all empty before this handoff (DM's
  // explicit instruction: populate them with real 2024 PHB data rather
  // than build the browser against empty columns) — SPELLS_DATA is fetched
  // once at boot (see fetchSpellsData()) now that the data is real.
  // "Category" column = spells.school (DM's explicit choice over
  // Gigglegloom types, which is what this file's own earlier read of the
  // Figma mockup had assumed before asking).
  var SPELL_TYPE_ICON_SRC = {
    Bubbleseed: '../assets/icons/icon-bubbleseed.svg',
    Featherflow: '../assets/icons/icon-featherflow.svg',
    Steelfist: '../assets/icons/icon-steelfist.svg',
    Flamerage: '../assets/icons/icon-flamerage.svg'
  };
  function spellThumbHtml(spell) {
    var t = spell.types && spell.types[0];
    var src = t ? SPELL_TYPE_ICON_SRC[t] : null;
    return src ? '<img class="cs-spell-thumb" src="' + src + '" alt="">' : '<span class="cs-spell-thumb-fallback">&#10022;</span>';
  }
  // Round 2 Revisions — DM decision: DM-assignment-only. Reviewed the old
  // self-serve "+ Learn" flow (Round 1 Fix 1's three-tier eligible-pool
  // browser) and moved off it entirely — the DM now assigns every spell a
  // character knows, via the DM Tools Players page (dm.html). This table
  // is read-mostly: it only ever displays character_sheet.learned_spells,
  // with zero add-a-spell path anywhere in this UI. The "could-learn"
  // eligibility pool (spells.classes ∪ extra_learnable_spells) that Round 1
  // built still exists — it's just moved to dm.html's own spell-assignment
  // search, DM-driven instead of player-driven; nothing here computes it
  // anymore. The "Prepared" checkbox is untouched — still toggles which
  // known spells are currently prepared, exactly as built.
  function renderSpellsLearnedTable() {
    var card = document.getElementById('cs-spells-learned-card');
    var tbody = document.getElementById('cs-spells-learned-tbody');
    if (!card || !tbody) return;
    // Same non-caster gate as before (Round 1 Fix 3) — true non-casters
    // (Barbarian/Fighter/Monk/Rogue) never see this card at all.
    var hasCasting = !!(CLASS_ROW && CLASS_ROW.spellcasting_ability);
    if (!hasCasting) { card.style.display = 'none'; return; }
    card.style.display = '';
    var learned = (SHEET && Array.isArray(SHEET.learned_spells)) ? SHEET.learned_spells : [];
    var prepared = (SHEET && Array.isArray(SHEET.prepared_spells)) ? SHEET.prepared_spells : [];
    var maxPrepared = computePreparedMax();
    var list = learned.map(function(id) { return SPELLS_BY_ID[id]; }).filter(Boolean)
      .sort(function(a,b) { return (a.level - b.level) || a.name.localeCompare(b.name); });
    // A level-1 caster legitimately may have nothing assigned yet — an
    // honest "not yet" message, not a blank void implying something broke.
    tbody.innerHTML = list.length ? list.map(function(s) {
      var isPrepared = prepared.indexOf(s.id) >= 0;
      var levelLabel = s.level === 0 ? 'Cantrip' : String(s.level);
      var preparedCell = '<input type="checkbox" ' + (isPrepared ? 'checked' : '') + (!isPrepared && prepared.length >= maxPrepared ? ' disabled title="Prepared list is full"' : '') + ' onchange="togglePreparedFromTable(\'' + s.id + '\', this.checked)">';
      return '<tr class="cs-inv-tr">'
        + '<td class="cs-inv-td cs-inv-td-select">' + preparedCell + '</td>'
        + '<td class="cs-inv-td cs-inv-td-thumb">' + spellThumbHtml(s) + '</td>'
        + '<td class="cs-inv-td">' + escHtml(s.name) + '</td>'
        + '<td class="cs-inv-td cs-inv-td-cat">' + levelLabel + '</td>'
        + '<td class="cs-inv-td">' + (s.school ? escHtml(s.school) : '&mdash;') + '</td>'
        + '<td class="cs-inv-td">' + (s.casting_time ? escHtml(s.casting_time) : '&mdash;') + '</td>'
        + '<td class="cs-inv-td">' + (s.range ? escHtml(s.range) : '&mdash;') + '</td>'
        + '<td class="cs-inv-td">' + (s.components ? escHtml(s.components) : '&mdash;') + '</td>'
        + '<td class="cs-inv-td">' + (s.duration ? escHtml(s.duration) : '&mdash;') + '</td>'
        + '<td class="cs-inv-td">' + (s.spell_desc ? escHtml(s.spell_desc) : '') + '</td>'
      + '</tr>';
    }).join('') : '<tr><td class="cs-inv-empty-row" colspan="10">No spells learned yet.</td></tr>';
  }
  function togglePreparedFromTable(id, checked) {
    if (!SHEET) return;
    var prepared = (Array.isArray(SHEET.prepared_spells) ? SHEET.prepared_spells : []).slice();
    var max = computePreparedMax();
    if (checked) {
      if (prepared.indexOf(id) === -1 && prepared.length < max) prepared.push(id);
    } else {
      prepared = prepared.filter(function(x){ return x !== id; });
    }
    SHEET.prepared_spells = prepared;
    saveSheet({ prepared_spells: prepared });
    renderPreparedSpells();
    renderSpellsLearnedTable();
  }

  // ── Spellcasting stats (Class tab) — Spellcasting Modifier / Spell Save
  // DC / Spell Attack Bonus. classes.spellcasting_ability is a new column
  // (str/dex/con/int/wis/cha, null for non-casters) — added this session;
  // classes.primary_ability was confirmed unreliable for this (a combined
  // string for half-casters, e.g. paladin "Strength & Charisma", ranger
  // "Dexterity & Wisdom" — the casting ability is only one of the two, and
  // only recoverable by parsing casting_summary's free text, which the
  // build doc explicitly said not to do).
  // Round 2 QA redesign — 3-column badge row instead of 3 stacked
  // .cs-ab-skill rows (see the .cs-spellcast-stat* CSS comment).
  // Round 3 QA: relocated from a standalone card (its own
  // style="display:none" show/hide toggle) into the Features accordion,
  // under Spells Prepared — inclusion is now gated by the same hasCasting
  // check the accordion's template already uses for that group (see
  // renderClassFeaturesAccordion()), so this function no longer needs to
  // manage its own card visibility; a non-caster simply never gets the
  // target div rendered at all.
  function spellStatCardHtml(label, value, tip) {
    return '<div class="cs-spellcast-stat">'
      + '<span class="cs-spellcast-stat-label">' + label
        + '<span class="cs-ab-tip" data-tip="' + tip.replace(/"/g,'&quot;') + '">?</span>'
      + '</span>'
      + '<span class="cs-spellcast-stat-val">' + value + '</span>'
    + '</div>';
  }
  function renderSpellcastingStats() {
    var el = document.getElementById('cs-class-spellcasting-stats');
    if (!el) return;
    var castingAbility = CLASS_ROW ? CLASS_ROW.spellcasting_ability : null;
    if (!castingAbility) { el.innerHTML = ''; return; }
    var abMod = Math.floor(((parseInt(ABILITY_SCORES[castingAbility]) || 10) - 10) / 2);
    var profBonus = SHEET ? (parseInt(SHEET.proficiency_bonus) || 0) : 2;
    var saveDC = 8 + profBonus + abMod;
    var atkBonus = profBonus + abMod;
    el.innerHTML = '<div class="cs-spellcast-stats">'
      + spellStatCardHtml('Spellcasting Modifier', (abMod >= 0 ? '+' : '') + abMod, 'The ability modifier your class uses to cast spells.')
      + spellStatCardHtml('Spell Save DC', saveDC, 'The number a creature must roll at or above to resist your spell.')
      + spellStatCardHtml('Spell Attack Bonus', (atkBonus >= 0 ? '+' : '') + atkBonus, 'Added to the d20 when you make an attack roll with a spell.')
    + '</div>';
  }

  // Populated once fetchClassData() resolves — the `classes` table is the
  // source for these mechanical fields (see docs/character-sheet-redesign-handoff.md §6).
  // ── Class-Specific limited-use tracker (Features accordion, new) ────
  // classes.limited_use_features: [{name, max_at_level: {level: max},
  // recharge}]. Max is derived live from the character's current level —
  // same "don't cache what you can derive" principle hp-calc.js already
  // uses for HP — picking the highest level threshold <= current level, so
  // leveling up just reveals more segments with no migration needed.
  function computeLimitedUseMax(feature, chLevel) {
    if (!feature || !feature.max_at_level) return 0;
    var thresholds = Object.keys(feature.max_at_level).map(Number).sort(function(a,b){return a-b;});
    var applicable = thresholds.filter(function(t){ return t <= chLevel; });
    if (!applicable.length) return 0;
    var pick = applicable[applicable.length - 1];
    return feature.max_at_level[pick];
  }
  // Round 2 QA — the lowest level threshold at which a feature has any
  // real uses at all (skips a threshold whose own value is 0, which some
  // feature tables use as an explicit "not yet" entry rather than just
  // omitting the level). Used only for the 0/0 "not unlocked yet" message
  // below — generalizes to any limited-use feature, not just Wild Shape.
  function firstUnlockLevel(feature) {
    if (!feature || !feature.max_at_level) return null;
    var thresholds = Object.keys(feature.max_at_level).map(Number)
      .filter(function(t){ return (parseInt(feature.max_at_level[t]) || 0) > 0; })
      .sort(function(a,b){ return a - b; });
    return thresholds.length ? thresholds[0] : null;
  }
  // Segment fill direction confirmed against the real Figma node (94:1772),
  // not assumed: available segments render left-to-right first, spent
  // segments fill in from the right — the opposite of the Hit Dice pip
  // convention (spent-left/available-right) built in an earlier session.
  // Deliberately not made consistent with that — this matches what the
  // actual design shows for this specific component, not a generic pip.
  function limitedUseCardHtml(feature, spent, max) {
    if (max <= 0) {
      var unlockLevel = firstUnlockLevel(feature);
      return '<div class="cs-limuse-card">'
        + '<div class="cs-limuse-header">'
          + '<span class="cs-limuse-name">' + escHtml(feature.name) + '</span>'
        + '</div>'
        + '<div class="cs-limuse-locked">' + (unlockLevel ? 'Unlocks at level ' + unlockLevel + '.' : 'Not available.') + '</div>'
      + '</div>';
    }
    var segments = [];
    for (var i = 0; i < max; i++) {
      var isSpent = i >= (max - spent);
      segments.push('<button class="cs-limuse-seg' + (isSpent ? ' spent' : ' active') + '" onclick="toggleLimitedUse(\'' + escHtml(feature.name).replace(/'/g, "\\'") + '\', ' + i + ')">'
        + (isSpent ? '<span class="cs-limuse-seg-label">Spent</span>' : '<span class="cs-limuse-seg-num">' + (i + 1) + '</span>')
        + '</button>');
    }
    return '<div class="cs-limuse-card">'
      + '<div class="cs-limuse-header">'
        + '<span class="cs-limuse-name">' + escHtml(feature.name) + '</span>'
        + '<span class="cs-limuse-count">Used: ' + spent + '/' + max + '</span>'
      + '</div>'
      + '<div class="cs-limuse-bar">' + segments.join('') + '</div>'
    + '</div>';
  }
  // Refreshes card content only — assumes the group shell (#cs-class-specific
  // and its "Class-Specific" label) already exists. Called both right after
  // renderClassFeaturesAccordion() builds that shell (CLASS_ROW loaded,
  // SHEET likely still null — renders a safe "0 spent" default) and again
  // from renderLivePlay() once SHEET is guaranteed loaded, for the real
  // spent counts — same two-pass pattern every SHEET-dependent Class tab
  // card in this series has used.
  function renderLimitedUseFeatures() {
    var container = document.getElementById('cs-class-specific');
    if (!container) return;
    var features = (CLASS_ROW && Array.isArray(CLASS_ROW.limited_use_features)) ? CLASS_ROW.limited_use_features : [];
    if (!features.length) return;
    var chLevel = (CH && CH.level) || 1;
    var spentMap = (SHEET && typeof SHEET.limited_use_spent === 'object' && SHEET.limited_use_spent) ? SHEET.limited_use_spent : {};
    container.innerHTML = features.map(function(f) {
      var max = computeLimitedUseMax(f, chLevel);
      var spent = parseInt(spentMap[f.name]) || 0;
      if (spent > max) spent = max;
      return limitedUseCardHtml(f, spent, max);
    }).join('');
  }
  // Click convention: clicking segment N sets spent to (max - N) — since
  // available fills left, spent fills right, segment index 0 is the
  // leftmost (highest-priority-available) slot. Clicking the currently-
  // first-spent segment un-spends it, mirroring the Death Saves/Hit Dice
  // "click the boundary segment to toggle" interaction exactly, just
  // mapped through the reversed fill direction this component uses.
  function toggleLimitedUse(name, segIdx) {
    if (!SHEET) return;
    var spentMap = (typeof SHEET.limited_use_spent === 'object' && SHEET.limited_use_spent) ? Object.assign({}, SHEET.limited_use_spent) : {};
    var cur = parseInt(spentMap[name]) || 0;
    var features = (CLASS_ROW && Array.isArray(CLASS_ROW.limited_use_features)) ? CLASS_ROW.limited_use_features : [];
    var feature = features.find(function(f){ return f.name === name; });
    if (!feature) return;
    var max = computeLimitedUseMax(feature, (CH && CH.level) || 1);
    var next = (cur === (max - segIdx)) ? (max - segIdx) - 1 : (max - segIdx);
    if (next < 0) next = 0;
    if (next > max) next = max;
    spentMap[name] = next;
    SHEET.limited_use_spent = spentMap;
    saveSheet({ limited_use_spent: spentMap });
    renderLimitedUseFeatures();
  }
  // Builds (or clears) the "Features" accordion shell into the always-
  // present #cs-class-features-acc-wrap anchor. Only emits the accordion
  // at all once CLASS_ROW confirms there's real content — per the DM's
  // explicit call, no hideIfEmpty flag added to accordionShell() itself,
  // this function just skips emitting the markup instead. Re-evaluated
  // every time it's called (not just once), so it also correctly clears
  // itself back out if a reload ever finds zero features where there used
  // to be some.
  // Handoff B folded Spell Slots + Spells Prepared into this same accordion
  // as sibling groups to Class-Specific, per the real Figma (52:2705) —
  // shown whenever the class has EITHER limited-use features OR any spell
  // slot progression (a caster), not just the former as before.
  // Round 1 Fix 3 — visibility gates corrected against the real 2024 rules,
  // not assumed. Investigating this surfaced that the underlying data (not
  // just the render logic) was wrong: Ranger/Paladin actually gain their
  // Spellcasting feature — and their first spell slots — at LEVEL 1 in the
  // 2024 PHB (a genuine, documented rules change from 2014, where it was
  // level 2), and Handoff B had mistakenly built the old 2014-shaped table.
  // That's now fixed at the data layer (see the Decision Log entry), which
  // means the QA screenshot's "hide these, a level-1 Ranger has nothing" is
  // the wrong fix for the wrong cause — a level-1 Ranger genuinely has 2
  // real spell slots and can prepare 2 real spells, so hiding the cards
  // would hide correct, working functionality. The real gate:
  // - hasCasting (spellcasting_ability set) — governs the Spells Prepared
  //   group AND the Spells Learned card. A true non-caster (Fighter/Rogue/
  //   Monk/Barbarian) has neither.
  // - hasSlotsThisLevel — governs the Spell Slots group specifically.
  //   Doesn't diverge from hasCasting for any of the 8 real casting classes
  //   at any level 1-20 once the data fix above landed (verified via the
  //   same raw table pull), but kept as its own check rather than collapsed
  //   into hasCasting — a future homebrew class with a real casting-but-no-
  //   slots-yet level shouldn't need this logic re-derived from scratch.
  function renderClassFeaturesAccordion() {
    var wrap = document.getElementById('cs-class-features-acc-wrap');
    if (!wrap) return;
    var features = (CLASS_ROW && Array.isArray(CLASS_ROW.limited_use_features)) ? CLASS_ROW.limited_use_features : [];
    var hasLimitedUse = features.length > 0;
    var hasCasting = !!(CLASS_ROW && CLASS_ROW.spellcasting_ability);
    var slotsArr = hasCasting ? computeSpellSlotsArray() : null;
    var hasSlotsThisLevel = !!(slotsArr && slotsArr.some(function(n){ return (parseInt(n) || 0) > 0; }));
    if (!hasLimitedUse && !hasCasting) { wrap.innerHTML = ''; return; }
    if (!document.getElementById('cs-class-features-acc')) {
      wrap.innerHTML = '<div class="cs-ov-acc" id="cs-class-features-acc">'
        + '<button class="cs-ov-acc-header" type="button" onclick="toggleSheetAccordion(\'cs-class-features-acc\')">'
          + '<span class="cs-ov-acc-title">Features</span>'
          + '<span class="cs-ov-acc-toggle"><span class="cs-ov-acc-toggle-label">Collapse</span><span class="cs-ov-acc-chevron">&#9662;</span></span>'
        + '</button>'
        + '<div class="cs-ov-acc-body-outer"><div class="cs-ov-acc-body cs-ov-acc-body--tight">'
          + (hasLimitedUse ? '<div class="cs-limuse-group">'
              + '<div class="cs-limuse-group-label">Class-Specific</div>'
              + '<div id="cs-class-specific"></div>'
            + '</div>' : '')
          + (hasSlotsThisLevel ? '<div class="cs-limuse-group">'
              + '<div class="cs-limuse-group-label">Spell Slots</div>'
              + '<div class="cs-spellslot-explainer">Spell slots represent a caster&#8217;s limited daily magical energy.'
                + '<ul><li><strong>Casting:</strong> To cast a spell, you must expend a slot of the spell&#8217;s level or higher.</li>'
                + '<li><strong>Recovery:</strong> All expended spell slots are restored after finishing a Long Rest.</li></ul>'
              + '</div>'
              + '<div id="cs-spellslot-cards"></div>'
            + '</div>' : '')
          + (hasCasting ? '<div class="cs-limuse-group">'
              + '<div class="cs-prepared-header-row"><span class="cs-limuse-group-label">Spells Prepared</span><span class="cs-prepared-count" id="cs-prepared-count"></span></div>'
              + '<div class="cs-prepared-explainer" id="cs-prepared-explainer"></div>'
              + '<div class="cs-prepared-pills" id="cs-prepared-pills"></div>'
            + '</div>' : '')
          // Round 3 QA: relocated here from a standalone .cs-ov-class-card
          // that used to sit above this whole accordion — directly below
          // Spells Prepared per the DM's explicit placement ask, same
          // hasCasting gate the Prepared group above it already uses (a
          // non-caster has neither).
          + (hasCasting ? '<div class="cs-limuse-group">'
              + '<div class="cs-limuse-group-label">Spellcasting</div>'
              + '<div id="cs-class-spellcasting-stats"></div>'
