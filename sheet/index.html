<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Anavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">

  <style>
    /* ── CSS Variables (mirrors character.css :root exactly) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


    /* ── Page Shell ── */
    body {
      background:
        linear-gradient(rgba(3,4,12,0.88), rgba(3,4,12,0.88)),
        url('../assets/images/regions/img-caparia-landscape.webp') center/cover fixed;
      color: var(--parchment);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav Bar ── */
    .cs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 15, 0.92);
      border-bottom: 1px solid rgba(200,148,10,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .cs-nav-title {
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .cs-nav-title:hover { opacity: 0.85; }
    .cs-nav-logo {
      height: 22px;
      width: auto;
      display: block;
    }
    .cs-nav-back {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    .cs-nav-back:hover { opacity: 1; color: var(--gold); }

    /* ── Main content wrapper ── */
    .cs-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Section headers ── */
    .cs-section {
      margin-bottom: 1.75rem;
    }
    .cs-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--char-highlight-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-section-label::before {
      content: '✦';
      font-size: 0.55rem;
      opacity: 0.6;
    }

    /* ── Appearance block ── */
    .cs-appearance-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      padding: 1.25rem 1.5rem;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: var(--char-text-muted);
      line-height: 1.8;
      font-style: italic;
    }
    .cs-appearance-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1rem;
    }
    .cs-chip {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--char-text-faint);
      background: var(--char-accent-tint);
    }
    .cs-chip-label {
      color: rgba(200,148,10,0.7);
      font-weight: 700;
      margin-right: 0.3rem;
    }

    /* ── Story panel ── */
    .cs-story-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      overflow: hidden;
    }
    .cs-story-row {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .cs-story-row:last-child { border-bottom: none; }
    .cs-story-key {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      padding-top: 0.05rem;
      line-height: 1.4;
    }
    .cs-story-val {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--char-text-muted);
      line-height: 1.7;
    }
    .cs-story-val em {
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ── Gear list ── */
    .cs-gear-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .cs-gear-item {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-gear-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* ── Gold display ── */
    .cs-gold-block {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--char-highlight-tint);
      border: 1px solid var(--char-highlight-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
    }
    .cs-gold-icon {
      font-size: 1.4rem;
      color: var(--gold-light);
      flex-shrink: 0;
    }
    .cs-gold-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--gold-light);
      line-height: 1;
    }
    .cs-gold-label {
      font-family: var(--font-sans);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.6);
      font-weight: 700;
      margin-top: 0.15rem;
    }

    /* ══════════════════════════════════════════════════════════════
       OVERVIEW + ABILITY SCORES (redesign)
       Figma P0tcVgf02XeI13Tz0TtRaX — desktop 36:310 / mobile 36:435
       Breaks out of .cs-wrap's 820px cap — this is the one part of
       the sheet wide enough to need it (portrait card + 3 overview
       cards side by side). Rest of the page stays at 820px.
       ══════════════════════════════════════════════════════════════ */
    .cs-ov-breakout {
      width: 100vw;
      position: relative;
      left: 50%;
      margin-left: -50vw;
      margin-bottom: 2rem;
    }
    .cs-ov-inner {
      max-width: 1560px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Portrait / money / weight card ── */
    .cs-ov-maininfo {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-m);
      align-items: flex-start;
    }
    .cs-ov-portrait {
      position: relative;
      width: 358px;
      min-height: 420px;
      flex-shrink: 0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      background: var(--surface-2);
    }
    .cs-ov-portrait-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    .cs-ov-portrait-upload-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 3;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(10,14,24,0.88);
      color: white;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .cs-ov-portrait-upload-btn:hover { background: rgba(200,148,10,0.35); border-color: rgba(200,148,10,0.6); }
    .cs-ov-money-row {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 10px;
      padding: 0 8px;
    }
    .cs-ov-money-cell {
      flex: 1 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: var(--radius-sm);
    }
    .cs-ov-money-cell--copper { background: var(--currency-copper); }
    .cs-ov-money-cell--silver { background: var(--currency-silver); }
    .cs-ov-money-cell--gold   { background: var(--currency-gold-coin); }
    .cs-ov-money-label {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 900;
      color: var(--blue-800, var(--surface-0));
      text-align: center;
    }
    .cs-ov-money-cell--copper .cs-ov-money-label { color: var(--text); }
    .cs-ov-money-input {
      width: 100%;
      height: 19px;
      border: 1px solid #000;
      border-radius: 3px;
      background: #fff;
      color: var(--surface-0);
      font-family: var(--font-body);
      font-size: 0.82rem;
      text-align: center;
      padding: 0;
    }
    .cs-ov-money-input::-webkit-outer-spin-button,
    .cs-ov-money-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cs-ov-weight {
      position: relative;
      z-index: 2;
      height: 32px;
      background: var(--blue-200);
    }
    .cs-ov-weight-fill {
      height: 100%;
      background: var(--surface-4);
      transition: width 0.25s ease;
    }
    .cs-ov-weight-fill.encumbered { background: var(--red-strong); }
    .cs-ov-weight-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
    }
    .cs-ov-weight-icon { font-size: 0.85rem; }

    /* ── Name / pills / blurb / accordions ── */
    .cs-ov-info {
      flex: 1 1 358px;
      min-width: 358px;
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-main {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cs-ov-name {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 4.5vw, 4rem);
      line-height: 1.05;
      color: var(--text);
    }
    .cs-ov-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cs-ov-pill {
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50px;
      padding: 8px 14px;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-pill strong { font-weight: 900; }
    .cs-ov-blurb {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      line-height: var(--line-height);
      color: var(--text);
    }

    /* ── Accordion shell (Overview / Ability Scores) ── */
    .cs-ov-acc { width: 100%; }
    .cs-ov-acc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 0 var(--char-ov-gap-2xs);
      gap: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-title {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      color: var(--text);
      text-align: left;
    }
    .cs-ov-acc-toggle {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-toggle-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .cs-ov-acc-chevron {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      color: var(--surface-0);
      font-size: 0.8rem;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .cs-ov-acc-body {
      padding-bottom: var(--char-ov-gap-2xs);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-acc.collapsed .cs-ov-acc-body { display: none; }
    .cs-ov-acc.collapsed .cs-ov-acc-chevron { transform: rotate(180deg); }

    /* ── Overview cards (alignment / background / gigglegloom) ── */
    .cs-ov-cards {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-card {
      flex: 1 0 0;
      min-width: 300px;
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-xs);
      background: var(--blue-700);
      border-radius: 0 24px 24px 0;
      padding-right: 16px;
      overflow: hidden;
    }
    .cs-ov-card-img {
      width: 75px; height: 75px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ov-card-icon-wrap {
      width: 75px; height: 75px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .cs-ov-card-icon {
      width: 40px; height: 40px;
      filter: drop-shadow(0 0 14px currentColor);
    }
    .cs-ov-card-txt {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .cs-ov-card-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-card-title {
      font-family: var(--font-display);
      font-size: var(--char-ov-h4);
      color: var(--text);
    }
    .cs-ov-card-sub {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--text);
    }

    /* ── Class card ── */
    .cs-ov-class-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-class-basic {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-s);
    }
    .cs-ov-class-img {
      width: 56px; height: 56px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .cs-ov-class-txt { flex: 1 0 0; min-width: 0; }
    .cs-ov-class-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-class-name {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-level {
      flex-shrink: 0;
      background: var(--surface-0);
      border-radius: 8px;
      padding: var(--char-ov-gap-2xs);
      text-align: center;
    }
    .cs-ov-class-level-label {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.72rem;
      color: var(--gold);
    }
    .cs-ov-class-level-val {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-details {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-class-detail {
      flex: 1 0 0;
      min-width: 240px;
      display: flex;
      gap: 10px;
    }
    .cs-ov-class-detail-keys {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      flex-shrink: 0;
    }
    .cs-ov-class-detail-keys p, .cs-ov-class-detail-vals p { line-height: 24px; margin: 0; }
    .cs-ov-class-detail-vals {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      color: var(--text);
      min-width: 0;
    }

    /* ── Narrative summary card (generateSummary() output, read-only) ── */
    .cs-ov-summary-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-summary-heading {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 1.4em 0 0.4em;
    }
    .cs-ov-summary-heading:first-child { margin-top: 0; }
    .cs-ov-summary-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.94rem;
      line-height: var(--line-height);
      color: var(--text);
      margin: 0;
    }

    /* ── Ability score cards ── */
    .cs-ab-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      width: 100%;
    }
    .cs-ab-card {
      flex: 1 0 0;
      min-width: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--char-ov-gap-xs) 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(to bottom, var(--blue-700), var(--ab-gradient));
      box-shadow: 2px 5px 11px 0 var(--ab-glow), 0 0 120px 0 var(--ab-glow);
    }
    .cs-ab-card--str { --ab-glow: var(--ability-str-glow); --ab-gradient: var(--ability-str-gradient); }
    .cs-ab-card--dex { --ab-glow: var(--ability-dex-glow); --ab-gradient: var(--ability-dex-gradient); }
    .cs-ab-card--con { --ab-glow: var(--ability-con-glow); --ab-gradient: var(--ability-con-gradient); }
    .cs-ab-card--int { --ab-glow: var(--ability-int-glow); --ab-gradient: var(--ability-int-gradient); }
    .cs-ab-card--wis { --ab-glow: var(--ability-wis-glow); --ab-gradient: var(--ability-wis-gradient); }
    .cs-ab-card--cha { --ab-glow: var(--ability-cha-glow); --ab-gradient: var(--ability-cha-gradient); }
    .cs-ab-img {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ab-txt {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--char-ov-gap-2xs) 0;
      text-align: center;
    }
    .cs-ab-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1.1rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ab-val {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ab-mod {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-ab-mod-num { font-weight: 700; }
    .cs-ab-mod-num.positive { color: var(--green); }
    .cs-ab-mod-num.negative { color: var(--red); }
    .cs-feat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: var(--char-ov-gap-m);
    }
    .cs-feat-chip {
      background: var(--char-card-bg-subtle);
      border: 1px solid var(--char-highlight-border);
      border-radius: var(--char-radius);
      padding: 0.5rem 0.85rem;
      max-width: 320px;
    }
    .cs-feat-chip-name {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }
    .cs-feat-chip-desc {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-muted);
      line-height: 1.5;
      margin-top: 0.2rem;
    }

    @media (max-width: 900px) {
      .cs-ov-portrait { width: 100%; min-height: 340px; }
      .cs-ov-info { min-width: 100%; }
    }
    @media (max-width: 600px) {
      .cs-ov-card { min-width: 100%; }
      .cs-ab-cards { gap: 12px; }
      .cs-ab-card { min-width: 84px; }
      .cs-ab-img { width: 72px; height: 72px; }
      .cs-ov-class-details { gap: 1rem; }
      /* Single unbreakable words ("Overview") can't shrink to share a row
         with the toggle at 48px — wrap the toggle onto its own line rather
         than letting it overflow past the viewport edge. */
      .cs-ov-acc-header { flex-wrap: wrap; row-gap: 0.4rem; }
      .cs-ov-acc-title { font-size: 2.25rem; }
    }

    /* ── Not-found state ── */
    .cs-not-found {
      text-align: center;
      padding: 6rem 2rem;
    }

  var ALIGNMENT_TRAIT_SENTENCE = {
    brightward:  'They are Protective — they believe the world is worth protecting, and they intend to be someone others can count on.',
    colorful:    'They are Freespirited — they want to do right by people, they\'ve just never been good at following someone else\'s idea of how.',
    greywarden:  'They are Measured — they see all sides, weigh things carefully, and don\'t think the world divides neatly into light and dark.',
    steelbound:  'They are Disciplined — they do what they said they would do. They consider this uncomplicated.',
    ashwalker:   'They are Pragmatic — they do what works for them, and they try to be honest about that.'
  };
  // Gigglegloom-flavor class name (e.g. wizard → "The Learned") used in the
  // Overview blurb — matches GIGGLEGLOOM_TYPES[*].classes[*].name in character.js.
  var CLASS_FLAVOR_NAME = {
    druid:'The Verdant', cleric:'The Faithful', paladin:'The Warden',
    ranger:'The Wanderer', rogue:'The Nimble', bard:'The Reveler',
    fighter:'The Tested', monk:'The Still', wizard:'The Learned',
    sorcerer:'The Sparked', warlock:'The Bound', barbarian:'The Furious'
  };
  var LANGUAGE_LABELS = {
    'caparian-deep':'Caparian Deep', 'conclave-script':'Conclave Script',
    'jugabi-canopy':'Jugabi Canopy', 'nombi-frost':'Nombi Frost',
    'pre-partition':'Pre-Partition Script', 'sohot-old':'Sohot Old Tongue'
  };

  // ── Helpers ───────────────────────────────────────────────────────
  function cap(str) { if (!str) return '—'; return str.charAt(0).toUpperCase() + str.slice(1); }
  function label(map, key) { if (!key) return '—'; return map[key] || cap((key+'').replace(/-/g,' ')); }
  function abMod(v) { var m = Math.floor((v-10)/2); return (m>=0?'+':'')+m; }
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getToken() {
    return new URLSearchParams(window.location.search).get('token') || '';
  }

  function showToast(msg, isError) {
    var t = document.getElementById('cs-toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'cs-toast' + (isError ? ' error' : '');
    void t.offsetWidth;
    t.classList.add('visible');
    setTimeout(function() { t.classList.remove('visible'); }, 3000);
  }

  // ── Appearance helpers ────────────────────────────────────────────
  function buildAppearanceDesc(app) {
    if (!app) return null;
    var parts = [];
    if (app.height && app.build) parts.push(cap(app.height) + ', ' + app.build + ' build.');
    else if (app.height) parts.push(cap(app.height) + '.');
    if (app.age) parts.push(cap(app.age) + '.');
    var face = [];
    if (app.face_shape) face.push(app.face_shape + ' face');
    // app-skin-tone is an <input type="color"> (character.html) — always a
    // hex value, never a word. Omit rather than print "#ffba66 skin".
    if (app.skin_tone && app.skin_tone.charAt(0) !== '#') face.push(app.skin_tone + ' skin');
    if (face.length) parts.push(cap(face.join(', ')) + '.');
    var eyes = [];
    if (app.eye_color) eyes.push(app.eye_color);
    if (app.eye_shape) eyes.push(app.eye_shape);
    if (eyes.length) parts.push(cap(eyes.join(', ')) + ' eyes.');
    var hair = [];
    if (app.hair_color) hair.push(app.hair_color);
    if (app.hair_style) hair.push(app.hair_style + ' hair');
    if (hair.length) parts.push(cap(hair.join(', ')) + '.');
    if (app.facial_hair && app.facial_hair !== 'none') parts.push(cap(app.facial_hair) + '.');
    if (Array.isArray(app.facial_markings) && app.facial_markings.length) {
      parts.push('Markings: ' + app.facial_markings.join(', ') + '.');
    }
    return parts.join(' ') || null;
  }

  function buildGearList(app) {
    if (!app) return [];
    var slotLabels = {
      cloak:'Cloak', top:'Top', lower:'Lower', shoes:'Shoes', hat:'Hat',
      hand_right:'Right Hand', hand_left:'Left Hand',
      ring_right:'Ring (R)', ring_left:'Ring (L)',
      necklace:'Necklace', earrings:'Earrings'
    };
    return Object.keys(slotLabels).filter(function(k) {
      return app[k] && app[k] !== 'none' && app[k] !== '';
    }).map(function(k) {
      return { slot: slotLabels[k], val: cap((app[k]||'').replace(/-/g,' ')) };
    });
  }

  // ── Not-found template ────────────────────────────────────────────
  function renderNotFound(title, body) {
    return '<div class="cs-not-found">'
      + '<div class="cs-not-found-glyph">✦</div>'
      + '<div class="cs-not-found-title">' + title + '</div>'
      + '<div class="cs-not-found-body">' + body + '</div>'
      + '<a class="cs-not-found-link" href="../index.html">← Return to Anavale Wiki</a>'
      + '</div>';
  }

  // ── Render static character data (from player_characters) ─────────
  function renderCharacter(ch) {
    var main = document.getElementById('cs-main');

    var typeKey     = (ch.class_gigglegloom || '').toLowerCase();
    var typeMeta    = TYPE_META[typeKey] || { name: cap(typeKey), color:'#c8940a', glow:'200,148,10', element:'', desc:'' };
    var regionKey   = (ch.home_region || '').toLowerCase();
    var regionLabel = REGION_LABELS[regionKey] || cap(ch.home_region || '');
    var scores      = (typeof ch.ability_scores === 'object' && ch.ability_scores) ? ch.ability_scores : {};
    ABILITY_SCORES  = scores;
    var app         = (typeof ch.appearance_data === 'object' && ch.appearance_data) ? ch.appearance_data : {};
    var gender      = ch.gender || 'm';
    var portraitSuffix = gender === 'female' ? 'f' : gender === 'non-binary' ? 'nb' : 'm';
    var portraitSrc = ch.species ? '../assets/images/species/sp-' + ch.species + '-' + portraitSuffix + '.png' : '';

    var classDisplay   = cap((ch.class_id      || '').replace(/-/g,' '));
    var speciesDisplay = cap((ch.species        || '').replace(/-/g,' '));
    var bgDisplay      = cap((ch.background_id  || '').replace(/-/g,' '));

    var appearanceDesc = ch.appearance_prompt || buildAppearanceDesc(app) || null;
    var gearList       = buildGearList(app);

    var overviewHtml = buildOverviewHtml(ch, scores, app, typeKey, typeMeta, regionLabel, speciesDisplay, classDisplay, bgDisplay, portraitSrc);
    var abilityScoresHtml = buildAbilityScoresHtml(scores, ch.feats);

    // Proficient skills — chosen from the class's skill list at Stage 2,
    // stored on player_characters.skills.
    var skillsArr = Array.isArray(ch.skills) ? ch.skills : [];
    var skillsVal = skillsArr.length ? skillsArr.join(', ') : '—';

    // Skill bonuses — flat +1 modifiers from the imagined-past answers (not
    // full proficiency), computed once at submission by buildCharacterEntry().
    var skillBonusesArr = Array.isArray(ch.skill_bonuses) ? ch.skill_bonuses : [];
    var skillBonusesVal = skillBonusesArr.length
      ? skillBonusesArr.map(function(b) { return '+' + b.amount + ' ' + b.skill; }).join(', ')
      : '—';

    // Story rows
    var storyRows = [
      { k:'Who raised you',  v: label(RAISED_LABELS, ch.who_raised_you) },
      { k:'Dearest friend',  v: ch.dearest_friend || '—' },
      { k:'Had a pet',       v: label(PET_LABELS, ch.had_pet) },
      { k:'Fallen in love',  v: label(LOVE_LABELS, ch.fallen_in_love) },
      { k:'Organization',    v: label(ORG_LABELS, ch.organization_joined) },
      { k:'Left behind',     v: label(LEFT_BEHIND_LABELS, ch.left_behind) },
      { k:'Why you left',    v: label(WHY_LEFT_LABELS, ch.why_you_left) },
      { k:'Cares about',     v: ch.cares_about || '—' },
      { k:'Deepest fear',    v: ch.deepest_fear || '—' },
      { k:'What you seek',   v: ch.seeking || '—' },
      { k:'Proficient skills', v: skillsVal },
      { k:'Bonus skills',    v: skillBonusesVal }
    ];
    var storyHtml = storyRows.filter(function(r) { return r.v && r.v !== '—'; })
      .map(function(r) {
        return '<div class="cs-story-row"><div class="cs-story-key">' + r.k + '</div>'
          + '<div class="cs-story-val">' + r.v + '</div></div>';
      }).join('');

    // Gear HTML
    var gearHtml = gearList.length
      ? gearList.map(function(g) {
          return '<div class="cs-gear-item"><div class="cs-gear-dot"></div>'
            + '<span><span style="color:var(--char-text-faint);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;">'
            + g.slot + '</span>  ' + g.val + '</span></div>';
        }).join('')
      : '<div class="cs-gear-item"><div class="cs-gear-dot"></div><em style="color:var(--char-text-faint);">Starting gear to be determined</em></div>';

    // DM-add items promised by an organization answer (e.g. "Wanderkeep
    // Field Kit") — never auto-granted. The DM clears each entry once
    // handed over (sccMarkPendingItemAdded() in dm.html's SCC player bar).
    var pendingItemsArr = Array.isArray(ch.dm_pending_items) ? ch.dm_pending_items : [];
    var pendingItemsHtml = pendingItemsArr.map(function(item) {
      return '<div class="cs-gear-item"><div class="cs-gear-dot"></div>'
        + '<span>' + (item.label || 'Item') + ' <em style="color:var(--char-text-faint);">— ask your DM</em></span></div>';
    }).join('');

    // Appearance chips
    var chipSlots = ['height','build','age','skin_tone','face_shape','eye_color','eye_shape','hair_color','hair_style'];
    var chipsHtml = chipSlots.filter(function(k) { return app[k]; }).map(function(k) {
      return '<span class="cs-chip"><span class="cs-chip-label">' + k.replace(/_/g,' ') + '</span>'
        + cap((app[k]||'').replace(/-/g,' ')) + '</span>';
    }).join('');

    // Assemble
    main.innerHTML =
      // Overview (portrait/money/weight + name/pills/blurb + alignment/
      // background/gigglegloom/class cards) + Ability Scores — redesign,
      // see buildOverviewHtml()/buildAbilityScoresHtml() below.
      overviewHtml
      + abilityScoresHtml

      // Appearance
      + (appearanceDesc || chipsHtml ? (
          '<div class="cs-section"><div class="cs-section-label">Appearance</div>'
          + (appearanceDesc ? '<div class="cs-appearance-block">' + appearanceDesc + '</div>' : '')
          + (chipsHtml ? '<div class="cs-appearance-chips">' + chipsHtml + '</div>' : '')
          + '</div>'
        ) : '')

      // Starting gear
      + '<div class="cs-section"><div class="cs-section-label">Starting Gear</div>'
        + '<div class="cs-gear-grid">' + gearHtml + '</div></div>'

      // Pending from your DM — only shown once there's something to show
      + (pendingItemsArr.length ? (
          '<div class="cs-section"><div class="cs-section-label">Pending From Your DM</div>'
          + '<div class="cs-gear-grid">' + pendingItemsHtml + '</div></div>'
        ) : '')

      // Story
      + (storyHtml ? (
          '<div class="cs-section"><div class="cs-section-label">Your Past</div>'
          + '<div class="cs-story-block">' + storyHtml + '</div></div>'
        ) : '')

      + '<div class="cs-divider"><span class="cs-divider-glyph">✦ · ✦</span></div>'

      // ── Live-play sections (populated by renderLivePlay) ──────────

      // HP
      + '<div class="cs-section" id="cs-hp-section">'
        + '<div class="cs-section-label">Hit Points</div>'
        + '<div class="cs-hp-block" id="cs-hp-block"></div>'
      + '</div>'

      // Gold
      + '<div class="cs-section" id="cs-gold-section">'
        + '<div class="cs-section-label">Gold</div>'
        + '<div id="cs-gold-block"></div>'
      + '</div>'

      // Equipped
      + '<div class="cs-section cs-equipped-section" id="cs-equipped-section">'
        + '<div class="cs-section-label">Equipped</div>'
        + '<div id="cs-equipped-block"></div>'
      + '</div>'

      // Inventory
      + '<div class="cs-section">'
        + '<div class="cs-section-label">Inventory</div>'
        + '<div class="cs-inv-weight-total" id="cs-inv-weight-total">Carrying: 0 lb</div>'
        + '<div class="cs-inv-search-wrap">'
          + '<div class="cs-inv-search-row">'
            + '<input class="cs-inv-input" id="cs-inv-search-input" placeholder="Search items…" autocomplete="off" oninput="onInventorySearchInput()">'
            + '<select class="cs-inv-cat-select" id="cs-inv-cat-select" onchange="onInventorySearchInput()">'
              + '<option value="">All</option>'
              + '<option value="accessory">Accessory</option>'
              + '<option value="armor">Armor</option>'
              + '<option value="consumable">Consumable</option>'
              + '<option value="shield">Shield</option>'
              + '<option value="tool">Tool</option>'
              + '<option value="weapon">Weapon</option>'
            + '</select>'
          + '</div>'
          + '<div class="cs-inv-search-dropdown" id="cs-inv-search-results"></div>'
        + '</div>'
        + '<button class="cs-inv-custom-btn" onclick="openCustomItemModal()">+ Can\'t find it? Add a custom item</button>'
        + '<div class="cs-inv-list" id="cs-inv-list"><div class="cs-inv-empty">Loading inventory…</div></div>'
      + '</div>'

      // Notes
      + '<div class="cs-section">'
        + '<div class="cs-section-label">Notes</div>'
        + '<div class="cs-notes-tabs" id="cs-notes-tabs"></div>'
        + '<div class="cs-notes-search-wrap">'
          + '<span class="cs-notes-search-icon">🔍</span>'
          + '<input class="cs-notes-search" id="cs-notes-search" type="text" placeholder="Search all notes…" oninput="onNotesSearchInput(this)">'
        + '</div>'
        + '<div class="cs-notes-search-results" id="cs-notes-search-results"></div>'
        + '<div class="cs-notes-list" id="cs-notes-list"></div>'
        + '<button class="cs-notes-add-btn" onclick="addNote()">＋ New note</button>'
      + '</div>'

      // Photo input — hidden, triggered from the portrait card's Replace button
      + '<input class="cs-photo-input" type="file" id="cs-photo-input" accept="image/*" onchange="uploadPhoto(this)">'

      + '<div class="cs-divider"><span class="cs-divider-glyph">✦ · ✦</span></div>';

    // Footer + title
    document.getElementById('cs-footer').textContent = '✦ · Anavale · ' + (ch.name||'') + ' · Level ' + (ch.level||1) + ' · ✦';
    document.title = (ch.name||'Character') + ' — Anavale';
  }

  // ── Overview + Ability Scores (redesign) ───────────────────────────
  function buildAbilityScoresHtml(scores, feats) {
    var AB_KEYS  = ['str','dex','con','int','wis','cha'];
    var AB_NAMES = { str:'STR', dex:'DEX', con:'CON', int:'INT', wis:'WIS', cha:'CHA' };
    var cards = AB_KEYS.map(function(ab) {
      var raw    = parseInt(scores[ab]) || 0;
      var modNum = raw ? Math.floor((raw - 10) / 2) : 0;
      var modStr = raw ? (modNum >= 0 ? '+' : '') + modNum : '—';
      var modCls = modNum > 0 ? 'positive' : modNum < 0 ? 'negative' : '';
      return '<div class="cs-ab-card cs-ab-card--' + ab + '">'
        + '<img class="cs-ab-img" src="../assets/images/character-sheet/ability-scores/ability-' + ab + '.png" alt="">'
        + '<div class="cs-ab-txt">'
          + '<div class="cs-ab-label">' + AB_NAMES[ab] + '</div>'
          + '<div class="cs-ab-val">' + (raw || '—') + '</div>'
          + (raw ? '<div class="cs-ab-mod"><span class="cs-ab-mod-num ' + modCls + '">' + modStr + '</span> Modifier</div>' : '')
        + '</div>'
      + '</div>';
    }).join('');
    // Feats — granted by the chosen background (player_characters.feats),
    // e.g. "Tough", "Alert". FEAT_TIPS mirrors character.js's rules text.
    var featsArr = Array.isArray(feats) ? feats : [];
    var featsHtml = featsArr.length
      ? '<div class="cs-feat-list">' + featsArr.map(function(f) {
          return '<div class="cs-feat-chip"><span class="cs-feat-chip-name">' + f + '</span>'
            + (FEAT_TIPS[f] ? '<span class="cs-feat-chip-desc">' + FEAT_TIPS[f] + '</span>' : '')
          + '</div>';
        }).join('') + '</div>'
      : '';
    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ov-acc" id="cs-ov-acc-abilities">'
        + '<button class="cs-ov-acc-header" type="button" onclick="toggleSheetAccordion(\'cs-ov-acc-abilities\')">'
          + '<span class="cs-ov-acc-title">Ability Scores</span>'
          + '<span class="cs-ov-acc-toggle"><span class="cs-ov-acc-toggle-label">Collapse</span><span class="cs-ov-acc-chevron">&#9662;</span></span>'
        + '</button>'
        + '<div class="cs-ov-acc-body"><div class="cs-ab-cards">' + cards + '</div>' + featsHtml + '</div>'
      + '</div>'
    + '</div></div>';
  }

  function renderClassDetailsHtml(row) {
    var primary = row ? row.primary_ability   : null;
    var saves   = row ? row.saving_throws     : null;
    var casting = row ? row.casting_summary   : null;
    var armor   = row ? row.armor             : null;
    var tools   = row ? row.tools             : null;
    var weapons = row ? row.weapons           : null;
    return '<div class="cs-ov-class-detail">'
        + '<div class="cs-ov-class-detail-keys"><p>Primary ability:</p><p>Saving throws:</p><p>Casting Spells:</p></div>'
        + '<div class="cs-ov-class-detail-vals"><p>' + (primary || '—') + '</p><p>' + (saves || '—') + '</p><p>' + (casting || '—') + '</p></div>'
      + '</div>'
      + '<div class="cs-ov-class-detail">'
        + '<div class="cs-ov-class-detail-keys"><p>Armor:</p><p>Tools:</p><p>Weapons:</p></div>'
        + '<div class="cs-ov-class-detail-vals"><p>' + (armor || '—') + '</p><p>' + (tools || '—') + '</p><p>' + (weapons || '—') + '</p></div>'
      + '</div>';
  }

  // Populated once fetchClassData() resolves — the `classes` table is the
  // source for these mechanical fields (see docs/character-sheet-redesign-handoff.md §6).
  function renderClassCard() {
    var el = document.getElementById('cs-ov-class-details');
    if (!el) return;
    el.innerHTML = renderClassDetailsHtml(CLASS_ROW);
  }

  // Parses generateSummary()'s plain-text output ("LABEL\n\nparagraph" blocks
  // joined by "\n\n\n") back into headed paragraphs. Read-only — no editing
  // affordance, matches the rest of the Overview card visually.
  function buildSummaryCardHtml(summaryText) {
    if (!summaryText) return '';
    var sections = summaryText.split('\n\n\n').map(function(block) {
      var idx = block.indexOf('\n\n');
      if (idx === -1) return null;
      return { label: block.slice(0, idx).trim(), text: block.slice(idx + 2).trim() };
    }).filter(function(sec) { return sec && sec.label && sec.text; });
    if (!sections.length) return '';
    var body = sections.map(function(sec) {
      return '<div class="cs-ov-summary-heading">' + escHtml(sec.label) + '</div>'
        + '<p class="cs-ov-summary-text">' + escHtml(sec.text) + '</p>';
    }).join('');
    return '<div class="cs-ov-summary-card">' + body + '</div>';
  }

  function buildOverviewHtml(ch, scores, app, typeKey, typeMeta, regionLabel, speciesDisplay, classDisplay, bgDisplay, portraitSrc) {
    var alignKey = (ch.alignment || '').toLowerCase();
    var bgKey    = (ch.background_id || '').toLowerCase();
    var classKey = (ch.class_id || '').toLowerCase();
    var speciesKey = (ch.species || '').toLowerCase();

    // Pills — age category (§4: category, not a number), gender, species (+PHB
    // equivalent), home region, language. Only fields that exist are shown.
    var idBits = [];
    if (app.age) idBits.push(cap(app.age));
    if (ch.gender) idBits.push(cap(ch.gender));
    idBits.push(speciesDisplay + (SPECIES_PHB[speciesKey] ? ' (' + SPECIES_PHB[speciesKey] + ')' : ''));
    var pills = ['<span class="cs-ov-pill">' + idBits.join(', ') + '</span>'];
    if (regionLabel && regionLabel !== '—') pills.push('<span class="cs-ov-pill">from ' + regionLabel + '</span>');
    if (ch.language_extra) {
      var langLabel = LANGUAGE_LABELS[ch.language_extra] || cap((ch.language_extra + '').replace(/-/g, ' '));
      pills.push('<span class="cs-ov-pill">Speaks ' + langLabel + '</span>');
    }
    var pillsHtml = pills.join('');

    // Blurb — species + class's Gigglegloom-flavor name + type + region,
    // plus the alignment trait sentence. Sourced from the same lookups
    // character.js's (pre-rewrite) generateSummary() draws from, not invented.
    var blurbParts = [];
    var flavorName = CLASS_FLAVOR_NAME[classKey];
    if (speciesDisplay && flavorName && typeMeta.name) {
      blurbParts.push('A ' + speciesDisplay + ' ' + flavorName + ' who carries the ' + typeMeta.name
        + (regionLabel && regionLabel !== '—' ? ' — from ' + regionLabel + '.' : '.'));
    }
    if (ALIGNMENT_TRAIT_SENTENCE[alignKey]) blurbParts.push(ALIGNMENT_TRAIT_SENTENCE[alignKey]);
    var blurbHtml = blurbParts.length ? '<p class="cs-ov-blurb">' + blurbParts.join(' ') + '</p>' : '';

    // Overview cards — alignment / background / gigglegloom. No invented
    // flavor text: PHB-equivalent subtitles come from real lookups; a
    // background/alignment "archetype" subtitle (e.g. Figma's "(Gladiator)"
    // for the alignment card) doesn't exist in canon data and isn't built here.
    var alignName = ALIGNMENT_TRAIT_NAME[alignKey] || label(ALIGNMENT_LABELS, ch.alignment);
    var alignPhb  = ALIGNMENT_PHB[alignKey];
    var alignCard = '<div class="cs-ov-card">'
      + '<img class="cs-ov-card-img" src="../assets/images/img-alignment.webp" alt="">'
      + '<div class="cs-ov-card-txt">'
        + '<div class="cs-ov-card-label">Alignment</div>'
        + '<div class="cs-ov-card-title">' + alignName + '</div>'
        + (alignPhb ? '<div class="cs-ov-card-sub">(' + alignPhb + ')</div>' : '')
      + '</div></div>';

    var bgPhb = BG_PHB[bgKey];
    var bgCard = '<div class="cs-ov-card">'
      + '<img class="cs-ov-card-img" src="../assets/images/backgrounds/bg-' + (bgKey || 'default') + '.png" alt="" onerror="this.style.display=\'none\'">'
      + '<div class="cs-ov-card-txt">'
        + '<div class="cs-ov-card-label">Background</div>'
        + '<div class="cs-ov-card-title">' + bgDisplay + '</div>'
        + (bgPhb ? '<div class="cs-ov-card-sub">(' + bgPhb + ')</div>' : '')
      + '</div></div>';

    var ggColorVar = typeKey ? '--' + typeKey : null;
    var ggCard = '<div class="cs-ov-card">'
      + '<div class="cs-ov-card-icon-wrap" style="box-shadow:inset 0 0 40px 0 ' + (ggColorVar ? 'var(' + ggColorVar + ')' : typeMeta.color) + ';">'
        + (typeKey ? '<img class="cs-ov-card-icon" style="color:' + (ggColorVar ? 'var(' + ggColorVar + ')' : typeMeta.color) + ';" src="../assets/icons/icon-' + typeKey + '.svg" alt="">' : '')
      + '</div>'
      + '<div class="cs-ov-card-txt">'
        + '<div class="cs-ov-card-label">Gigglegloom</div>'
        + '<div class="cs-ov-card-title">' + typeMeta.name + '</div>'
      + '</div></div>';

    // Class card — basic info (image/name/level) is available immediately;
    // mechanical fields (primary ability, saves, casting, armor, tools,
    // weapons) come from the `classes` table via renderClassCard() once
    // fetchClassData() resolves (that table doesn't exist until §6/§7 lands).
    var classImgSrc = classKey ? '../assets/images/classes/class-' + classKey + '.webp' : '';
    var classCard = '<div class="cs-ov-class-card">'
      + '<div class="cs-ov-class-basic">'
        + (classImgSrc ? '<img class="cs-ov-class-img" src="' + classImgSrc + '" alt="" onerror="this.style.display=\'none\'">' : '')
        + '<div class="cs-ov-class-txt">'
          + '<div class="cs-ov-class-label">Class</div>'
          + '<div class="cs-ov-class-name">' + classDisplay + '</div>'
        + '</div>'
        + '<div class="cs-ov-class-level"><div class="cs-ov-class-level-label">Level</div><div class="cs-ov-class-level-val">' + (ch.level || 1) + '</div></div>'
      + '</div>'
      + '<div class="cs-ov-class-details" id="cs-ov-class-details">' + renderClassDetailsHtml(CLASS_ROW) + '</div>'
    + '</div>';

    // Narrative summary — generateSummary() (character.js) writes
    // player_characters.summary as plain text, "LABEL\n\nparagraph" blocks
    // joined by "\n\n\n". Read-only display; free-text player answers are
    // baked into this string, so it's HTML-escaped like any other field.
    var summaryCardHtml = buildSummaryCardHtml(ch.summary);

    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ov-maininfo">'
        + '<div class="cs-ov-portrait">'
          + '<img class="cs-ov-portrait-img" id="cs-hero-portrait-img" src="' + (portraitSrc || '') + '" alt="' + (ch.name || '') + ' portrait" onerror="this.style.display=\'none\'">'
          + '<button class="cs-ov-portrait-upload-btn" onclick="document.getElementById(\'cs-photo-input\').click()">Replace</button>'
          + '<div class="cs-ov-money-row">'
            + '<div class="cs-ov-money-cell cs-ov-money-cell--copper"><div class="cs-ov-money-label">Copper</div><input class="cs-ov-money-input" id="cs-ov-cp" type="number" min="0" inputmode="numeric" onblur="onOverviewMoneyChange()"></div>'
            + '<div class="cs-ov-money-cell cs-ov-money-cell--silver"><div class="cs-ov-money-label">Silver</div><input class="cs-ov-money-input" id="cs-ov-sp" type="number" min="0" inputmode="numeric" onblur="onOverviewMoneyChange()"></div>'
            + '<div class="cs-ov-money-cell cs-ov-money-cell--gold"><div class="cs-ov-money-label">Gold</div><input class="cs-ov-money-input" id="cs-ov-gp" type="number" min="0" inputmode="numeric" onblur="onOverviewMoneyChange()"></div>'
          + '</div>'
          + '<div class="cs-ov-weight" id="cs-ov-weight">'
            + '<div class="cs-ov-weight-fill" id="cs-ov-weight-fill" style="width:0%;"></div>'
            + '<div class="cs-ov-weight-label"><span class="cs-ov-weight-icon">&#9878;</span><span id="cs-ov-weight-nums">0 / 0 LBS</span></div>'
          + '</div>'
        + '</div>'
        + '<div class="cs-ov-info">'
          + '<div class="cs-ov-main">'
            + '<h1 class="cs-ov-name">' + (ch.name || 'Unknown') + '</h1>'
            + '<div class="cs-ov-pills">' + pillsHtml + '</div>'
            + blurbHtml
          + '</div>'
          + '<div class="cs-ov-acc" id="cs-ov-acc-overview">'
            + '<button class="cs-ov-acc-header" type="button" onclick="toggleSheetAccordion(\'cs-ov-acc-overview\')">'
              + '<span class="cs-ov-acc-title">Overview</span>'
              + '<span class="cs-ov-acc-toggle"><span class="cs-ov-acc-toggle-label">Collapse</span><span class="cs-ov-acc-chevron">&#9662;</span></span>'
            + '</button>'
            + '<div class="cs-ov-acc-body">'
              + '<div class="cs-ov-cards">' + alignCard + bgCard + ggCard + '</div>'
              + classCard
              + summaryCardHtml
            + '</div>'
          + '</div>'
        + '</div>'
      + '</div>'
    + '</div></div>';
  }

  function toggleSheetAccordion(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var collapsed = el.classList.toggle('collapsed');
    var labelEl = el.querySelector('.cs-ov-acc-toggle-label');
    if (labelEl) labelEl.textContent = collapsed ? 'Expand' : 'Collapse';
  }

  // ── Overview money (cp/sp/gp) — combines into / splits from the same
  // character_sheet.gold_cp field as the Gold section's setGold(), so both
  // editors and the character-creation HUD/Stage 3 panel stay in sync. ──
  function renderOverviewMoney() {
    var cp = SHEET ? (SHEET.gold_cp || 0) : 0;
    var gpEl = document.getElementById('cs-ov-gp');
    var spEl = document.getElementById('cs-ov-sp');
    var cpEl = document.getElementById('cs-ov-cp');
    if (gpEl) gpEl.value = Math.floor(cp / 100);
    if (spEl) spEl.value = Math.floor((cp % 100) / 10);
    if (cpEl) cpEl.value = cp % 10;
  }
  function onOverviewMoneyChange() {
    if (!SHEET) return;
    var gp = parseInt(document.getElementById('cs-ov-gp').value) || 0;
    var sp = parseInt(document.getElementById('cs-ov-sp').value) || 0;
    var cp = parseInt(document.getElementById('cs-ov-cp').value) || 0;
    SHEET.gold_cp = Math.max(0, (gp * 100) + (sp * 10) + cp);
    saveSheet({ gold_cp: SHEET.gold_cp });
    renderOverviewMoney();
    renderGold();
    showToast('Gold updated');
  }

  // ── Overview weight bar — capacity = STR × 15, current = full inventory
  // (equipped + carried), same sum cs-inv-weight-total already uses. ──
  function computeCarriedWeight() {
    return INVENTORY.reduce(function(sum, item) {
      var w = item.item_id ? (catalogWeightFor(item.item_id) || 0) : (parseFloat(item.weight_lb) || 0);
      return sum + (w * (parseInt(item.quantity) || 0));
    }, 0);
  }
  function renderOverviewWeight() {
    var fillEl = document.getElementById('cs-ov-weight-fill');
    var numsEl = document.getElementById('cs-ov-weight-nums');
    if (!fillEl || !numsEl) return;
    var strRaw   = parseInt(ABILITY_SCORES.str) || 10;
    var capacity = strRaw * 15;
    var carried  = Math.round(computeCarriedWeight() * 10) / 10;
    var pct = capacity > 0 ? Math.min((carried / capacity) * 100, 100) : 0;
    fillEl.style.width = pct + '%';
    fillEl.classList.toggle('encumbered', capacity > 0 && carried > capacity);
    numsEl.textContent = carried + ' / ' + capacity + ' LBS';
  }

  // ── Render live-play data (HP, gold, inventory, notes, photo) ─────
  function renderLivePlay() {
    renderHP();
    renderEquipped();
    renderGold();
    renderOverviewMoney();
    renderInventory();
    renderNotes();
    renderPhoto();
  }

  // ── HP ────────────────────────────────────────────────────────────
  function renderHP() {
    var block  = document.getElementById('cs-hp-block');
    if (!block) return;
    var hpCur     = SHEET ? SHEET.hp_current : '—';
    var hpMaxBase = SHEET ? SHEET.hp_max : 0;
    var hpModifier = SHEET ? (SHEET.hp_max_modifier || 0) : 0;
    var hpMaxEffective = hpMaxBase + hpModifier;
    var hpTemp    = SHEET ? (SHEET.hp_temp || 0) : 0;
    block.innerHTML =
      '<div class="cs-hp-cell cs-hp-cell--current">'
        + '<div class="cs-hp-label">Current HP</div>'
        + '<div class="cs-hp-val" id="cs-hp-current">' + hpCur + '</div>'
        + '<div class="cs-hp-controls">'
          + '<button class="cs-hp-btn" onclick="adjustHP(-1)" title="−1">−</button>'
          + '<button class="cs-hp-btn" onclick="adjustHP(1)"  title="+1">+</button>'
        + '</div>'
        + '<div class="cs-hp-input-row">'
          + '<input class="cs-hp-input" id="cs-hp-delta" type="number" placeholder="±">'
          + '<button class="cs-hp-apply" onclick="applyHPDelta()">Apply</button>'
        + '</div>'
      + '</div>'
      + '<div class="cs-hp-cell">'
        + '<div class="cs-hp-label">Max HP</div>'
        + '<div class="cs-hp-val">' + hpMaxEffective + (hpModifier !== 0 ? ' <span style="font-size:0.7rem;color:' + (hpModifier > 0 ? '#6ecf6e' : '#f87171') + ';">(' + (hpModifier > 0 ? '+' : '') + hpModifier + ')</span>' : '') + '</div>'
        + '<div class="cs-hp-input-row">'
          + '<input class="cs-hp-input" id="cs-hp-max-modifier" type="number" placeholder="±" title="Temporary max HP change from a status effect">'
          + '<button class="cs-hp-apply" onclick="setMaxHPModifier()">Set</button>'
        + '</div>'
      + '</div>'
      + '<div class="cs-hp-cell">'
        + '<div class="cs-hp-label">Temp HP</div>'
        + '<div class="cs-hp-val" id="cs-hp-temp">' + hpTemp + '</div>'
        + '<div class="cs-hp-input-row">'
          + '<input class="cs-hp-input" id="cs-hp-temp-input" type="number" min="0" placeholder="0">'
          + '<button class="cs-hp-apply" onclick="setTempHP()">Set</button>'
        + '</div>'
      + '</div>';
  }

  function adjustHP(delta) {
    if (!SHEET) return;
    var cur = parseInt(SHEET.hp_current) || 0;
    var maxEffective = (parseInt(SHEET.hp_max) || 0) + (parseInt(SHEET.hp_max_modifier) || 0);
    SHEET.hp_current = Math.max(0, Math.min(maxEffective, cur + delta));
    document.getElementById('cs-hp-current').textContent = SHEET.hp_current;
    saveSheet({ hp_current: SHEET.hp_current });
  }
  function setTempHP() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-temp-input');
    var val = parseInt(input.value);
    if (isNaN(val) || val < 0) return;
    SHEET.hp_temp = val;
    saveSheet({ hp_temp: val });
    input.value = '';
    renderHP();
  }
  function setMaxHPModifier() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-max-modifier');
    var val = parseInt(input.value);
    if (isNaN(val)) return;
    SHEET.hp_max_modifier = val;
    saveSheet({ hp_max_modifier: val });
    input.value = '';
    renderHP();
  }

  function applyHPDelta() {
    if (!SHEET) return;
    var input = document.getElementById('cs-hp-delta');
    var delta = parseInt(input.value) || 0;
    if (!delta) return;
    adjustHP(delta);
    input.value = '';
  }

  // ── Gold ──────────────────────────────────────────────────────────
  function renderGold() {
    var block = document.getElementById('cs-gold-block');
    if (!block) return;
    var cp     = SHEET ? (SHEET.gold_cp || 0) : 0;
    var gpWhole = Math.floor(cp / 100);
    var spRem   = Math.floor((cp % 100) / 10);
    var cpRem   = cp % 10;
    var display = gpWhole + ' gp';
    if (spRem) display += ' ' + spRem + ' sp';
    if (cpRem) display += ' ' + cpRem + ' cp';
    block.innerHTML =
      '<div class="cs-gold-block">'
        + '<div class="cs-gold-icon">◈</div>'
        + '<div>'
          + '<div class="cs-gold-val" id="cs-gold-val">' + display + '</div>'
          + '<div class="cs-gold-label">Current gold</div>'
        + '</div>'
      + '</div>'
      + '<div class="cs-gold-edit-row">'
        + '<input class="cs-gold-input" id="cs-gold-input" type="number" placeholder="gp" title="Enter gold pieces">'
        + '<button class="cs-gold-save" onclick="setGold()">Set Gold</button>'
      + '</div>';
  }

  function setGold() {
    if (!SHEET) return;
    var input = document.getElementById('cs-gold-input');
    var gp = parseFloat(input.value);
    if (isNaN(gp)) return;
    SHEET.gold_cp = Math.round(gp * 100);
    saveSheet({ gold_cp: SHEET.gold_cp });
    input.value = '';
    renderGold();
    renderOverviewMoney();
    showToast('Gold updated');
  }

  // ── Equipped ──────────────────────────────────────────────────────
  var EQUIP_SLOTS = [
    { key:'armor',      label:'Armor',     type:'armor',  category:'armor'  },
    { key:'shield',     label:'Shield',    type:'shield', category:'shield' },
    { key:'hand_right', label:'Main Hand', type:'weapon', category:'weapon' },
    { key:'hand_left',  label:'Off Hand',  type:'weapon', category:'weapon' }
  ];
  // Minimal tooltip: reads data-tip off an element and shows a floating
  // bubble on hover. sheet/index.html has no shared tooltip system (unlike
  // character.js's data-tip convention) — this is scoped to the Equipped
  // section's AC badge only.
  function wireTooltip(el) {
    if (!el || !el.dataset || !el.dataset.tip || el._tipWired) return;
    el._tipWired = true;
    var tipEl = null;
    el.addEventListener('mouseenter', function() {
      tipEl = document.createElement('div');
      tipEl.className = 'cs-tooltip';
      tipEl.textContent = el.dataset.tip;
      document.body.appendChild(tipEl);
      var rect = el.getBoundingClientRect();
      tipEl.style.left = (rect.left + rect.width / 2) + 'px';
      tipEl.style.top  = rect.top + 'px';
    });
    el.addEventListener('mouseleave', function() {
      if (tipEl) { tipEl.remove(); tipEl = null; }
    });
  }
  function renderEquipped() {
    var block = document.getElementById('cs-equipped-block');
    if (!block) return;
    var mainHandItem = EQUIPPED.hand_right ? EQUIPPED_ITEMS[EQUIPPED.hand_right] : null;
    var isTwoHanded = !!(mainHandItem && Array.isArray(mainHandItem.properties) && mainHandItem.properties.indexOf('two-handed') !== -1);
    if (isTwoHanded && EQUIPPED.hand_left) {
      autoUnequipOffHandForTwoHanded();
    }
    block.innerHTML = renderEquippedAC()
      + '<div class="cs-equipped-grid">' + EQUIP_SLOTS.map(function(slot) { return renderEquippedSlot(slot, isTwoHanded); }).join('') + '</div>';
    var badge = block.querySelector('.cs-equipped-ac-badge');
    if (badge) wireTooltip(badge);
  }
  // Clears Off Hand when Main Hand holds/gains a two-handed weapon — covers
  // both directions (equipping two-handed while Off Hand is occupied, and
  // Off Hand simply staying locked afterward via renderEquippedSlot).
  function autoUnequipOffHandForTwoHanded() {
    if (!SHEET) return;
    var equipped = (typeof SHEET.equipped === 'object' && SHEET.equipped) ? SHEET.equipped : {};
    var removedId = equipped.hand_left;
    delete equipped.hand_left;
    SHEET.equipped = equipped;
    EQUIPPED.hand_left = null;
    var stillUsed = Object.keys(EQUIPPED).some(function(k) { return EQUIPPED[k] === removedId; });
    if (removedId && !stillUsed) delete EQUIPPED_ITEMS[removedId];
    saveSheet({ equipped: equipped });
  }
  function buildWeaponDamageHtml(item) {
    return '<span class="cs-equipped-damage-dice">' + item.damage_dice + '</span>'
      + (item.damage_type ? ' <span class="cs-equipped-damage-type">' + item.damage_type + '</span>' : '');
  }
  function renderEquippedAC() {
    var dexRaw = parseInt(ABILITY_SCORES.dex) || 10;
    var dexMod = Math.floor((dexRaw - 10) / 2);
    var armor  = EQUIPPED.armor  ? EQUIPPED_ITEMS[EQUIPPED.armor]  : null;
    var shield = EQUIPPED.shield ? EQUIPPED_ITEMS[EQUIPPED.shield] : null;
    var ac = 10;
    var breakdown = [];
    if (armor) {
      ac = parseInt(armor.base_ac) || 10;
      breakdown.push(ac + ' (' + armor.name + ')');
      var weightClass = (armor.armor_weight_class || '').toLowerCase();
      if (weightClass === 'heavy') {
        breakdown.push('Dex (not added)');
      } else if (weightClass === 'medium') {
        var maxDex = (armor.max_dex_bonus != null && armor.max_dex_bonus !== '') ? parseInt(armor.max_dex_bonus) : 2;
        var dexApplied = Math.min(dexMod, maxDex);
        ac += dexApplied;
        breakdown.push(dexApplied + ' Dex (capped)');
      } else {
        ac += dexMod;
        breakdown.push(dexMod + ' Dex (' + dexRaw + ')');
      }
      if (parseInt(armor.magic_bonus) > 0) {
        ac += parseInt(armor.magic_bonus);
        breakdown.push(armor.magic_bonus + ' armor enchantment');
      }
    } else {
      ac += dexMod;
      breakdown.push('10 base');
      breakdown.push(dexMod + ' Dex (' + dexRaw + ')');
    }
    if (shield) {
      var shieldBonus = (shield.ac_bonus != null && shield.ac_bonus !== '') ? parseInt(shield.ac_bonus) : 2;
      ac += shieldBonus;
      breakdown.push(shieldBonus + ' Shield');
      if (parseInt(shield.magic_bonus) > 0) {
        ac += parseInt(shield.magic_bonus);
        breakdown.push(shield.magic_bonus + ' shield enchantment');
      }
    }
    var tip = breakdown.join(' + ') + ' = ' + ac;

    var mainHand = EQUIPPED.hand_right ? EQUIPPED_ITEMS[EQUIPPED.hand_right] : null;
    var offHand  = EQUIPPED.hand_left  ? EQUIPPED_ITEMS[EQUIPPED.hand_left]  : null;
    var dmgParts = [];
    if (mainHand && mainHand.damage_dice) dmgParts.push(buildWeaponDamageHtml(mainHand));
    if (offHand && offHand.damage_dice) dmgParts.push(buildWeaponDamageHtml(offHand));
    var dmgHtml = dmgParts.length
      ? '<span class="cs-equipped-damage-sep">&#9876;</span><span class="cs-equipped-damage">'
        + dmgParts.join('<span class="cs-equipped-damage-slash"> / </span>') + '</span>'
      : '';

    return '<div class="cs-equipped-ac-badge" data-tip="' + tip.replace(/"/g,'&quot;') + '">AC ' + ac + '</div>' + dmgHtml;
  }
  function renderEquippedStat(labelText, value, fullRow) {
    return '<div class="cs-equipped-stat"' + (fullRow ? ' style="grid-column:1/-1;"' : '') + '>'
      + '<span>' + labelText + '</span><span>' + value + '</span></div>';
  }
  function renderEquippedSlot(slot, mainHandTwoHanded) {
    if (slot.key === 'hand_left' && mainHandTwoHanded) {
      return '<div class="cs-equipped-slot"><div class="cs-equipped-slot-label">' + slot.label.toUpperCase() + '</div>'
        + '<div class="cs-equipped-locked">Two-handed weapon equipped</div></div>';
    }
    var itemId = EQUIPPED[slot.key];
    var item   = itemId ? EQUIPPED_ITEMS[itemId] : null;
    var body;
    if (!item) {
      body = '<button class="cs-equipped-empty-btn" onclick="openEquipModal(\'' + slot.key + '\')">Search to equip&#8230;</button>';
    } else {
      var stats = [];
      if (slot.type === 'armor') {
        stats.push(renderEquippedStat('Base AC', item.base_ac != null ? item.base_ac : '&mdash;'));
        if (item.armor_weight_class) stats.push(renderEquippedStat('Weight Class', cap(item.armor_weight_class)));
        if (item.stealth_disadvantage) stats.push(renderEquippedStat('Stealth', 'Disadvantage'));
        if (item.str_requirement) stats.push(renderEquippedStat('Str Req', item.str_requirement));
        if (item.magic_bonus) stats.push(renderEquippedStat('Magic Bonus', '+' + item.magic_bonus));
        if (item.weight_lb != null) stats.push(renderEquippedStat('Weight', item.weight_lb + ' lb'));
      } else if (slot.type === 'shield') {
        stats.push(renderEquippedStat('AC Bonus', '+' + (item.ac_bonus != null ? item.ac_bonus : 2)));
        if (item.magic_bonus) stats.push(renderEquippedStat('Magic Bonus', '+' + item.magic_bonus));
        if (item.weight_lb != null) stats.push(renderEquippedStat('Weight', item.weight_lb + ' lb'));
      } else if (slot.type === 'weapon') {
        var isRanged = !!item.range_normal;
        stats.push(renderEquippedStat('Attack', isRanged ? 'Ranged' : 'Melee'));
        if (item.damage_dice) stats.push(renderEquippedStat('Damage', item.damage_dice + (item.damage_type ? ' ' + item.damage_type : '')));
        if (item.versatile_dice) stats.push(renderEquippedStat('Versatile', item.versatile_dice));
        if (Array.isArray(item.properties) && item.properties.length) stats.push(renderEquippedStat('Properties', item.properties.join(', ')));
        if (isRanged) stats.push(renderEquippedStat('Range', item.range_normal + (item.range_long ? ' / ' + item.range_long : '')));
        if (item.magic_bonus) stats.push(renderEquippedStat('Magic Bonus', '+' + item.magic_bonus));
        if (item.weight_lb != null) stats.push(renderEquippedStat('Weight', item.weight_lb + ' lb'));
      }
      if (Array.isArray(item.grants_advantage) && item.grants_advantage.length) {
        stats.push(renderEquippedStat('Advantage', item.grants_advantage.join(', '), true));
      }
      if (item.story_note) {
        stats.push('<div class="cs-equipped-stat" style="grid-column:1/-1;font-style:italic;">' + item.story_note + '</div>');
      }
      body = '<div class="cs-equipped-item">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;">'
          + '<strong>' + item.name + '</strong>'
          + '<button class="cs-equipped-unequip" onclick="unequipSlot(\'' + slot.key + '\')" title="Unequip">&#10005;</button>'
        + '</div>'
        + stats.join('')
      + '</div>';
    }
    return '<div class="cs-equipped-slot"><div class="cs-equipped-slot-label">' + slot.label.toUpperCase() + '</div>' + body + '</div>';
  }

  // ── Equip search modal ────────────────────────────────────────────
  var EQUIP_TARGET_SLOT = null;
  var EQUIP_SLOT_TITLES = { armor:'Equip Armor', shield:'Equip Shield', hand_right:'Equip Main Hand', hand_left:'Equip Off Hand' };
  function equipSlotByKey(key) {
    for (var i = 0; i < EQUIP_SLOTS.length; i++) { if (EQUIP_SLOTS[i].key === key) return EQUIP_SLOTS[i]; }
    return null;
  }
  function openEquipModal(slotKey) {
    EQUIP_TARGET_SLOT = slotKey;
    document.getElementById('cs-equip-modal-title').textContent = EQUIP_SLOT_TITLES[slotKey] || 'Equip Item';
    document.getElementById('cs-equip-search-input').value = '';
    renderEquipResults('');
    document.getElementById('cs-equip-modal-overlay').style.display = 'flex';
  }
  function closeEquipModal() {
    document.getElementById('cs-equip-modal-overlay').style.display = 'none';
    EQUIP_TARGET_SLOT = null;
  }
  function onEquipSearchInput() {
    var q = (document.getElementById('cs-equip-search-input').value || '').trim();
    renderEquipResults(q);
  }
  // Inventory rows relevant to a slot — custom rows match by item_type,
  // catalog-linked rows match by the linked catalog item's category.
  function getEquipCandidates(slotKey) {
    var slot = equipSlotByKey(slotKey);
    if (!slot) return [];
    return INVENTORY.filter(function(item) {
      var catalogItem  = item.item_id ? CATALOG_CACHE[item.item_id] : null;
      var matchesCustom  = item.item_type === slot.category;
      var matchesCatalog = !!(item.item_id && catalogItem && catalogItem.category === slot.category);
      return matchesCustom || matchesCatalog;
    });
  }
  // Stats line for an equip search result — reads catalog fields when the
  // row is catalog-linked, falls back to whatever the inventory row itself
  // carries (custom items don't have combat stats, so this is often empty).
  function buildEquipResultStats(category, src) {
    src = src || {};
    if (category === 'armor') {
      if (src.base_ac == null) return '';
      return 'AC ' + src.base_ac
        + (src.armor_weight_class ? ' &middot; ' + src.armor_weight_class : '')
        + (src.stealth_disadvantage ? ' &middot; Stealth disadv.' : '')
        + (src.str_requirement ? ' &middot; Str ' + src.str_requirement + ' req.' : '')
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '');
    }
    if (category === 'shield') {
      if (src.ac_bonus == null) return '';
      return '+' + src.ac_bonus + ' AC'
        + (src.magic_bonus > 0 ? ' &middot; +' + src.magic_bonus : '');
    }
    if (category === 'weapon') {
      if (!src.damage_dice) return '';
      return src.damage_dice + (src.damage_type ? ' ' + src.damage_type : '')

  function wireInventoryDragDrop() {
    document.querySelectorAll('.cs-inv-row').forEach(function(row) {
      row.addEventListener('dragstart', function(e) {
        DRAG_ITEM_ID = row.dataset.id;
        row.closest('.cs-inv-row-wrap').classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', function() {
        document.querySelectorAll('.cs-inv-row-wrap.dragging').forEach(function(el) { el.classList.remove('dragging'); });
        DRAG_ITEM_ID = null;
      });
    });
    document.querySelectorAll('.cs-inv-sortable').forEach(function(container) {
      container.addEventListener('dragover', function(e) {
        e.preventDefault();
        var dragging = container.querySelector('.cs-inv-row-wrap.dragging');
        if (!dragging) return;
        var afterEl = getDragAfterElement(container, e.clientY);
        if (afterEl == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterEl);
        }
      });
      container.addEventListener('drop', function(e) {
        e.preventDefault();
        persistDragOrder(container);
      });
    });
  }
  function getDragAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll('.cs-inv-row-wrap:not(.dragging)'));
    return els.reduce(function(closest, el) {
      var box = el.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: el };
      } else {
        return closest;
      }
    }, { offset: -Infinity, element: null }).element;
  }
  function persistDragOrder(container) {
    var isFavorite = container.dataset.group === 'favorite';

  function levenshteinSimilarity(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    var m = a.length, n = b.length;
    if (!m) return n ? 0 : 1;
    if (!n) return 0;
    var d = [];
    for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i-1] === b[j-1] ? 0 : 1;
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      }
    }
    var dist = d[m][n];
    var maxLen = Math.max(m, n);
    return 1 - (dist / maxLen);
  }
  function checkCatalogForMatch(name) {

      res.data.forEach(function(it) {
        var score = levenshteinSimilarity(name, it.name);
        if (score > bestScore) { bestScore = score; best = it; }
      });
      return bestScore >= 0.7 ? best : null;
    });
  }

  // ── Wiki autocomplete ─────────────────────────────────────────────
  var WIKI_TABLES = ['cities','world_characters','creatures','organizations','pois','nations','regions','religions','items'];
  function loadWikiAcCache() {
    if (WIKI_AC_CACHE !== null) return Promise.resolve();
    return Promise.all(WIKI_TABLES.map(function(table) {
      return sb.from(table).select('id,name,player_facing').then(function(res) {
        if (res.error || !res.data) return [];
        return res.data
          .filter(function(r) { return r.player_facing === true || r.player_facing === 'teaser'; })
          .map(function(r) { return { id: r.id, name: r.name, table: table }; });
      });
    })).then(function(results) {
      WIKI_AC_CACHE = [];
      results.forEach(function(rows) { WIKI_AC_CACHE = WIKI_AC_CACHE.concat(rows); });
    });
  }
  function handleNoteBodyInput(bodyEl, noteId) {
    // Capture query synchronously before any async gap
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range  = sel.getRangeAt(0);
    var text   = range.startContainer.textContent || '';
    var pos    = range.startOffset;
    var before = text.slice(0, pos);
    var match  = before.match(/([A-Za-z'][A-Za-z']*)$/);
    if (!match || match[1].trim().length < 2) { closeWikiAc(noteId); return; }
    var query       = match[1].trim().toLowerCase();
    var matchedText = match[1];
    loadWikiAcCache().then(function() {
      // Re-capture selection after async gap — caret may have moved
      var sel2 = window.getSelection();
      if (!sel2 || !sel2.rangeCount) return;
      var range2 = sel2.getRangeAt(0);
      var hits = (WIKI_AC_CACHE || []).filter(function(e) {
        return e.name.toLowerCase().indexOf(query) !== -1;
      }).sort(function(a, b) {
        var aStarts = a.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
        var bStarts = b.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
        return aStarts - bStarts || a.name.localeCompare(b.name);
      }).slice(0, 8);
      if (hits.length) {
        showWikiAc(noteId, hits, bodyEl, range2, matchedText);
      } else {
        closeWikiAc(noteId);
      }
    });
  }

    var groupNotes = notes.filter(function(n) { return n.is_favorite === note.is_favorite && n.id !== noteId; });

  function wireNoteDragDrop() {
    document.querySelectorAll('.cs-note-card').forEach(function(card) {
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', function(e) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.dataset.noteId);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', function() {
        document.querySelectorAll('.cs-note-card.dragging').forEach(function(el){ el.classList.remove('dragging'); });
      });
    });
    document.querySelectorAll('.cs-note-sortable').forEach(function(container) {
      container.addEventListener('dragover', function(e) {
        e.preventDefault();
        var dragging = document.querySelector('.cs-note-card.dragging');
        if (!dragging) return;
        var afterEl = getNoteAfterElement(container, e.clientY);
        if (afterEl == null) {
          container.appendChild(dragging);
        } else {
          container.insertBefore(dragging, afterEl);
        }
      });
      container.addEventListener('drop', function(e) {
        e.preventDefault();
        persistNoteDragOrder(container);
      });
    });

  function getNoteAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll('.cs-note-card:not(.dragging)'));
    return els.reduce(function(closest, el) {
      var box    = el.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: el };
      }
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }
  function persistNoteDragOrder(container) {
    var tab   = ACTIVE_NOTE_TAB;
    var cards = Array.prototype.slice.call(container.querySelectorAll('.cs-note-card'));

      var noteId = card.dataset.noteId;
      var note   = (NOTES[tab] || []).find(function(n){ return n.id === noteId; });
      if (note) note.sort_order = idx;
      sb.from('character_notes').update({ sort_order: idx }).eq('id', noteId).then(function(res) {
        if (res.error) console.warn('Note sort save failed', noteId, res.error);
      });

  function showWikiAc(noteId, hits, bodyEl, range, matchedText) {
    var dropdown = document.getElementById('cs-wiki-ac-' + noteId);
    if (!dropdown) return;
    if (!hits.length) { dropdown.classList.remove('visible'); return; }
    var TABLE_LABELS = {
      cities:'City', world_characters:'Character', creatures:'Creature',
      organizations:'Organization', pois:'Place of Interest',
      nations:'Nation', regions:'Region', religions:'Religion', items:'Item'
    };
    dropdown.innerHTML = hits.map(function(h, idx) {
      return '<div class="cs-wiki-ac-item" data-idx="' + idx + '">'
        + '<span class="cs-wiki-ac-item-type">' + (TABLE_LABELS[h.table]||h.table) + '</span>'
        + h.name.replace(/</g,'&lt;')
      + '</div>';
    }).join('');
    dropdown.classList.add('visible');
    // Position dropdown: use caret rect when valid, else fall back to bottom of body
    var bodyRect  = bodyEl.getBoundingClientRect();
    var caretRect = range.getBoundingClientRect();
    var topOffset, leftOffset;
    if (caretRect && caretRect.bottom > 0 && caretRect.bottom > bodyRect.top) {
      topOffset  = caretRect.bottom - bodyRect.top + 4;
      leftOffset = Math.max(0, caretRect.left - bodyRect.left);
    } else {
      // Fallback: position below the body element's current scroll height
      topOffset  = bodyEl.scrollHeight + 4;
      leftOffset = 0;
    }
    dropdown.style.top  = topOffset  + 'px';
    dropdown.style.left = leftOffset + 'px';
    // Wire click — capture range for link insertion
    dropdown.querySelectorAll('.cs-wiki-ac-item').forEach(function(itemEl, idx) {
      itemEl.addEventListener('mousedown', function(e) {
        e.preventDefault();
        insertWikiLink(bodyEl, noteId, hits[idx], matchedText, range);
      });
    });

  function closeWikiAc(noteId) {

  function insertWikiLink(bodyEl, noteId, entry, matchedText, range) {
    closeWikiAc(noteId);
    var routeFn  = WIKI_ROUTES[entry.table];
    var href     = routeFn ? routeFn(entry.id) : '#';
    var wikiBase = window.location.origin + '/anavale-wiki/';
    var link     = document.createElement('a');
    link.href      = wikiBase + href;
    link.className = 'cs-wiki-link';
    link.target    = '_blank';
    link.rel       = 'noopener';
    link.textContent = entry.name;
    // Replace the typed text with the link
    var textNode   = range.startContainer;
    var pos        = range.startOffset;
    var text       = textNode.textContent || '';
    var matchStart = pos - matchedText.length;
    if (matchStart < 0) matchStart = 0;
    // Split text node and insert link
    var before = document.createTextNode(text.slice(0, matchStart));
    var after  = document.createTextNode(text.slice(pos) + ' ');
    var parent = textNode.parentNode;
    parent.insertBefore(before, textNode);
    parent.insertBefore(link, textNode);
    parent.insertBefore(after, textNode);
    parent.removeChild(textNode);
    // Move caret after link
    var newRange = document.createRange();
    newRange.setStart(after, 1);
    newRange.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(newRange);
    // Save immediately
    saveNoteBody(bodyEl, noteId);
  }
