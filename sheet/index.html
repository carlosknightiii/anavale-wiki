<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Anavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/hp-calc.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">

  <style>
    /* ── CSS Variables (mirrors character.css :root exactly) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


    /* ── Page Shell ── */
    body {
      background:
        linear-gradient(rgba(3,4,12,0.88), rgba(3,4,12,0.88)),
        url('../assets/images/regions/img-caparia-landscape.webp') center/cover fixed;
      color: var(--parchment);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav Bar ──
       Logo removed (was duplicating the PageTitle component below it —
       the mockup shows exactly one Anavale logo, the PageTitle's). Nav
       now holds only the Return-to-Wiki link. */
    .cs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 15, 0.92);
      border-bottom: 1px solid rgba(200,148,10,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
    }
    .cs-nav-back {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    .cs-nav-back:hover { opacity: 1; color: var(--gold); }

    /* ── Main content wrapper ── */
    .cs-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Section headers ── */
    .cs-section {
      margin-bottom: 1.75rem;
    }
    .cs-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--char-highlight-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-section-label::before {
      content: '✦';
      font-size: 0.55rem;
      opacity: 0.6;
    }

    /* ── Story panel ── */
    .cs-story-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      overflow: hidden;
    }
    .cs-story-row {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .cs-story-row:last-child { border-bottom: none; }
    .cs-story-key {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      padding-top: 0.05rem;
      line-height: 1.4;
    }
    .cs-story-val {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--char-text-muted);
      line-height: 1.7;
    }
    .cs-story-val em {
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ── Currency — 3 pills (Figma 51:2260) ── */
    .cs-currency-row {
      display: flex;
      gap: 0.6rem;
      width: 100%;
    }
    .cs-currency-pill {
      flex: 1 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: var(--char-ov-gap-2xs) var(--char-ov-gap-xs);
      border-radius: var(--radius-sm);
    }
    .cs-currency-pill--gold   { background: var(--currency-gold-coin); }
    .cs-currency-pill--silver { background: var(--currency-silver); }
    .cs-currency-pill--copper { background: var(--currency-copper); }
    .cs-currency-pill-label {
      font-family: var(--font-body);
      font-weight: 900;
      font-size: 18px;
      color: var(--blue-800);
      text-align: center;
    }
    .cs-currency-pill--copper .cs-currency-pill-label { color: var(--text); }
    .cs-currency-input {
      width: 100%;
      background: var(--white);
      border: 1px solid black;
      color: var(--blue-800);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 18px;
      text-align: center;
      padding: var(--char-ov-gap-2xs) var(--char-ov-gap-xs);
      box-sizing: border-box;
    }
    .cs-currency-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(240,180,41,0.4); }

    /* ══════════════════════════════════════════════════════════════
       OVERVIEW + ABILITY SCORES (redesign)
       Figma P0tcVgf02XeI13Tz0TtRaX — desktop 36:310 / mobile 36:435
       Breaks out of .cs-wrap's 820px cap — this is the one part of
       the sheet wide enough to need it (portrait card + 3 overview
       cards side by side). Rest of the page stays at 820px.
       ══════════════════════════════════════════════════════════════ */
    .cs-ov-breakout {
      width: 100vw;
      position: relative;
      left: 50%;
      margin-left: -50vw;
      margin-bottom: 2rem;
    }
    .cs-ov-inner {
      max-width: 1560px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Page title (Figma 51:1385) — logo + "Character Sheet" ── */
    .cs-sheet-title-logo {
      height: 22px;
      width: auto;
      display: block;
      margin-bottom: 0.3rem;
    }
    .cs-sheet-title-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      color: var(--text);
    }

    /* ── Portrait / money / weight card ── */
    .cs-ov-maininfo {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-m);
      align-items: flex-start;
    }
    .cs-ov-portrait {
      position: relative;
      width: 358px;
      min-height: 420px;
      flex-shrink: 0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      background: var(--surface-2);
    }
    .cs-ov-portrait-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    .cs-ov-portrait-upload-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 3;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(10,14,24,0.88);
      color: white;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .cs-ov-portrait-upload-btn:hover { background: rgba(200,148,10,0.35); border-color: rgba(200,148,10,0.6); }

    /* ── Name / pills / blurb / accordions ── */
    .cs-ov-info {
      flex: 1 1 358px;
      min-width: 358px;
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-main {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cs-ov-name {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 4.5vw, 4rem);
      line-height: 1.05;
      color: var(--text);
    }
    .cs-ov-blurb {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      line-height: var(--line-height);
      color: var(--text);
    }

    /* ── Accordion shell (Overview / Ability Scores) ── */
    .cs-ov-acc { width: 100%; }
    .cs-ov-acc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 0 var(--char-ov-gap-2xs);
      gap: var(--char-ov-gap-2xs);
    }
    /* Tab page title (Figma 51:1103 "YOUR STORY") — bigger than the
       Who You Are/Your Background/Your Past section titles below it
       (.cs-ov-acc-title, --text-4xl) so it reads as the page heading, not
       another accordion. One per tab (pageTitleHtml()) — Your Story,
       Ability Scores, Inventory, Class all carry the same heading. */
    .cs-page-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      color: var(--text);
      margin-bottom: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h3);
      color: var(--text);
      text-align: left;
    }
    .cs-ov-acc-toggle {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-toggle-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .cs-ov-acc-chevron {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      color: var(--surface-0);
      font-size: 0.8rem;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    /* Expand/collapse transition — grid-template-rows 1fr→0fr rather than a
       JS-measured max-height, so it works for any content height without
       recalculating. cs-ov-acc-body-outer is the grid container/animated
       element; cs-ov-acc-body (unchanged internal flex layout) just needs
       overflow:hidden so it clips cleanly mid-transition. */
    .cs-ov-acc-body-outer {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 0.22s ease, opacity 0.2s ease;
    }
    .cs-ov-acc-body {
      overflow: hidden;
      min-height: 0;
      padding-bottom: var(--char-ov-gap-2xs);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-acc.collapsed .cs-ov-acc-body-outer { grid-template-rows: 0fr; opacity: 0; }
    .cs-ov-acc.collapsed .cs-ov-acc-chevron { transform: rotate(180deg); }

    /* ── Overview cards (alignment / background / gigglegloom) ── */
    .cs-ov-cards {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-card {
      flex: 1 0 0;
      min-width: 300px;
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-xs);
      background: var(--blue-700);
      border-radius: 0 24px 24px 0;
      padding-right: 16px;
      overflow: hidden;
    }
    .cs-ov-card-img {
      width: 75px; height: 75px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ov-card-icon-wrap {
      width: 75px; height: 75px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .cs-ov-card-icon {
      width: 40px; height: 40px;
      filter: drop-shadow(0 0 14px currentColor);
    }
    .cs-ov-card-txt {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .cs-ov-card-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-card-title {
      font-family: var(--font-display);
      font-size: var(--char-ov-h4);
      color: var(--text);
    }
    .cs-ov-card-sub {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--text);
    }

    /* ── Class card ── */
    .cs-ov-class-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-class-basic {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-s);
    }
    .cs-ov-class-img {
      width: 56px; height: 56px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .cs-ov-class-txt { flex: 1 0 0; min-width: 0; }
    .cs-ov-class-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-class-name {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-level {
      flex-shrink: 0;
      background: var(--surface-0);
      border-radius: 8px;
      padding: var(--char-ov-gap-2xs);
      text-align: center;
    }
    .cs-ov-class-level-label {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.72rem;
      color: var(--gold);
    }
    .cs-ov-class-level-val {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-details {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-class-detail {
      flex: 1 0 0;
      min-width: 240px;
      display: flex;
      gap: 10px;
    }
    .cs-ov-class-detail-keys {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      flex-shrink: 0;
    }
    .cs-ov-class-detail-keys p, .cs-ov-class-detail-vals p { line-height: 24px; margin: 0; }
    .cs-ov-class-detail-vals {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      color: var(--text);
      min-width: 0;
    }

    /* ── Class tab — Key Features (Figma 52:2705/52:2710) ──────────────
       Alternating row shading is pure CSS nth-child, no data dependency. */
    .cs-class-features-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      margin: var(--char-ov-gap-s) 0 var(--char-ov-gap-2xs);
    }
    .cs-class-features {
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .cs-class-feature-row {
      display: flex;
      align-items: flex-start;
      gap: var(--char-ov-gap-2xs);
      padding: 0.65rem var(--char-ov-gap-2xs);
    }
    .cs-class-feature-row:nth-child(even) { background: var(--blue-500); }
    .cs-class-feature-icon { font-size: 1.1rem; line-height: 1.4; flex-shrink: 0; }
    .cs-class-feature-txt { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .cs-class-feature-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text);
    }
    .cs-class-feature-level {
      margin-left: 0.5rem;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .cs-class-feature-desc {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.86rem;
      color: var(--text);
      opacity: 0.85;
    }

    /* ── Spell slots (Class tab, stopgap — see Decision Log) ── */
    .cs-spell-slots-card { margin-top: var(--char-ov-gap-s); }
    .cs-spell-slot-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-2xs);
      padding: 0.35rem 0;
    }
    .cs-spell-slot-level {
      width: 70px;
      flex-shrink: 0;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-spell-slot-pips { display: flex; gap: 0.3rem; }
    .cs-spell-slot-pip {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      background: none;
      cursor: pointer;
      padding: 0;
    }
    .cs-spell-slot-pip.filled { background: var(--gold); border-color: var(--gold); }
    .cs-spell-slot-none { color: var(--char-text-faint); font-size: 0.8rem; }
    .cs-spell-slot-max-edit { display: flex; gap: 0.35rem; align-items: center; margin-left: auto; }
    .cs-spell-slot-max-input { width: 50px; }

    /* ── Your Story cards (Who You Are / Your Background / Your Past) ──
       Figma 51:1103/51:1218. Wider description cards, not small pills —
       real player answers run from short phrases to full paragraphs. ── */
    .cs-story-cards {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: var(--char-ov-gap-s);
      margin-top: var(--char-ov-gap-m);
    }
    .cs-story-card {
      flex: 1 0 260px;
      min-width: 240px;
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-story-card-head { display: flex; align-items: center; gap: 0.6rem; }
    .cs-story-card-img {
      width: 75px;
      height: 75px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    .cs-story-card-headtext { display: flex; flex-direction: column; gap: 0.15rem; }
    .cs-story-card-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue-100);
    }
    .cs-story-card-title {
      font-family: var(--font-display);
      font-size: var(--char-ov-h4);
      color: var(--text);
    }
    .cs-story-card-sub {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.78rem;
      color: var(--text);
      opacity: 0.75;
    }
    /* Your Past cards (Figma 51:1218) — fixed 358px width (not the flexible
       Your Background sizing), 18px titles (not 26px), and two layouts:
       default puts the icon beside just the eyebrow/title header row;
       --full (Left Behind, Why You Left) puts the icon beside the entire
       content column instead — a real structural split, not a styling one. */
    .cs-past-card {
      width: 358px;
      flex: 0 0 358px;
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-xs);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cs-past-card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h5);
      color: var(--text);
    }
    .cs-past-card--full {
      flex-direction: row;
      gap: 0.75rem;
    }
    .cs-past-card--full .cs-story-card-img { margin-top: 0; }
    .cs-past-card-body {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      min-width: 0;
    }
    .cs-story-card-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.88rem;
      line-height: var(--line-height);
      color: var(--text);
      opacity: 0.9;
    }
    /* Benefits box (Figma 51:1218) — typed lines, not pill tags. Lighter
       than the card's own blue/700 background so it reads as a distinct
       inset panel. */
    .cs-story-benefits {
      margin-top: 0.5rem;
      background: var(--blue-600);
      border-radius: var(--radius);
      padding: 8px;
    }
    .cs-story-benefit-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      color: var(--currency-gold-coin);
      margin-bottom: 0.2rem;
    }
    .cs-benefit-line {
      font-size: 12px;
      color: var(--text);
      margin-top: 0.2rem;
    }
    .cs-benefit-line:first-of-type { margin-top: 0; }
    .cs-benefit-amount { font-weight: 700; color: var(--green); }
    .cs-benefit-amount.negative { color: var(--red); }
    .cs-benefit-name { font-weight: 700; color: var(--text); }
    .cs-benefit-desc { font-weight: 300; color: var(--text); }
    .cs-benefit-suffix { font-weight: 300; color: var(--char-text-muted); }
    /* "Personal quest" line (Why You Left) — plain text, not a Benefits box. */
    .cs-past-quest {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 16px;
      line-height: 24px;
      color: var(--text);
      margin-top: 0.5rem;
    }
    .cs-story-quest-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      margin-right: 0.3rem;
    }

    /* ── Who You Are (Figma 51:1103) — ONE card: summary heading/paragraph
       + personality items as flush left-border strips, not separate boxes
       like Your Background/Your Past. ── */
    .cs-whoyouare-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-summary-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 18px;
      line-height: 24px;
      color: var(--text);
      margin: 0.5em 0 0;
    }
    .cs-whoyouare-items {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-xs);
      margin-top: var(--char-ov-gap-s);
    }
    .cs-whoyouare-item {
      flex: 1 1 200px;
      border-left: 4px solid var(--blue-400);
      padding: 8px 8px 8px 18px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .cs-whoyouare-item-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h5);
      color: var(--text);
    }

    /* ── Ability score cards ── */
    .cs-ab-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      width: 100%;
    }
    .cs-ab-card {
      flex: 1 0 0;
      min-width: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--char-ov-gap-xs) 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(to bottom, var(--blue-700), var(--ab-gradient));
      box-shadow: 2px 5px 11px 0 var(--ab-glow), 0 0 120px 0 var(--ab-glow);
    }
    .cs-ab-card--str { --ab-glow: var(--ability-str-glow); --ab-gradient: var(--ability-str-gradient); }
    .cs-ab-card--dex { --ab-glow: var(--ability-dex-glow); --ab-gradient: var(--ability-dex-gradient); }
    .cs-ab-card--con { --ab-glow: var(--ability-con-glow); --ab-gradient: var(--ability-con-gradient); }
    .cs-ab-card--int { --ab-glow: var(--ability-int-glow); --ab-gradient: var(--ability-int-gradient); }
    .cs-ab-card--wis { --ab-glow: var(--ability-wis-glow); --ab-gradient: var(--ability-wis-gradient); }
    .cs-ab-card--cha { --ab-glow: var(--ability-cha-glow); --ab-gradient: var(--ability-cha-gradient); }
    .cs-ab-img {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ab-txt {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--char-ov-gap-2xs) 0;
      text-align: center;
    }
    .cs-ab-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1.1rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ab-tip {
      display: inline-block;
      margin-left: 0.3rem;
      width: 13px;
      height: 13px;
      line-height: 13px;
      text-align: center;
      vertical-align: middle;
      border-radius: 50%;
      background: var(--gold);
      color: var(--blue-800);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 9px;
      cursor: help;
    }
    .cs-ab-val {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ab-mod {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-ab-mod-num { font-weight: 700; }
    .cs-ab-mod-num.positive { color: var(--green); }
    .cs-ab-mod-num.negative { color: var(--red); }
    .cs-feat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: var(--char-ov-gap-m);
    }
    .cs-feat-chip {
      background: var(--char-card-bg-subtle);
      border: 1px solid var(--char-highlight-border);
      border-radius: var(--char-radius);
      padding: 0.5rem 0.85rem;
      max-width: 320px;
    }
    .cs-feat-chip-name {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }
    .cs-feat-chip-desc {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-muted);
      line-height: 1.5;
      margin-top: 0.2rem;
    }

    /* ══════════════════════════════════════════════════════════════
       TAB SHELL
       Character Sheet Tab Redesign v1 — docs build spec, Aug 9 2026.
       Pure scaffolding pass: bar + show/hide only. Only "Your Story"
       carries real content today; Ability Scores/Inventory/Class are
       placeholders until their own build slices land.
       ══════════════════════════════════════════════════════════════ */
    /* Tab bar (Figma 51:1103) — pill tabs, not underlines. Inactive tabs sit
       at 50% text opacity on a darker fill; the active tab gets full
       opacity on a lighter fill. */
    .cs-tabbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      border-bottom: 4px solid var(--blue-400);
      overflow-x: auto;
    }
    .cs-tab-btn {
      background: var(--blue-600);
      border: none;
      border-radius: 8px 8px 0 0;
      padding: 10px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      opacity: 0.5;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    .cs-tab-btn:hover { opacity: 0.75; }
    .cs-tab-btn.active { background: var(--blue-400); opacity: 1; }
    .cs-tab-content[hidden] { display: none; }
    .cs-tab-placeholder {
      padding: 3rem 0;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ══════════════════════════════════════════════════════════════
       MAININFO — shared header (renders once, above the tab bar)
       Figma 51:1385. Portrait/name/blurb are relocated, unchanged
       logic; species paragraph, speaks block, conditions, inspiration,
       AC badge, HP bar and death saves are new UI over existing data.
       ══════════════════════════════════════════════════════════════ */
    /* Species/Appearance/Speaks — labeled 3-column row (Figma 51:1385).
       All three columns share the same plain-text treatment; Speaks lost
       its boxed-pill look here so it reads as a column, not a card. */
    .cs-mi-triple-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
    }
    .cs-mi-triple-col { flex: 1 1 200px; min-width: 180px; }
    .cs-mi-triple-label {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .cs-mi-species-desc,
    .cs-mi-appearance {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.85rem;
      line-height: var(--line-height);
      color: var(--char-text-muted);
    }
    /* Glyph + name sit inline on one row; "spoken where" sits on its own
       full-width row below (Figma 51:1385) — not nested under the name, so
       it isn't indented past the glyph. */
    .cs-mi-speaks { display: flex; flex-direction: column; gap: 0.2rem; }
    .cs-mi-speaks-row { display: flex; align-items: center; gap: 0.5rem; }
    .cs-mi-speaks-glyph { font-size: 1.2rem; line-height: 1; flex-shrink: 0; }
    .cs-mi-speaks-name { font-family: var(--font-sans); font-size: 0.85rem; font-weight: 700; color: var(--blue); }
    .cs-mi-speaks-sub { font-family: var(--font-body); font-weight: 300; font-size: 0.82rem; color: var(--char-text-muted); }

    /* Conditions — inline pill row above the name (Figma 51:1385). Per-pill
       color/tooltip come from the `conditions` Supabase table (fetched once,
       fetchConditionsData()) via --cond-bg/--cond-border/--cond-text custom
       properties set inline per pill — same technique dm.html's SCC Live
       Session panel uses. Picker-only now (no free text), so every pill is
       guaranteed a real match; the flat purple fallback only covers a
       CONDITIONS_DATA fetch failure, not the normal path. */
    .cs-mi-top-row { margin-bottom: var(--char-ov-gap-2xs); }
    .cs-mi-conditions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
    .cs-mi-condition-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--cond-bg, var(--purple-dim));
      border: 1px solid var(--cond-border, var(--purple-border));
      border-radius: 20px;
      padding: 0.2rem 0.5rem 0.2rem 0.7rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cond-text, var(--purple));
      cursor: help;
    }
    .cs-mi-condition-remove {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0 0.15rem;
    }
    .cs-mi-condition-add {
      background: none;
      border: 1px dashed var(--char-accent-border);
      border-radius: 20px;
      padding: 0.2rem 0.65rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      color: var(--char-text-faint);
      cursor: pointer;
    }
    .cs-mi-condition-add:hover { border-color: var(--gold-border); color: var(--gold-light); }
    .cs-mi-condition-input-row { display: inline-flex; gap: 0.35rem; align-items: center; }
    .cs-mi-condition-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--char-accent-border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      max-width: 160px;
    }
    .cs-mi-condition-select option { background: #1a1208; color: var(--text); }

    /* Compact single row (Figma 51:1385): AC badge, HP badge+bar, Temp HP
       badge+bar, all inline. Each cs-mi-hp-compact wraps down onto its own
       line on narrow viewports rather than the whole row scrolling. */
    .cs-mi-vitals { display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap; row-gap: 0.6rem; }

    /* Inspiration — small circular badge, top-right of the header (Figma
       51:1385), not a pill next to AC. .cs-ov-maininfo carries the
       position:relative for this to anchor against. */
    .cs-mi-inspiration {
      position: absolute;
      top: 0;
      right: 0;
    }
    .cs-mi-insp-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px dashed var(--char-accent-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      background: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .cs-mi-insp-badge.active { border: 1px solid var(--gold-border-mid); background: var(--gold-dim); }
    .cs-mi-insp-badge-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.55rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--char-text-faint);
    }
    .cs-mi-insp-badge.active .cs-mi-insp-badge-label { color: var(--gold-light); }
    .cs-mi-insp-badge-state {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.55rem;
      color: var(--char-text-faint);
    }
    .cs-mi-insp-badge.active .cs-mi-insp-badge-state { color: var(--gold-light); }

    /* HP grows to fill the row (Figma 51:1385: the bar takes up whatever
       width is left after the label/inputs) — Temp HP has no bar (see
       renderHeaderHP()) so it stays sized to its own content. */
    .cs-mi-hp-slot { flex: 1 1 320px; min-width: 220px; }
    .cs-mi-temp-hp { flex: 0 0 auto; display: flex; align-items: center; }

    /* Compact HP/Temp HP row (Figma 51:1385) — label + directly-editable
       number input(s) + bar. No Edit toggle, no separate control panel:
       typing into the input and blurring is the entire interaction. */
    .cs-mi-hp-compact { display: flex; align-items: center; gap: 0.5rem; }
    .cs-mi-hp-compact-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 24px;
      color: var(--text);
    }
    .cs-mi-hp-num-input {
      width: 44px;
      background: var(--blue-50);
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px;
      text-align: center;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 18px;
      color: var(--blue-800);
    }
    .cs-mi-hp-num-input::-webkit-outer-spin-button,
    .cs-mi-hp-num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cs-mi-hp-compact-max { font-family: var(--font-body); font-weight: 700; font-size: 18px; color: var(--text); }
    /* Prominent, full-height bar filling the remaining row width (Figma
       51:1385: bar height matches the row's full 37px, not a thin sliver) —
       flex:1 so it grows/shrinks with .cs-mi-hp-slot's available space. */
    .cs-mi-hp-compact-bar {
      flex: 1 1 auto;
      min-width: 50px;
      height: 37px;
      border-radius: 999px;
      background: var(--red-track);
      overflow: hidden;
    }
    .cs-mi-hp-compact-bar-fill { height: 100%; background: var(--red-strong); transition: width 0.25s ease; }
    /* Death-save-state Heal row only (0 Current HP) — the normal-state HP
       row above has no button controls left, just the two inputs. */
    .cs-mi-hp-controls { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.4rem; }

    .cs-mi-death-saves {
      flex: 1 1 260px;
      min-width: 220px;
      background: var(--char-card-bg);
      border: 1px solid var(--red-border);
      border-radius: var(--char-radius);
      padding: 0.85rem 1rem;
    }
    .cs-mi-ds-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f87171;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .cs-mi-ds-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.3rem; }
    .cs-mi-ds-row-label { font-family: var(--font-sans); font-size: 0.72rem; color: var(--char-text-muted); width: 70px; }
    .cs-mi-ds-pips { display: flex; gap: 0.4rem; }
    .cs-mi-ds-pip { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: none; cursor: pointer; padding: 0; }
    .cs-mi-ds-pip--success.filled { background: #6ecf6e; border-color: #6ecf6e; }
    .cs-mi-ds-pip--failure.filled { background: #f87171; border-color: #f87171; }

    @media (max-width: 900px) {
      .cs-ov-portrait { width: 100%; min-height: 340px; }
      .cs-ov-info { min-width: 100%; }
    }
    @media (max-width: 600px) {
      .cs-ov-card { min-width: 100%; }
      .cs-ab-cards { gap: 12px; }
      .cs-ab-card { min-width: 84px; }
      .cs-ab-img { width: 72px; height: 72px; }
      .cs-ov-class-details { gap: 1rem; }
      /* Single unbreakable words ("Overview") can't shrink to share a row
         with the toggle — wrap the toggle onto its own line rather than
         letting it overflow past the viewport edge. */
      .cs-ov-acc-header { flex-wrap: wrap; row-gap: 0.4rem; }
    }

    /* ── Not-found state ── */
    .cs-not-found {
      text-align: center;
      padding: 6rem 2rem;
    }
    .cs-not-found-glyph {
      font-family: var(--font-headers);
      font-size: 5rem;
      color: rgba(200,148,10,0.15);
      margin-bottom: 1.5rem;
      line-height: 1;
    }
    .cs-not-found-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--char-text-faint);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .cs-not-found-body {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: rgba(245,234,212,0.4);
      line-height: 1.8;
      max-width: 380px;
      margin: 0 auto 2rem;
    }
    .cs-not-found-link {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--char-highlight-border);
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .cs-not-found-link:hover {
      background: var(--char-highlight-tint);
      border-color: var(--gold);
    }

    /* ── Divider ornament ── */
    .cs-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0 1.5rem;
      opacity: 0.25;
    }
    .cs-divider::before, .cs-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold);
    }
    .cs-divider-glyph {
      font-family: var(--font-headers);
      font-size: 0.85rem;
      color: var(--gold);
    }

    /* ── Footer ── */
    .cs-footer {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.15);
    }

    /* ── Animations ── */
    @keyframes cs-fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cs-wrap { animation: cs-fadein 0.5s ease forwards; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cs-story-row { grid-template-columns: 1fr; gap: 0.2rem; }
      .cs-nav { padding: 0.6rem 1rem; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .cs-wrap { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="cs-nav">
    <a class="cs-nav-back" href="../index.html">← Return to Wiki</a>
  </nav>

  <!-- Main content — rendered by JS below -->
  <main class="cs-wrap" id="cs-main">
    <!-- populated by renderSheet() -->
  </main>
  <div id="cs-modal-root"></div>

  <footer class="cs-footer" id="cs-footer"></footer>

  <div id="cs-toast" class="cs-toast"></div>

  <style>
    /* ── Loading state ── */
    .cs-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1.5rem;
    }
    .cs-loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(200,148,10,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: cs-spin 0.9s linear infinite;
    }
    .cs-loading-text {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.4);
    }
    @keyframes cs-spin { to { transform: rotate(360deg); } }

    /* ── HP tracker ── */
    .cs-hp-block {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }
    .cs-hp-cell {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--char-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-hp-cell--current { border-color: rgba(180,60,60,0.35); background: rgba(180,60,60,0.07); }
    .cs-hp-label {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-hp-val {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--white);
      line-height: 1;
    }
    .cs-hp-cell--current .cs-hp-val { color: #f87171; }
    .cs-hp-controls {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }
    .cs-hp-btn {
      flex: 1;
      padding: 0.35rem 0;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-hp-btn:hover { background: rgba(255,255,255,0.12); }
    .cs-hp-input-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }
    .cs-hp-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      text-align: center;
      width: 60px;
    }
    .cs-hp-apply {
      padding: 0.3rem 0.75rem;
      background: rgba(200,148,10,0.2);
      border: 1px solid rgba(200,148,10,0.4);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-hp-apply:hover { background: rgba(200,148,10,0.35); }

    /* ── Equipped ── */
    /* AC badge (Figma 51:1385) — flat-top, rounded-bottom shield shape;
       "AC" label and the number are separately sized/weighted, not one
       uniform string. */
    .cs-mi-ac-badge {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--blue-100);
      color: var(--blue-800);
      border-radius: 0 0 55px 55px;
      padding: 8px 18px;
    }
    .cs-mi-ac-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 24px;
      line-height: 1;
    }
    .cs-mi-ac-num {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 32px;
      line-height: 1;
    }
    /* ── Equipped Gear — 10-slot doll (Figma 51:2260, 2026-08-09) ──────
       Desktop lays the 10 positions out via grid-template-areas echoing
       the humanoid silhouette (Head top-center, Neck/Earrings upper-right,
       Back upper-left, Chest/Arms mid, Left/Right Hand mid-edges, Legs,
       Feet). The real Figma frame instead absolute-positions every slot in
       raw px against a fixed canvas width — that breaks the mobile frame
       outright (slots render off-screen, confirmed via screenshot) and
       would silently misalign at any desktop width other than the exact
       design canvas. Grid-areas reproduce the same relative arrangement
       without hardcoding a canvas width, and share one mobile fallback
       with the already-DM-approved mobile deviation below.
       Slot frame + body silhouette use the real exported Figma assets
       (assets/images/character-sheet/equipped-gear/*, found staged
       on disk but untracked/never wired in — not invented here) rather
       than a CSS approximation. */
    .cs-equip-damage-row {
      text-align: center;
      margin-bottom: 0.6rem;
    }
    .cs-equip-doll {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-areas:
        ".     head  .     ."
        ".     .     neck  earrings"
        "back  .     .     ."
        ".     chest arms  ."
        "handL .     .     handR"
        ".     .     legs  ."
        ".     feet  .     .";
      gap: 1.1rem 0.75rem;
      justify-items: center;
      max-width: 480px;
      margin: 0 auto;
    }
    /* Root-cause fix (2026-08-10): the previous pass pulled exact geometry
       from Figma node 68:7354 (silhouette x:449.723 y:0 w:362.553
       h:759.268 within a 1180x759.268 container) and converted it to
       left:38.11%/width:30.72%/height:100% — percentages that only
       reproduce Figma's proportions if the container they're applied to
       has the SAME aspect ratio as Figma's 1180x759 (1.55:1) canvas. This
       grid's actual container is capped at max-width:480px and grows
       tall from its own 7 stacked slot-rows (rendered ~480x945, a 0.51:1
       ratio) — applying Figma's percentages there squashed the silhouette
       into a ~147x945px sliver (confirmed via getBoundingClientRect
       before this fix), which is what "tiny/misaligned" actually was.
       Not a caching issue — a real aspect-ratio mismatch, verified via
       computed geometry, not just a screenshot glance (that's what let it
       through the previous pass's verification).
       Fix: stop borrowing Figma's absolute canvas ratio. Place the
       silhouette as a real grid item spanning the two center columns
       (where Head/Chest/Feet at col 2 and Neck/Legs at col 3 already put
       the visual spine) across every row, sized to fill that cell via
       object-fit:contain so the image's own real aspect ratio (329x689,
       confirmed equal to the Figma export ratio) is preserved no matter
       how tall the grid ends up rendering. */
    .cs-equip-doll-silhouette {
      grid-column: 2 / 4;
      grid-row: 1 / -1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      z-index: 0;
    }
    .cs-equip-slot-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      max-width: 96px;
    }
    .cs-equip-slot-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      background: var(--char-card-bg) url('../assets/images/character-sheet/equipped-gear/gear-slot.jpg') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cs-equip-slot-empty {
      cursor: pointer;
      transition: filter 0.15s;
      padding: 0;
      border: none;
    }
    .cs-equip-slot-empty:hover { filter: brightness(1.3); }
    .cs-equip-slot-filled {
      cursor: pointer;
    }
    .cs-equip-slot-locked {
      opacity: 0.4;
    }
    .cs-equip-slot-thumb {
      width: 76%;
      height: 76%;
      object-fit: cover;
      border-radius: calc(var(--radius) - 4px);
    }
    .cs-equip-slot-thumb-icon {
      font-size: 1.8rem;
      color: var(--gold-light);
    }
    .cs-equip-slot-unequip {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,15,0.75);
      border: none;
      border-radius: 50%;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 0.7rem;
      transition: color 0.15s;
    }
    .cs-equip-slot-unequip:hover { color: #f87171; }
    /* Sparkle badge — a real mechanical item is equipped here, independent
       of whatever art the slot is showing (cosmetic or mechanical
       fallback). Mirrors .cs-equip-slot-unequip's corner-badge treatment,
       opposite corner so the two never collide. */
    .cs-equip-slot-badge {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,15,0.75);
      border-radius: 50%;
      color: var(--gold-light);
      font-size: 0.65rem;
      pointer-events: none;
    }
    .cs-equip-slot-label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      text-align: center;
    }
    .cs-equip-slot-name {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      color: var(--char-text-muted);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    @media (max-width: 600px) {
      .cs-equip-doll {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        max-width: none;
      }
      .cs-equip-doll-silhouette { display: none; }
      .cs-equip-slot-wrap { width: 84px; }
    }
    .cs-equipped-damage-sep {
      display: inline-block;
      vertical-align: middle;
      color: var(--gold);
      font-size: 0.8em;
      margin: 0 0.4rem;
    }
    .cs-equipped-damage {
      display: inline-block;
      vertical-align: middle;
      font-size: 1rem;
      font-weight: 600;
      color: var(--gold);
    }
    .cs-equipped-damage-dice {
      font-family: var(--font-display);
    }
    .cs-equipped-damage-type {
      font-family: var(--font-body);
      font-size: 0.85em;
      color: var(--gold);
      opacity: 0.75;
    }
    .cs-equipped-damage-slash {
      color: var(--gold);
      opacity: 0.4;
      margin: 0 0.3rem;
    }
    .cs-tooltip {
      position: fixed;
      transform: translate(-50%, calc(-100% - 8px));
      background: rgba(14,18,32,0.98);
      border: 1px solid rgba(200,148,10,0.4);
      border-radius: 6px;
      padding: 0.4rem 0.65rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      color: var(--char-text-muted);
      white-space: nowrap;
      z-index: 99999;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .cs-equip-results {
      margin-top: 0.6rem;
      max-height: 320px;
      overflow-y: auto;
    }
    .cs-equip-result {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-equip-result:last-child { border-bottom: none; }
    .cs-equip-result:hover { background: rgba(255,255,255,0.04); }
    .cs-equip-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      flex: none;
      background: rgba(255,255,255,0.05);
    }
    .cs-equip-thumb-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 1rem;
    }
    .cs-equip-icon-armor::before      { content: '🛡'; }
    .cs-equip-icon-shield::before     { content: '🛡'; }
    .cs-equip-icon-weapon::before     { content: '⚔'; }
    .cs-equip-icon-accessory::before  { content: '💍'; }
    .cs-equip-result-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .cs-equip-result-name {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--white);
    }
    .cs-equip-result-stats {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      color: var(--char-text-faint);
    }
    /* "Currently equipped" line (this slot) + "Also equipped: X" flag
       (other-hand conflict) — reuse the same gold-tinted badge language
       already used elsewhere (e.g. .cs-inv-custom-btn/.cs-tooltip), not a
       new visual pattern. */
    .cs-equip-current {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--gold-light);
      margin-bottom: 0.6rem;
      min-height: 1em;
    }
    .cs-equip-result-flag {
      display: inline-block;
      margin-top: 0.15rem;
      padding: 0.1rem 0.45rem;
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--gold-light);
      width: fit-content;
    }
    .cs-equip-result-weight {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--char-text-faint);
      flex: none;
      text-align: right;
    }
    /* ── Slot popover — two independent rows (single-doll redesign) ── */
    .cs-slot-popover-section + .cs-slot-popover-section {
      margin-top: 1.1rem;
      padding-top: 1.1rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .cs-slot-popover-heading {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .cs-equip-current-clear {
      background: none;
      border: none;
      color: var(--char-text-faint);
      font-family: var(--font-sans);
      font-size: 0.7rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      margin-left: 0.4rem;
    }
    .cs-equip-current-clear:hover { color: #f87171; }
    .cs-wearing-select {
      width: 100%;
      background: var(--blue-600);
      border: 1px solid var(--blue-200);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      padding: 0.5rem 0.75rem;
      box-sizing: border-box;
    }
    .cs-wearing-empty {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-style: italic;
      color: var(--char-text-faint);
    }
    /* ── Rings — cosmetic-only, no doll position (Part B step 6) ── */
    .cs-ring-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.25rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    .cs-ring-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1 1 160px;
      max-width: 220px;
    }
    .cs-ring-label {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      text-align: center;
    }
    .cs-ring-select { font-size: 0.8rem; padding: 0.4rem 0.6rem; }
    /* ── Inventory ── */
    .cs-inv-input {
      flex: 1;
      min-width: 140px;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(200,148,10,0.45);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      padding: 0.45rem 0.75rem;
    }
    .cs-inv-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,148,10,0.25); }
    .cs-inv-input::placeholder { color: rgba(255,255,255,0.4); }
    .cs-inv-del {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.25rem;
      transition: color 0.15s;
    }
    .cs-inv-del:hover { color: #f87171; }
    .cs-inv-empty {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.2);
      font-style: italic;
      padding: 0.75rem 0;
      text-align: center;
    }
    .cs-inv-search-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .cs-inv-cat-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      padding: 0.45rem 0.6rem;
      flex: none;
    }
    /* Shared with the Notes tab's Pinned/Notes group labels — do not remove
       even though Inventory's own favorites grouping (which used to use
       this class too) is gone. */
    .cs-inv-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.55);
      margin: 0.6rem 0 0.35rem;
      font-weight: 700;
    }
    .cs-inv-qty-input {
      width: 54px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 5px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-align: center;
      padding: 0.2rem 0.3rem;
    }
    .cs-inv-search-wrap { position: relative; }
    /* Normal-flow, not absolute — this lives inside the +Add Item modal,
       which already scrolls (.cs-modal has its own max-height/overflow-y).
       An absolutely-positioned dropdown gets clipped by that ancestor's
       overflow box once the modal's own visible content is short (search
       input + category + button), cutting results off mid-list. In-flow
       lets the modal grow to contain it (up to its own 85vh cap, then the
       modal's own scrollbar takes over), while this list's own max-height
       + overflow-y keeps a long result set from making the modal huge. */
    .cs-inv-search-dropdown {
      display: none;
      background: rgba(12,16,28,0.98);
      border: 1px solid rgba(200,148,10,0.3);
      border-radius: 8px;
      margin-top: 0.3rem;
      max-height: 320px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .cs-inv-search-dropdown.visible { display: block; }
    .cs-inv-result-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-inv-result-row:last-child { border-bottom: none; }
    .cs-inv-result-row:hover { background: rgba(255,255,255,0.04); }
    .cs-inv-result-info { flex: 1; display: flex; flex-direction: column; gap: 0.1rem; cursor: default; }
    .cs-inv-result-name { font-family: var(--font-sans); font-size: 0.85rem; color: var(--white); }
    .cs-inv-result-meta { font-family: var(--font-sans); font-size: 0.7rem; color: var(--char-text-faint); }
    .cs-inv-result-add { display: flex; align-items: center; gap: 0.4rem; flex: none; }
    .cs-inv-result-add-btn {
      padding: 0.3rem 0.7rem;
      background: rgba(200,148,10,0.2);
      border: 1px solid rgba(200,148,10,0.4);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cs-inv-result-add-btn:hover { background: rgba(200,148,10,0.35); }
    .cs-inv-custom-btn {
      display: inline-block;
      width: auto;
      padding: 0.55rem 1.1rem;
      margin-top: 0.75rem;
      background: rgba(200,148,10,0.85);
      border: 1px solid rgba(200,148,10,1);
      border-radius: 8px;
      color: #1a1408;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cs-inv-custom-btn:hover { background: rgba(220,165,20,1); }
    .cs-inv-thumb {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      flex: none;
      background: rgba(255,255,255,0.05);
    }
    .cs-inv-thumb-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .cs-inv-edit {
      background: none;
      border: none;
      color: rgba(255,255,255,0.25);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 0.25rem;
      flex: none;
    }
    .cs-inv-edit:hover { color: var(--gold-light); }

    /* ── Inventory tab header, +Add Item, Equipped/Currency row (Figma 51:2260) ── */
    .cs-inv-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--char-ov-gap-xs);
      margin-bottom: var(--char-ov-gap-s);
      flex-wrap: wrap;
    }
    .cs-inv-additem-btn {
      background: var(--gold);
      border: none;
      border-radius: 9999px;
      padding: var(--char-ov-gap-xs) var(--char-ov-gap-s);
      color: var(--blue-800);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .cs-inv-additem-btn:hover { background: var(--gold-bright); }
    .cs-inv-top-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
      justify-content: space-between;
      margin-bottom: var(--char-ov-gap-m);
    }
    .cs-inv-top-col { flex: 1 1 0; min-width: 358px; }
    .cs-inv-top-col--currency { max-width: 480px; display: flex; flex-direction: column; align-items: center; }
    .cs-inv-col-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h4);
      color: var(--text);
      text-align: center;
      margin: 0 0 var(--char-ov-gap-xs);
    }
    .cs-inv-carrying-title { text-align: left; }

    /* ── Carrying bar — capacity = STR x 15, standard progress-bar reading:
       track (--blue-700) always full width, fill (--blue-300) grows from
       the left as current weight rises toward capacity. Live-tested report
       of "no visible fill" investigated via getComputedStyle() — both
       colors and the fill-width % were resolving correctly (confirmed
       against a real character: 14/195lb -> width:7.18%, backgroundColor
       rgb(71,84,127) on the fill vs rgb(18,24,41) on the track), so this
       wasn't a broken calc or an unresolved CSS variable. What's real:
       at low carry percentages the fill is a thin strip and the two blues
       are close enough in value that it reads as blank at a glance —
       widened the border accent and floored the width so the fill always
       has an unambiguous, visible presence. ── */
    .cs-inv-weight-bar {
      position: relative;
      width: 100%;
      height: 44px;
      border-radius: 9999px;
      background: var(--blue-700);
      overflow: hidden;
      margin-bottom: var(--char-ov-gap-m);
    }
    .cs-inv-weight-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      min-width: 8px;
      background: var(--blue-300);
      border-right: 2px solid var(--blue-200);
      transition: width 0.2s ease;
    }
    .cs-inv-weight-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
    }

    /* ── Own-inventory search/category filter (Figma 51:2260) ── */
    .cs-inv-filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: var(--char-ov-gap-xs);
      margin-bottom: var(--char-ov-gap-xs);
    }
    .cs-inv-filter-field {
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-2xs);
      flex: 1 1 240px;
      min-width: 200px;
    }
    /* Category is a short "Select"/category-name value, not free text —
       sizing it to match the Search field's width left a lot of empty
       dropdown space. Sized to content instead. */
    .cs-inv-filter-field--cat { flex: 0 1 auto; min-width: 0; }
    .cs-inv-filter-label { font-family: var(--font-body); font-size: 1rem; color: var(--text); }
    .cs-inv-filter-input, .cs-inv-filter-select {
      background: var(--blue-600);
      border: 1px solid var(--blue-200);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      padding: var(--char-ov-gap-xs) 1rem;
      box-sizing: border-box;

  // ── Helpers ───────────────────────────────────────────────────────
  function cap(str) { if (!str) return '—'; return str.charAt(0).toUpperCase() + str.slice(1); }
  function label(map, key) { if (!key) return '—'; return map[key] || cap((key+'').replace(/-/g,' ')); }
  // Ported verbatim from js/character.js — bg.bonuses entries are either an
  // ability delta ("+1 Wis") or a feat name ("Tough"); this is the same
  // parsing character.js uses for its own live preview, kept identical so
  // the two can't drift. Only the two functions are ported, not the data.
  var ABILITY_WORD_MAP = { 'Str':'str', 'Dex':'dex', 'Con':'con', 'Int':'int', 'Wis':'wis', 'Cha':'cha' };
  function parseBackgroundAbilityBonuses(bgObj) {
    var result = {};
    if (!bgObj || !bgObj.bonuses) return result;
    bgObj.bonuses.forEach(function(b) {
      var m = b.match(/^([+-]\d+)\s+(\w+)$/);
      if (m && ABILITY_WORD_MAP[m[2]]) {
        var key = ABILITY_WORD_MAP[m[2]];
        result[key] = (result[key] || 0) + parseInt(m[1]);
      }
    });
    return result;
  }
  function getBackgroundFeat(bgObj) {
    if (!bgObj || !bgObj.bonuses) return null;
    var feat = bgObj.bonuses.find(function(b) { return !/^[+-]\d+\s+\w+$/.test(b); });
    return feat || null;
  }
  function abMod(v) { var m = Math.floor((v-10)/2); return (m>=0?'+':'')+m; }
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getToken() {

  function showToast(msg, isError) {
    var t = document.getElementById('cs-toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'cs-toast' + (isError ? ' error' : '');
    void t.offsetWidth;
    t.classList.add('visible');
    setTimeout(function() { t.classList.remove('visible'); }, 3000);
  }

  // ── Appearance helpers ────────────────────────────────────────────
  function buildAppearanceDesc(app) {
    if (!app) return null;
    var parts = [];
    if (app.height && app.build) parts.push(cap(app.height) + ', ' + app.build + ' build.');
    else if (app.height) parts.push(cap(app.height) + '.');
    if (app.age) parts.push(cap(app.age) + '.');
    var face = [];
    if (app.face_shape) face.push(app.face_shape + ' face');
    // app-skin-tone is an <input type="color"> (character.html) — always a
    // hex value, never a word. Omit rather than print "#ffba66 skin".
    if (app.skin_tone && app.skin_tone.charAt(0) !== '#') face.push(app.skin_tone + ' skin');
    if (face.length) parts.push(cap(face.join(', ')) + '.');
    var eyes = [];
    if (app.eye_color) eyes.push(app.eye_color);
    if (app.eye_shape) eyes.push(app.eye_shape);
    if (eyes.length) parts.push(cap(eyes.join(', ')) + ' eyes.');
    var hair = [];
    if (app.hair_color) hair.push(app.hair_color);
    if (app.hair_style) hair.push(app.hair_style + ' hair');
    if (hair.length) parts.push(cap(hair.join(', ')) + '.');
    if (app.facial_hair && app.facial_hair !== 'none') parts.push(cap(app.facial_hair) + '.');
    if (Array.isArray(app.facial_markings) && app.facial_markings.length) {
      parts.push('Markings: ' + app.facial_markings.join(', ') + '.');
    }
    return parts.join(' ') || null;
  }

  // against all 72 real feature strings (12 classes × 6) in classes.features

  var FEAT_ICONS = [
    { pattern: /favored enemy/i,            icon: '&#127919;' },

    { pattern: /hide in plain sight/i,      icon: '&#128065;' },

    { pattern: /expertise/i,                icon: '&#127925;' },
    { pattern: /destroy undead/i,           icon: '&#128128;' },

    { pattern: /action surge/i,             icon: '&#9889;' },
    { pattern: /indomitable/i,              icon: '&#128074;' },
    { pattern: /martial arts/i,             icon: '&#129357;' },

    { pattern: /unarmored movement/i,       icon: '&#128168;' },
    { pattern: /metamagic/i,                icon: '&#128302;' },
    { pattern: /pact magic/i,               icon: '&#128138;' },
    { pattern: /eldritch invocation/i,      icon: '&#128520;' },
    { pattern: /mystic arcanum/i,           icon: '&#128220;' },
    { pattern: /arcane tradition/i,         icon: '&#9905;' },
    { pattern: /arcane recovery/i,          icon: '&#128260;' },
    { pattern: /spell mastery/i,            icon: '&#129497;' },
    { pattern: /spellbook/i,                icon: '&#128214;' },
    { pattern: /reckless attack/i,          icon: '&#9889;' },
    { pattern: /sneak attack/i,             icon: '&#128481;' },
    { pattern: /divine smite|smite/i,       icon: '&#9876;' },
    { pattern: /extra attack/i,             icon: '&#9876;' },
    { pattern: /fighting style/i,           icon: '&#9876;' },
    { pattern: /spellcasting/i,             icon: '&#10024;' },
    { pattern: /channel divinity/i,         icon: '&#9728;' },

    { pattern: /aura of protection/i,       icon: '&#128737;' },
    { pattern: /sacred oath|monastic tradition|ranger archetype|bard college|sorcerous origin|otherworldly patron/i, icon: '&#127775;' },
    { pattern: /subclass/i,                 icon: '&#127775;' },
    { pattern: /cunning action|uncanny dodge|evasion/i, icon: '&#128481;' },
    { pattern: /superiority|maneuver/i,     icon: '&#128171;' },
    { pattern: /ki point|flurry|patient defense/i, icon: '&#128074;' },
    { pattern: /eldritch blast/i,           icon: '&#128520;' },
    { pattern: /dark one|pact of/i,         icon: '&#128138;' },
    { pattern: /signature spell/i,          icon: '&#129497;' },
    // Generic fallback
    { pattern: /./,                         icon: '&#10022;' }
  ];
  function classFeatureIcon(raw) {
    for (var i = 0; i < FEAT_ICONS.length; i++) {
      if (FEAT_ICONS[i].pattern.test(raw)) return FEAT_ICONS[i].icon;
    }
    return '&#10022;';
  }
  // Splits a raw feature string into {name, description, level}. New logic
  // — not a port, character.js never split these, it only assigns an icon
  // and renders the whole string. " — " separates name from description
  // when present; " subclass at level N" / " at level N" is stripped off
  // the name (whichever side of the dash it landed on) into a level badge.
  function parseClassFeature(raw) {
    var name = raw, description = null, level = null;
    var dashIdx = raw.indexOf(' — ');
    if (dashIdx !== -1) {
      name = raw.slice(0, dashIdx);
      description = raw.slice(dashIdx + 3);
    }
    var subclassMatch = name.match(/^(.*) subclass at level (\d+)$/);
    if (subclassMatch) {
      name = subclassMatch[1];
      level = subclassMatch[2];
    } else {
      var levelMatch = name.match(/^(.*) at level (\d+)$/);
      if (levelMatch) {
        name = levelMatch[1];
        level = levelMatch[2];
      }
    }
    return { name: name, description: description, level: level };
  }
  function buildClassFeaturesHtml(features) {
    if (!Array.isArray(features) || !features.length) return '';
    var rows = features.map(function(raw) {
      var icon = classFeatureIcon(raw);
      var parsed = parseClassFeature(raw);
      return '<div class="cs-class-feature-row">'
        + '<span class="cs-class-feature-icon">' + icon + '</span>'
        + '<div class="cs-class-feature-txt">'
          + '<span class="cs-class-feature-name">' + escHtml(parsed.name) + '</span>'
          + (parsed.level ? '<span class="cs-class-feature-level">Level ' + parsed.level + '</span>' : '')
          + (parsed.description ? '<span class="cs-class-feature-desc">' + escHtml(parsed.description) + '</span>' : '')
        + '</div>'
      + '</div>';
    }).join('');
    return '<div class="cs-class-features-label">Key Features</div><div class="cs-class-features">' + rows + '</div>';
  }

  // ── Spell slots (Class tab, new — stopgap only) ─────────────────────
  // The build spec described this as relocating an "existing" tracker, but
  // no such UI has ever existed anywhere in this codebase (confirmed via
  // full-repo grep) despite character_sheet.spell_slots/spell_slots_max
  // both being real, empty ({}) columns on all 3 characters. Built minimal
  // and functional per the DM's explicit call: current/max pips per spell
  // level (1–9), wired to those columns, no new visual design beyond
  // existing card tokens. This is a stopgap, not the real Figma redesign —
  // see CLAUDE.md Decision Log.
  var SPELL_LEVELS = [1,2,3,4,5,6,7,8,9];
  function renderSpellSlots() {
    var el = document.getElementById('cs-class-spell-slots');
    if (!el) return;
    var maxObj = (SHEET && typeof SHEET.spell_slots_max === 'object' && SHEET.spell_slots_max) ? SHEET.spell_slots_max : {};
    var curObj = (SHEET && typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? SHEET.spell_slots : {};
    el.innerHTML = SPELL_LEVELS.map(function(lvl) {
      var max = parseInt(maxObj[lvl]) || 0;
      var cur = parseInt(curObj[lvl]) || 0;
      var pips = max > 0
        ? Array.from({ length: max }, function(_, i) {
            var n = i + 1;
            return '<button class="cs-spell-slot-pip' + (n <= cur ? ' filled' : '') + '" onclick="toggleSpellSlot(' + lvl + ',' + n + ')" aria-label="Level ' + lvl + ' slot ' + n + '"></button>';
          }).join('')
        : '<span class="cs-spell-slot-none">&mdash;</span>';
      return '<div class="cs-spell-slot-row">'
        + '<span class="cs-spell-slot-level">Level ' + lvl + '</span>'
        + '<span class="cs-spell-slot-pips">' + pips + '</span>'
        + '<span class="cs-spell-slot-max-edit">'
          + '<input class="cs-hp-input cs-spell-slot-max-input" type="number" min="0" placeholder="' + max + '" id="cs-spell-max-' + lvl + '">'
          + '<button class="cs-hp-apply" onclick="setSpellSlotMax(' + lvl + ')">Set Max</button>'
        + '</span>'
      + '</div>';
    }).join('');
  }
  // Clicking a filled pip un-fills it and everything after (spend a slot);
  // clicking an empty pip fills up to it (restore slots, e.g. after a rest)
  // — same toggle pattern as the death-save pips.
  function toggleSpellSlot(level, n) {
    if (!SHEET) return;
    var curObj = (typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? Object.assign({}, SHEET.spell_slots) : {};
    var cur = parseInt(curObj[level]) || 0;
    curObj[level] = (cur === n) ? n - 1 : n;
    SHEET.spell_slots = curObj;
    saveSheet({ spell_slots: curObj });
    renderSpellSlots();
  }
  function setSpellSlotMax(level) {
    if (!SHEET) return;
    var input = document.getElementById('cs-spell-max-' + level);
    var val = parseInt(input.value);
    if (isNaN(val) || val < 0) return;
    var maxObj = (typeof SHEET.spell_slots_max === 'object' && SHEET.spell_slots_max) ? Object.assign({}, SHEET.spell_slots_max) : {};
    var curObj = (typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? Object.assign({}, SHEET.spell_slots) : {};
    maxObj[level] = val;
    if ((parseInt(curObj[level]) || 0) > val) curObj[level] = val;
    SHEET.spell_slots_max = maxObj;
    SHEET.spell_slots = curObj;
    saveSheet({ spell_slots_max: maxObj, spell_slots: curObj });
    input.value = '';
    renderSpellSlots();
  }

  // Populated once fetchClassData() resolves — the `classes` table is the
  // source for these mechanical fields (see docs/character-sheet-redesign-handoff.md §6).
  function renderClassTabDynamic() {
    var detailsEl = document.getElementById('cs-class-details');
    var featuresEl = document.getElementById('cs-class-features');
