<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Anavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/hp-calc.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">

  <style>
    /* ── CSS Variables (mirrors character.css :root exactly) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


    /* ── Page Shell ── */
    body {
      background:
        linear-gradient(rgba(3,4,12,0.88), rgba(3,4,12,0.88)),
        url('../assets/images/regions/img-caparia-landscape.webp') center/cover fixed;
      color: var(--parchment);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav Bar ──
       Logo removed (was duplicating the PageTitle component below it —
       the mockup shows exactly one Anavale logo, the PageTitle's). Nav
       now holds only the Return-to-Wiki link. */
    .cs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 15, 0.92);
      border-bottom: 1px solid rgba(200,148,10,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
    }
    .cs-nav-back {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    .cs-nav-back:hover { opacity: 1; color: var(--gold); }

    /* ── Main content wrapper ── */
    .cs-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Section headers ── */
    .cs-section {
      margin-bottom: 1.75rem;
    }
    .cs-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--char-highlight-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-section-label::before {
      content: '✦';
      font-size: 0.55rem;
      opacity: 0.6;
    }

    /* ── Story panel ── */
    .cs-story-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      overflow: hidden;
    }
    .cs-story-row {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .cs-story-row:last-child { border-bottom: none; }
    .cs-story-key {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      padding-top: 0.05rem;
      line-height: 1.4;
    }
    .cs-story-val {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--char-text-muted);
      line-height: 1.7;
    }
    .cs-story-val em {
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ── Currency — 3 pills (Figma 51:2260) ── */
    .cs-currency-row {
      display: flex;
      gap: 0.6rem;
      width: 100%;
    }
    .cs-currency-pill {
      flex: 1 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: var(--char-ov-gap-2xs) var(--char-ov-gap-xs);
      border-radius: var(--radius-sm);
    }
    .cs-currency-pill--gold   { background: var(--currency-gold-coin); }
    .cs-currency-pill--silver { background: var(--currency-silver); }
    .cs-currency-pill--copper { background: var(--currency-copper); }
    .cs-currency-pill-label {
      font-family: var(--font-body);
      font-weight: 900;
      font-size: 18px;
      color: var(--blue-800);
      text-align: center;
    }
    .cs-currency-pill--copper .cs-currency-pill-label { color: var(--text); }
    /* Was background:white/border:1px solid black — plain unstyled-looking
       browser default, inconsistent with the sheet's dark theme. Matches
       .cs-mi-hp-num-input's existing direct-edit-number-field treatment
       now (light token bg, no border, dark text) rather than inventing a
       new pattern. */
    .cs-currency-input {
      width: 100%;
      background: var(--blue-50);
      border: none;
      color: var(--blue-800);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 18px;
      text-align: center;
      padding: var(--char-ov-gap-2xs) var(--char-ov-gap-xs);
      box-sizing: border-box;
    }
    .cs-currency-input::-webkit-outer-spin-button,
    .cs-currency-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    /* Round 3 Follow-up: field is now always readonly (DM-only editing) —
       scoped the focus glow to :not([readonly]) so it can't visually imply
       this is still an editable field, per this round's model change. No
       consumer currently renders a non-readonly .cs-currency-input, but
       scoping this way (rather than deleting the rule outright) keeps the
       glow available if a future DM-facing surface ever reuses this exact
       class for a real edit field. */
    .cs-currency-input:not([readonly]):focus { outline: none; box-shadow: 0 0 0 2px rgba(240,180,41,0.4); }
    .cs-currency-input[readonly] { cursor: default; }

    /* ══════════════════════════════════════════════════════════════
       OVERVIEW + ABILITY SCORES (redesign)
       Figma P0tcVgf02XeI13Tz0TtRaX — desktop 36:310 / mobile 36:435
       Breaks out of .cs-wrap's 820px cap — this is the one part of
       the sheet wide enough to need it (portrait card + 3 overview
       cards side by side). Rest of the page stays at 820px.
       ══════════════════════════════════════════════════════════════ */
    .cs-ov-breakout {
      width: 100vw;
      position: relative;
      left: 50%;
      margin-left: -50vw;
      margin-bottom: 2rem;
    }
    .cs-ov-inner {
      max-width: 1560px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Page title (Figma 51:1385) — logo + "Character Sheet" ── */
    .cs-sheet-title-logo {
      height: 22px;
      width: auto;
      display: block;
      margin-bottom: 0.3rem;
    }
    .cs-sheet-title-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      color: var(--text);
    }

    /* ── Portrait / money / weight card ── */
    .cs-ov-maininfo {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-m);
      align-items: flex-start;
    }
    .cs-ov-portrait {
      position: relative;
      width: 358px;
      min-height: 420px;
      flex-shrink: 0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      background: var(--surface-2);
    }
    .cs-ov-portrait-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    .cs-ov-portrait-upload-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 3;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(10,14,24,0.88);
      color: white;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .cs-ov-portrait-upload-btn:hover { background: rgba(200,148,10,0.35); border-color: rgba(200,148,10,0.6); }

    /* ── Name / pills / blurb / accordions ── */
    .cs-ov-info {
      flex: 1 1 358px;
      min-width: 358px;
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-main {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cs-ov-name {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 4.5vw, 4rem);
      line-height: 1.05;
      color: var(--text);
    }
    .cs-ov-blurb {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      line-height: var(--line-height);
      color: var(--text);
    }

    /* ── Accordion shell (Overview / Ability Scores) ──
       Round 2 QA: "confusing as to what is expanded and what isn't...
       we should have the dark blue card style for the entire background
       of all accordions to help differentiate each accordion from one
       another." Whole shell (header + body together) now gets the same
       --blue-700 background every individual card on this page already
       uses (.cs-ov-card/.cs-story-card/.cs-limuse-group/etc) — reused,
       not a new color. One exception: the Class tab's Overview accordion
       (#cs-class-overview-acc) is nested INSIDE .cs-ov-class-card (itself
       already blue-700, wrapping Basic info + this accordion as one visual
       unit) — a second identical background there would just add invisible
       padding, so it's reset back to transparent via the override below;
       that whole card is already one distinct block against the page. */
    .cs-ov-acc {
      width: 100%;
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      box-sizing: border-box;
    }
    .cs-ov-class-card .cs-ov-acc { background: none; padding: 0; border-radius: 0; }
    .cs-ov-acc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 0 var(--char-ov-gap-2xs);
      gap: var(--char-ov-gap-2xs);
    }
    /* Tab page title (Figma 51:1103 "YOUR STORY") — bigger than the
       Who You Are/Your Background/Your Past section titles below it
       (.cs-ov-acc-title, --text-4xl) so it reads as the page heading, not
       another accordion. One per tab (pageTitleHtml()) — Your Story,
       Ability Scores, Inventory, Class all carry the same heading. */
    .cs-page-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      color: var(--text);
      margin-bottom: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h3);
      color: var(--text);
      text-align: left;
    }
    .cs-ov-acc-toggle {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-toggle-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .cs-ov-acc-chevron {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      color: var(--surface-0);
      font-size: 0.8rem;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    /* Expand/collapse transition — grid-template-rows 1fr→0fr rather than a
       JS-measured max-height, so it works for any content height without
       recalculating. cs-ov-acc-body-outer is the grid container/animated
       element; cs-ov-acc-body (unchanged internal flex layout) just needs
       overflow:hidden so it clips cleanly mid-transition. */
    .cs-ov-acc-body-outer {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 0.22s ease, opacity 0.2s ease;
    }
    .cs-ov-acc-body {
      overflow: hidden;
      min-height: 0;
      padding-bottom: var(--char-ov-gap-2xs);
      display: flex;
      flex-direction: column;
      /* Round 2 QA: "not enough space between sections" — bumped from
         gap-m to the largest existing gap token rather than a new value.
         This is the right amount for accordion-to-card separation (Who You
         Are/Your Background/Your Past content, the Class tab's Overview
         column pair) — but Round 2 Revisions QA caught that the same rule
         also governs the Features accordion's *internal* groups
         (Class-Specific/Spell Slots/Spells Prepared), where it read as
         genuine dead space, especially after a visually-short card like
         Wild Shape's "Unlocks at level 2" message. .cs-ov-acc-body--tight
         below scopes a smaller gap to that one case instead of reverting
         this shared default for every accordion. */
      gap: var(--char-ov-gap-l);
    }
    /* Round 3 QA: DM re-flagged real remaining dead space after the Round 2
       Revisions gap-s (26px) tightening — re-measured live rather than
       assumed still-fine: each .cs-limuse-group already carries its own
       26px padding on every side (a real, Figma-sourced value shared with
       .cs-effect-panel, not something to shrink) plus a visible blue-700
       background, so a *short* group (Class-Specific/Wild Shape — 2 lines
       of real content) reads as mostly empty box once you add another 26px
       of gap on top before the next box starts. The padded, backgrounded
       boxes already read as clearly separate from each other at a much
       tighter gap — dropped to gap-2xs (8px), the smallest existing gap
       token, rather than inventing a new one. */
    .cs-ov-acc-body--tight { gap: var(--char-ov-gap-2xs); }
    .cs-ov-acc.collapsed .cs-ov-acc-body-outer { grid-template-rows: 0fr; opacity: 0; }
    .cs-ov-acc.collapsed .cs-ov-acc-chevron { transform: rotate(180deg); }

    /* ── Overview cards (alignment / background / gigglegloom) ── */
    .cs-ov-cards {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-card {
      flex: 1 0 0;
      min-width: 300px;
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-xs);
      background: var(--blue-700);
      border-radius: 0 24px 24px 0;
      padding-right: 16px;
      overflow: hidden;
    }
    .cs-ov-card-img {
      width: 75px; height: 75px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ov-card-icon-wrap {
      width: 75px; height: 75px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .cs-ov-card-icon {
      width: 40px; height: 40px;
      filter: drop-shadow(0 0 14px currentColor);
    }
    .cs-ov-card-txt {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .cs-ov-card-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-card-title {
      font-family: var(--font-display);
      font-size: var(--char-ov-h4);
      color: var(--text);
    }
    .cs-ov-card-sub {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--text);
    }

    /* ── Class tab — top-level section stack (Round 2 QA: more breathing
       room between Class card / Features accordion / Spellcasting /
       Spells Learned than the 0-gap they got by just being sibling divs
       inside one shared .cs-ov-inner). Hidden cards (display:none until
       their data loads) contribute no gap, so this doesn't create a
       phantom gap before Spellcasting/Spells Learned show up. ── */
    .cs-class-tab-stack { display: flex; flex-direction: column; gap: var(--char-ov-gap-l); }

    /* ── Class card ── */
    .cs-ov-class-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-class-basic {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-s);
    }
    .cs-ov-class-img {
      width: 56px; height: 56px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .cs-ov-class-txt { flex: 1 0 0; min-width: 0; }
    .cs-ov-class-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-class-name {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-level {
      flex-shrink: 0;
      background: var(--surface-0);
      border-radius: 8px;
      padding: var(--char-ov-gap-2xs);
      text-align: center;
    }
    .cs-ov-class-level-label {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.72rem;
      color: var(--gold);
    }
    .cs-ov-class-level-val {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-details {
      display: flex;
      flex-wrap: wrap;
      /* Round 3 QA: no align-items meant the default stretch, forcing this
         block's two .cs-ov-class-detail children (Primary/Saves/Casting,
         Armor/Tools/Weapons) to equal height — since Casting Spells' prose
         is the tallest cell by far, the shorter Armor/Tools/Weapons grid
         stretched to match it, and grid's own align-content:normal (which
         behaves as stretch here) spread that leftover space evenly across
         its 3 auto rows, adding real, measurable gaps between rows that
         had nothing to do with the row-alignment fix below. flex-start
         lets each block size to its own real content. */
      align-items: flex-start;
      gap: var(--char-ov-gap-m);
    }
    /* Round 3 QA: was two independent flex columns (keys, values), each a
       stack of <p>s relying on every row sharing the same fixed 24px
       line-height to stay aligned row-for-row. Real bug, not a data-mapping
       one — confirmed live (Hana/Druid): Armor's value ("Light, Medium,
       Shields (no metal)") wraps to 2 lines in this column width, but its
       key ("Armor:") stays 1 line, so every value below it in that column
       shifts down by one row relative to its own key — Tools' key ends up
       next to the tail of Armor's wrapped text (reads as no value), and
       Weapons' key ends up next to Tools' actual value, with Weapons' own
       value dangling in an extra row with no key beside it at all (reads
       as "Weapons: Herbalism Kit / Simple (no metal)"). Fixed by locking
       each key+value pair to the same grid row instead of trusting two
       columns to stay in sync — grid-auto-flow row-major placement across
       2 columns means key/value pairs emitted in DOM order (key,val,key,
       val,...) land on the same row automatically, and a wrapped value's
       row simply grows (row-gap:0 keeps un-wrapped rows exactly as tight
       as before), it can never push a later row's key out of sync again. */
    .cs-ov-class-detail {
      flex: 1 0 0;
      min-width: 240px;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 10px;
      row-gap: 0;
      align-items: start;
    }
    .cs-ov-class-detail-key {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .cs-ov-class-detail-key, .cs-ov-class-detail-val { line-height: 24px; margin: 0; }
    .cs-ov-class-detail-val {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      color: var(--text);
      min-width: 0;
    }

    /* ── Class tab — Overview accordion two-column layout (Figma 52:2705,
       node 94:1560 "details", pulled fresh 2026-08-14) — Class details
       left, Key Features right. gap-42px and min-w-171px are exact Figma
       values (new --char-ov-gap-l token; 171px is a one-off, no existing
       token matched it). flex-wrap so both columns stack on narrow
       viewports, same pattern .cs-story-cards already uses. */
    .cs-class-overview-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-l);
    }
    .cs-class-overview-col {
      flex: 1 0 0;
      min-width: 171px;
    }
    .cs-class-col-heading {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h4);
      color: var(--text);
      margin-bottom: 10px;
    }
    /* ── Class tab — Key Features (Figma 52:2705/52:2710) ──────────────
       Alternating row shading is pure CSS nth-child, no data dependency. */
    .cs-class-features-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      margin: var(--char-ov-gap-s) 0 var(--char-ov-gap-2xs);
    }
    .cs-class-features {
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .cs-class-feature-row {
      display: flex;
      align-items: flex-start;
      gap: var(--char-ov-gap-2xs);
      padding: 0.65rem var(--char-ov-gap-2xs);
    }
    .cs-class-feature-row:nth-child(even) { background: var(--blue-500); }
    .cs-class-feature-icon { font-size: 1.1rem; line-height: 1.4; flex-shrink: 0; }
    .cs-class-feature-txt { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .cs-class-feature-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text);
    }
    .cs-class-feature-level {
      margin-left: 0.5rem;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .cs-class-feature-desc {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.86rem;
      color: var(--text);
      opacity: 0.85;
    }

    /* ── Class-Specific limited-use tracker (Features accordion, Figma
       52:2705, node 94:1772 "slots" — pulled fresh 2026-08-14, verified via
       get_design_context, not the handoff doc's paraphrase: the doc claimed
       the feature name was Cinzel Decorative, the real frame is plain
       Roboto Bold, matching the values used below). One shared box per
       group (mirrors .cs-effect-panel's blue-700/radius-lg/padding-s
       choice), each feature its own .cs-limuse-card inside it — gap-xs
       between cards, no divider lines (unlike Special Effects' per-item
       border — confirmed via the real node tree, this group uses plain
       gap spacing instead). ── */
    .cs-limuse-group {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-xs);
      width: 100%;
      box-sizing: border-box;
    }
    .cs-limuse-group-label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h4);
      color: var(--text);
    }
    .cs-limuse-card {
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-xs);
      width: 100%;
    }
    .cs-limuse-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--char-ov-gap-2xs);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: var(--char-ov-pl);
      color: var(--text);
    }
    .cs-limuse-name { flex: 1 0 0; min-width: 0; }
    .cs-limuse-count { flex-shrink: 0; text-align: right; }
    /* Fully-rounded pill (radius:999px), overflow-clip so each segment's
       square corners get cropped to the pill shape by the wrapper alone —
       segments themselves need no border-radius of their own. */
    .cs-limuse-bar {
      display: flex;
      gap: 3px;
      align-items: stretch;
      width: 100%;
      border: 1px solid var(--blue-200);
      border-radius: 999px;
      overflow: hidden;
    }
    .cs-limuse-seg {
      flex: 1 0 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--char-ov-gap-2xs) 8px;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--char-ov-pl);
      white-space: nowrap;
    }
    /* Available (not yet spent) — bright solid green, dark text for
       contrast. Spent — same green at 25% opacity, light text at 50%
       opacity. Available sits left, spent sits right (getAttunableEquipped
       Items()-style left-to-right fill order, confirmed against the real
       Figma example — opposite of the Hit Dice pip convention, which spends
       left-to-right instead; not made consistent with it on purpose, this
       matches what the real design shows for this specific component). */
    .cs-limuse-seg.active { background: var(--green); color: var(--blue-900); }
    .cs-limuse-seg.spent { background: rgba(34,197,94,0.25); color: var(--text); opacity: 0.5; }
    /* Round 2 QA: a feature not yet unlocked (e.g. Wild Shape before level
       2) rendered as a bare "Used: 0/0" with no bar and no explanation —
       "looks broken without" one. Shown instead of the segmented bar
       whenever computeLimitedUseMax() is genuinely 0 because the
       character's level hasn't reached the feature's first threshold. */
    .cs-limuse-locked { color: var(--char-text-faint); font-size: 0.82rem; font-style: italic; }

    /* ── Spell Slots (Features accordion, sibling group to Class-Specific —
       Handoff B, Figma 52:2705). Reuses .cs-limuse-* structure verbatim
       (group/card/header/name/count/bar), just with a --magic-blue segment
       treatment instead of Class-Specific's --green, since this is a
       distinct component per the real Figma pull, not a generic pip. ── */
    .cs-spellslot-explainer {
      font-family: var(--font-body);
      font-size: 0.82rem;
      color: var(--text);
      opacity: 0.85;
      line-height: 1.5;
    }
    .cs-spellslot-explainer ul { margin: 0.35rem 0 0; padding-left: 1.1rem; }
    .cs-spellslot-seg.active { background: var(--magic-blue); color: var(--blue-900); }
    .cs-spellslot-seg.spent { background: var(--magic-blue-dim); color: var(--text); opacity: 0.5; }
    .cs-spell-slot-none { color: var(--char-text-faint); font-size: 0.8rem; }

    /* ── Spellcasting stats (Class tab card, redesigned Round 2 QA) ──
       "Looks way too sparse and the text is too small and too far apart...
       needs to be more visually intriguing and not have so much negative
       space." Was 3 stacked plain .cs-ab-skill rows; now a 3-column row of
       badges — same visual language as the header's AC/Init badges
       (label-above-value, blue-600 fill against the card's blue-700, big
       Cinzel Decorative number) instead of a new pattern. ── */
    .cs-spellcast-stats {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
    }
    .cs-spellcast-stat {
      flex: 1 1 160px;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      background: var(--blue-600);
      border: 1px solid var(--blue-400);
      border-radius: var(--radius);
      padding: var(--char-ov-gap-xs) var(--char-ov-gap-2xs);
      text-align: center;
    }
    .cs-spellcast-stat-label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--blue-100);
    }
    .cs-spellcast-stat-val {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h3);
      color: var(--text);
    }

    /* ── Spells Prepared (Features accordion, sibling group — Handoff B) ── */
    .cs-prepared-header-row { display: flex; justify-content: space-between; align-items: center; gap: var(--char-ov-gap-2xs); }
    .cs-prepared-count { font-family: var(--font-body); font-weight: 700; font-size: var(--char-ov-pl); color: var(--text); flex-shrink: 0; }
    .cs-prepared-explainer { font-family: var(--font-body); font-size: 0.82rem; color: var(--text); opacity: 0.85; margin-top: 0.2rem; }
    .cs-prepared-pills { display: flex; flex-wrap: wrap; gap: var(--char-ov-gap-2xs); margin-top: var(--char-ov-gap-xs); }
    .cs-prepared-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: var(--magic-blue);
      color: var(--blue-900);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.82rem;
      border: none;
    }
    .cs-prepared-pill-x {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.7;
      cursor: pointer;
      padding: 0;
      font-size: 0.75rem;
      line-height: 1;
    }
    .cs-prepared-pill-x:hover { opacity: 1; }
    .cs-prepared-pill--add {
      background: none;
      border: 1px dashed var(--blue-200);
      color: var(--text);
      opacity: 0.8;
      cursor: pointer;
    }
    .cs-prepared-pill--add:hover { opacity: 1; }

    /* ── Spells Learned (Class tab, full-width card). Round 2 Revisions —
       DM-assignment-only model: this table only ever displays
       character_sheet.learned_spells, no self-serve add/browse UI (the
       search/filter row from the old eligible-pool browser is gone
       entirely, per DM decision). Table styling reuses .cs-inv-table
       verbatim (same tr/td/th classes as the Inventory tab's item table). */
    .cs-spells-learned-card { margin-top: var(--char-ov-gap-s); }
    .cs-spell-thumb { width: 28px; height: 28px; object-fit: contain; display: block; margin: 0 auto; }
    .cs-spell-thumb-fallback { display: block; text-align: center; opacity: 0.5; font-size: 1rem; }
    /* Column widths (Round 2 Revisions 2c) — Level/Category/Casting Time/
       Range/Components/Duration all carried excess whitespace under
       table-layout:auto's default even-ish distribution of leftover
       width, while Description (the most information-dense column, real
       prose) got no proportional benefit from it. Explicit widths on the
       narrow columns let table-layout:auto concentrate the remaining space
       into Name/Description instead, whose own content is what actually
       needs it. Scoped to .cs-sl-table (this table only) via nth-child —
       matches this table's fixed 10-column layout exactly, doesn't touch
       the Inventory tab's own reuse of .cs-inv-th/.cs-inv-td for a
       different column set. */
    .cs-sl-table th:nth-child(1), .cs-sl-table td:nth-child(1) { width: 70px; }
    .cs-sl-table th:nth-child(2), .cs-sl-table td:nth-child(2) { width: 44px; }
    .cs-sl-table th:nth-child(4), .cs-sl-table td:nth-child(4) { width: 60px; }
    .cs-sl-table th:nth-child(5), .cs-sl-table td:nth-child(5) { width: 105px; }
    .cs-sl-table th:nth-child(6), .cs-sl-table td:nth-child(6) { width: 115px; }
    .cs-sl-table th:nth-child(7), .cs-sl-table td:nth-child(7) { width: 90px; }
    .cs-sl-table th:nth-child(8), .cs-sl-table td:nth-child(8) { width: 90px; }
    .cs-sl-table th:nth-child(9), .cs-sl-table td:nth-child(9) { width: 135px; }

    /* ── Your Story cards (Who You Are / Your Background / Your Past) ──
       Figma 51:1103/51:1218. Wider description cards, not small pills —
       real player answers run from short phrases to full paragraphs. ── */
    .cs-story-cards {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: var(--char-ov-gap-s);
      margin-top: var(--char-ov-gap-m);
    }
    .cs-story-card {
      flex: 1 0 260px;
      min-width: 240px;
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-story-card-head { display: flex; align-items: center; gap: 0.6rem; }
    .cs-story-card-img {
      width: 75px;
      height: 75px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    /* min-width:0 override needed — flex children default to min-width:auto
       (their content's min-content size), so an unbreakable long title word
       (e.g. a one-word background name like "Greywitnessed") pushed this
       row wider than the card, clipping raggedly at the card edge with no
       ellipsis. Same class of fix .cs-past-card-body already has. */
    .cs-story-card-headtext { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .cs-story-card-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue-100);
    }
    .cs-story-card-title {
      font-family: var(--font-display);
      font-size: var(--char-ov-h4);
      color: var(--text);
      /* Wrap rather than truncate — these are lore names (backgrounds,
         orgs, etc.) a player should be able to read in full, not the kind
         of secondary label an ellipsis (.cs-equip-slot-name's pattern) is
         fine for. overflow-wrap only breaks a word when it would otherwise
         overflow, so normal multi-word titles wrap at spaces as before. */
      overflow-wrap: break-word;
    }
    .cs-story-card-sub {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.78rem;
      color: var(--text);
      opacity: 0.75;
    }
    /* Your Past cards (Figma 51:1218) — fixed 358px width (not the flexible
       Your Background sizing), 18px titles (not 26px), and two layouts:
       default puts the icon beside just the eyebrow/title header row;
       --full (Left Behind, Why You Left) puts the icon beside the entire
       content column instead — a real structural split, not a styling one. */
    .cs-past-card {
      width: 358px;
      flex: 0 0 358px;
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-xs);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cs-past-card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h5);
      color: var(--text);
      /* Same gap as .cs-story-card-title, and same fix — needed even for
         the --full layout, where the title sits in .cs-past-card-body
         (already min-width:0) but the title text itself still has no
         wrap handling of its own: min-width:0 stops the box from being
         pushed wider, it doesn't make unbreakable text wrap within it. */
      overflow-wrap: break-word;
    }
    .cs-past-card--full {
      flex-direction: row;
      gap: 0.75rem;
    }
    .cs-past-card--full .cs-story-card-img { margin-top: 0; }
    .cs-past-card-body {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      min-width: 0;
    }
    .cs-story-card-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.88rem;
      line-height: var(--line-height);
      color: var(--text);
      opacity: 0.9;
    }
    /* Benefits box (Figma 51:1218) — typed lines, not pill tags. Lighter
       than the card's own blue/700 background so it reads as a distinct
       inset panel. */
    .cs-story-benefits {
      margin-top: 0.5rem;
      background: var(--blue-600);
      border-radius: var(--radius);
      padding: 8px;
    }
    .cs-story-benefit-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      color: var(--currency-gold-coin);
      margin-bottom: 0.2rem;
    }
    .cs-benefit-line {
      font-size: 12px;
      color: var(--text);
      margin-top: 0.2rem;
    }
    .cs-benefit-line:first-of-type { margin-top: 0; }
    .cs-benefit-amount { font-weight: 700; color: var(--green); }
    .cs-benefit-amount.negative { color: var(--red); }
    .cs-benefit-name { font-weight: 700; color: var(--text); }
    .cs-benefit-desc { font-weight: 300; color: var(--text); }
    .cs-benefit-suffix { font-weight: 300; color: var(--char-text-muted); }
    /* "Personal quest" line (Why You Left) — plain text, not a Benefits box. */
    .cs-past-quest {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 16px;
      line-height: 24px;
      color: var(--text);
      margin-top: 0.5rem;
    }
    .cs-story-quest-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      margin-right: 0.3rem;
    }

    /* ── Who You Are (Figma 51:1103) — ONE card: summary heading/paragraph
       + personality items as flush left-border strips, not separate boxes
       like Your Background/Your Past. ── */
    .cs-whoyouare-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-summary-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 18px;
      line-height: 24px;
      color: var(--text);
      margin: 0.5em 0 0;
    }
    .cs-whoyouare-items {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-xs);
      margin-top: var(--char-ov-gap-s);
    }
    .cs-whoyouare-item {
      flex: 1 1 200px;
      border-left: 4px solid var(--blue-400);
      padding: 8px 8px 8px 18px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .cs-whoyouare-item-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h5);
      color: var(--text);
    }

    /* ── Ability score cards ──
       Round 2 QA: "add wrapping so cards flow onto multiple rows as the
       screen narrows." flex-wrap was already set here, but it had a real
       bug, not just a missing property — with flex:1 0 0 on the cards,
       whichever card(s) land alone on a wrapped row have nothing to share
       growth with, so they stretch to fill that entire row width while
       their siblings above sit cramped at their 100px floor (confirmed
       live: 6 cards at ~610px viewport rendered 5 squeezed to 102px and a
       lone 6th stretched to 560px on its own line — exactly the "squishes
       illegibly" bug, just with an extra "then one card blows up huge"
       twist flexbox's independent-per-line growth causes). CSS Grid fixes
       this at the root: grid tracks are shared down every row, so a
       leftover card on the last row keeps the same column width as every
       card above it instead of stretching — no per-row growth mismatch is
       possible. Round 2 Revisions QA: floor raised 100px→200px, confirmed
       as the real current minimum before changing it (not assumed) — "at
       all times," including mobile, so the 84px mobile override below is
       raised to match rather than left as a separate, smaller floor. At
       narrow widths this means cards genuinely stack one-per-row (2×200px
       + gap already exceeds a 375px viewport) — a deliberate, direct
       consequence of the instruction, not an oversight. */
    .cs-ab-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      width: 100%;
    }
    .cs-ab-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Round 3 QA: Round 2 added justify-content:center here to balance
         cards with less content (CON's "No skills") against taller
         siblings. DM reviewed the live result and reverted this — cards
         go back to natural top-aligned flow. Equal row height still holds
         (.cs-ab-cards is a Grid with default align-items:stretch, untouched
         by this revert), only the internal content alignment changed. */
      padding: var(--char-ov-gap-xs) 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(to bottom, var(--blue-700), var(--ab-gradient));
      box-shadow: 2px 5px 11px 0 var(--ab-glow), 0 0 120px 0 var(--ab-glow);
    }
    .cs-ab-card--str { --ab-glow: var(--ability-str-glow); --ab-gradient: var(--ability-str-gradient); }
    .cs-ab-card--dex { --ab-glow: var(--ability-dex-glow); --ab-gradient: var(--ability-dex-gradient); }
    .cs-ab-card--con { --ab-glow: var(--ability-con-glow); --ab-gradient: var(--ability-con-gradient); }
    .cs-ab-card--int { --ab-glow: var(--ability-int-glow); --ab-gradient: var(--ability-int-gradient); }
    .cs-ab-card--wis { --ab-glow: var(--ability-wis-glow); --ab-gradient: var(--ability-wis-gradient); }
    .cs-ab-card--cha { --ab-glow: var(--ability-cha-glow); --ab-gradient: var(--ability-cha-gradient); }
    .cs-ab-img {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ab-txt {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--char-ov-gap-2xs) 0;
      text-align: center;
    }
    .cs-ab-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1.1rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ab-tip {
      display: inline-block;
      margin-left: 0.3rem;
      width: 13px;
      height: 13px;
      line-height: 13px;
      text-align: center;
      vertical-align: middle;
      border-radius: 50%;
      background: var(--gold);
      color: var(--blue-800);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 9px;
      cursor: help;
    }
    .cs-ab-val {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ab-mod {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-ab-mod-num { font-weight: 700; }
    .cs-ab-mod-num.positive { color: var(--green); }
    .cs-ab-mod-num.negative { color: var(--red); }
    /* Skills list under each ability card — no Figma reference, ad-hoc
       against existing tokens (same approach as Special Effects). */
    .cs-ab-skills {
      width: 100%;
      align-self: stretch;
      box-sizing: border-box;
      padding: 0 var(--char-ov-gap-xs) var(--char-ov-gap-2xs);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .cs-ab-skills-empty {
      width: 100%;
      align-self: stretch;
      box-sizing: border-box;
      padding: 0 var(--char-ov-gap-xs) var(--char-ov-gap-2xs);
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--char-text-faint);
      text-align: center;
    }
    .cs-ab-skill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-body);
      font-size: 0.8rem;
    }
    /* Fixed-width marker slot so the name column lines up whether the row
       shows the "Prof." text label or is empty (flat-bonus/neither). */
    .cs-ab-skill-marker {
      flex: 0 0 26px;
      display: flex;
      align-items: center;
    }
    .cs-ab-skill-prof-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--gold);
    }
    /* Three distinct states — proficient ("Prof." text label), flat +1 from
       an imagined-past bonus (no marker — its amount is called out in parens
       next to the total instead; a dot here read as a second, unexplained
       state per DM feedback), neither (no marker, muted name). */
    .cs-ab-skill--proficient .cs-ab-skill-name { color: var(--text); font-weight: 700; }
    .cs-ab-skill--flat .cs-ab-skill-name { color: var(--text); font-weight: 400; }
    .cs-ab-skill--none .cs-ab-skill-name { color: var(--char-text-faint); font-weight: 400; }
    .cs-ab-skill-name { flex: 1 1 auto; }
    .cs-ab-skill-total { flex: 0 0 auto; font-weight: 700; color: var(--text); }
    .cs-ab-skill-total.positive { color: var(--green); }
    .cs-ab-skill-total.negative { color: var(--red); }
    /* Saving-throw row — one .cs-ab-skill row per card, wrapped for its own
       spacing (mirrors .cs-ab-skills' side padding, plus a small gap before
       the skills list below it so "Save" doesn't read as just another skill). */
    .cs-ab-save {
      width: 100%;
      align-self: stretch;
      box-sizing: border-box;
      padding: 0 var(--char-ov-gap-xs);
      margin-bottom: 0.4rem;
    }
    /* Passive Perception — small gold-accented pill on the WIS card only,
       not a rollable stat so deliberately distinct from the skill list
       (smaller scale than .cs-mi-ac-badge — this isn't as load-bearing as AC). */
    .cs-ab-passive {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.35rem;
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gold);
      cursor: help;
    }
    .cs-ab-passive-label {
      font-family: var(--font-body);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--gold);
    }
    .cs-ab-passive-val {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
    }
    /* Shared Proficiency/Saving Throw explainer, under the Ability Scores
       page title — replaces the per-card Save "?" tooltips (all 6) and
       STR's separate blue "i" intro-tip icon, which were duplicated noise
       for one concept repeated six times with minor variation. Round 3 QA:
       was one undifferentiated paragraph running both concepts together;
       DM asked for two clearly separated blocks, each with its own bold
       gold sub-heading + body paragraph. */
    .cs-ab-explainer {
      max-width: 760px;
      margin-bottom: var(--char-ov-gap-m);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-s);
    }
    .cs-ab-explainer-block + .cs-ab-explainer-block { margin-top: 0; }
    .cs-ab-explainer-heading {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--gold);
      margin-bottom: 0.25rem;
    }
    .cs-ab-explainer-body {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.95rem;
      line-height: var(--line-height);
      color: var(--text);
      opacity: 0.85;
    }
    .cs-feat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: var(--char-ov-gap-m);
    }
    .cs-feat-chip {
      background: var(--char-card-bg-subtle);
      border: 1px solid var(--char-highlight-border);
      border-radius: var(--char-radius);
      padding: 0.5rem 0.85rem;
      max-width: 320px;
    }
    .cs-feat-chip-name {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }
    .cs-feat-chip-desc {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-muted);
      line-height: 1.5;
      margin-top: 0.2rem;
    }

    /* ══════════════════════════════════════════════════════════════
       TAB SHELL
       Character Sheet Tab Redesign v1 — docs build spec, Aug 9 2026.
       Pure scaffolding pass: bar + show/hide only. Only "Your Story"
       carries real content today; Ability Scores/Inventory/Class are
       placeholders until their own build slices land.
       ══════════════════════════════════════════════════════════════ */
    /* Tab bar (Figma 51:1103) — pill tabs, not underlines. Inactive tabs sit
       at 50% text opacity on a darker fill; the active tab gets full
       opacity on a lighter fill. */
    .cs-tabbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      border-bottom: 4px solid var(--blue-400);
      overflow-x: auto;
    }
    .cs-tab-btn {
      background: var(--blue-600);
      border: none;
      border-radius: 8px 8px 0 0;
      padding: 10px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      opacity: 0.5;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    .cs-tab-btn:hover { opacity: 0.75; }
    .cs-tab-btn.active { background: var(--blue-400); opacity: 1; }
    .cs-tab-content[hidden] { display: none; }
    .cs-tab-placeholder {
      padding: 3rem 0;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ══════════════════════════════════════════════════════════════
       MAININFO — shared header (renders once, above the tab bar)
       Figma 51:1385. Portrait/name/blurb are relocated, unchanged
       logic; species paragraph, speaks block, conditions, inspiration,
       AC badge, HP bar and death saves are new UI over existing data.
       ══════════════════════════════════════════════════════════════ */
    /* Species/Appearance/Speaks — labeled 3-column row (Figma 51:1385).
       All three columns share the same plain-text treatment; Speaks lost
       its boxed-pill look here so it reads as a column, not a card. */
    .cs-mi-triple-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
    }
    .cs-mi-triple-col { flex: 1 1 200px; min-width: 180px; }
    .cs-mi-triple-label {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .cs-mi-species-desc,
    .cs-mi-appearance {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.85rem;
      line-height: var(--line-height);
      color: var(--char-text-muted);
    }
    /* Glyph + name sit inline on one row; "spoken where" sits on its own
       full-width row below (Figma 51:1385) — not nested under the name, so
       it isn't indented past the glyph. */
    .cs-mi-speaks { display: flex; flex-direction: column; gap: 0.2rem; }
    .cs-mi-speaks-row { display: flex; align-items: center; gap: 0.5rem; }
    .cs-mi-speaks-glyph { font-size: 1.2rem; line-height: 1; flex-shrink: 0; }
    .cs-mi-speaks-name { font-family: var(--font-sans); font-size: 0.85rem; font-weight: 700; color: var(--blue); } /* fallback only — real color is inline per-language, see renderSpeaksBlock() */
    .cs-mi-speaks-sub { font-family: var(--font-body); font-weight: 300; font-size: 0.82rem; color: var(--char-text-muted); }

    /* Conditions — inline pill row above the name (Figma 51:1385). Per-pill
       color/tooltip come from the `conditions` Supabase table (fetched once,
       fetchConditionsData()) via --cond-bg/--cond-border/--cond-text custom
       properties set inline per pill — same technique dm.html's SCC Live
       Session panel uses. Picker-only now (no free text), so every pill is
       guaranteed a real match; the flat purple fallback only covers a
       CONDITIONS_DATA fetch failure, not the normal path. */
    .cs-mi-top-row { margin-bottom: var(--char-ov-gap-2xs); }
    .cs-mi-conditions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
    .cs-mi-condition-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--cond-bg, var(--purple-dim));
      border: 1px solid var(--cond-border, var(--purple-border));
      border-radius: 20px;
      padding: 0.2rem 0.5rem 0.2rem 0.7rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cond-text, var(--purple));
      cursor: help;
    }
    .cs-mi-condition-remove {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0 0.15rem;
    }
    .cs-mi-condition-add {
      background: none;
      border: 1px dashed var(--char-accent-border);
      border-radius: 20px;
      padding: 0.2rem 0.65rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      color: var(--char-text-faint);
      cursor: pointer;
    }
    .cs-mi-condition-add:hover { border-color: var(--gold-border); color: var(--gold-light); }
    .cs-mi-condition-input-row { display: inline-flex; gap: 0.35rem; align-items: center; }
    .cs-mi-condition-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--char-accent-border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      max-width: 160px;
    }
    .cs-mi-condition-select option { background: #1a1208; color: var(--text); }

    /* Compact single row (Figma 51:1385): AC badge, HP badge+bar, Temp HP
       badge+bar, all inline. Each cs-mi-hp-compact wraps down onto its own
       line on narrow viewports rather than the whole row scrolling. */
    .cs-mi-vitals { display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap; row-gap: 0.6rem; }

    /* Inspiration — small circular badge, top-right of the header (Figma
       51:1385), not a pill next to AC. .cs-ov-maininfo carries the
       position:relative for this to anchor against. */
    .cs-mi-inspiration {
      position: absolute;
      top: 0;
      right: 0;
    }
    .cs-mi-insp-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px dashed var(--char-accent-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      background: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .cs-mi-insp-badge.active { border: 1px solid var(--gold-border-mid); background: var(--gold-dim); }
    .cs-mi-insp-badge-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.55rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--char-text-faint);
    }
    .cs-mi-insp-badge.active .cs-mi-insp-badge-label { color: var(--gold-light); }
    .cs-mi-insp-badge-state {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.55rem;
      color: var(--char-text-faint);
    }
    .cs-mi-insp-badge.active .cs-mi-insp-badge-state { color: var(--gold-light); }

    /* HP grows to fill the row (Figma 51:1385: the bar takes up whatever
       width is left after the label/inputs) — Temp HP has no bar (see
       renderHeaderHP()) so it stays sized to its own content. */
    .cs-mi-hp-slot { flex: 1 1 320px; min-width: 220px; }
    .cs-mi-temp-hp { flex: 0 0 auto; display: flex; align-items: center; }

    /* Compact HP/Temp HP row (Figma 51:1385) — label + directly-editable
       number input(s) + bar. No Edit toggle, no separate control panel:
       typing into the input and blurring is the entire interaction. */
    .cs-mi-hp-compact { display: flex; align-items: center; gap: 0.5rem; }
    .cs-mi-hp-compact-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 24px;
      color: var(--text);
    }
    .cs-mi-hp-num-input {
      width: 44px;
      background: var(--blue-50);
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px;
      text-align: center;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 18px;
      color: var(--blue-800);
    }
    .cs-mi-hp-num-input::-webkit-outer-spin-button,
    .cs-mi-hp-num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cs-mi-hp-compact-max { font-family: var(--font-body); font-weight: 700; font-size: 18px; color: var(--text); }
    /* Prominent, full-height bar filling the remaining row width (Figma
       51:1385: bar height matches the row's full 37px, not a thin sliver) —
       flex:1 so it grows/shrinks with .cs-mi-hp-slot's available space. */
    .cs-mi-hp-compact-bar {
      flex: 1 1 auto;
      min-width: 50px;
      height: 37px;
      border-radius: 999px;
      background: var(--red-track);
      overflow: hidden;
    }
    .cs-mi-hp-compact-bar-fill { height: 100%; background: var(--red-strong); transition: width 0.25s ease; }
    /* Death-save-state Heal row only (0 Current HP) — the normal-state HP
       row above has no button controls left, just the two inputs. */
    .cs-mi-hp-controls { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.4rem; }

    .cs-mi-death-saves {
      flex: 1 1 260px;
      min-width: 220px;
      background: var(--char-card-bg);
      border: 1px solid var(--red-border);
      border-radius: var(--char-radius);
      padding: 0.85rem 1rem;
    }
    .cs-mi-ds-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f87171;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .cs-mi-ds-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.3rem; }
    .cs-mi-ds-row-label { font-family: var(--font-sans); font-size: 0.72rem; color: var(--char-text-muted); width: 70px; }
    .cs-mi-ds-pips { display: flex; gap: 0.4rem; }
    .cs-mi-ds-pip { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: none; cursor: pointer; padding: 0; }
    .cs-mi-ds-pip--success.filled { background: #6ecf6e; border-color: #6ecf6e; }
    .cs-mi-ds-pip--failure.filled { background: #f87171; border-color: #f87171; }

    /* Hit Dice (MainInfo header) — Round 2 QA redesign: DM feedback was
       "not intuitive," no specific direction given. Round-2's own suggested
       fix, taken: bring it in line with the label/"Used: X/Y"/segmented-bar
       pattern already established by Spell Slots and the Class-Specific
       tracker (.cs-limuse-*) instead of the plain round pips this predates
       that pattern with — a player who's already learned to read Spell
       Slots shouldn't have to learn a second visual language for Hit Dice.
       Fill direction also switched to match those (available fills left,
       spent fills right) for the same reason — this is now consistently
       the site's one "spend a segment" convention, not two competing ones
       (Death Saves' pips are a genuinely different concept — marking a
       fixed 3-of-3 toward death, not spending/restoring a pool — so those
       are deliberately left as plain pips, not converted). Compact sizing
       (not .cs-limuse-*'s full card treatment) since this lives inline in
       the header's vitals row, not a full-width Features accordion card —
       segments wrap onto a second row rather than shrinking illegibly for
       higher-level characters with many dice. Gold keeps the existing
       "active resource" fill convention (e.g. Inspiration's badge). */
    .cs-mi-hit-dice { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; min-width: 120px; }
    .cs-mi-hd-headrow { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; width: 100%; }
    .cs-mi-hd-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--char-text-faint);
      white-space: nowrap;
    }
    .cs-mi-hd-count {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.65rem;
      color: var(--text);
      white-space: nowrap;
    }
    .cs-mi-hd-row { display: flex; flex-wrap: wrap; gap: 3px; }
    .cs-mi-hd-seg {
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.68rem;
    }
    .cs-mi-hd-seg.active { background: var(--gold); color: var(--gold-text-on); }
    .cs-mi-hd-seg.spent { background: rgba(255,255,255,0.08); color: var(--char-text-faint); }

    @media (max-width: 900px) {
      .cs-ov-portrait { width: 100%; min-height: 340px; }
      .cs-ov-info { min-width: 100%; }
    }
    @media (max-width: 600px) {
      .cs-ov-card { min-width: 100%; }
      /* 200px minimum "at all times" per Round 2 Revisions QA — same floor
         as desktop, so this override now only still matters for the gap. */
      .cs-ab-cards { gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      .cs-ab-img { width: 72px; height: 72px; }
      .cs-ov-class-details { gap: 1rem; }
      /* Single unbreakable words ("Overview") can't shrink to share a row
         with the toggle — wrap the toggle onto its own line rather than
         letting it overflow past the viewport edge. */
      .cs-ov-acc-header { flex-wrap: wrap; row-gap: 0.4rem; }
      /* The new full-card accordion padding (gap-s, 26px/side) is generous
         on desktop but eats too much width on a narrow phone — tighten it. */
      .cs-ov-acc { padding: var(--char-ov-gap-xs); }
      .cs-class-tab-stack { gap: var(--char-ov-gap-m); }
    }

    /* ── Not-found state ── */
    .cs-not-found {
      text-align: center;
      padding: 6rem 2rem;
    }
    .cs-not-found-glyph {
      font-family: var(--font-headers);
      font-size: 5rem;
      color: rgba(200,148,10,0.15);
      margin-bottom: 1.5rem;
      line-height: 1;
    }
    .cs-not-found-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--char-text-faint);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .cs-not-found-body {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: rgba(245,234,212,0.4);
      line-height: 1.8;
      max-width: 380px;
      margin: 0 auto 2rem;
    }
    .cs-not-found-link {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--char-highlight-border);
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .cs-not-found-link:hover {
      background: var(--char-highlight-tint);
      border-color: var(--gold);
    }

    /* ── Divider ornament ── */
    .cs-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0 1.5rem;
      opacity: 0.25;
    }
    .cs-divider::before, .cs-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold);
    }
    .cs-divider-glyph {
      font-family: var(--font-headers);
      font-size: 0.85rem;
      color: var(--gold);
    }

    /* ── Footer ── */
    .cs-footer {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.15);
    }

    /* ── Animations ── */
    @keyframes cs-fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cs-wrap { animation: cs-fadein 0.5s ease forwards; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cs-story-row { grid-template-columns: 1fr; gap: 0.2rem; }
      .cs-nav { padding: 0.6rem 1rem; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .cs-wrap { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="cs-nav">
    <a class="cs-nav-back" href="../index.html">← Return to Wiki</a>
  </nav>

  <!-- Main content — rendered by JS below -->
  <main class="cs-wrap" id="cs-main">
    <!-- populated by renderSheet() -->
  </main>
  <div id="cs-modal-root"></div>

  <footer class="cs-footer" id="cs-footer"></footer>

  <div id="cs-toast" class="cs-toast"></div>

  <style>
    /* ── Loading state ── */
    .cs-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1.5rem;
    }
    .cs-loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(200,148,10,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: cs-spin 0.9s linear infinite;
    }
    .cs-loading-text {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.4);
    }
    @keyframes cs-spin { to { transform: rotate(360deg); } }

    /* ── HP tracker ── */
    .cs-hp-block {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }
    .cs-hp-cell {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--char-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-hp-cell--current { border-color: rgba(180,60,60,0.35); background: rgba(180,60,60,0.07); }
    .cs-hp-label {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-hp-val {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--white);
      line-height: 1;
    }
    .cs-hp-cell--current .cs-hp-val { color: #f87171; }
    .cs-hp-controls {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }
    .cs-hp-btn {
      flex: 1;
      padding: 0.35rem 0;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-hp-btn:hover { background: rgba(255,255,255,0.12); }
    .cs-hp-input-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }
    .cs-hp-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      text-align: center;
      width: 60px;
    }
    .cs-hp-apply {
      padding: 0.3rem 0.75rem;
      background: rgba(200,148,10,0.2);
      border: 1px solid rgba(200,148,10,0.4);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-sans);

    /* ── Equipped Gear — 10-slot doll (Figma 68:7354, corrected 2026-08-10,
       replacing the earlier grid-area build below at DM request — the
       first pass was built with no Figma reference for this node; the
       DM has since designed the real layout there). Structure per the
       real node: one flex row, items-end (bottom-anchored), gap 10px,
       justify-center — a left group (Left Hand slot at gap-16px beside a
       4-slot stacked column: Head/Chest/Arms/Feet) and a mirrored right
       group (Neck/Earrings/Back/Legs column at gap-16px beside Right
       Hand), flanking a centered silhouette. Each stacked slot's row is
       177.249px tall with its content (140.691x143.249 frame + label)
       bottom-justified inside it — that's what produces the "everything
       sits on one shared baseline" look, vs. the old grid's slots spread
       across the silhouette's full height with big gaps between them.
       Fluid via container query units (cqi), not raw px: the previous
       pass's own fix comment below already diagnosed the failure mode of
       copying Figma's canvas px onto a container of a different aspect
       ratio — same risk here, since this doll now lives inside a
       flexible .cs-inv-top-col that can be anywhere from ~360px to
       ~1000px+ wide depending on viewport and whether Currency wraps
       below it. Every descendant dimension (including heights, not just
       widths) is expressed as a %% of the doll's own inline-size via
       cqi, so the whole layout scales as one unit — the same effect as
       resizing a photo from a corner handle — instead of hardcoding one
       canvas width. clamp() floors stop slot boxes/text from shrinking
       below a usable size once the container gets narrow; below the
       600px viewport breakpoint the silhouette hides entirely (existing
       DM-approved mobile deviation — the real Figma mobile frame reuses
       this same desktop component with no mobile layout of its own, a
       gap flagged in docs/inventory-tab-build-spec.md, not something to
       invent a design for here) and the two groups' own floor sizes are
       small enough to sit side by side down to 375px.
       Slot frame + body silhouette still use the real exported Figma
       assets (assets/images/character-sheet/equipped-gear/*). */
    .cs-equip-doll {
      container-type: inline-size;
      width: 100%;
      max-width: 61.08rem; /* 977.317px — the node's own reference width */
      margin: 0 auto;
      display: flex;
      /* nowrap deliberately, not a "safety net" wrap: because every
         descendant width below is a %% of this element's OWN inline-size
         (cqi), the three children's widths always sum to ~100% of the
         container by construction — they can never overflow it in the
         fluid range. flex-wrap:wrap was tried here first and caused a
         real bug: at container widths where the cqi sum lands within a
         sub-pixel of 100% (common, since the percentages are tuned to
         hit ~100%), browser rounding tips one child over the edge and
         wrap silently drops the second side group onto its own line
         below the item table — confirmed live via getBoundingClientRect
         (side groups landed 700px+ apart vertically) before switching to
         nowrap. Floors below only bite at the ~350px container floor
         (comfortably below this column's own 358px architectural
         minimum elsewhere in this file), where nowrap can't overflow
         either since the floors were sized specifically to fit inside
         that minimum. */
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: center;
      gap: 0.625rem; /* 10px */
    }
    .cs-equip-doll-side {
      display: flex;
      align-items: center;
      gap: clamp(0.36rem, 1.637cqi, 1rem); /* 16px */
      flex: 0 0 auto;
    }
    .cs-equip-doll-col {
      display: flex;
      flex-direction: column;
      gap: clamp(0.22rem, 1.023cqi, 0.625rem); /* 10px */
      flex: 0 0 auto;
    }
    .cs-equip-slot-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(0.22rem, 1.023cqi, 0.625rem); /* 10px */
      min-height: clamp(3.97rem, 18.135cqi, 11.08rem); /* 177.249px */
    }
    /* Previous pass's root-cause fix (2026-08-10, kept for history): the
       pass before that had pulled exact geometry from Figma node 68:7354
       (silhouette x:449.723 y:0 w:362.553 h:759.268 within a 1180x759.268
       container) and converted it to left:38.11%/width:30.72%/height:100%
       — percentages that only reproduce Figma's proportions if the
       container they're applied to has the SAME aspect ratio as Figma's
       1180x759 (1.55:1) canvas. That grid's actual container was capped
       at max-width:480px and grew tall from its own 7 stacked slot-rows,
       squashing the silhouette into a sliver. The cqi-based rebuild above
       supersedes this entirely (silhouette is a real flex sibling now,
       not an absolutely-positioned overlay), but the lesson stands: never
       borrow Figma's absolute canvas ratio onto a container shaped
       differently from Figma's own frame. */
    .cs-equip-doll-silhouette {
      width: clamp(8.12rem, 37.098cqi, 22.66rem); /* 362.553px */
      height: clamp(17rem, 77.688cqi, 47.45rem); /* 759.268px */
      object-fit: contain;
      pointer-events: none;
      flex: 0 0 auto;
    }
    .cs-equip-slot-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.2rem, 0.9cqi, 0.5rem);
      width: clamp(3.15rem, 14.396cqi, 8.79rem); /* 140.691px */
      flex: 0 0 auto;
    }
    .cs-equip-slot-box {
      position: relative;
      width: 100%;
      height: clamp(3.21rem, 14.658cqi, 8.95rem); /* 143.249px */
      border-radius: var(--radius);
      background: var(--char-card-bg) url('../assets/images/character-sheet/equipped-gear/gear-slot.jpg') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

    .cs-equip-slot-empty {

    .cs-equip-slot-empty:hover { filter: brightness(1.3); }
    .cs-equip-slot-filled {

    .cs-equip-slot-locked {

    .cs-equip-slot-thumb {

      border-radius: calc(var(--radius) - 4px);
    }
    .cs-equip-slot-thumb-icon {
      font-size: 1.8rem;
      color: var(--gold-light);
    }
    .cs-equip-slot-unequip {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,15,0.75);
      border: none;
      border-radius: 50%;
      color: rgba(255,255,255,0.6);

    .cs-equip-slot-unequip:hover { color: #f87171; }
    .cs-equip-slot-label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(0.75rem, 1.842cqi, var(--char-ov-h5)); /* 18px */
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
      text-align: center;
    }
    .cs-equip-slot-name {
      font-family: var(--font-sans);
      font-size: 0.7rem;

    /* Per-slot weapon damage, directly under the name line (handL/handR
       only in practice — buildSlotDamageText() returns '' for any item
       without damage_dice, so armor/accessory slots never produce this
       without needing an explicit area check). Same red already used for
       the HP bar fill (--red-strong), not a new color. */
    .cs-equip-slot-damage {

    /* Mobile fallback (existing DM-approved deviation, carried over from
       the grid build): the real Figma mobile frame reuses this same
       desktop component with no mobile-specific layout of its own, so
       there's no mobile geometry to match here. Hiding the silhouette
       frees up enough width to raise the slot-size floor for a better
       touch target than the base floor allows (that base floor is tuned
       tight — ~350px total — specifically to survive the doll rendering
       alongside a still-visible silhouette in a squeezed desktop column;
       mobile doesn't have that constraint once the silhouette is gone,
       so it gets its own larger floor here instead of inheriting the
       tight one). */
    @media (max-width: 600px) {

      .cs-equip-slot-wrap { width: clamp(4.4rem, 14.396cqi, 8.79rem); }
