<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Anavale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/hp-calc.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">

  <style>
    /* ── CSS Variables (mirrors character.css :root exactly) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


    /* ── Page Shell ── */
    body {
      background:
        linear-gradient(rgba(3,4,12,0.88), rgba(3,4,12,0.88)),
        url('../assets/images/regions/img-caparia-landscape.webp') center/cover fixed;
      color: var(--parchment);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav Bar ── */
    .cs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 7, 15, 0.92);
      border-bottom: 1px solid rgba(200,148,10,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .cs-nav-title {
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .cs-nav-title:hover { opacity: 0.85; }
    .cs-nav-logo {
      height: 22px;
      width: auto;
      display: block;
    }
    .cs-nav-back {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      text-decoration: none;
      letter-spacing: 0.08em;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    .cs-nav-back:hover { opacity: 1; color: var(--gold); }

    /* ── Main content wrapper ── */
    .cs-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Section headers ── */
    .cs-section {
      margin-bottom: 1.75rem;
    }
    .cs-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--char-highlight-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-section-label::before {
      content: '✦';
      font-size: 0.55rem;
      opacity: 0.6;
    }

    /* ── Story panel ── */
    .cs-story-block {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--char-radius);
      overflow: hidden;
    }
    .cs-story-row {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.75rem;
      align-items: start;
    }
    .cs-story-row:last-child { border-bottom: none; }
    .cs-story-key {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      padding-top: 0.05rem;
      line-height: 1.4;
    }
    .cs-story-val {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      color: var(--char-text-muted);
      line-height: 1.7;
    }
    .cs-story-val em {
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ── Gear list ── */
    .cs-gear-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .cs-gear-item {
      background: var(--char-card-bg-subtle);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--char-text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-gear-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* ── Gold display ── */
    .cs-gold-block {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: var(--char-highlight-tint);
      border: 1px solid var(--char-highlight-border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
    }
    .cs-gold-icon {
      font-size: 1.4rem;
      color: var(--gold-light);
      flex-shrink: 0;
    }
    .cs-gold-val {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--gold-light);
      line-height: 1;
    }
    .cs-gold-label {
      font-family: var(--font-sans);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.6);
      font-weight: 700;
      margin-top: 0.15rem;
    }

    /* ══════════════════════════════════════════════════════════════
       OVERVIEW + ABILITY SCORES (redesign)
       Figma P0tcVgf02XeI13Tz0TtRaX — desktop 36:310 / mobile 36:435
       Breaks out of .cs-wrap's 820px cap — this is the one part of
       the sheet wide enough to need it (portrait card + 3 overview
       cards side by side). Rest of the page stays at 820px.
       ══════════════════════════════════════════════════════════════ */
    .cs-ov-breakout {
      width: 100vw;
      position: relative;
      left: 50%;
      margin-left: -50vw;
      margin-bottom: 2rem;
    }
    .cs-ov-inner {
      max-width: 1560px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Page title (Figma 51:1385) — logo + "Character Sheet" ── */
    .cs-sheet-title-logo {
      height: 22px;
      width: auto;
      display: block;
      margin-bottom: 0.3rem;
    }
    .cs-sheet-title-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      color: var(--text);
    }

    /* ── Portrait / money / weight card ── */
    .cs-ov-maininfo {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-m);
      align-items: flex-start;
    }
    .cs-ov-portrait {
      position: relative;
      width: 358px;
      min-height: 420px;
      flex-shrink: 0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      background: var(--surface-2);
    }
    .cs-ov-portrait-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    .cs-ov-portrait-upload-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 3;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(10,14,24,0.88);
      color: white;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .cs-ov-portrait-upload-btn:hover { background: rgba(200,148,10,0.35); border-color: rgba(200,148,10,0.6); }

    /* ── Name / pills / blurb / accordions ── */
    .cs-ov-info {
      flex: 1 1 358px;
      min-width: 358px;
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-main {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cs-ov-name {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 4.5vw, 4rem);
      line-height: 1.05;
      color: var(--text);
    }
    .cs-ov-blurb {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      line-height: var(--line-height);
      color: var(--text);
    }

    /* ── Accordion shell (Overview / Ability Scores) ── */
    .cs-ov-acc { width: 100%; }
    .cs-ov-acc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 0 var(--char-ov-gap-2xs);
      gap: var(--char-ov-gap-2xs);
    }
    /* Tab page title (Figma 51:1103 "YOUR STORY") — bigger than the
       Who You Are/Your Background/Your Past section titles below it
       (.cs-ov-acc-title, --text-4xl) so it reads as the page heading, not
       another accordion. One per tab (pageTitleHtml()) — Your Story,
       Ability Scores, Inventory, Class all carry the same heading. */
    .cs-page-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      color: var(--text);
      margin-bottom: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-title {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      color: var(--text);
      text-align: left;
    }
    .cs-ov-acc-toggle {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-2xs);
    }
    .cs-ov-acc-toggle-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .cs-ov-acc-chevron {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      color: var(--surface-0);
      font-size: 0.8rem;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    /* Expand/collapse transition — grid-template-rows 1fr→0fr rather than a
       JS-measured max-height, so it works for any content height without
       recalculating. cs-ov-acc-body-outer is the grid container/animated
       element; cs-ov-acc-body (unchanged internal flex layout) just needs
       overflow:hidden so it clips cleanly mid-transition. */
    .cs-ov-acc-body-outer {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 0.22s ease, opacity 0.2s ease;
    }
    .cs-ov-acc-body {
      overflow: hidden;
      min-height: 0;
      padding-bottom: var(--char-ov-gap-2xs);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-acc.collapsed .cs-ov-acc-body-outer { grid-template-rows: 0fr; opacity: 0; }
    .cs-ov-acc.collapsed .cs-ov-acc-chevron { transform: rotate(180deg); }

    /* ── Overview cards (alignment / background / gigglegloom) ── */
    .cs-ov-cards {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-card {
      flex: 1 0 0;
      min-width: 300px;
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-xs);
      background: var(--blue-700);
      border-radius: 0 24px 24px 0;
      padding-right: 16px;
      overflow: hidden;
    }
    .cs-ov-card-img {
      width: 75px; height: 75px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ov-card-icon-wrap {
      width: 75px; height: 75px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .cs-ov-card-icon {
      width: 40px; height: 40px;
      filter: drop-shadow(0 0 14px currentColor);
    }
    .cs-ov-card-txt {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .cs-ov-card-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-card-title {
      font-family: var(--font-display);
      font-size: var(--char-ov-h4);
      color: var(--text);
    }
    .cs-ov-card-sub {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      color: var(--text);
    }

    /* ── Class card ── */
    .cs-ov-class-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-class-basic {
      display: flex;
      align-items: center;
      gap: var(--char-ov-gap-s);
    }
    .cs-ov-class-img {
      width: 56px; height: 56px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .cs-ov-class-txt { flex: 1 0 0; min-width: 0; }
    .cs-ov-class-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ov-class-name {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-level {
      flex-shrink: 0;
      background: var(--surface-0);
      border-radius: 8px;
      padding: var(--char-ov-gap-2xs);
      text-align: center;
    }
    .cs-ov-class-level-label {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.72rem;
      color: var(--gold);
    }
    .cs-ov-class-level-val {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ov-class-details {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-m);
    }
    .cs-ov-class-detail {
      flex: 1 0 0;
      min-width: 240px;
      display: flex;
      gap: 10px;
    }
    .cs-ov-class-detail-keys {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      flex-shrink: 0;
    }
    .cs-ov-class-detail-keys p, .cs-ov-class-detail-vals p { line-height: 24px; margin: 0; }
    .cs-ov-class-detail-vals {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1rem;
      color: var(--text);
      min-width: 0;
    }

    /* ── Class tab — Key Features (Figma 52:2705/52:2710) ──────────────
       Alternating row shading is pure CSS nth-child, no data dependency. */
    .cs-class-features-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      margin: var(--char-ov-gap-s) 0 var(--char-ov-gap-2xs);
    }
    .cs-class-features {
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .cs-class-feature-row {
      display: flex;
      align-items: flex-start;
      gap: var(--char-ov-gap-2xs);
      padding: 0.65rem var(--char-ov-gap-2xs);
    }
    .cs-class-feature-row:nth-child(even) { background: var(--blue-500); }
    .cs-class-feature-icon { font-size: 1.1rem; line-height: 1.4; flex-shrink: 0; }
    .cs-class-feature-txt { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .cs-class-feature-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text);
    }
    .cs-class-feature-level {
      margin-left: 0.5rem;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .cs-class-feature-desc {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.86rem;
      color: var(--text);
      opacity: 0.85;
    }

    /* ── Spell slots (Class tab, stopgap — see Decision Log) ── */
    .cs-spell-slots-card { margin-top: var(--char-ov-gap-s); }
    .cs-spell-slot-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-2xs);
      padding: 0.35rem 0;
    }
    .cs-spell-slot-level {
      width: 70px;
      flex-shrink: 0;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-spell-slot-pips { display: flex; gap: 0.3rem; }
    .cs-spell-slot-pip {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      background: none;
      cursor: pointer;
      padding: 0;
    }
    .cs-spell-slot-pip.filled { background: var(--gold); border-color: var(--gold); }
    .cs-spell-slot-none { color: var(--char-text-faint); font-size: 0.8rem; }
    .cs-spell-slot-max-edit { display: flex; gap: 0.35rem; align-items: center; margin-left: auto; }
    .cs-spell-slot-max-input { width: 50px; }

    /* ── Your Story cards (Who You Are / Your Background / Your Past) ──
       Figma 51:1103/51:1218. Wider description cards, not small pills —
       real player answers run from short phrases to full paragraphs. ── */
    .cs-story-cards {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
      margin-top: var(--char-ov-gap-m);
    }
    .cs-story-card {
      flex: 1 0 260px;
      min-width: 240px;
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-story-card-head { display: flex; align-items: center; gap: 0.6rem; }
    .cs-story-card-img {
      width: 75px;
      height: 75px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    .cs-story-card-headtext { display: flex; flex-direction: column; gap: 0.15rem; }
    .cs-story-card-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue-100);
    }
    .cs-story-card-title {
      font-family: var(--font-display);
      font-size: var(--char-ov-h4);
      color: var(--text);
    }
    .cs-story-card-sub {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.78rem;
      color: var(--text);
      opacity: 0.75;
    }
    /* Your Past cards (Figma 51:1218) — fixed 358px width (not the flexible
       Your Background sizing), 18px titles (not 26px), and two layouts:
       default puts the icon beside just the eyebrow/title header row;
       --full (Left Behind, Why You Left) puts the icon beside the entire
       content column instead — a real structural split, not a styling one. */
    .cs-past-card {
      width: 358px;
      flex: 0 0 358px;
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-xs);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cs-past-card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h5);
      color: var(--text);
    }
    .cs-past-card--full {
      flex-direction: row;
      gap: 0.75rem;
    }
    .cs-past-card--full .cs-story-card-img { margin-top: 0; }
    .cs-past-card-body {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      min-width: 0;
    }
    .cs-story-card-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.88rem;
      line-height: var(--line-height);
      color: var(--text);
      opacity: 0.9;
    }
    /* Benefits box (Figma 51:1218) — typed lines, not pill tags. Lighter
       than the card's own blue/700 background so it reads as a distinct
       inset panel. */
    .cs-story-benefits {
      margin-top: 0.5rem;
      background: var(--blue-600);
      border-radius: var(--radius);
      padding: 8px;
    }
    .cs-story-benefit-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      color: var(--currency-gold-coin);
      margin-bottom: 0.2rem;
    }
    .cs-benefit-line {
      font-size: 12px;
      color: var(--text);
      margin-top: 0.2rem;
    }
    .cs-benefit-line:first-of-type { margin-top: 0; }
    .cs-benefit-amount { font-weight: 700; color: var(--green); }
    .cs-benefit-amount.negative { color: var(--red); }
    .cs-benefit-name { font-weight: 700; color: var(--text); }
    .cs-benefit-desc { font-weight: 300; color: var(--text); }
    .cs-benefit-suffix { font-weight: 300; color: var(--char-text-muted); }
    /* "Personal quest" line (Why You Left) — plain text, not a Benefits box. */
    .cs-past-quest {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 16px;
      line-height: 24px;
      color: var(--text);
      margin-top: 0.5rem;
    }
    .cs-story-quest-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 16px;
      color: var(--gold);
      margin-right: 0.3rem;
    }

    /* ── Who You Are (Figma 51:1103) — ONE card: summary heading/paragraph
       + personality items as flush left-border strips, not separate boxes
       like Your Background/Your Past. ── */
    .cs-whoyouare-card {
      background: var(--blue-700);
      border-radius: var(--radius-lg);
      padding: var(--char-ov-gap-s);
      width: 100%;
    }
    .cs-ov-summary-text {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 18px;
      line-height: 24px;
      color: var(--text);
      margin: 0.5em 0 0;
    }
    .cs-whoyouare-items {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-xs);
      margin-top: var(--char-ov-gap-s);
    }
    .cs-whoyouare-item {
      flex: 1 1 200px;
      border-left: 4px solid var(--blue-400);
      padding: 8px 8px 8px 18px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .cs-whoyouare-item-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--char-ov-h5);
      color: var(--text);
    }

    /* ── Ability score cards ── */
    .cs-ab-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      width: 100%;
    }
    .cs-ab-card {
      flex: 1 0 0;
      min-width: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--char-ov-gap-xs) 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(to bottom, var(--blue-700), var(--ab-gradient));
      box-shadow: 2px 5px 11px 0 var(--ab-glow), 0 0 120px 0 var(--ab-glow);
    }
    .cs-ab-card--str { --ab-glow: var(--ability-str-glow); --ab-gradient: var(--ability-str-gradient); }
    .cs-ab-card--dex { --ab-glow: var(--ability-dex-glow); --ab-gradient: var(--ability-dex-gradient); }
    .cs-ab-card--con { --ab-glow: var(--ability-con-glow); --ab-gradient: var(--ability-con-gradient); }
    .cs-ab-card--int { --ab-glow: var(--ability-int-glow); --ab-gradient: var(--ability-int-gradient); }
    .cs-ab-card--wis { --ab-glow: var(--ability-wis-glow); --ab-gradient: var(--ability-wis-gradient); }
    .cs-ab-card--cha { --ab-glow: var(--ability-cha-glow); --ab-gradient: var(--ability-cha-gradient); }
    .cs-ab-img {
      width: 100px; height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }
    .cs-ab-txt {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--char-ov-gap-2xs) 0;
      text-align: center;
    }
    .cs-ab-label {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 1.1rem;
      text-transform: uppercase;
      color: var(--text);
    }
    .cs-ab-tip {
      display: inline-block;
      margin-left: 0.3rem;
      font-size: 0.7rem;
      color: var(--gold);
      cursor: help;
    }
    .cs-ab-val {
      font-family: var(--font-display);
      font-size: var(--char-ov-h3);
      color: var(--text);
    }
    .cs-ab-mod {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--text);
    }
    .cs-ab-mod-num { font-weight: 700; }
    .cs-ab-mod-num.positive { color: var(--green); }
    .cs-ab-mod-num.negative { color: var(--red); }
    .cs-feat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: var(--char-ov-gap-m);
    }
    .cs-feat-chip {
      background: var(--char-card-bg-subtle);
      border: 1px solid var(--char-highlight-border);
      border-radius: var(--char-radius);
      padding: 0.5rem 0.85rem;
      max-width: 320px;
    }
    .cs-feat-chip-name {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }
    .cs-feat-chip-desc {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-muted);
      line-height: 1.5;
      margin-top: 0.2rem;
    }

    /* ══════════════════════════════════════════════════════════════
       TAB SHELL
       Character Sheet Tab Redesign v1 — docs build spec, Aug 9 2026.
       Pure scaffolding pass: bar + show/hide only. Only "Your Story"
       carries real content today; Ability Scores/Inventory/Class are
       placeholders until their own build slices land.
       ══════════════════════════════════════════════════════════════ */
    /* Tab bar (Figma 51:1103) — pill tabs, not underlines. Inactive tabs sit
       at 50% text opacity on a darker fill; the active tab gets full
       opacity on a lighter fill. */
    .cs-tabbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      border-bottom: 4px solid var(--blue-400);
      overflow-x: auto;
    }
    .cs-tab-btn {
      background: var(--blue-600);
      border: none;
      border-radius: 8px 8px 0 0;
      padding: 10px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      opacity: 0.5;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }
    .cs-tab-btn:hover { opacity: 0.75; }
    .cs-tab-btn.active { background: var(--blue-400); opacity: 1; }
    .cs-tab-content[hidden] { display: none; }
    .cs-tab-placeholder {
      padding: 3rem 0;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--char-text-faint);
      font-style: italic;
    }

    /* ══════════════════════════════════════════════════════════════
       MAININFO — shared header (renders once, above the tab bar)
       Figma 51:1385. Portrait/name/blurb are relocated, unchanged
       logic; species paragraph, speaks block, conditions, inspiration,
       AC badge, HP bar and death saves are new UI over existing data.
       ══════════════════════════════════════════════════════════════ */
    /* Species/Appearance/Speaks — labeled 3-column row (Figma 51:1385).
       All three columns share the same plain-text treatment; Speaks lost
       its boxed-pill look here so it reads as a column, not a card. */
    .cs-mi-triple-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--char-ov-gap-s);
    }
    .cs-mi-triple-col { flex: 1 1 200px; min-width: 180px; }
    .cs-mi-triple-label {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .cs-mi-species-desc,
    .cs-mi-appearance {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.85rem;
      line-height: var(--line-height);
      color: var(--char-text-muted);
    }
    .cs-mi-speaks {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cs-mi-speaks-glyph { font-size: 1.2rem; line-height: 1; flex-shrink: 0; }
    .cs-mi-speaks-txt { display: flex; flex-direction: column; gap: 0.1rem; }
    .cs-mi-speaks-name { font-family: var(--font-sans); font-size: 0.85rem; font-weight: 700; color: var(--blue); }
    .cs-mi-speaks-sub { font-family: var(--font-body); font-weight: 300; font-size: 0.82rem; color: var(--char-text-muted); }

    /* Conditions — inline pill row above the name (Figma 51:1385). Per-pill
       color/tooltip come from the `conditions` Supabase table (fetched once,
       fetchConditionsData()) via --cond-bg/--cond-border/--cond-text custom
       properties set inline per pill — same technique dm.html's SCC Live
       Session panel uses. Picker-only now (no free text), so every pill is
       guaranteed a real match; the flat purple fallback only covers a
       CONDITIONS_DATA fetch failure, not the normal path. */
    .cs-mi-top-row { margin-bottom: var(--char-ov-gap-2xs); }
    .cs-mi-conditions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
    .cs-mi-condition-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--cond-bg, var(--purple-dim));
      border: 1px solid var(--cond-border, var(--purple-border));
      border-radius: 20px;
      padding: 0.2rem 0.5rem 0.2rem 0.7rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--cond-text, var(--purple));
      cursor: help;
    }
    .cs-mi-condition-remove {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      padding: 0 0.15rem;
    }
    .cs-mi-condition-add {
      background: none;
      border: 1px dashed var(--char-accent-border);
      border-radius: 20px;
      padding: 0.2rem 0.65rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      color: var(--char-text-faint);
      cursor: pointer;
    }
    .cs-mi-condition-add:hover { border-color: var(--gold-border); color: var(--gold-light); }
    .cs-mi-condition-input-row { display: inline-flex; gap: 0.35rem; align-items: center; }
    .cs-mi-condition-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--char-accent-border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      max-width: 160px;
    }
    .cs-mi-condition-select option { background: #1a1208; color: var(--text); }

    /* Compact single row (Figma 51:1385): AC badge, HP badge+bar, Temp HP
       badge+bar, all inline. Each cs-mi-hp-compact wraps down onto its own
       line on narrow viewports rather than the whole row scrolling. */
    .cs-mi-vitals { display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap; row-gap: 0.6rem; }

    /* Inspiration — small circular badge, top-right of the header (Figma
       51:1385), not a pill next to AC. .cs-ov-maininfo carries the
       position:relative for this to anchor against. */
    .cs-mi-inspiration {
      position: absolute;
      top: 0;
      right: 0;
    }
    .cs-mi-insp-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px dashed var(--char-accent-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      background: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .cs-mi-insp-badge.active { border: 1px solid var(--gold-border-mid); background: var(--gold-dim); }
    .cs-mi-insp-badge-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.55rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--char-text-faint);
    }
    .cs-mi-insp-badge.active .cs-mi-insp-badge-label { color: var(--gold-light); }
    .cs-mi-insp-badge-state {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.55rem;
      color: var(--char-text-faint);
    }
    .cs-mi-insp-badge.active .cs-mi-insp-badge-state { color: var(--gold-light); }

    .cs-mi-hp-slot { flex: 0 0 auto; }
    .cs-mi-temp-hp { flex: 0 0 auto; display: flex; align-items: center; }

    /* Compact HP/Temp HP row (Figma 51:1385) — label + directly-editable
       number input(s) + bar. No Edit toggle, no separate control panel:
       typing into the input and blurring is the entire interaction. */
    .cs-mi-hp-compact { display: flex; align-items: center; gap: 0.5rem; }
    .cs-mi-hp-compact-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 24px;
      color: var(--text);
    }
    .cs-mi-hp-num-input {
      width: 44px;
      background: var(--blue-50);
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px;
      text-align: center;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 18px;
      color: var(--blue-800);
    }
    .cs-mi-hp-num-input::-webkit-outer-spin-button,
    .cs-mi-hp-num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cs-mi-hp-compact-max { font-family: var(--font-body); font-weight: 700; font-size: 18px; color: var(--text); }
    .cs-mi-hp-compact-bar {
      width: 120px;
      height: 10px;
      border-radius: 999px;
      background: #371212;
      overflow: hidden;
    }
    .cs-mi-hp-compact-bar-fill { height: 100%; background: var(--red-strong); transition: width 0.25s ease; }
    /* Death-save-state Heal row only (0 Current HP) — the normal-state HP
       row above has no button controls left, just the two inputs. */
    .cs-mi-hp-controls { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.4rem; }

    .cs-mi-death-saves {
      flex: 1 1 260px;
      min-width: 220px;
      background: var(--char-card-bg);
      border: 1px solid var(--red-border);
      border-radius: var(--char-radius);
      padding: 0.85rem 1rem;
    }
    .cs-mi-ds-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f87171;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .cs-mi-ds-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.3rem; }
    .cs-mi-ds-row-label { font-family: var(--font-sans); font-size: 0.72rem; color: var(--char-text-muted); width: 70px; }
    .cs-mi-ds-pips { display: flex; gap: 0.4rem; }
    .cs-mi-ds-pip { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: none; cursor: pointer; padding: 0; }
    .cs-mi-ds-pip--success.filled { background: #6ecf6e; border-color: #6ecf6e; }
    .cs-mi-ds-pip--failure.filled { background: #f87171; border-color: #f87171; }

    @media (max-width: 900px) {
      .cs-ov-portrait { width: 100%; min-height: 340px; }
      .cs-ov-info { min-width: 100%; }
    }
    @media (max-width: 600px) {
      .cs-ov-card { min-width: 100%; }
      .cs-ab-cards { gap: 12px; }
      .cs-ab-card { min-width: 84px; }
      .cs-ab-img { width: 72px; height: 72px; }
      .cs-ov-class-details { gap: 1rem; }
      /* Single unbreakable words ("Overview") can't shrink to share a row
         with the toggle at 48px — wrap the toggle onto its own line rather
         than letting it overflow past the viewport edge. */
      .cs-ov-acc-header { flex-wrap: wrap; row-gap: 0.4rem; }
      .cs-ov-acc-title { font-size: 2.25rem; }
    }

    /* ── Not-found state ── */
    .cs-not-found {
      text-align: center;
      padding: 6rem 2rem;
    }
    .cs-not-found-glyph {
      font-family: var(--font-headers);
      font-size: 5rem;
      color: rgba(200,148,10,0.15);
      margin-bottom: 1.5rem;
      line-height: 1;
    }
    .cs-not-found-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--char-text-faint);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    .cs-not-found-body {
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: rgba(245,234,212,0.4);
      line-height: 1.8;
      max-width: 380px;
      margin: 0 auto 2rem;
    }
    .cs-not-found-link {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--char-highlight-border);
      padding: 0.55rem 1.25rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .cs-not-found-link:hover {
      background: var(--char-highlight-tint);
      border-color: var(--gold);
    }

    /* ── Divider ornament ── */
    .cs-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.25rem 0 1.5rem;
      opacity: 0.25;
    }
    .cs-divider::before, .cs-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold);
    }
    .cs-divider-glyph {
      font-family: var(--font-headers);
      font-size: 0.85rem;
      color: var(--gold);
    }

    /* ── Footer ── */
    .cs-footer {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.15);
    }

    /* ── Animations ── */
    @keyframes cs-fadein {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cs-wrap { animation: cs-fadein 0.5s ease forwards; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cs-story-row { grid-template-columns: 1fr; gap: 0.2rem; }
      .cs-gear-grid { grid-template-columns: 1fr; }
      .cs-nav { padding: 0.6rem 1rem; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .cs-wrap { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="cs-nav">
    <a class="cs-nav-title" href="../index.html"><img class="cs-nav-logo" src="../assets/logo-Anavale.svg" alt="Anavale"></a>
    <a class="cs-nav-back" href="../index.html">← Return to Wiki</a>
  </nav>

  <!-- Main content — rendered by JS below -->
  <main class="cs-wrap" id="cs-main">
    <!-- populated by renderSheet() -->
  </main>
  <div id="cs-modal-root"></div>

  <footer class="cs-footer" id="cs-footer"></footer>

  <div id="cs-toast" class="cs-toast"></div>

  <style>
    /* ── Loading state ── */
    .cs-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1.5rem;
    }
    .cs-loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(200,148,10,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: cs-spin 0.9s linear infinite;
    }
    .cs-loading-text {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.4);
    }
    @keyframes cs-spin { to { transform: rotate(360deg); } }

    /* ── HP tracker ── */
    .cs-hp-block {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }
    .cs-hp-cell {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--char-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .cs-hp-cell--current { border-color: rgba(180,60,60,0.35); background: rgba(180,60,60,0.07); }
    .cs-hp-label {
      font-family: var(--font-sans);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      font-weight: 700;
    }
    .cs-hp-val {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--white);
      line-height: 1;
    }
    .cs-hp-cell--current .cs-hp-val { color: #f87171; }
    .cs-hp-controls {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }
    .cs-hp-btn {
      flex: 1;
      padding: 0.35rem 0;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-hp-btn:hover { background: rgba(255,255,255,0.12); }
    .cs-hp-input-row {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }
    .cs-hp-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      text-align: center;
      width: 60px;
    }
    .cs-hp-apply {
      padding: 0.3rem 0.75rem;
      background: rgba(200,148,10,0.2);
      border: 1px solid rgba(200,148,10,0.4);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-hp-apply:hover { background: rgba(200,148,10,0.35); }

    /* ── Gold tracker ── */
    .cs-gold-edit-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      align-items: center;
    }
    .cs-gold-input {
      width: 90px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(200,148,10,0.3);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.3rem 0.5rem;

      display: inline-flex;

      padding: 8px 18px;

    .cs-mi-ac-label {
      font-family: var(--font-body);

    }
    .cs-mi-ac-num {

      font-weight: 700;

    }
    .cs-equipped-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;

    .cs-equipped-slot {

    .cs-equipped-slot-label {

    .cs-equipped-unequip {
      background: none;
      border: none;
      color: rgba(255,255,255,0.25);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 0.2rem;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .cs-equipped-unequip:hover { color: #f87171; }
    .cs-equipped-locked {
      width: 100%;
      padding: 0.6rem;

      font-family: var(--font-sans);

    }
    .cs-equipped-damage-sep {

      margin: 0 0.4rem;
    }
    .cs-equipped-damage {
      display: inline-block;
      vertical-align: middle;

      font-weight: 600;

    }
    .cs-equipped-damage-dice {
      font-family: var(--font-display);
    }
    .cs-equipped-damage-type {
      font-family: var(--font-body);
      font-size: 0.85em;
      color: var(--gold);
      opacity: 0.75;
    }
    .cs-equipped-damage-slash {
      color: var(--gold);
      opacity: 0.4;
      margin: 0 0.3rem;
    }
    .cs-tooltip {
      position: fixed;
      transform: translate(-50%, calc(-100% - 8px));
      background: rgba(14,18,32,0.98);
      border: 1px solid rgba(200,148,10,0.4);

      font-size: 0.72rem;

    .cs-equip-results {

    .cs-equip-result {

    .cs-equip-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;

    .cs-equip-thumb-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 1rem;

    .cs-equip-icon-armor::before  { content: '🛡'; }
    .cs-equip-icon-shield::before { content: '🛡'; }
    .cs-equip-icon-weapon::before { content: '⚔'; }
    .cs-equip-result-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .cs-equip-result-name {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--white);
    }
    .cs-equip-result-stats {
      font-family: var(--font-sans);
      font-size: 0.7rem;

    /* ── Inventory ── */
    .cs-inv-add-row {
      display: flex;

      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }
    .cs-inv-input {

      border: 1px solid rgba(200,148,10,0.45);

      font-family: var(--font-sans);
      font-size: 0.85rem;
      padding: 0.45rem 0.75rem;
    }
    .cs-inv-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,148,10,0.25); }
    .cs-inv-input::placeholder { color: rgba(255,255,255,0.4); }
    .cs-inv-add-btn {
      padding: 0.45rem 1rem;
      background: rgba(200,148,10,0.2);
      border: 1px solid rgba(200,148,10,0.4);

      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;

      white-space: nowrap;

    }

    .cs-inv-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .cs-inv-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.45; flex-shrink: 0; }
    .cs-inv-name { font-family: var(--font-sans); font-size: 0.86rem; color: var(--char-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cs-inv-qty {
      font-family: var(--font-mono);
      font-size: 0.75rem;

      border-radius: 4px;
      padding: 0.1rem 0.45rem;
    }
    .cs-inv-del {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.25rem;
      transition: color 0.15s;
    }
    .cs-inv-del:hover { color: #f87171; }
    .cs-inv-empty {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.2);
      font-style: italic;
      padding: 0.75rem 0;
      text-align: center;
    }
    .cs-inv-weight-total {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--char-text-faint);
      margin-bottom: 0.6rem;
      letter-spacing: 0.05em;
    }
    .cs-inv-search-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .cs-inv-cat-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      padding: 0.45rem 0.6rem;
      flex: none;
    }
    .cs-inv-section-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(200,148,10,0.55);
      margin: 0.6rem 0 0.35rem;
      font-weight: 700;
    }
    .cs-inv-row {
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: grid;
      grid-template-columns: 16px 32px 20px 1fr 90px 55px 110px 55px 20px 20px;
      align-items: center;
      gap: 0.6rem;
    }
    .cs-inv-drag-handle {
      color: rgba(255,255,255,0.2);
      cursor: grab;
      font-size: 0.9rem;
      flex: none;
    }
    .cs-inv-fav-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      font-size: 1rem;
      cursor: pointer;
      flex: none;
      padding: 0;
    }
    .cs-inv-fav-btn.active { color: var(--gold); }
    .cs-inv-type-tag {
      font-family: var(--font-sans);
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      text-align: center;
      white-space: nowrap;
    }
    .cs-inv-qty-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 5px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-align: center;
      padding: 0.2rem 0.3rem;
    }
    .cs-inv-cost, .cs-inv-weight {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--char-text-faint);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cs-inv-sortable { display: flex; flex-direction: column; gap: 0.4rem; }
    .cs-inv-row-wrap.dragging { opacity: 0.4; }
    .cs-inv-row { cursor: grab; }
    .cs-inv-row:active { cursor: grabbing; }
    .cs-inv-search-wrap { position: relative; }
    .cs-inv-search-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 30;
      background: rgba(12,16,28,0.98);
      border: 1px solid rgba(200,148,10,0.3);
      border-radius: 8px;
      margin-top: 0.3rem;
      max-height: 320px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .cs-inv-search-dropdown.visible { display: block; }
    .cs-inv-result-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s;
    }
    .cs-inv-result-row:last-child { border-bottom: none; }
    .cs-inv-result-row:hover { background: rgba(255,255,255,0.04); }
    .cs-inv-result-info { flex: 1; display: flex; flex-direction: column; gap: 0.1rem; cursor: default; }
    .cs-inv-result-name { font-family: var(--font-sans); font-size: 0.85rem; color: var(--white); }
    .cs-inv-result-meta { font-family: var(--font-sans); font-size: 0.7rem; color: var(--char-text-faint); }
    .cs-inv-result-add { display: flex; align-items: center; gap: 0.4rem; flex: none; }
    .cs-inv-result-add-btn {
      padding: 0.3rem 0.7rem;
      background: rgba(200,148,10,0.2);
      border: 1px solid rgba(200,148,10,0.4);
      border-radius: 6px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cs-inv-result-add-btn:hover { background: rgba(200,148,10,0.35); }
    .cs-inv-custom-btn {
      display: inline-block;
      width: auto;
      padding: 0.55rem 1.1rem;
      margin-bottom: 0.75rem;
      background: rgba(200,148,10,0.85);
      border: 1px solid rgba(200,148,10,1);
      border-radius: 8px;
      color: #1a1408;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;

    }
    .cs-inv-custom-btn:hover { background: rgba(220,165,20,1); }
    .cs-inv-thumb {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      flex: none;
      background: rgba(255,255,255,0.05);
    }
    .cs-inv-thumb-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .cs-inv-row-wrap { display: flex; flex-direction: column; }
    .cs-inv-name-wrap { flex: 1; min-width: 0; }
    .cs-inv-expand-arrow { font-size: 1.3rem; color: var(--gold-light); margin-left: 0.4rem; display: inline-block; transition: transform 0.15s; }
    .cs-inv-desc-panel {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--char-text-faint);
      line-height: 1.6;
      padding: 0.7rem 0.85rem 0.7rem 4.2rem;
      background: var(--char-card-bg);
      border: 1px solid rgba(255,255,255,0.07);
      border-top: 1px solid rgba(200,148,10,0.25);
      border-radius: 0 0 8px 8px;

    .cs-inv-edit {
      background: none;
      border: none;
      color: rgba(255,255,255,0.25);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 0.25rem;
      flex: none;
    }
    .cs-inv-edit:hover { color: var(--gold-light); }
    .cs-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .cs-modal {
      background: rgba(16,20,34,0.98);
      border: 1px solid rgba(200,148,10,0.3);
      border-radius: 14px;
      padding: 1.5rem;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      box-sizing: border-box;

    .cs-modal-sm { max-width: 380px; }
    .cs-modal-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--gold-light);
      margin-bottom: 1rem;

      display: block;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--char-text-faint);
      margin-bottom: 0.3rem;
      font-weight: 600;

    .cs-field-row-4 .cs-inv-input { flex: none; min-width: 0; width: 100%; box-sizing: border-box; }

      padding: 0.5rem 1.1rem;
      background: rgba(200,148,10,0.25);
      border: 1px solid rgba(200,148,10,0.5);
      border-radius: 7px;
      color: var(--gold-light);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cs-modal-btn-primary:hover { background: rgba(200,148,10,0.4); }
    .cs-modal-btn-secondary {
      padding: 0.5rem 1.1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 7px;
      color: var(--char-text-muted);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .cs-modal-btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .cs-modal-btn-danger {
      padding: 0.5rem 1.1rem;
      background: rgba(180,50,50,0.25);
      border: 1px solid rgba(180,50,50,0.5);

      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;

      border: 1px solid rgba(255,255,255,0.08);

    .cs-notes-empty {

  // ── Helpers ───────────────────────────────────────────────────────
  function cap(str) { if (!str) return '—'; return str.charAt(0).toUpperCase() + str.slice(1); }
  function label(map, key) { if (!key) return '—'; return map[key] || cap((key+'').replace(/-/g,' ')); }
  // Ported verbatim from js/character.js — bg.bonuses entries are either an
  // ability delta ("+1 Wis") or a feat name ("Tough"); this is the same
  // parsing character.js uses for its own live preview, kept identical so
  // the two can't drift. Only the two functions are ported, not the data.
  var ABILITY_WORD_MAP = { 'Str':'str', 'Dex':'dex', 'Con':'con', 'Int':'int', 'Wis':'wis', 'Cha':'cha' };
  function parseBackgroundAbilityBonuses(bgObj) {
    var result = {};
    if (!bgObj || !bgObj.bonuses) return result;
    bgObj.bonuses.forEach(function(b) {
      var m = b.match(/^([+-]\d+)\s+(\w+)$/);
      if (m && ABILITY_WORD_MAP[m[2]]) {
        var key = ABILITY_WORD_MAP[m[2]];
        result[key] = (result[key] || 0) + parseInt(m[1]);
      }
    });
    return result;
  }
  function getBackgroundFeat(bgObj) {
    if (!bgObj || !bgObj.bonuses) return null;
    var feat = bgObj.bonuses.find(function(b) { return !/^[+-]\d+\s+\w+$/.test(b); });
    return feat || null;
  }
  function abMod(v) { var m = Math.floor((v-10)/2); return (m>=0?'+':'')+m; }
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getToken() {

  function showToast(msg, isError) {
    var t = document.getElementById('cs-toast');

    t.textContent = msg;
    t.className = 'cs-toast' + (isError ? ' error' : '');
    void t.offsetWidth;
    t.classList.add('visible');
    setTimeout(function() { t.classList.remove('visible'); }, 3000);
  }

  // ── Appearance helpers ────────────────────────────────────────────
  function buildAppearanceDesc(app) {
    if (!app) return null;
    var parts = [];
    if (app.height && app.build) parts.push(cap(app.height) + ', ' + app.build + ' build.');
    else if (app.height) parts.push(cap(app.height) + '.');
    if (app.age) parts.push(cap(app.age) + '.');
    var face = [];
    if (app.face_shape) face.push(app.face_shape + ' face');
    // app-skin-tone is an <input type="color"> (character.html) — always a
    // hex value, never a word. Omit rather than print "#ffba66 skin".
    if (app.skin_tone && app.skin_tone.charAt(0) !== '#') face.push(app.skin_tone + ' skin');
    if (face.length) parts.push(cap(face.join(', ')) + '.');
    var eyes = [];
    if (app.eye_color) eyes.push(app.eye_color);
    if (app.eye_shape) eyes.push(app.eye_shape);
    if (eyes.length) parts.push(cap(eyes.join(', ')) + ' eyes.');
    var hair = [];
    if (app.hair_color) hair.push(app.hair_color);
    if (app.hair_style) hair.push(app.hair_style + ' hair');
    if (hair.length) parts.push(cap(hair.join(', ')) + '.');
    if (app.facial_hair && app.facial_hair !== 'none') parts.push(cap(app.facial_hair) + '.');
    if (Array.isArray(app.facial_markings) && app.facial_markings.length) {
      parts.push('Markings: ' + app.facial_markings.join(', ') + '.');
    }
    return parts.join(' ') || null;
  }

  function buildGearList(app) {
    if (!app) return [];
    var slotLabels = {
      cloak:'Cloak', top:'Top', lower:'Lower', shoes:'Shoes', hat:'Hat',
      hand_right:'Right Hand', hand_left:'Left Hand',
      ring_right:'Ring (R)', ring_left:'Ring (L)',
      necklace:'Necklace', earrings:'Earrings'
    };
    return Object.keys(slotLabels).filter(function(k) {
      return app[k] && app[k] !== 'none' && app[k] !== '';
    }).map(function(k) {
      return { slot: slotLabels[k], val: cap((app[k]||'').replace(/-/g,' ')) };
    });
  }

  function updateTabUI() {

  // Ability Scores tab content (Figma 51:1663/51:1668) — 6 cards from
  // ability_scores jsonb, math unchanged. Feats moved to the Background
  // card (buildYourBackgroundHtml, Your Story tab) per the Tab Redesign v1
  // spec — not rendered here anymore.
  function buildAbilityScoresHtml(scores, ch) {
    var AB_KEYS  = ['str','dex','con','int','wis','cha'];
    var AB_SHORT = { str:'STR', dex:'DEX', con:'CON', int:'INT', wis:'WIS', cha:'CHA' };
    var cards = AB_KEYS.map(function(ab) {
      var raw    = parseInt(scores[ab]) || 0;
      var modNum = raw ? Math.floor((raw - 10) / 2) : 0;
      var modStr = raw ? (modNum >= 0 ? '+' : '') + modNum : '—';
      var modCls = modNum > 0 ? 'positive' : modNum < 0 ? 'negative' : '';
      return '<div class="cs-ab-card cs-ab-card--' + ab + '">'
        + '<img class="cs-ab-img" src="../assets/images/character-sheet/ability-scores/ability-' + ab + '.png" alt="">'
        + '<div class="cs-ab-txt">'
          + '<div class="cs-ab-label">' + AB_SHORT[ab]
            + '<span class="cs-ab-tip" data-tip="' + ABILITY_TIPS[ab].replace(/"/g,'&quot;') + '">?</span>'
          + '</div>'
          + '<div class="cs-ab-val">' + (raw || '—') + '</div>'
          + (raw ? '<div class="cs-ab-mod"><span class="cs-ab-mod-num ' + modCls + '">' + modStr + '</span> Modifier</div>' : '')
        + '</div>'
      + '</div>';
    }).join('');

    // Proficient skills (class-chosen at Stage 2) — distinct from the flat
    // +1 bonuses shown in Your Story's cards. Relocated here from Your Past
    // (had no real home there — see Decision Log) since it's about skill
    // proficiencies, which conceptually belongs on the Ability Scores tab.
    var skillsArr = Array.isArray(ch && ch.skills) ? ch.skills : [];
    var skillsRow = skillsArr.length
      ? '<div class="cs-story-block"><div class="cs-story-row"><div class="cs-story-key">Proficient skills</div><div class="cs-story-val">' + escHtml(skillsArr.join(', ')) + '</div></div></div>'
      : '';

    return '<div class="cs-ov-breakout"><div class="cs-ov-inner"><div class="cs-ab-cards">' + cards + '</div>' + skillsRow + '</div></div>';
  }

    { pattern: /mystic arcanum/i,           icon: '&#128220;' },
    { pattern: /arcane tradition/i,         icon: '&#9905;' },
    { pattern: /arcane recovery/i,          icon: '&#128260;' },
    { pattern: /spell mastery/i,            icon: '&#129497;' },
    { pattern: /spellbook/i,                icon: '&#128214;' },
    { pattern: /reckless attack/i,          icon: '&#9889;' },
    { pattern: /sneak attack/i,             icon: '&#128481;' },
    { pattern: /divine smite|smite/i,       icon: '&#9876;' },
    { pattern: /extra attack/i,             icon: '&#9876;' },
    { pattern: /fighting style/i,           icon: '&#9876;' },
    { pattern: /spellcasting/i,             icon: '&#10024;' },
    { pattern: /channel divinity/i,         icon: '&#9728;' },
    { pattern: /divine intervention/i,      icon: '&#9728;' },
    { pattern: /aura of protection/i,       icon: '&#128737;' },
    { pattern: /sacred oath|monastic tradition|ranger archetype|bard college|sorcerous origin|otherworldly patron/i, icon: '&#127775;' },
    { pattern: /subclass/i,                 icon: '&#127775;' },
    { pattern: /cunning action|uncanny dodge|evasion/i, icon: '&#128481;' },
    { pattern: /superiority|maneuver/i,     icon: '&#128171;' },
    { pattern: /ki point|flurry|patient defense/i, icon: '&#128074;' },
    { pattern: /eldritch blast/i,           icon: '&#128520;' },
    { pattern: /dark one|pact of/i,         icon: '&#128138;' },
    { pattern: /signature spell/i,          icon: '&#129497;' },
    // Generic fallback
    { pattern: /./,                         icon: '&#10022;' }
  ];
  function classFeatureIcon(raw) {
    for (var i = 0; i < FEAT_ICONS.length; i++) {
      if (FEAT_ICONS[i].pattern.test(raw)) return FEAT_ICONS[i].icon;
    }
    return '&#10022;';
  }
  // Splits a raw feature string into {name, description, level}. New logic
  // — not a port, character.js never split these, it only assigns an icon
  // and renders the whole string. " — " separates name from description
  // when present; " subclass at level N" / " at level N" is stripped off
  // the name (whichever side of the dash it landed on) into a level badge.
  function parseClassFeature(raw) {
    var name = raw, description = null, level = null;
    var dashIdx = raw.indexOf(' — ');
    if (dashIdx !== -1) {
      name = raw.slice(0, dashIdx);
      description = raw.slice(dashIdx + 3);
    }
    var subclassMatch = name.match(/^(.*) subclass at level (\d+)$/);
    if (subclassMatch) {
      name = subclassMatch[1];
      level = subclassMatch[2];
    } else {
      var levelMatch = name.match(/^(.*) at level (\d+)$/);
      if (levelMatch) {
        name = levelMatch[1];
        level = levelMatch[2];
      }
    }
    return { name: name, description: description, level: level };
  }
  function buildClassFeaturesHtml(features) {
    if (!Array.isArray(features) || !features.length) return '';
    var rows = features.map(function(raw) {
      var icon = classFeatureIcon(raw);
      var parsed = parseClassFeature(raw);
      return '<div class="cs-class-feature-row">'
        + '<span class="cs-class-feature-icon">' + icon + '</span>'
        + '<div class="cs-class-feature-txt">'
          + '<span class="cs-class-feature-name">' + escHtml(parsed.name) + '</span>'
          + (parsed.level ? '<span class="cs-class-feature-level">Level ' + parsed.level + '</span>' : '')
          + (parsed.description ? '<span class="cs-class-feature-desc">' + escHtml(parsed.description) + '</span>' : '')
        + '</div>'
      + '</div>';
    }).join('');
    return '<div class="cs-class-features-label">Key Features</div><div class="cs-class-features">' + rows + '</div>';
  }

  // ── Class tab (Figma 52:2705/52:2710) ───────────────────────────────
  // Basic info (image/name/level) renders immediately from player_characters;
  // mechanical fields + Key Features come from the `classes` table via
  // renderClassTabDynamic() once fetchClassData() resolves.
  function buildClassTabHtml(ch, classDisplay) {
    var classKey = (ch.class_id || '').toLowerCase();
    var classImgSrc = classKey ? '../assets/images/classes/class-' + classKey + '.webp' : '';
    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ov-class-card">'
        + '<div class="cs-ov-class-basic">'
          + (classImgSrc ? '<img class="cs-ov-class-img" src="' + classImgSrc + '" alt="" onerror="this.style.display=\'none\'">' : '')
          + '<div class="cs-ov-class-txt">'
            + '<div class="cs-ov-class-label">Class</div>'
            + '<div class="cs-ov-class-name">' + classDisplay + '</div>'
          + '</div>'
          + '<div class="cs-ov-class-level"><div class="cs-ov-class-level-label">Level</div><div class="cs-ov-class-level-val">' + (ch.level || 1) + '</div></div>'
        + '</div>'
        + '<div class="cs-ov-class-details" id="cs-class-details">' + renderClassDetailsHtml(CLASS_ROW) + '</div>'
        + '<div id="cs-class-features">' + buildClassFeaturesHtml(CLASS_ROW ? CLASS_ROW.features : null) + '</div>'
      + '</div>'
      + '<div class="cs-ov-class-card cs-spell-slots-card">'
        + '<div class="cs-class-features-label" style="margin-top:0;">Spell Slots</div>'
        + '<div id="cs-class-spell-slots"></div>'
      + '</div>'
    + '</div></div>';
  }

  // ── Spell slots (Class tab, new — stopgap only) ─────────────────────
  // The build spec described this as relocating an "existing" tracker, but
  // no such UI has ever existed anywhere in this codebase (confirmed via
  // full-repo grep) despite character_sheet.spell_slots/spell_slots_max
  // both being real, empty ({}) columns on all 3 characters. Built minimal
  // and functional per the DM's explicit call: current/max pips per spell
  // level (1–9), wired to those columns, no new visual design beyond
  // existing card tokens. This is a stopgap, not the real Figma redesign —
  // see CLAUDE.md Decision Log.
  var SPELL_LEVELS = [1,2,3,4,5,6,7,8,9];
  function renderSpellSlots() {
    var el = document.getElementById('cs-class-spell-slots');
    if (!el) return;
    var maxObj = (SHEET && typeof SHEET.spell_slots_max === 'object' && SHEET.spell_slots_max) ? SHEET.spell_slots_max : {};
    var curObj = (SHEET && typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? SHEET.spell_slots : {};
    el.innerHTML = SPELL_LEVELS.map(function(lvl) {
      var max = parseInt(maxObj[lvl]) || 0;
      var cur = parseInt(curObj[lvl]) || 0;
      var pips = max > 0
        ? Array.from({ length: max }, function(_, i) {
            var n = i + 1;
            return '<button class="cs-spell-slot-pip' + (n <= cur ? ' filled' : '') + '" onclick="toggleSpellSlot(' + lvl + ',' + n + ')" aria-label="Level ' + lvl + ' slot ' + n + '"></button>';
          }).join('')
        : '<span class="cs-spell-slot-none">&mdash;</span>';
      return '<div class="cs-spell-slot-row">'
        + '<span class="cs-spell-slot-level">Level ' + lvl + '</span>'
        + '<span class="cs-spell-slot-pips">' + pips + '</span>'
        + '<span class="cs-spell-slot-max-edit">'
          + '<input class="cs-hp-input cs-spell-slot-max-input" type="number" min="0" placeholder="' + max + '" id="cs-spell-max-' + lvl + '">'
          + '<button class="cs-hp-apply" onclick="setSpellSlotMax(' + lvl + ')">Set Max</button>'
        + '</span>'
      + '</div>';
    }).join('');
  }
  // Clicking a filled pip un-fills it and everything after (spend a slot);
  // clicking an empty pip fills up to it (restore slots, e.g. after a rest)
  // — same toggle pattern as the death-save pips.
  function toggleSpellSlot(level, n) {
    if (!SHEET) return;
    var curObj = (typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? Object.assign({}, SHEET.spell_slots) : {};
    var cur = parseInt(curObj[level]) || 0;
    curObj[level] = (cur === n) ? n - 1 : n;
    SHEET.spell_slots = curObj;
    saveSheet({ spell_slots: curObj });
    renderSpellSlots();
  }
  function setSpellSlotMax(level) {
    if (!SHEET) return;
    var input = document.getElementById('cs-spell-max-' + level);
    var val = parseInt(input.value);
    if (isNaN(val) || val < 0) return;
    var maxObj = (typeof SHEET.spell_slots_max === 'object' && SHEET.spell_slots_max) ? Object.assign({}, SHEET.spell_slots_max) : {};
    var curObj = (typeof SHEET.spell_slots === 'object' && SHEET.spell_slots) ? Object.assign({}, SHEET.spell_slots) : {};
    maxObj[level] = val;
    if ((parseInt(curObj[level]) || 0) > val) curObj[level] = val;
    SHEET.spell_slots_max = maxObj;
    SHEET.spell_slots = curObj;
    saveSheet({ spell_slots_max: maxObj, spell_slots: curObj });
    input.value = '';
    renderSpellSlots();
  }

  // Populated once fetchClassData() resolves — the `classes` table is the
  // source for these mechanical fields (see docs/character-sheet-redesign-handoff.md §6).
  function renderClassTabDynamic() {
    var detailsEl = document.getElementById('cs-class-details');
    var featuresEl = document.getElementById('cs-class-features');
    if (detailsEl) detailsEl.innerHTML = renderClassDetailsHtml(CLASS_ROW);
    if (featuresEl) featuresEl.innerHTML = buildClassFeaturesHtml(CLASS_ROW ? CLASS_ROW.features : null);
    wireAllTooltips();
  }

  // Parses generateSummary()'s plain-text output ("LABEL\n\nparagraph" blocks
  // joined by "\n\n\n") into {label, text} sections. Shared by the Who You
  // Are summary card and (new) the header's appearance paragraph, so both
  // read the same real parsing instead of two copies drifting apart.
  function parseSummaryBlocks(summaryText) {
    if (!summaryText) return [];
    return summaryText.split('\n\n\n').map(function(block) {
      var idx = block.indexOf('\n\n');
      if (idx === -1) return null;
      return { label: block.slice(0, idx).trim(), text: block.slice(idx + 2).trim() };
    }).filter(function(sec) { return sec && sec.label && sec.text; });
  }
  // Header's appearance paragraph (new) — pulls the "YOUR APPEARANCE" block
  // straight out of the same generateSummary() text already shown in Who
  // You Are, instead of the raw appearance_prompt AI-portrait prompt string
  // that used to leak into the UI verbatim. One authored description
  // instead of a second, unrelated-looking copy.
  function extractSummarySection(summaryText, wantedLabel) {
    var sections = parseSummaryBlocks(summaryText);
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].label.toUpperCase() === wantedLabel.toUpperCase()) return sections[i].text;
    }
    return null;
  }
  // Read-only — no editing affordance, matches the rest of the Overview card
  // visually. Shows only the "WHO ARE YOU" section of generateSummary()'s
  // text, not all six — Your Magic/Your Background/Your Past/Your Appearance/
  // Your Compass are already fully covered by their own dedicated cards
  // (Gigglegloom Affinity, Background, Organization, the header's appearance
  // paragraph, Alignment), so repeating them here was pure duplication.
  function buildSummaryCardHtml(summaryText) {
    var text = extractSummarySection(summaryText, 'WHO ARE YOU');
    if (!text) return '';
    return '<div class="cs-story-card-title">Summary</div><p class="cs-ov-summary-text">' + escHtml(text) + '</p>';
  }

  // ── MainInfo — shared header (Figma 51:1385), renders once above the
  // tab bar and is reused across all four tabs (not duplicated per tab). ──
  function buildMainInfoHtml(ch, app, appearanceDesc, speciesDisplay, regionLabel, portraitSrc) {
    var classKey   = (ch.class_id || '').toLowerCase();
    var alignKey   = (ch.alignment || '').toLowerCase();
    var typeKey    = (ch.class_gigglegloom || '').toLowerCase();
    var typeMeta   = TYPE_META[typeKey] || { name: cap(typeKey) };

    // Blurb — species + class's Gigglegloom-flavor name + type + region,
    // plus the alignment trait sentence. Sourced from the same lookups
    // character.js's (pre-rewrite) generateSummary() draws from, not invented.
    var blurbParts = [];
    var flavorName = CLASS_FLAVOR_NAME[classKey];
    if (speciesDisplay && flavorName && typeMeta.name) {
      blurbParts.push('A ' + speciesDisplay + ' ' + flavorName + ' who carries the ' + typeMeta.name

    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ov-maininfo">'
        + '<div class="cs-ov-portrait">'
          + '<img class="cs-ov-portrait-img" id="cs-hero-portrait-img" src="' + (portraitSrc || '') + '" alt="' + (ch.name || '') + ' portrait" onerror="this.style.display=\'none\'">'
          + '<button class="cs-ov-portrait-upload-btn" onclick="document.getElementById(\'cs-photo-input\').click()">Replace</button>'
        + '</div>'
        + '<div class="cs-ov-info">'
          + '<div class="cs-mi-top-row">'
            + '<div class="cs-mi-conditions" id="cs-mi-conditions"></div>'
          + '</div>'
          + '<div class="cs-ov-main">'
            + '<h1 class="cs-ov-name">' + (ch.name || 'Unknown') + '</h1>'
            + '<div class="cs-mi-vitals">'
              + '<div class="cs-mi-ac-badge" id="cs-mi-ac-badge" data-tip=""><span class="cs-mi-ac-label">AC</span><span class="cs-mi-ac-num">—</span></div>'
              + '<div class="cs-mi-hp-slot" id="cs-mi-hp-slot"></div>'
              + '<div class="cs-mi-temp-hp" id="cs-mi-temp-hp"></div>'
            + '</div>'
            + blurbHtml
          + '</div>'
          + '<div class="cs-mi-triple-row">'
            + (speciesDisplay ? '<div class="cs-mi-triple-col"><div class="cs-mi-triple-label">Species</div><div class="cs-mi-species-desc" id="cs-mi-species-desc"></div></div>' : '')
            + (appearanceDesc ? '<div class="cs-mi-triple-col"><div class="cs-mi-triple-label">Appearance</div><div class="cs-mi-appearance">' + appearanceDesc + '</div></div>' : '')
            + '<div class="cs-mi-triple-col" id="cs-mi-speaks-col"><div class="cs-mi-triple-label">Speaks</div><div class="cs-mi-speaks" id="cs-mi-speaks" style="display:none;"></div></div>'
          + '</div>'
        + '</div>'
        + '<div class="cs-mi-inspiration" id="cs-mi-inspiration"></div>'
      + '</div>'
    + '</div></div>';
  }

  // ── Overview cards (alignment / background / gigglegloom / class /
  // summary) — still "Your Story" tab content for this pass; will move to
  // their real tabs (Class, Your Story > Your Background) in later slices. ──
  // ── Your Story tab (Figma 51:1103/51:1218) — Who You Are / Your
  // Background / Your Past. Replaces the old pre-redesign "Overview"
  // accordion (alignment/background/gigglegloom cards + narrative summary)
  // entirely — those cards move into Your Background below; the feat chip
  // that landed on the old Background card in the Ability Scores slice was
  // always meant to be transitional pending this exact rebuild. ──

  // Tab page title (Figma 51:1103 "YOUR STORY") — one per tab, same heading
  // weight/placement across all four (see .cs-page-title CSS).
  function pageTitleHtml(text) {
    return '<div class="cs-ov-breakout"><div class="cs-ov-inner"><h2 class="cs-page-title">' + text + '</h2></div></div>';
  }
  function accordionShell(id, title, bodyHtml) {
    return '<div class="cs-ov-breakout"><div class="cs-ov-inner">'
      + '<div class="cs-ov-acc" id="' + id + '">'
        + '<button class="cs-ov-acc-header" type="button" onclick="toggleSheetAccordion(\'' + id + '\')">'
          + '<span class="cs-ov-acc-title">' + title + '</span>'
          + '<span class="cs-ov-acc-toggle"><span class="cs-ov-acc-toggle-label">Collapse</span><span class="cs-ov-acc-chevron">&#9662;</span></span>'

  function storyCard(label, title, text, benefitsHtml, imgSrc) {

      + (imgSrc
          ? '<div class="cs-story-card-head"><img class="cs-story-card-img" src="' + imgSrc + '" alt="" loading="lazy"><div class="cs-story-card-headtext">' + labelTitleHtml + '</div></div>'
          : labelTitleHtml)
      + (text ? '<div class="cs-story-card-text">' + escHtml(text) + '</div>' : '')
      + (benefitsHtml || '')
    + '</div>';
  }
  // ── Benefits box (Figma 51:1218) — typed lines inside a blue/600 box,
  // not the old rounded pill-tags. Ability deltas combine onto one
  // comma-joined line; everything else (skill/feat/DM-add/situational)
  // gets its own line with a type-specific suffix. Only skill and feat
  // lines get the gold tooltip icon — plain ability lines and DM-add/
  // situational lines don't (confirmed against the real Figma benefit
  // boxes on both Your Background's Background card and Your Past's
  // cards, not assumed). ──
  function abilityDeltaLineHtml(deltas) {
    if (!deltas || !deltas.length) return '';
    var parts = deltas.map(function(d) {
      return '<span class="cs-benefit-amount ' + (d.amount >= 0 ? 'positive' : 'negative') + '">' + (d.amount >= 0 ? '+' : '') + d.amount + '</span> <span class="cs-benefit-name">' + d.key.toUpperCase() + '</span>';
    });
    return '<div class="cs-benefit-line">' + parts.join(', ') + '</div>';
  }
  // amount is optional — Your Past's skill_bonuses carry a real +N amount,
  // Your Background's flat skill grants don't (confirmed against Figma:
  // Background's skill lines have no "+1" prefix, Your Past's do).
  function skillBenefitLineHtml(name, amount) {
    var tip = SKILL_TIPS[name];
    return '<div class="cs-benefit-line">'
      + (amount != null ? '<span class="cs-benefit-amount positive">+' + amount + '</span> ' : '')
      + '<span class="cs-benefit-name">' + escHtml(name) + '</span> <span class="cs-benefit-suffix">(Skill Proficiency)</span>'
      + (tip ? '<span class="cs-ab-tip" data-tip="' + tip.replace(/"/g,'&quot;') + '">?</span>' : '')
    + '</div>';
  }
  function featBenefitLineHtml(name) {
    var tip = FEAT_TIPS[name];
    return '<div class="cs-benefit-line">'
      + '<span class="cs-benefit-name">' + escHtml(name) + '</span> <span class="cs-benefit-suffix">(Ability)</span>'
      + (tip ? '<span class="cs-ab-tip" data-tip="' + tip.replace(/"/g,'&quot;') + '">?</span>' : '')
    + '</div>';

  function dmAddBenefitLineHtml(label) {

  // ── Your Past card (Figma 51:1218) — distinct from storyCard(): fixed
  // 358px width, 18px titles (vs Your Background's 26px), and two layout
  // variants. 'header' (5 of 7 cards) puts the icon beside just the eyebrow
  // + title; 'full' (Left Behind, Why You Left) puts the icon beside the
  // ENTIRE content column including body text — a real structural
  // difference confirmed against the Figma frame, not a styling nuance. ──
  function pastCard(eyebrow, title, text, benefitsHtml, imgSrc, layout) {
    var headTextHtml = '<div class="cs-story-card-label">' + eyebrow + '</div>'
      + '<div class="cs-past-card-title">' + title + '</div>';
    var bodyInner = (text ? '<div class="cs-story-card-text">' + escHtml(text) + '</div>' : '') + (benefitsHtml || '');
    if (layout === 'full') {
      return '<div class="cs-past-card cs-past-card--full">'

        + '<div class="cs-past-card-body">' + headTextHtml + bodyInner + '</div>'

      + '<div class="cs-story-card-head">'

        + '<div class="cs-story-card-headtext">' + headTextHtml + '</div>'
      + '</div>'
      + bodyInner
